name: Publish signed Android APK

on:
  push:
    tags:
      - "app-v*.*.*"

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, sign, and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Match tag to Android version and capture content latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP_VERSION="$(./gradlew -q :app:printVersionName --no-daemon)"
          APP_VERSION_CODE="$(./gradlew -q :app:printVersionCode --no-daemon)"
          EXPECTED_TAG="app-v${APP_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Android version ${EXPECTED_TAG}." >&2
            exit 1
          fi
          if [ "${APP_VERSION_CODE}" != "10" ]; then
            echo "Expected Android version code 10, got ${APP_VERSION_CODE}." >&2
            exit 1
          fi
          CONTENT_LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          case "${CONTENT_LATEST_TAG}" in
            content-v*) ;;
            *)
              echo "Current latest release is not a content release: ${CONTENT_LATEST_TAG}" >&2
              exit 1
              ;;
          esac
          {
            echo "APP_VERSION=${APP_VERSION}"
            echo "APP_VERSION_CODE=${APP_VERSION_CODE}"
            echo "CONTENT_LATEST_TAG=${CONTENT_LATEST_TAG}"
          } >> "${GITHUB_ENV}"

      - name: Restore temporary release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Secret is empty: ${name}" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/xinghuo-release.keystore"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -storepass:env ANDROID_RELEASE_STORE_PASSWORD \
            -alias "${ANDROID_RELEASE_KEY_ALIAS}" >/dev/null
          echo "ANDROID_RELEASE_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Run checks and build signed release APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
          --no-daemon
          --stacktrace

      - name: Verify APK signature and version
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "Signed release APK is missing: ${APK_PATH}" >&2
            exit 1
          fi
          BUILD_TOOLS_VERSION="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          test -x "${APKSIGNER}"
          test -x "${AAPT}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
          BADGING="$("${AAPT}" dump badging "${APK_PATH}")"
          PACKAGE_LINE="${BADGING%%$'\n'*}"
          grep -F "package: name='com.xuhuangbin.xinghuozhaidu'" <<< "${PACKAGE_LINE}"
          grep -F "versionCode='${APP_VERSION_CODE}'" <<< "${PACKAGE_LINE}"
          grep -F "versionName='${APP_VERSION}'" <<< "${PACKAGE_LINE}"

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_NAME="xinghuo-zhaidu-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (
            cd dist
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )
          {
            echo "RELEASE_APK=dist/${APK_NAME}"
            echo "RELEASE_SHA256=dist/${APK_NAME}.sha256"
          } >> "${GITHUB_ENV}"

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .draft)"
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Refusing to modify an already published release: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --latest=false \
              --verify-tag \
              --title "星火摘读 Android ${APP_VERSION}" \
              --notes "正式签名 Android APK。下载后可使用同一签名证书覆盖升级后续版本。"
          fi

      - name: Upload complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${RELEASE_APK}"
          "${RELEASE_SHA256}"
          --clobber

      - name: Publish as a non-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${GITHUB_REF_NAME}"
          --draft=false
          --prerelease=false
          --latest=false

      - name: Verify content latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "${LATEST_TAG}" != "${CONTENT_LATEST_TAG}" ]; then
            echo "Restoring content release ${CONTENT_LATEST_TAG} as latest."
            gh release edit "${CONTENT_LATEST_TAG}" --latest
          fi
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "${LATEST_TAG}" != "${CONTENT_LATEST_TAG}" ]; then
            echo "Latest release is ${LATEST_TAG}, expected ${CONTENT_LATEST_TAG}." >&2
            exit 1
          fi
          MANIFEST_PATH="${RUNNER_TEMP}/manifest.json"
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" \
            --output "${MANIFEST_PATH}"
          python3 - "${MANIFEST_PATH}" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for field in ("contentVersion", "packageUrl"):
              if not manifest.get(field):
                  raise SystemExit(f"latest manifest has no {field}")
          PY
