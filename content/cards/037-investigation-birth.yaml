id: ed16cc81-6358-529f-8bd7-86feb36d4221
revision: 2
status: published
quote: 调查就像“十月怀胎”，解决问题就像“一朝分娩”。调查就是解决问题。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: 1930-05
themes:
- 调查研究
interpretation:
  inspiration: 先把事实、关系和约束查清，再下结论；很多方案会在调查过程中自然显现。
  explanation: 在《反对本本主义》讨论调查研究与理论联系实际的语境中，这句话把重点放在充分调查不是行动前的装饰，而是形成解决方案的过程。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1930年5月，毛泽东写成《反对本本主义》。
background: 毛泽东总结红军工作经验，批评离开实际调查、照搬书本和上级指示的作风。 此卡所选名句着重表现充分调查不是行动前的装饰，而是形成解决方案的过程。
story: 《反对本本主义》围绕调查研究与理论联系实际逐层展开。这句话把充分调查不是行动前的装饰，而是形成解决方案的过程凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
