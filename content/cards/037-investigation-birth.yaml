revision: 3
status: published
quote: 调查就像“十月怀胎”，解决问题就像“一朝分娩”。调查就是解决问题。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: 1930-05
themes:
- 调查研究
interpretation:
  inspiration: '有些问题迟迟想不明白，不一定是缺少聪明办法，可能只是还没看够现场。多问几个当事人，把过程走一遍，答案常会慢慢长出来，而不是突然从脑中跳出来。'
  explanation: '这句话用怀胎和分娩作比：调查不是解决问题之前的准备动作，调查逐步深入的过程，本身就在孕育答案。1930年，毛泽东总结红军中的工作经验，批评只凭“本本”或上级指示办事、不肯到实际中了解情况的作风。所谓“调查就是解决问题”，不是说收集资料后问题会自动消失，而是说只有弄清各方关系、困难来源和现实条件，办法才有可能对症。没有这个过程，方案往往只是主观猜测。'
historicalEvent: 1930年5月，毛泽东写成《反对本本主义》。
background: 毛泽东总结红军工作经验，批评离开实际调查、照搬书本和上级指示的作风。 此卡所选名句着重表现充分调查不是行动前的装饰，而是形成解决方案的过程。
story: 《反对本本主义》围绕调查研究与理论联系实际逐层展开。这句话把充分调查不是行动前的装饰，而是形成解决方案的过程凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
