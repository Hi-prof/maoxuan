id: a0ecb8df-fa23-4666-a7ca-1c2e1cc6ddcc
revision: 3
status: published
quote: 我们和北平人民正在做一件重要工作，按照八个条件和平地解决北平问题。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中共发言人关于命令国民党反动政府重新逮捕前日本侵华军总司令冈村宁次和逮捕国民党内战罪犯的谈话
  authoredAt: '1949-01-28'
themes:
- 群众路线
interpretation:
  inspiration: '解决重大冲突时，能让普通人的生命、城市和日常少受损失，本身就是重要成果。坚持原则与寻找和平路径不一定相反，关键是条件是否真正处理了问题。'
  explanation: '“重要工作”指通过谈判和平解决北平问题。平津战役中，人民解放军已完成军事包围，同时争取傅作义部接受改编，使北平免遭攻城破坏。1949年1月，谈判按中共提出的条件推进，北平人民也广泛要求和平解放。毛泽东在谈话中把这项工作同追究日本侵华军总司令冈村宁次和国民党内战责任并列，说明和平不是放弃政治原则，而是在胜负已明的条件下尽量减少生命和历史城市的损失，完成政权转换。'
historicalEvent: 1949年1月28日，《中共发言人关于命令国民党反动政府重新逮捕前日本侵华军总司令冈村宁次和逮捕国民党内战罪犯的谈话》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中共发言人关于命令国民党反动政府重新逮捕前日本侵华军总司令冈村宁次和逮捕国民党内战罪犯的谈话》从当时的具体问题出发讨论群众路线，本卡从“我们和北平人民正在做一件重要工作”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《中共发言人关于命令国民党反动政府重新逮捕前日本侵华军总司令冈村宁次和逮捕国民党内战罪犯的谈话》中的理由和限制一起理解。
