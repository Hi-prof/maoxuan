revision: 3
status: published
quote: 我们用自己动手的方法，达到了丰衣足食的目的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 组织起来
  authoredAt: '1943-11-29'
themes:
- 自力更生
interpretation:
  inspiration: '等不到理想资源时，可以先看看手边能做出什么。自己动手不是拒绝帮助，也不是凡事单干；它只是让等待少一点，把已有的人和工具先接成一条能走的路。'
  explanation: '这句话回顾抗日根据地通过大生产改善供给的成果。边区遭受战争、封锁和物资困难，外部援助有限，军队、机关和群众便开展农业、手工业生产，并组织互助合作。毛泽东说“自己动手”，强调的是依靠本地群众和组织能力创造物质条件，减少被动等待；“丰衣足食”则是生产改善的目标。它并不等于每个人孤立自给，也不否认外部合作，而是把分散力量组织起来，在困难环境中增强基本生活和持续抗战的能力。'
historicalEvent: 1943年11月29日，毛泽东在陕甘宁边区劳动英雄大会上讲话。
background: 抗日根据地开展大生产运动，毛泽东强调通过合作组织把分散的群众力量和生产积极性结合起来。 此卡所选名句着重表现根据地军民通过自己动手开展生产来克服物资困难。
story: 《组织起来》围绕组织群众和发挥集体创造力逐层展开。这句话把根据地军民通过自己动手开展生产来克服物资困难凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
