quote: 党的主张办法，除宣传外，执行的时候必须通过政府的组织。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 井冈山的斗争
  authoredAt: '1928-11-25'
themes:
- 领导方法
interpretation:
  inspiration: “党的主张办法，除宣传外，执行的时候必须通过政府的组织”提示我们，遇到相似问题时先让方向、分工、沟通和执行彼此衔接。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《井冈山的斗争》，原文围绕领导方法的具体任务展开。“党的主张办法，除宣传外，执行的时候必须通过政府的组织”不是孤立口号，而是论证中的一个判断。它强调让方向、分工、沟通和执行彼此衔接；理解时也要看到，领导不是包办，决定也必须建立在信息和协作上。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1928年11月25日，《井冈山的斗争》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《井冈山的斗争》从当时的具体问题出发讨论领导方法，本卡从“党的主张办法，除宣传外，执行的时候必须通过政府的组织”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“党的主张办法，除宣传外，执行的时候必须通过政府的组织”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
