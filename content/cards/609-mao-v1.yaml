quote: 党的主张办法，除宣传外，执行的时候必须通过政府的组织。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 井冈山的斗争
  authoredAt: '1928-11-25'
themes:
- 领导方法
interpretation:
  inspiration: '提出方向的人不必亲手包办每个环节。让负责执行的组织拥有清楚权限和正常流程，事情才不会靠临时口头指令运转。分工明确，也是对责任的一种尊重。'
  explanation: '这句话区分党的政治领导与政府的行政执行：党的主张可以通过宣传说明，但成为实际政策时，应由苏维埃政府依照组织程序实施。1928年井冈山根据地初建，党、军队和政权的职责还容易混在一起，有时党组织直接包办政府事务。毛泽东在《井冈山的斗争》中批评这种做法，要求既坚持党的领导，也尊重政权组织的功能。否则，政府容易成为空架子，政策执行也依赖个别人的临时命令，难以形成稳定制度。'
historicalEvent: 1928年11月25日，《井冈山的斗争》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《井冈山的斗争》从当时的具体问题出发讨论领导方法，本卡从“党的主张办法，除宣传外，执行的时候必须通过政府的组织”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“党的主张办法，除宣传外，执行的时候必须通过政府的组织”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
