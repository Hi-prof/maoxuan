status: published
quote: 共产党员不应当是闭关主义者，而应当是国际主义者。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国共产党在民族战争中的地位
  authoredAt: '1938-10-14'
themes:
- 开放视野
interpretation:
  inspiration: 保持自己的立场，同时学习外部经验、关注共同问题，避免用封闭保护熟悉做法。
  explanation: 《中国共产党在民族战争中的地位》写到党员的模范作用和群众关系时，用这句话说明处理本地事业也要理解它同更广阔世界和共同利益的联系。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1938年10月14日，毛泽东在中共六届六中全会上作报告。
background: 抗战进入相持阶段前后，毛泽东讨论共产党员在民族战争中的模范作用、学习责任和群众关系。 此卡所选名句着重表现处理本地事业也要理解它同更广阔世界和共同利益的联系。
story: 《中国共产党在民族战争中的地位》围绕党员的模范作用和群众关系逐层展开。这句话把处理本地事业也要理解它同更广阔世界和共同利益的联系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
