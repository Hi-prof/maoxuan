id: ae64455c-887d-5a89-b77e-8a5f7ca85ef8
revision: 3
status: published
quote: 共产党员不应当是闭关主义者，而应当是国际主义者。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国共产党在民族战争中的地位
  authoredAt: '1938-10-14'
themes:
- 开放视野
interpretation:
  inspiration: '关心眼前的土地和人，并不妨碍抬头看看更远处。别人的经验、困境和帮助，常会让本地问题出现新的理解。开放不是丢掉自己，而是不把熟悉当成世界的全部。'
  explanation: '这句话要求共产党员在领导民族抗战时，不把中国的斗争封闭起来，而要看到它同世界反法西斯力量和国际工人运动的联系。1938年，日本侵华战争持续，中国抗战既是民族解放战争，也是当时国际反侵略斗争的一部分。毛泽东把民族立场与国际主义并列，并不是轻视本国实际，而是反对只顾本国、拒绝国际团结的狭隘态度。理解本地任务，同时认识共同利益和相互支援，是这里“国际主义”的具体含义。'
historicalEvent: 1938年10月14日，毛泽东在中共六届六中全会上作报告。
background: 抗战进入相持阶段前后，毛泽东讨论共产党员在民族战争中的模范作用、学习责任和群众关系。 此卡所选名句着重表现处理本地事业也要理解它同更广阔世界和共同利益的联系。
story: 《中国共产党在民族战争中的地位》围绕党员的模范作用和群众关系逐层展开。这句话把处理本地事业也要理解它同更广阔世界和共同利益的联系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
