quote: 在这个阶段中，应当组织贫农团，作为领导骨干，还可组织以贫农为主体的农会（可称为农民协会）。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在不同地区实施土地法的不同策略
  authoredAt: '1948-02-03'
themes:
- 群众路线
interpretation:
  inspiration: “在这个阶段中，应当组织贫农团，作为领导骨干，还可组织以贫农为主体的农会（可称为农民协会）”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《在不同地区实施土地法的不同策略》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“在这个阶段中，应当组织贫农团，作为领导骨干，还可组织以贫农为主体的农会（可称为农民协会）”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1948年2月3日，《在不同地区实施土地法的不同策略》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《在不同地区实施土地法的不同策略》从当时的具体问题出发讨论群众路线，本卡从“在这个阶段中，应当组织贫农团，作为领导骨干，还可组织以贫农为主体的农会（可称为农民协会）”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《在不同地区实施土地法的不同策略》中的理由和限制一起理解。
