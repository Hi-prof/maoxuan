quote: 正如人的认识反映不依赖于它而存在的自然界即发展着的物质那样，人的社会认识(即哲学、宗教、政治等等的不同观点和学说)反映社会的经济制度。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思主义的三个来源和三个组成部分》
  authoredAt: '1902'
themes:
- 社会关系
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《马克思主义的三个来源和三个组成部分》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义的三个来源和三个组成部分》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
