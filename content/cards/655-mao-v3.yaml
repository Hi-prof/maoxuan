quote: 美国工人阶级及其先锋队美国共产党反对白劳德修正主义――投降主义的胜利，对于中美两国人民目前所进行的反日战争和战后建设和平民主世界的伟大事业，无疑地将有重大的贡献。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 给福斯特同志的电报
  authoredAt: '1945-07-29'
themes:
- 群众路线
interpretation:
  inspiration: '远方组织里的路线争论，看似同自己无关，也可能影响共同事业怎样合作。理解这类文字，先补上人物和争议背景，比从一句赞扬里硬找通用道理更合适。'
  explanation: '白劳德曾领导美国共产党，二战后期主张资本主义与社会主义可以长期和谐合作，并在1944年推动解散共产党、改组为政治协会。福斯特等人批评这一路线放弃工人阶级独立政治立场，1945年美国共产党重建。毛泽东致电福斯特，称反对白劳德修正主义、投降主义的胜利，不仅关系美国工人运动，也有助于中美人民继续反日和建设战后和平民主世界。这是国际共产主义运动内部一次具体路线争论，不是一般的群众工作格言。'
historicalEvent: 1945年7月29日，《给福斯特同志的电报》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《给福斯特同志的电报》从当时的具体问题出发讨论群众路线，本卡从“美国工人阶级及其先锋队美国共产党反对白劳德修正主义――投降主义的胜利”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《给福斯特同志的电报》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
