quote: 社会的生产和资本主义占有之间的矛盾表现为个别工厂中生产的组织性和整个社会中生产的无政府状态之间的对立。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《社会主义从空想到科学的发展》
  authoredAt: '1878'
themes:
- 辩证思维
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《社会主义从空想到科学的发展》，可从“辩证思维”角度理解。辩证思维要求看到联系、变化和条件，不用静止标签代替分析。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《社会主义从空想到科学的发展》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
