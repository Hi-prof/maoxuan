themes:
- 理想
interpretation:
  inspiration: 遇到停滞时，别急着给自己下结论；先保留行动、学习和重新选择的空间。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 五四新文化运动推动白话文学、思想启蒙与社会批评，鲁迅是其中的重要作家。
background: 鲁迅的杂文、小说与书信常从个人处境切入，追问麻木、勇气、学习与社会责任。
