quote: 「我懷有一個建立民主和自由社會的美好理想，在這個社會裡，人人和睦相處，機會均等。我這生將追求此一理想，希望予以實現。但是如果需要，我也準備為這個理想獻出生命。」
literature:
  series: 名人名言
  volume: 纳尔逊·曼德拉
