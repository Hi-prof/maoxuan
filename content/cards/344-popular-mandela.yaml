themes:
- 理想
interpretation:
  inspiration: 把这句话当作一次提醒：认真生活，也认真分辨什么值得长期投入。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 南非反种族隔离斗争推动了20世纪末关于平等、和解与公共正义的全球讨论。
background: 曼德拉的言行常被用来思考尊严、和平、勇气和长期公共行动。
