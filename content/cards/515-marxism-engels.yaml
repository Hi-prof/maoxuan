quote: 资产阶级社会科学，即古典政治经济学，主要只研究人在生产和交换中的行为所产生的可以直接预期的社会影响。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《劳动在从猿到人转变过程中的作用》
  authoredAt: '1878'
themes:
- 社会关系
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《劳动在从猿到人转变过程中的作用》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《劳动在从猿到人转变过程中的作用》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
