status: published
quote: 一切真知都是从直接经验发源的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 经验
interpretation:
  inspiration: '不必每件事都从零撞一遍，别人留下的经验能省很多力气。不过，到了自己手上的具体问题，还是要看一看、做一做。借来的知识经过一次真实核验，才更稳当。'
  explanation: '“一切真知都从直接经验发源”是在说明知识的最终来源。人可以通过书本和他人获得大量间接经验，不必事事亲历；但这些知识在最初形成时，仍来自某些人的实际活动和观察。《实践论》用这一点反对把概念看成脱离现实、天然正确的东西。对个人而言，间接经验扩大了认识范围，直接实践则帮助判断它在当前条件下是否适用。两者不是互相排斥，而是共同构成认识不断深化的过程。'
historicalEvent: 1937年7月，毛泽东在延安讲授认识与实践问题。
background: 为克服党内教条主义，毛泽东在延安从认识论角度说明实践、认识、真理标准和反复检验的关系。 此卡所选名句着重表现知识的源头是人们在实践中获得并积累的经验。
story: 《实践论》围绕认识怎样从实践产生并接受检验逐层展开。这句话把知识的源头是人们在实践中获得并积累的经验凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
