quote: 生产本身日益社会化，使几十万以至几百万工人联结成一个有条不紊的经济机体，而共同劳动的产品却被一小撮资本家所占有。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思主义的三个来源和三个组成部分》
  authoredAt: '1902'
themes:
- 劳动
interpretation:
  inspiration: 不要用抽象口号跳过具体问题。把对象、条件、利益和变化过程放在一起看。
  explanation: 这句出自《马克思主义的三个来源和三个组成部分》，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义的三个来源和三个组成部分》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
