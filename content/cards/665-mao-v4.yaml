quote: 为着执行歼敌任务，除有计划地谨慎地从解放区动员人民参军外，必须大量利用俘虏。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中共中央关于九月会议的通知
  authoredAt: '1948-10-01'
themes:
- 群众路线
interpretation:
  inspiration: '这是特定战争条件下的兵员政策，不适合硬转成人生格言。它更值得帮助我们看懂一场战争怎样补充队伍、保护后方生产，以及被俘士兵的处境如何被重新安排。'
  explanation: '这句话讨论解放战争后期怎样补充兵员：在解放区征兵要有计划、谨慎进行，避免过多抽走农业和生产劳力；同时把大量国民党军俘虏经过教育改造后补入人民解放军。1948年战略决战临近，部队规模和连续作战任务迅速扩大，单靠根据地征兵会加重群众负担。利用俘虏既削弱对方，也补充自身，但并非简单强迫原样使用，背后有甄别、教育和组织改造。这是一项具体的战争动员安排，不能泛化为普通管理方法。'
historicalEvent: 1948年10月1日，《中共中央关于九月会议的通知》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中共中央关于九月会议的通知》从当时的具体问题出发讨论群众路线，本卡从“为着执行歼敌任务，除有计划地谨慎地从解放区动员人民参军外，必须大量利用俘虏”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“为着执行歼敌任务，除有计划地谨慎地从解放区动员人民参军外，必须大量利用俘虏”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
