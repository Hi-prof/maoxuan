quote: 必须努力生产，使一切必需品，首先是粮食和布匹，完全自给。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 以自卫战争粉碎蒋介石的进攻
  authoredAt: '1946-07-20'
themes:
- 经济建设
interpretation:
  inspiration: '外部供应可能中断时，先找出真正不能缺的几样东西。把基本需要的自主能力做稳，不是拒绝交换，而是让自己在变化里还有选择，不至于每次都被卡住。'
  explanation: '全面内战爆发后，解放区可能遭受军事进攻、交通封锁和物资断绝。毛泽东在部署自卫战争时要求继续努力生产，首先保证粮食和布匹等基本生活、军需品自给。军事胜负不仅取决于战场，也取决于后方能否养活军民、维持长期作战。这里的“完全自给”针对战争封锁下的解放区基本必需品，不是否定地区交换和商业。它强调把生产建设视为自卫能力的一部分，避免命脉掌握在可能中断的外部供应中。'
historicalEvent: 1946年7月20日，《以自卫战争粉碎蒋介石的进攻》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《以自卫战争粉碎蒋介石的进攻》从当时的具体问题出发讨论经济建设，本卡从“必须努力生产，使一切必需品，首先是粮食和布匹，完全自给”切入全文的一层论证。
story: 《以自卫战争粉碎蒋介石的进攻》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
