revision: 3
status: published
quote: 这种态度，就是有的放矢的态度。“的”就是中国革命，“矢”就是马克思列宁主义。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 改造我们的学习
  authoredAt: '1941-05-19'
themes:
- 理论联系实际
interpretation:
  inspiration: '手里有一把好工具，很容易看什么都像同一种问题。先把靶子看清：究竟要解决什么、条件是什么，再决定用哪种方法。箭很漂亮，射错方向也没有用。'
  explanation: '这句话用射箭比喻理论联系实际：“矢”是马克思列宁主义理论，“的”是中国革命的具体问题，有的放矢就是用理论研究和解决中国实际。1941年延安整风准备阶段，毛泽东批评有人熟读马克思主义词句，却不研究中国历史和现状，也不会处理现实问题。他反对的不是理论学习，而是理论与对象分离。箭要经过学习和掌握，靶也要通过调查才能看清；二者对准，理论才从可以背诵的知识变成分析问题的方法。'
historicalEvent: 1941年5月19日，毛泽东在延安干部会上作《改造我们的学习》报告。
background: 延安整风准备阶段，毛泽东批评主观主义学风，要求研究历史、现状并把理论用于中国实际。 此卡所选名句着重表现理论是解决实际问题的工具，使用前必须看清具体目标。
story: 《改造我们的学习》围绕学风、调查和理论联系实际逐层展开。这句话把理论是解决实际问题的工具，使用前必须看清具体目标凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
