revision: 3
status: published
quote: 又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 必须学会做经济工作
  authoredAt: '1945-01-10'
themes:
- 群众路线
interpretation:
  inspiration: '一句“大家努力”很难自己落地。负责人先做出样子，再挑一个具体点教会、做通，让经验慢慢扩散。号召有了现场和方法，参与的人才知道从哪里下手。'
  explanation: '这句话总结怎样领导根据地生产：主要负责人亲自承担责任、参加实践，依靠骨干带动广大群众，同时把普遍号召落实为对具体单位和具体问题的指导。1945年，毛泽东总结陕甘宁边区生产经验，批评只会发命令、不会做经济工作的干部。生产涉及土地、劳力、工具和经营，光提出增产目标不够；领导者要选择典型、解决实际困难，再推广经验。“首长负责”不是包办全部劳动，而是不能把经济任务当次要事务推给下级。'
historicalEvent: 1945年1月10日，《必须学会做经济工作》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《必须学会做经济工作》从当时的具体问题出发讨论群众路线，本卡从“又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《必须学会做经济工作》中的理由和限制一起理解。
