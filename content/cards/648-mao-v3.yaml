quote: 又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 必须学会做经济工作
  authoredAt: '1945-01-10'
themes:
- 群众路线
interpretation:
  inspiration: “又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《必须学会做经济工作》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1945年1月10日，《必须学会做经济工作》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《必须学会做经济工作》从当时的具体问题出发讨论群众路线，本卡从“又须首长负责，自己动手，实行领导骨干和广大群众相结合、一般号召和具体指导相结合的办法，才能有效地推进生产工作”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《必须学会做经济工作》中的理由和限制一起理解。
