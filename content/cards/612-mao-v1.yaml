revision: 3
status: published
quote: 蒋氏如欲在抗日问题上徘徊，推迟其诺言的实践，则全国人民的革命浪潮势将席卷蒋氏以去。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关于蒋介石声明的声明
  authoredAt: '1936-12-28'
themes:
- 群众路线
interpretation:
  inspiration: '一句承诺的分量，要看它后来有没有行动。等待兑现时，也可以保留观察和推动的力量。相信不必等于放弃判断，谨慎也不必把一切可能都提前关掉。'
  explanation: '这句话是在西安事变和平解决后，要求蒋介石把停止内战、共同抗日的声明变成实际行动。1936年12月，蒋介石获释后发表书面承诺，但措辞仍有保留。中共中央的声明一面欢迎有利于团结抗日的转变，一面警告如果继续拖延，全国日益高涨的抗日救亡运动将越过他。所谓“革命浪潮”指广大人民要求停止内战、抵抗日本侵略的政治压力。句子表达的是对承诺既争取又监督的态度，而不是一般的人际威胁。'
historicalEvent: 1936年12月28日，《关于蒋介石声明的声明》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关于蒋介石声明的声明》从当时的具体问题出发讨论群众路线，本卡从“蒋氏如欲在抗日问题上徘徊”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《关于蒋介石声明的声明》中的理由和限制一起理解。
