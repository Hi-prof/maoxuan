interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《哥达纲领批判》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
story: 此卡从《哥达纲领批判》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
