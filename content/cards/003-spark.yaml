id: 8a3e739a-9b89-5840-a47a-6bb2c6435c1c
revision: 4
status: published
quote: '它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 星星之火，可以燎原
  authoredAt: '1930-01-05'
themes:
  - 信念
  - 形势判断
interpretation:
  inspiration: '长期做一件事，低谷时很容易把眼前困难当成最终结局。先别急着乐观或悲观，看看支持变化的条件是否正在积累，有没有能够反复观察到的早期信号。方向可以坚定，日期却不必硬猜。把信心放在事实和行动上，也给变化、反复和判断失误留出余地。'
  explanation: '航船的桅杆、东方的朝日和将要出生的婴儿，都在说明同一件事：新的趋势还没有完全展开，但已经出现可以辨认的征兆。文章用这些意象回应红军内部对革命前途的悲观估计，认为不能只因眼前力量弱小、处境困难，就否认正在形成的条件。不过，这并不是对胜利时间的精确预言。原文紧接着说明，人们只能判断未来的大方向，不可能像算命一样机械规定时日。这里的信心来自对社会矛盾、群众力量和革命形势的分析，也需要继续由实践检验。把愿望当事实是盲目乐观，只看当前困难则会漏掉正在生长的新因素。'
historicalEvent: '1930年1月5日，毛泽东写信回应红军内部的悲观情绪，分析革命形势和根据地前途。'
background: '这篇文章原是写给林彪的一封信，回应红军内部对形势和前途的悲观估计。引文位于结尾，用三个逐层推进的意象说明革命高潮已经显露的趋势。'
story: '一九四八年公开刊行时，林彪提出不写明收信人姓名，毛泽东同意。收入《毛泽东选集》第一版时，信件改用今天通行的篇名。'
