id: 8a3e739a-9b89-5840-a47a-6bb2c6435c1c
revision: 2
status: published
quote: '它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 星星之火，可以燎原
  authoredAt: '1930-01-05'
themes:
  - 信念
  - 形势判断
interpretation:
  coreMeaning: '航船、朝日和婴儿三个意象都在描述同一件事：新的趋势尚未完全展开，却已经出现可以辨认的征兆。作者借此反驳只因眼前困难就否定革命前途的悲观判断。'
  keyPoint: '这不是对胜利日期的精确预言。紧邻的原文明确说，未来只能判断大的方向，不能机械规定时日。信心来自对形势和发展条件的分析，而不是把愿望当作事实。'
  contemporaryRelevance: '判断一件长期工作有没有前景，既不要被暂时挫折吓住，也不要只凭热情乐观。应寻找正在形成的条件和可验证的早期信号，同时给不确定性留下位置。'
contextExcerpt: '马克思主义者不是算命先生，未来的发展和变化，只应该也只能说出个大的方向，不应该也不可能机械地规定时日。'
background: '这篇文章原是写给林彪的一封信，回应红军内部对形势和前途的悲观估计。引文位于结尾，用三个逐层推进的意象说明革命高潮已经显露的趋势。'
story: '一九四八年公开刊行时，林彪提出不写明收信人姓名，毛泽东同意。收入《毛泽东选集》第一版时，信件改用今天通行的篇名。'
