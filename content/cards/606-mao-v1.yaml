revision: 3
status: published
quote: 做一个真正能干的高级指挥员，不是初出茅庐或仅仅善于在纸上谈兵的角色所能办到的，必须在战争中学习才能办得到。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: 1936-12
themes:
- 理论与实践
interpretation:
  inspiration: '读懂规则只是起点，真正的判断力会在现场慢慢形成。可以先承担小一点的真实责任，做完认真复盘。经验不是年头自然累积，而是行动被思考消化以后留下的东西。'
  explanation: '这句话说，优秀的高级指挥员既不是刚入门就能胜任，也不能只靠书本和纸上推演培养，必须在真实战争中学习。毛泽东在《中国革命战争的战略问题》中总结十年内战经验，强调战争规律要从实际作战中认识。它不是轻视军事理论；文章本身就在系统整理经验。理论能帮助理解，战场则不断提出意外条件，迫使指挥员判断敌我、地形、时机和士气。能力来自实践、总结、再实践的循环，而不是把未经反思的经历简单堆起来。'
historicalEvent: 1936年12月，《中国革命战争的战略问题》形成，集中讨论理论与实践及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国革命战争的战略问题》从当时的具体问题出发讨论理论与实践，本卡从“做一个真正能干的高级指挥员”切入全文的一层论证。
story: 《中国革命战争的战略问题》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
