revision: 3
status: published
quote: 民族战争而不依靠人民大众，毫无疑义将不能取得胜利。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 反对日本进攻的方针、办法和前途
  authoredAt: '1937-07-23'
themes:
- 群众路线
interpretation:
  inspiration: '一件关系到所有人的事，不能让大多数人只做观众。信息能听懂、意见能表达、行动有位置，参与才不只是被动支持。真正的力量往往藏在这层连接里。'
  explanation: '这句话判断，抵抗日本侵略的民族战争若不依靠广大人民，就不可能取得胜利。1937年七七事变后，毛泽东提出同国民党单纯依靠政府和军队的“片面抗战”不同的全面抗战路线：开放民众运动，实行民主，改善人民生活，并把人民组织进战争。民族战争涉及全国社会，兵员、生产、运输、情报和士气都离不开群众。所谓“依靠”不是只要求人民付出，而是要赋予他们参与的政治条件，并让抗战同他们的利益相联系。'
historicalEvent: 1937年7月23日，《反对日本进攻的方针、办法和前途》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《反对日本进攻的方针、办法和前途》从当时的具体问题出发讨论群众路线，本卡从“民族战争而不依靠人民大众”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《反对日本进攻的方针、办法和前途》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
