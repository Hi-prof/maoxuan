- 关系
interpretation:
  inspiration: 允许过程不完美，但别把一次受挫误认成全部可能性的终点。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“关系”压缩成简洁表达。关系的价值不在于迎合，而在于尊重、沟通和能否彼此成全。
historicalEvent: 两次世界大战改变了20世纪文学的主题，战争经历深刻影响了海明威的写作。
background: 海明威的小说以克制语言写压力、失败、尊严和人在困境中的选择。
story: 此卡按可追溯出处筛选自海明威语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
