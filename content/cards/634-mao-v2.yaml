revision: 3
status: published
quote: 我们应当向人民群众指出战争的胜利前途，使他们明白失败和困难的暂时性，只要百折不回地奋斗下去，最后的胜利必属于我们。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 和英国记者贝特兰的谈话
  authoredAt: '1937-10-25'
themes:
- 群众路线
interpretation:
  inspiration: '困难时的鼓励若只说“会好的”，很快会变轻。把已经具备的条件、眼前受挫为什么是暂时的、下一步能做什么讲清楚，信心就多了一点可以握住的东西。'
  explanation: '这句话要求向群众说明抗战能够胜利的根据，使人们理解眼前失败和困难只是战争过程中的阶段，而不是最终结局。1937年上海等地战事艰苦，社会上既有恐慌，也有对速胜的幻想。毛泽东同英国记者贝特兰谈话时强调全面动员群众、实行持久抗战，并相信长期奋斗会改变力量对比。指出胜利前途不是用口号安慰，而要解释中国的广阔国土、人民力量、战争正义性等条件，让群众知道为什么值得坚持、怎样参加。'
historicalEvent: 1937年10月25日，《和英国记者贝特兰的谈话》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《和英国记者贝特兰的谈话》从当时的具体问题出发讨论群众路线，本卡从“我们应当向人民群众指出战争的胜利前途”切入全文的一层论证。
story: 《和英国记者贝特兰的谈话》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
