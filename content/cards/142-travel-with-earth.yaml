revision: 2
status: published
quote: 坐地日行八万里，巡天遥看一千河。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七律二首·送瘟神
  authoredAt: '1958-07-01'
themes:
- 想象力
interpretation:
  inspiration: 跳出眼前尺度能改变问题感受，但宏观视野最终仍要落回当下可做的行动。
  explanation: 《七律二首·送瘟神》写到公共卫生、人民行动和社会变化时，用这句话说明以地球运动的尺度拓展观察世界的想象。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1958年6月30日，《人民日报》报道余江县消灭血吸虫病。
background: 得知江西余江县消灭血吸虫病后，毛泽东写下两首七律，把公共卫生实践同社会面貌变化联系起来。 此卡所选名句着重表现以地球运动的尺度拓展观察世界的想象。
story: 《七律二首·送瘟神》以景物、行动和历史联想组织诗意。这一句集中呈现以地球运动的尺度拓展观察世界的想象，既有鲜明画面，也保留了作品写作时的现实背景。
