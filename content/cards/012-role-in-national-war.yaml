id: 189e81c3-ffeb-5f4c-a450-05c221d53cf8
revision: 3
status: published
quote: '共产党员应是实事求是的模范，又是具有远见卓识的模范。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国共产党在民族战争中的地位
  authoredAt: '1938-10-14'
themes:
  - 实事求是
  - 学习
interpretation:
  inspiration: '做计划时，分开问两个问题：眼前的事实支持我做什么，这一步又会把事情带向哪里。只顾短期结果，可能忙得很有效率却走错方向；只谈长远目标，没有具体步骤，也很难落地。把现实材料和长期方向放在一起检查，今天的行动才既能完成，又不会越走越偏。'
  explanation: '这句话把实事求是和远见卓识放在一起，说明行动需要两种相互校正的能力。面对当前任务，要尊重事实、了解条件，把确定的事情办成；面对长期道路，又不能只见局部，要判断现在的选择会通向哪里。实事求是不是只顾眼前，更不是见什么做什么。远见也不是离开材料大胆想象。原文把二者同时列为党员发挥模范作用的要求，意味着长期判断必须由现实情况支撑，具体工作也要接受整体方向的检验。文章随后说既要做民众的教师，也要做民众的学生，进一步说明判断不是个人闭门形成的，需要在环境、群众和友军的实际经验中不断学习。只有一面，工作都容易失去平衡。'
historicalEvent: '1938年10月14日，中共六届六中全会期间，毛泽东作结论并讨论党员在民族战争中的作用。'
background: '文章是中共扩大的六届六中全会结论的一部分，讨论党员在民族战争中的先锋作用、组织纪律和学习任务。'
story: '引文之后紧接着提出“每天都是民众的教师，但又每天都是民众的学生”，把模范作用同向群众、环境和友军学习联系起来。'
