id: 1286c5ba-ea06-5e1a-a65a-8c8a69261dee
revision: 3
status: published
quote: 只有开展经济战线方面的工作，发展红色区域的经济，才能使革命战争得到相当的物质基础。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
- 经济建设
interpretation:
  inspiration: '理想说得再清楚，也要落到时间、体力、工具和预算上。准备做一件长期的事时，先找出最容易断掉的补给线，把基础照顾好，心里会踏实许多。'
  explanation: '这句话是在说，革命战争不能只靠政治动员和军事行动，还要有根据地经济提供粮食、物资和财政支持。1933年的中央革命根据地处在战争压力与物资困难中，经济工作一度没有得到足够重视。毛泽东要求组织农业、手工业和合作社等生产，把发展经济视为支撑战争、改善群众生活的实际条件。它把宏大的政治目标拉回物质基础：没有稳定生产和组织能力，再正确的方向也难以长久维持。'
historicalEvent: 1933年8月12日，毛泽东在南部十七县经济建设大会上作报告。
background: 中央革命根据地面临战争和物资困难，毛泽东要求把经济建设作为支持战争、改善群众生活的重要工作。 此卡所选名句着重表现长期目标必须有稳定的物质和组织基础。
story: 《必须注意经济工作》围绕经济建设与群众负担逐层展开。这句话把长期目标必须有稳定的物质和组织基础凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
