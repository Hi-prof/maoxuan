revision: 1
status: published
quote: 只有开展经济战线方面的工作，发展红色区域的经济，才能使革命战争得到相当的物质基础。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
- 经济建设
interpretation:
  inspiration: 宏大计划要落到预算、供给、人员和维护机制上，否则意志难以持续。
  explanation: 原文出自《必须注意经济工作》，围绕经济建设与群众负担展开。这句话强调长期目标必须有稳定的物质和组织基础。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1933年8月12日，毛泽东在南部十七县经济建设大会上作报告。
background: 中央革命根据地面临战争和物资困难，毛泽东要求把经济建设作为支持战争、改善群众生活的重要工作。 此卡所选名句着重表现长期目标必须有稳定的物质和组织基础。
story: 《必须注意经济工作》围绕经济建设与群众负担逐层展开。这句话把长期目标必须有稳定的物质和组织基础凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
