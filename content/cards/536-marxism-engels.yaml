interpretation:
  inspiration: 不要用抽象口号跳过具体问题。把对象、条件、利益和变化过程放在一起看。
  explanation: 这句出自《反杜林论》旧序：论辩证法，可从“理论与实践”角度理解。理论的价值不在于替代现实，而在于帮助提出问题、组织行动并接受检验。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
