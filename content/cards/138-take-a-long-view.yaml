revision: 1
status: published
quote: 牢骚太盛防肠断，风物长宜放眼量。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七律·和柳亚子先生
  authoredAt: '1949-04-29'
themes:
- 长远眼光
interpretation:
  inspiration: 情绪需要被看见，也要补充时间尺度和全局信息，避免让眼前不快支配全部判断。
  explanation: 《七律·和柳亚子先生》写到化解牢骚和放宽历史眼光时，用这句话说明劝友人减少困于一时牢骚，把眼光放到更长历史和更广风物。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1949年4月29日，毛泽东写诗酬答柳亚子。
background: 新中国成立前夕，毛泽东和诗劝慰柳亚子，把个人感慨放到更长的历史和更广的风物中看。 此卡所选名句着重表现劝友人减少困于一时牢骚，把眼光放到更长历史和更广风物。
story: 《七律·和柳亚子先生》以景物、行动和历史联想组织诗意。这一句集中呈现劝友人减少困于一时牢骚，把眼光放到更长历史和更广风物，既有鲜明画面，也保留了作品写作时的现实背景。
