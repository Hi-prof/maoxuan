revision: 3
status: published
quote: 俗话说：“到什么山上唱什么歌。”又说：“看菜吃饭，量体裁衣。”
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 反对党八股
  authoredAt: '1942-02-08'
themes:
- 表达
interpretation:
  inspiration: '同一句话，对熟悉背景的人和第一次听的人，讲法本来就可以不同。沟通前想一想对方站在哪里、需要什么，不是讨好，而是让意思真的走到对方那里。'
  explanation: '“到什么山上唱什么歌”和“量体裁衣”都在说，写文章、作演说要看具体对象和场合，不能拿一种固定腔调应付所有人。1942年延安整风中，毛泽东批评党八股空话连篇、装腔作势，其中一个问题就是不看读者，只按僵硬格式说话。他借群众熟悉的俗语要求表达者先研究实际情况：对谁说、要解决什么问题、对方能否听懂。因地制宜不是随意改变原则，而是让内容找到适合任务的形式。'
historicalEvent: 1942年2月8日，毛泽东在延安干部会上讲演。
background: 延安整风期间，毛泽东逐条分析党八股的表现，要求文章和讲话有内容、看对象、讲准确。 此卡所选名句着重表现表达和工作方法要根据对象、条件和任务作具体调整。
story: 《反对党八股》围绕写作、表达和实事求是逐层展开。这句话把表达和工作方法要根据对象、条件和任务作具体调整凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
