id: 91d65b57-3cc3-4c37-ba02-fce9d36deaa1
revision: 2
status: published
quote: 只有在我们把土地分配给农民，对农民的生产加以提倡奖励以后，农民群众的劳动热情才爆发了起来，伟大的生产胜利才能得到。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 我们的经济政策
  authoredAt: 1934-01
themes:
- 群众路线
interpretation:
  inspiration: 可以把“只有在我们把土地分配给农民”转成一个工作问题：怎样把当事人的处境和实际需要放进决策？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《我们的经济政策》中，这句话服务于对群众路线问题的分析。它把“只有在我们把土地分配给农民”同实际任务联系起来，要求把当事人的处境和实际需要放进决策。它的现实启发主要是一种工作方法；尊重群众不等于放弃分析和责任边界，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1934年1月，《我们的经济政策》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《我们的经济政策》从当时的具体问题出发讨论群众路线，本卡从“只有在我们把土地分配给农民”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《我们的经济政策》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
