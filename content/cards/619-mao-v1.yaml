id: 91d65b57-3cc3-4c37-ba02-fce9d36deaa1
revision: 3
status: published
quote: 只有在我们把土地分配给农民，对农民的生产加以提倡奖励以后，农民群众的劳动热情才爆发了起来，伟大的生产胜利才能得到。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 我们的经济政策
  authoredAt: 1934-01
themes:
- 群众路线
interpretation:
  inspiration: '积极性很少凭口号突然出现。一个人对成果有真实关系，也获得工具和鼓励，才更愿意投入。与其催促“再努力一点”，不如看看条件和回报是不是连得起来。'
  explanation: '这句话说，分配土地改变了农民同生产资料和劳动成果的关系，再加上对生产的鼓励，农民的劳动积极性才被充分调动，根据地也取得生产增长。1934年的《我们的经济政策》总结土地革命后苏区经济建设经验。毛泽东把生产热情同实际利益联系起来，反对只靠政治号召要求农民增产。农民获得土地后，劳动成果更多归自己，同时政府通过政策支持生产，个人利益与根据地公共需要才有了结合的基础。'
historicalEvent: 1934年1月，《我们的经济政策》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《我们的经济政策》从当时的具体问题出发讨论群众路线，本卡从“只有在我们把土地分配给农民”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《我们的经济政策》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
