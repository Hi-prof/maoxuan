revision: 3
status: published
quote: 各抗日根据地的全体同志必须认识，今后的物质困难必然更甚于目前，我们必须克服这个困难，我们的重要的办法之一就是精兵简政。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 一个极其重要的政策
  authoredAt: '1942-09-07'
themes:
- 理论与实践
interpretation:
  inspiration: '资源将变紧时，早点把组织做轻，比撑到耗尽再慌张好。精简不是随便砍人砍事，而是分清哪些真正支撑目标，让留下的部分运转得更清楚。'
  explanation: '这句话判断抗日根据地的物质困难还会加重，必须通过“精兵简政”减少脱离生产的人口和行政负担。1941年后，日军“扫荡”、国民党封锁和灾荒使根据地财政供给十分紧张，庞大的机关和部队会把过多负担压给群众。毛泽东采纳李鼎铭提出的建议，把它称为极其重要的政策。精简不是削弱抗战，而是压缩重叠机构、提高效率、减轻人民负担，使有限资源能够支持更持久的战争和政权工作。'
historicalEvent: 1942年9月7日，《一个极其重要的政策》形成，集中讨论理论与实践及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《一个极其重要的政策》从当时的具体问题出发讨论理论与实践，本卡从“各抗日根据地的全体同志必须认识”切入全文的一层论证。
story: 《一个极其重要的政策》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
