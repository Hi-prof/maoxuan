revision: 1
status: published
quote: 伟大的胜利的中国人民解放战争和人民大革命，已经复兴了并正在复兴着伟大的中国人民的文化。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 唯心历史观的破产
  authoredAt: '1949-09-16'
themes:
- 群众路线
interpretation:
  inspiration: 从“伟大的胜利的中国人民解放战争和人民大革命”出发，可以把态度转成行动：把当事人的处境和实际需要放进决策，并让事实、分工和实际结果检验原先的判断。
  explanation: 《唯心历史观的破产》讨论的是特定历史条件下的群众路线问题。这里用“伟大的胜利的中国人民解放战争和人民大革命”指出行动应有的着力点，核心在于把当事人的处境和实际需要放进决策。原文并不支持脱离对象的简单化理解，因为尊重群众不等于放弃分析和责任边界。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1949年9月16日，《唯心历史观的破产》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《唯心历史观的破产》从当时的具体问题出发讨论群众路线，本卡从“伟大的胜利的中国人民解放战争和人民大革命”切入全文的一层论证。
story: 《唯心历史观的破产》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
