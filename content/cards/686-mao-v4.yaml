revision: 3
status: published
quote: 伟大的胜利的中国人民解放战争和人民大革命，已经复兴了并正在复兴着伟大的中国人民的文化。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 唯心历史观的破产
  authoredAt: '1949-09-16'
themes:
- 群众路线
interpretation:
  inspiration: 一个人或一群人长期没有机会表达，不等于没有创造力。评价作品和能力时，不妨也看看教育、资源和发言空间有没有打开；条件变了，人的面貌也会变。
  explanation: 这句话认为，人民解放战争和革命的胜利正在使中国人民重新取得文化上的主动和创造力。1949年9月，新中国成立前夕，《唯心历史观的破产》针对美国国务卿艾奇逊关于中国革命原因的说法展开批驳；前文谈到马克思列宁主义同中国实际结合，使中国人“在精神上由被动转入主动”。因而这里的“文化复兴”不是单指文艺繁荣，而是作者对政治解放、思想主体性与文化发展的整体判断。
historicalEvent: 1949年9月16日，《唯心历史观的破产》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《唯心历史观的破产》从当时的具体问题出发讨论群众路线，本卡从“伟大的胜利的中国人民解放战争和人民大革命”切入全文的一层论证。
story: 《唯心历史观的破产》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
