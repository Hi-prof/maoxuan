id: 013f8239-97fd-41af-b16b-44b66934cc90
revision: 1
status: published
quote: 必须依靠自己手里的力量，行动指导上的正确，党内兄弟一样的团结和对人民有良好的关系。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中共中央关于同国民党进行和平谈判的通知
  authoredAt: '1945-08-26'
themes:
- 群众路线
interpretation:
  inspiration: 从“必须依靠自己手里的力量”出发，可以把态度转成行动：把当事人的处境和实际需要放进决策，并让事实、分工和实际结果检验原先的判断。
  explanation: 《中共中央关于同国民党进行和平谈判的通知》讨论的是特定历史条件下的群众路线问题。这里用“必须依靠自己手里的力量”指出行动应有的着力点，核心在于把当事人的处境和实际需要放进决策。原文并不支持脱离对象的简单化理解，因为尊重群众不等于放弃分析和责任边界。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1945年8月26日，《中共中央关于同国民党进行和平谈判的通知》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中共中央关于同国民党进行和平谈判的通知》从当时的具体问题出发讨论群众路线，本卡从“必须依靠自己手里的力量”切入全文的一层论证。
story: 《中共中央关于同国民党进行和平谈判的通知》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
