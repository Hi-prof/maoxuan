revision: 3
status: published
quote: 必须依靠自己手里的力量，行动指导上的正确，党内兄弟一样的团结和对人民有良好的关系。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中共中央关于同国民党进行和平谈判的通知
  authoredAt: '1945-08-26'
themes:
- 群众路线
interpretation:
  inspiration: '谈判和自立并不矛盾。愿意坐下来争取好结果，同时保留自己的能力、判断和支持关系，交流会更踏实。把希望全押在对方善意上，反而让谈判失去根基。'
  explanation: '抗战胜利后，毛泽东准备赴重庆同国民党谈判。中共中央通知指出，谈判是争取和平、揭露内战阴谋的必要行动，但不能因此解除警惕或放弃解放区自身力量。真正可靠的基础包括人民军队和根据地、正确的行动方针、党内团结以及同人民的良好关系。这里把外部谈判与内部建设并列：和平要争取，却不能只寄托在国民党的承诺和国际调停上。拥有独立力量，也使谈判不至于成为单方面接受条件。'
historicalEvent: 1945年8月26日，《中共中央关于同国民党进行和平谈判的通知》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中共中央关于同国民党进行和平谈判的通知》从当时的具体问题出发讨论群众路线，本卡从“必须依靠自己手里的力量”切入全文的一层论证。
story: 《中共中央关于同国民党进行和平谈判的通知》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
