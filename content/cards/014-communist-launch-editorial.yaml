id: e4cf09ca-b2ea-5772-b80b-d3e1a854bae8
revision: 4
status: published
quote: '统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 《共产党人》发刊词
  authoredAt: '1939-10-04'
themes:
  - 党的建设
  - 革命方法
interpretation:
  inspiration: '一项复杂工作出了问题，不妨同时看看三处：外部合作是否合适，实际行动有没有抓手，内部团队能不能承担。只顾拉伙伴，自己没有能力；只顾冲任务，没有合作空间；只练内部，却不接触真实问题，都会形成短板。三方面要一起看，具体做法还得跟着环境调整。'
  explanation: '文章把统一战线、武装斗争和党的建设概括为中国革命长期经验中的三个主要问题。它们分别回答同哪些力量联合、用什么形式开展斗争，以及怎样建设能够承担任务的组织。“三个法宝”不是三个彼此分开的口号。文章回顾建党十八年的经历，重点分析它们在不同阶段怎样变化、怎样互相影响。联合需要有原则，也需要组织领导；斗争会检验合作关系是否可靠，同时暴露组织能力的不足；党的建设又不是关起门来完成，而是在联合和斗争的实际过程中推进。理解这句话，关键不是记住三个名词，而是看到外部关系、行动方式和内部能力必须互相配合，并随具体形势重新安排重点。'
historicalEvent: '1939年10月4日，党内刊物《共产党人》创刊，毛泽东撰写发刊词总结建党十八年的经验。'
background: '这篇发刊词为党内刊物《共产党人》创刊而写，以建党十八年的成败经验为材料，集中说明统一战线、武装斗争和党的建设之间的关系。'
story: '文章没有把“三个法宝”当作并列口号，而是逐一回顾它们在不同历史阶段怎样变化，以及党的组织如何在这些斗争中发展。'
