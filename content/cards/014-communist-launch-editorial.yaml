id: e4cf09ca-b2ea-5772-b80b-d3e1a854bae8
revision: 2
status: published
quote: '统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 《共产党人》发刊词
  authoredAt: '1939-10-04'
themes:
  - 党的建设
  - 革命方法
interpretation:
  coreMeaning: '文章把统一战线、武装斗争和党的建设概括为长期革命经验中的三种主要力量。它们分别回答联合哪些力量、采取什么斗争形式，以及怎样建设能够承担任务的组织。'
  keyPoint: '“三个法宝”不是彼此孤立的口号。原文着重回顾它们在不同阶段的变化和相互作用：联合与斗争需要组织领导，组织本身又在实际斗争和合作关系中受到检验。'
  contemporaryRelevance: '分析一项复杂事业时，可以同时查看外部合作、实际行动和内部能力是否匹配。只强调某一方面，往往会让另外两处成为短板；具体方法仍须随环境变化重新判断。'
contextExcerpt: '正确地理解了这三个问题及其相互关系，就等于正确地领导了全部中国革命。'
background: '这篇发刊词为党内刊物《共产党人》创刊而写，以建党十八年的成败经验为材料，集中说明统一战线、武装斗争和党的建设之间的关系。'
story: '文章没有把“三个法宝”当作并列口号，而是逐一回顾它们在不同历史阶段怎样变化，以及党的组织如何在这些斗争中发展。'
