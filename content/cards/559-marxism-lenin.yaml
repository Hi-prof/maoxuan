quote: 农民以废除封建残余为满足，转而支持现存秩序，只是间或动摇于工人民主派和资产阶级自由派之间。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思学说的历史命运》
  authoredAt: '1902'
themes:
- 人的发展
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《马克思学说的历史命运》，可从“人的发展”角度理解。自由不是抽象口号，而要落实到人能够实际发展能力、参与社会生活的条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思学说的历史命运》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
