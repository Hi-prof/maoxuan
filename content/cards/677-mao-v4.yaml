quote: 各纵均须构筑两面阻击阵地，务使敌人不能跑掉，然后休整部队，恢复疲劳，然后攻歼几部分较小之敌。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于平津战役的作战方针
  authoredAt: '1948-12-11'
themes:
- 政策
interpretation:
  inspiration: '这是一道具体作战命令，不必硬拗成生活道理。若只取一点温和的观察，就是节奏也属于计划：先控制局面，再休整恢复，最后处理较小目标，并非越快连续用力越好。'
  explanation: '这句话部署平津战役初期的包围与歼敌次序：各纵队构筑两面阻击阵地，切断国民党军逃跑或相互增援的路线；形成包围后先让连续行军作战的部队休整、恢复疲劳，再逐步攻歼较小敌军。1948年底，中央军委试图稳住傅作义集团，避免其海运南撤或西逃，同时争取东北野战军完成入关部署。命令体现的是对包围、休整和攻击节奏的精确安排，不能简单归入抽象政策或群众路线。'
historicalEvent: 1948年12月11日，《关于平津战役的作战方针》形成，集中讨论政策及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于平津战役的作战方针》从当时的具体问题出发讨论政策，本卡从“各纵均须构筑两面阻击阵地”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“各纵均须构筑两面阻击阵地”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
