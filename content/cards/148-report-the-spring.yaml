revision: 1
status: published
quote: 俏也不争春，只把春来报。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 卜算子·咏梅
  authoredAt: 1961-12
themes:
- 奉献
interpretation:
  inspiration: 完成先行工作后让成果服务共同目标，不必把所有关注和荣誉留给自己。
  explanation: 原文出自《卜算子·咏梅》，围绕坚韧、报春和完成后的谦退展开。这句话强调梅花报春而不争春，突出承担使命而不争功。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1961年12月，毛泽东写作《卜算子·咏梅》。
background: 毛泽东读陆游咏梅词后反其意而作，用风雪中的梅花写坚韧、报春和不争功。 此卡所选名句着重表现梅花报春而不争春，突出承担使命而不争功。
story: 《卜算子·咏梅》以景物、行动和历史联想组织诗意。这一句集中呈现梅花报春而不争春，突出承担使命而不争功，既有鲜明画面，也保留了作品写作时的现实背景。
