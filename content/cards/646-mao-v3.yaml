quote: 中国民族解放战争的新阶段已经到来了，全国人民应该加强团结，为夺取最后胜利而斗争。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 对日寇的最后一战
  authoredAt: '1945-08-09'
themes:
- 群众路线
interpretation:
  inspiration: '事情进入收尾阶段时，最容易一半放松、一半混乱。看清阶段变了，就重新整理目标、分工和风险。接近终点不是自动抵达，最后一段也值得认真走。'
  explanation: '1945年8月，苏联对日宣战并出兵中国东北，日本战败已成定局。毛泽东发表《对日寇的最后一战》，判断抗战进入全面反攻和争取最后胜利的新阶段，号召各抗日力量加强团结，向日军及其伪军展开广泛进攻。“新阶段”不是说战争已经自然结束，而是外部力量对比发生重大变化，中国抗日力量要抓住时机收复失地、接受投降并保卫人民成果。越接近胜利，越需要组织行动，而不能只等待局势替自己完成任务。'
historicalEvent: 1945年8月9日，《对日寇的最后一战》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《对日寇的最后一战》从当时的具体问题出发讨论群众路线，本卡从“中国民族解放战争的新阶段已经到来了”切入全文的一层论证。
story: 《对日寇的最后一战》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
