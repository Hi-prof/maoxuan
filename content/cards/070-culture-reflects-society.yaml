quote: 一定的文化是一定社会的政治和经济在观念形态上的反映。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 文化
interpretation:
  inspiration: 理解作品或观念时，也要考察它产生的制度、利益和生活条件，避免孤立评价。
  explanation: 《新民主主义论》写到新民主主义革命及其政治文化纲领时，用这句话说明文化同社会的政治经济条件存在紧密联系。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现文化同社会的政治经济条件存在紧密联系。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把文化同社会的政治经济条件存在紧密联系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
