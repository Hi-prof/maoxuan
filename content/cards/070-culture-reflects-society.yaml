quote: 一定的文化是一定社会的政治和经济在观念形态上的反映。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 文化
interpretation:
  inspiration: '一部作品或一种风气不会凭空出现。除了问“它表达了什么”，也可以看看当时人怎样生活、谁有发言机会、什么利益正在变化。背景多一层，理解常会松动一点。'
  explanation: '这句话说，文学、艺术、思想和教育等文化形态，会反映一个社会的政治关系和经济结构。1940年的《新民主主义论》正试图从中国革命所处阶段出发，说明应当建设怎样的政治、经济与文化。文化在这里不是同现实分离的装饰，而是社会生活在观念中的表现。所谓“反映”也不是简单照镜子：文章同时认为新的文化能够组织思想、影响现实。理解文化，既要读它自身的内容，也要追问它在怎样的社会条件中产生、服务于谁。'
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现文化同社会的政治经济条件存在紧密联系。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把文化同社会的政治经济条件存在紧密联系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
