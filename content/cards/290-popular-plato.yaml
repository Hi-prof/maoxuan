themes:
- 理想
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 古希腊哲学从对话、辩论和城邦生活中发展出关于知识、正义和教育的系统思考。
background: 柏拉图用对话体讨论真理、灵魂、政治和教育，常提醒读者区分意见与经过论证的知识。
story: 此卡按可追溯出处筛选自柏拉图语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
