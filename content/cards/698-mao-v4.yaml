quote: 大约不要很久，战犯名单就可公布，代表就可指派，谈判就可开始，孙院长就不能说我们“迷信武力”了。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 评国民党对战争责任问题的几种答案
  authoredAt: '1949-02-18'
themes:
- 战略
interpretation:
  inspiration: 从“大约不要很久，战犯名单就可公布，代表就可指派，谈判就可开始，孙院长就不能说我们“迷信武力”了”出发，可以把态度转成行动：分清长期趋势、当前力量和行动节奏，并让事实、分工和实际结果检验原先的判断。
  explanation: 《评国民党对战争责任问题的几种答案》讨论的是特定历史条件下的战略问题。这里用“大约不要很久，战犯名单就可公布，代表就可指派，谈判就可开始，孙院长就不能说我们“迷信武力”了”指出行动应有的着力点，核心在于分清长期趋势、当前力量和行动节奏。原文并不支持脱离对象的简单化理解，因为历史战争经验不能脱离时代直接套用。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1949年2月18日，《评国民党对战争责任问题的几种答案》形成，集中讨论战略及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《评国民党对战争责任问题的几种答案》从当时的具体问题出发讨论战略，本卡从“大约不要很久，战犯名单就可公布，代表就可指派，谈判就可开始，孙院长就不能说我们“迷信武力”了”切入全文的一层论证。
story: 《评国民党对战争责任问题的几种答案》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
