  inspiration: 把认识放回行动中验证：先做可观察的一步，再根据结果修正原先的判断。
  explanation: 这句出自《德意志意识形态》（节选），可从“历史唯物主义”角度理解。历史分析要回到人们怎样生活、生产和组织社会的具体条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
