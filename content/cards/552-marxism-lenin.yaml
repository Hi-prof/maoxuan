themes:
- 社会关系
interpretation:
  inspiration: 把认识放回行动中验证：先做可观察的一步，再根据结果修正原先的判断。
  explanation: 这句出自《马克思主义和修正主义》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义和修正主义》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
