revision: 2
status: published
quote: 因为革命战争是群众的战争，只有动员群众才能进行战争，只有依靠群众才能进行战争。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
- 群众路线
interpretation:
  inspiration: “因为革命战争是群众的战争”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《关心群众生活，注意工作方法》，原文围绕群众路线的具体任务展开。“因为革命战争是群众的战争”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1934年1月27日，《关心群众生活，注意工作方法》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关心群众生活，注意工作方法》从当时的具体问题出发讨论群众路线，本卡从“因为革命战争是群众的战争”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“因为革命战争是群众的战争”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
