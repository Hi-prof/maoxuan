quote: 因为革命战争是群众的战争，只有动员群众才能进行战争，只有依靠群众才能进行战争。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
- 群众路线
interpretation:
  inspiration: '一件需要许多人参与的事，不能只在少数人的计划表里完成。大家知道为什么做，生活上的顾虑有人回应，才会从“被动配合”走向真正投入。'
  explanation: '这句话说，革命战争不是少数军人单独进行的战争，只有广大群众被发动、组织并真心支持，战争才有兵员、物资、情报和社会基础。1934年根据地正处在反“围剿”的困难中，毛泽东在代表大会报告中把军事动员同关心群众生活放在一起。他认为，只向群众提出参军、支前等要求，却不解决土地、劳动和柴米油盐问题，不可能获得持久支持。“依靠群众”因此不是抽象赞美，而是由具体利益、组织工作和共同目标构成的关系。'
historicalEvent: 1934年1月27日，《关心群众生活，注意工作方法》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关心群众生活，注意工作方法》从当时的具体问题出发讨论群众路线，本卡从“因为革命战争是群众的战争”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“因为革命战争是群众的战争”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
