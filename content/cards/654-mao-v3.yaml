revision: 3
status: published
quote: 在这四十八天中，这个城市每天的胜负消息，紧系着无数千万、万万人民的呼吸，使他们忧愁，使他们欢乐。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 第二次世界大战的转折点
  authoredAt: '1942-10-12'
themes:
- 群众路线
interpretation:
  inspiration: '有些远方事件会让许多陌生人同时揪心，因为大家知道自己的生活也同它相连。理解这种共同情绪，不只看新闻热度，还要看那件事承载了怎样的希望和危险。'
  explanation: '“这个城市”指斯大林格勒。1942年夏秋，德军猛烈进攻，城市守卫战持续，每天战况都牵动世界反法西斯人民。毛泽东在战斗开始四十八天后撰文，判断斯大林格勒保卫战关系苏德战场乃至第二次世界大战全局，可能成为由法西斯进攻转向反法西斯反攻的转折点。人们的忧乐不是对一座陌生城市的围观，而是因为它集中承载了战争走向、各国生存和解放希望。后来战役胜利也印证了其重大转折意义。'
historicalEvent: 1942年10月12日，《第二次世界大战的转折点》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《第二次世界大战的转折点》从当时的具体问题出发讨论群众路线，本卡从“在这四十八天中，这个城市每天的胜负消息，紧系着无数千万、万万人民的呼吸，使他们忧愁，使他们欢乐”切入全文的一层论证。
story: 《第二次世界大战的转折点》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
