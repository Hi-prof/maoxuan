revision: 3
status: published
quote: 我们又认为中国人民革命阵营必须巩固，必须不容许坏人侵入，必须不容许错误的主张获得胜利。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 将革命进行到底
  authoredAt: '1948-12-30'
themes:
- 群众路线
interpretation:
  inspiration: 组建团队时，门槛太高会错过愿意帮忙的人，规则太模糊又容易偏离目标。把参与方式和共同底线提前说清，比事后靠猜测彼此动机省心。
  explanation: 这句话主张，在扩大革命阵营、联合愿意参加者的同时，也要防止反对力量借“和平”进入阵营并改变其方向。1948年末三大战役胜局已显，《将革命进行到底》针对国民党方面的和平倡议，判断其意在保存力量；原文前一段刚说“必须扩大”、需要主力军和同盟军，随后才说“必须巩固”。因此，这里的“坏人”“错误主张”属于当时革命阵营的敌我划分，不能直接套作普通交往中的识人准则。
historicalEvent: 1948年12月30日，《将革命进行到底》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《将革命进行到底》从当时的具体问题出发讨论群众路线，本卡从“我们又认为中国人民革命阵营必须巩固”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《将革命进行到底》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
