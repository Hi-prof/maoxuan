revision: 2
status: published
quote: 为什么在我们年轻时我们面前的生命之路总是显得无比漫长？因为我们不得不找寻空间塞满我们无限的希望。
literature:
  series: 名人名言
  volume: 叔本华
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1840'
themes:
- 人生
interpretation:
  inspiration: 把这句话当作一次提醒：认真生活，也认真分辨什么值得长期投入。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 19世纪欧洲哲学在理性主义之外重新讨论欲望、痛苦、艺术与人生体验。
background: 叔本华的观点常带有锋芒，适合用来反省欲望、判断和独处，而不宜被断章当成消极结论。
story: 此卡按可追溯出处筛选自叔本华语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
