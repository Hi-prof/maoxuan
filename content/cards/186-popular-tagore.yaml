themes:
- 人生
interpretation:
  inspiration: 遇到停滞时，别急着给自己下结论；先保留行动、学习和重新选择的空间。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 1913年，泰戈尔获得诺贝尔文学奖，亚洲文学获得更广泛的世界性关注。
background: 泰戈尔的诗歌与散文常围绕自由、爱、生命、教育和人与世界的关系展开。
story: 此卡按可追溯出处筛选自泰戈尔语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
