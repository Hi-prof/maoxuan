  authoredAt: '1878'
themes:
- 社会关系
interpretation:
  inspiration: 面对复杂局面，先找主要矛盾和关键条件，避免把所有问题混成一团。
  explanation: 这句出自《社会主义从空想到科学的发展》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《社会主义从空想到科学的发展》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
