id: 0cc98b81-bcd6-5e6c-b2cc-3c5c4e3a315d
revision: 4
status: published
quote: '党八股的第一条罪状是：空话连篇，言之无物。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 反对党八股
  authoredAt: '1942-02-08'
themes:
  - 文风
  - 表达
interpretation:
  inspiration: '动笔前先想清楚读者要解决什么问题，再决定放哪些材料。写完逐段检查：这一段有没有新信息，能不能让意思往前走，删掉后是否完全不受影响。该说清的证据不要省，装腔、套话和重复则可以大胆删。文章不是越短越好，而是每一段都该有用。'
  explanation: '“空话连篇，言之无物”批评的是文字占了很大篇幅，却没有事实、明确观点，也不能帮助解决问题。文章故意借八股文的形式列出“八大罪状”，针对空洞冗长、装腔作势、无的放矢和语言无味等毛病。这里反对长而空，并不是一味追求短。复杂问题本来就需要足够篇幅，把材料、逻辑和不同情况说明白。真正应当删掉的是同对象无关的内容、重复套话和用来摆姿态的句子，而不是必要的论证。文章长短要服从内容和读者，写作者需要知道给谁看、希望对方理解什么。若文字没人愿意看、看了也不懂，即使形式整齐、篇幅很大，也没有完成表达的任务。'
historicalEvent: '1942年2月8日，毛泽东在延安干部会上演说，集中批评党八股的八类表现。'
background: '这篇演说延续整风主题，以“八大罪状”逐项分析空洞冗长、装腔作势、无的放矢和语言无味等问题。'
story: '文章故意借八股文的形式“以毒攻毒”，但论证落点很实际：文章必须有人看、有人懂，并能解决问题；长短本身不是标准，内容才是。'
