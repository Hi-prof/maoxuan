revision: 3
status: published
quote: 世界上只有非掠夺性的谋解放的战争，才是正义的战争。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 关于国际新形势对新华日报记者的谈话
  authoredAt: '1939-09-01'
themes:
- 战略
interpretation:
  inspiration: '同样叫“冲突”，目的和后果可能完全不同。判断一个有力行动时，别只看声势，也看看它是在争夺别人的东西，还是在摆脱压迫、保护基本自由。'
  explanation: '这句话用战争目的区分正义与非正义：为掠夺、扩张而发动的战争不正义，被压迫民族和人民为解放自己进行的非掠夺战争才具有正义性。1939年9月欧洲战争爆发，毛泽东接受《新华日报》记者采访，分析新的国际形势，并把中国抗日战争归入民族解放战争。这里的判断不以谁先宣称正义或谁更强大为准，而要看战争的社会政治目的、是否侵占他国和是否反抗压迫。它属于对战争性质的历史政治分析，不是赞美战争本身。'
historicalEvent: 1939年9月1日，《关于国际新形势对新华日报记者的谈话》形成，集中讨论战略及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《关于国际新形势对新华日报记者的谈话》从当时的具体问题出发讨论战略，本卡从“世界上只有非掠夺性的谋解放的战争”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“世界上只有非掠夺性的谋解放的战争”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
