revision: 2
status: published
quote: 世界上只有非掠夺性的谋解放的战争，才是正义的战争。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 关于国际新形势对新华日报记者的谈话
  authoredAt: '1939-09-01'
themes:
- 战略
interpretation:
  inspiration: “世界上只有非掠夺性的谋解放的战争”提示我们，遇到相似问题时先分清长期趋势、当前力量和行动节奏。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《关于国际新形势对新华日报记者的谈话》，原文围绕战略的具体任务展开。“世界上只有非掠夺性的谋解放的战争”不是孤立口号，而是论证中的一个判断。它强调分清长期趋势、当前力量和行动节奏；理解时也要看到，历史战争经验不能脱离时代直接套用。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1939年9月1日，《关于国际新形势对新华日报记者的谈话》形成，集中讨论战略及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《关于国际新形势对新华日报记者的谈话》从当时的具体问题出发讨论战略，本卡从“世界上只有非掠夺性的谋解放的战争”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“世界上只有非掠夺性的谋解放的战争”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
