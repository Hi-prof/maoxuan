id: 7a52bd69-5d76-4573-8957-6591723f0d19
revision: 2
status: published
quote: 中国迫切需要一个资产阶级的民主革命，这个革命必须由无产阶级领导才能完成。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国的红色政权为什么能够存在？
  authoredAt: '1928-10-05'
themes:
- 领导方法
interpretation:
  inspiration: “中国迫切需要一个资产阶级的民主革命”提醒我们面对复杂局面先让方向、分工、沟通和执行彼此衔接，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《中国的红色政权为什么能够存在？》时，面对的是需要作出具体判断和安排的领导方法问题。这句话以“中国迫切需要一个资产阶级的民主革命”概括其中一层意思，即让方向、分工、沟通和执行彼此衔接。同时，领导不是包办，决定也必须建立在信息和协作上。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1928年10月5日，《中国的红色政权为什么能够存在？》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国的红色政权为什么能够存在？》从当时的具体问题出发讨论领导方法，本卡从“中国迫切需要一个资产阶级的民主革命”切入全文的一层论证。
story: 文本围绕领导方法逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《中国的红色政权为什么能够存在？》中的理由和限制一起理解。
