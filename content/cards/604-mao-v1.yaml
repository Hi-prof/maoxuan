revision: 3
status: published
quote: 中国迫切需要一个资产阶级的民主革命，这个革命必须由无产阶级领导才能完成。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国的红色政权为什么能够存在？
  authoredAt: '1928-10-05'
themes:
- 领导方法
interpretation:
  inspiration: '有些句子是在给一段历史确定任务和领导力量，不适合直接变成人生建议。读懂“要做什么”以后，再看看“为什么由谁来做”，会比只记住结论更接近文章。'
  explanation: '这句话区分革命的任务和领导力量：当时中国仍要完成反帝反封建、争取民主的资产阶级民主革命任务，但毛泽东认为民族资产阶级软弱，革命必须由无产阶级领导才可能完成。1928年大革命失败后，《中国的红色政权为什么能够存在？》试图说明共产党领导的农村根据地为何有前途。这里不是说要在中国建立资产阶级统治，而是用马克思主义的革命阶段理论判断：民主革命的社会任务尚未完成，领导权和发展方向却已不同于旧式民主革命。'
historicalEvent: 1928年10月5日，《中国的红色政权为什么能够存在？》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国的红色政权为什么能够存在？》从当时的具体问题出发讨论领导方法，本卡从“中国迫切需要一个资产阶级的民主革命”切入全文的一层论证。
story: 文本围绕领导方法逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《中国的红色政权为什么能够存在？》中的理由和限制一起理解。
