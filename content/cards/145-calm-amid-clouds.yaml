quote: 暮色苍茫看劲松，乱云飞渡仍从容。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七绝·为李进同志题所摄庐山仙人洞照
  authoredAt: '1961-09-09'
themes:
- 从容
interpretation:
  inspiration: 局势混乱时守住原则和节奏，持续观察变化，不被每一阵噪声带走方向。
  explanation: 在《七绝·为李进同志题所摄庐山仙人洞照》讨论复杂环境中的定力和攀登的语境中，这句话把重点放在用暮色、劲松和乱云构成复杂环境中坚定从容的形象。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1961年9月9日，毛泽东为庐山仙人洞照片题诗。
background: 作品题写庐山仙人洞照片，以劲松、乱云和险峰组织出逆境中从容挺立的形象。 此卡所选名句着重表现用暮色、劲松和乱云构成复杂环境中坚定从容的形象。
story: 《七绝·为李进同志题所摄庐山仙人洞照》以景物、行动和历史联想组织诗意。这一句集中呈现用暮色、劲松和乱云构成复杂环境中坚定从容的形象，既有鲜明画面，也保留了作品写作时的现实背景。
