revision: 3
status: published
quote: 我们的原则是党指挥枪，而决不容许枪指挥党。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 战争和战略问题
  authoredAt: '1938-11-06'
themes:
- 组织领导
interpretation:
  inspiration: '工具越有力量，越值得时常问一句：它还在服务最初的目标吗？流程、数据、技术都可能从帮手变成主角。把目的放回桌面，手段才不容易带着人跑。'
  explanation: '这句话界定党与军队的关系：军队必须接受党的政治领导，不能让掌握武装的力量反过来决定党的路线。毛泽东在1938年的《战争和战略问题》中总结中国革命长期武装斗争的经验，认为没有统一的政治领导，军队可能失去革命目标，甚至形成以武力支配政治的局面。“枪”在这里是有组织的武装力量，“党指挥枪”强调军事行动服务于政治目的，而不是赞美强力本身。它也同文章对政权和战争关系的讨论相连。'
historicalEvent: 1938年11月6日，毛泽东在中共六届六中全会上作结论。
background: 毛泽东总结中国革命的武装斗争经验，讨论战争、军队、政权以及党对军队领导的关系。 此卡所选名句着重表现强力工具必须服从明确的政治目的和组织领导。
story: 《战争和战略问题》围绕战争、政权和组织领导逐层展开。这句话把强力工具必须服从明确的政治目的和组织领导凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
