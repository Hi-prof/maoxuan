- 自由
interpretation:
  inspiration: 遇到停滞时，别急着给自己下结论；先保留行动、学习和重新选择的空间。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“自由”压缩成简洁表达。自由既意味着选择，也意味着对选择后果和他人边界的尊重。
historicalEvent: 美国内战时期围绕联邦、奴隶制和公民权利的冲突深刻改变了美国社会。
background: 林肯的演说和书信常讨论民主、责任、学习与在冲突中维持公共原则。
