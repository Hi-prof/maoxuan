status: published
quote: 让资产阶级去对民族屈辱负责吧，无产阶级的事业是使劳动摆脱资产阶级的桎梏，争取社会主义的解放。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思主义和修正主义》
  authoredAt: '1902'
themes:
- 劳动
interpretation:
  inspiration: 把认识放回行动中验证：先做可观察的一步，再根据结果修正原先的判断。
  explanation: 这句出自《马克思主义和修正主义》，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义和修正主义》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
