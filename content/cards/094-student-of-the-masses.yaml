quote: 只有代表群众才能教育群众，只有做群众的学生才能做群众的先生。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在延安文艺座谈会上的讲话
  authoredAt: 1942-05
themes:
- 向群众学习
interpretation:
  inspiration: '想给建议时，先让自己做一会儿学生。听懂对方已经知道什么、每天被什么难住，再开口会少一点自说自话。好的“教”，常从认真被教开始。'
  explanation: '这句话把“学生”放在“先生”之前：文艺工作者或领导者如果不了解群众、不能表达他们的生活和愿望，就没有基础去教育群众。延安文艺座谈会讨论的正是创作者同工农兵生活疏远的问题。毛泽东认为，作家要先进入群众、学习他们的语言和经验，再把分散的生活材料提炼成作品，帮助群众认识和改变现实。“代表群众”不是自封的身份，要建立在实际联系上；教育也不是单向灌输，而是学习、集中和再交流的循环。'
historicalEvent: 1942年5月，延安文艺座谈会召开，毛泽东作结论讲话。
background: 延安文艺座谈会上，毛泽东讨论文艺为谁服务、怎样服务，以及文艺工作者同群众生活的关系。 此卡所选名句着重表现教育群众的前提是先理解、代表并向群众学习。
story: 《在延安文艺座谈会上的讲话》围绕文艺的人民立场、普及和提高逐层展开。这句话把教育群众的前提是先理解、代表并向群众学习凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
