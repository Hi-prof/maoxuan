revision: 2
status: published
quote: 敌军围困万千重，我自岿然不动。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 西江月·井冈山
  authoredAt: 1928-09
themes:
- 定力
interpretation:
  inspiration: 压力骤增时先守住核心目标和基本秩序，再处理噪声，不让恐慌替代判断。
  explanation: 这句话来自《西江月·井冈山》，原文关注险境中的定力和军民协作，核心是在重重包围中以岿然不动写根据地军民的镇定。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1928年8月底，红军在黄洋界保卫战中击退进攻。
background: 井冈山军民保卫黄洋界后，毛泽东以词记录山地防御、军民配合和敌军退却。 此卡所选名句着重表现在重重包围中以岿然不动写根据地军民的镇定。
story: 《西江月·井冈山》以景物、行动和历史联想组织诗意。这一句集中呈现在重重包围中以岿然不动写根据地军民的镇定，既有鲜明画面，也保留了作品写作时的现实背景。
