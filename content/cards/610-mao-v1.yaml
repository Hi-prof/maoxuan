quote: 至于党内的主观主义的批评，不要证据的乱说，或互相猜忌，往往酿成党内的无原则纠纷，破坏党的组织。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关于纠正党内的错误思想
  authoredAt: 1929-12
themes:
- 团结
interpretation:
  inspiration: '想批评一件事时，先把看见的事实和自己的猜测分开。证据说清楚，问题就能落到行动上；只猜动机，谈话很快会变成彼此防备，原来的事反而没人处理。'
  explanation: '这句话反对党内没有证据、凭主观猜测开展批评。红军早期成分复杂，组织生活中容易把意见分歧解释成个人动机，互相怀疑，最后形成没有原则、也无法解决实际问题的纠纷。1929年古田会议决议要求纠正这种思想，主张批评要有政治和组织原则，也要以事实为根据。这里不是反对批评，而是区分旨在改进工作的批评与制造猜忌的议论。没有证据的指责伤害团结，也让真正的错误难以被清楚认识。'
historicalEvent: 1929年12月，《关于纠正党内的错误思想》形成，集中讨论团结及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关于纠正党内的错误思想》从当时的具体问题出发讨论团结，本卡从“至于党内的主观主义的批评”切入全文的一层论证。
story: 《关于纠正党内的错误思想》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
