quote: 上面提出的一些问题，归根到底就是：一般历史条件在生产上是怎样起作用的，生产和一般历史运动的关系又是怎样的。
literature:
  series: 马原思考
  volume: 卡尔·马克思
  workTitle: 《政治经济学批判》导言
  authoredAt: '1848'
themes:
- 历史唯物主义
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《政治经济学批判》导言，可从“历史唯物主义”角度理解。历史分析要回到人们怎样生活、生产和组织社会的具体条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
story: 此卡从《政治经济学批判》导言的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
