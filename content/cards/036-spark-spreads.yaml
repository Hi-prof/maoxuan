quote: 星星之火，可以燎原。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 星星之火，可以燎原
  authoredAt: '1930-01-05'
themes:
- 信心
interpretation:
  inspiration: '刚起步的事情看着很小，先别急着用眼前规模判它的前途。看看它有没有真实需要、能不能继续积累、周围条件是否在变化。希望不是保证，但值得用小步行动去验证。'
  explanation: '“一点火星能够烧成大火”是在说，眼前弱小的革命根据地可能在合适条件下发展成更大的力量。1930年，红军处境艰难，队伍中有人对革命前途悲观。毛泽东在给林彪的信中分析全国的社会矛盾、群众斗争和红军发展条件，认为不能只看暂时的力量对比。这个比喻并非断言凡是微小事物都会成功；“可以燎原”的判断，背后有对现实条件和发展趋势的分析。'
historicalEvent: 1930年1月5日，毛泽东写信分析红色政权和革命高潮的前途。
background: 红军处在困难环境中，毛泽东在给林彪的信中分析革命形势，反对把暂时困难等同于没有前途。 此卡所选名句着重表现微小力量在合适条件下可以成长为改变全局的力量。
story: 《星星之火，可以燎原》围绕困难形势中的战略判断逐层展开。这句话把微小力量在合适条件下可以成长为改变全局的力量凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
