revision: 3
status: published
quote: 应该研究一下文章怎样写得短些，写得精粹些。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 反对党八股
  authoredAt: '1942-02-08'
themes:
- 写作
interpretation:
  inspiration: '写完以后删掉一段，不必舍不得。看看它有没有带来新事实、新关系或新动作；如果只是把同一意思说得更响，放它离开，真正重要的话会更容易被看见。'
  explanation: '这句话主张研究怎样把文章写短、写精，而不是单纯规定字数。《反对党八股》针对的是没有内容却故意拉长、堆叠空话和套话的文风。毛泽东同时说明，重要而复杂的内容需要长文，短而空也一样不好，关键在于是否有内容、是否准确。1942年的整风需要干部用文章和讲话说明真实问题，冗长党八股反而隔开了作者与读者。因此“短些”意味着去掉重复和装饰，“精粹些”则要求保留事实、判断和真正有用的表达。'
historicalEvent: 1942年2月8日，毛泽东在延安干部会上讲演。
background: 延安整风期间，毛泽东逐条分析党八股的表现，要求文章和讲话有内容、看对象、讲准确。 此卡所选名句着重表现短不是简单删字，而是去掉空话后保留准确、有用的内容。
story: 《反对党八股》围绕写作、表达和实事求是逐层展开。这句话把短不是简单删字，而是去掉空话后保留准确、有用的内容凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
