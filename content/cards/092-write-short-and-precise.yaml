quote: 应该研究一下文章怎样写得短些，写得精粹些。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 反对党八股
  authoredAt: '1942-02-08'
themes:
- 写作
interpretation:
  inspiration: 完成初稿后逐段问它提供了什么新信息，删除重复，让关键事实和行动更清楚。
  explanation: 原文出自《反对党八股》，围绕写作、表达和实事求是展开。这句话强调短不是简单删字，而是去掉空话后保留准确、有用的内容。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1942年2月8日，毛泽东在延安干部会上讲演。
background: 延安整风期间，毛泽东逐条分析党八股的表现，要求文章和讲话有内容、看对象、讲准确。 此卡所选名句着重表现短不是简单删字，而是去掉空话后保留准确、有用的内容。
story: 《反对党八股》围绕写作、表达和实事求是逐层展开。这句话把短不是简单删字，而是去掉空话后保留准确、有用的内容凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
