quote: 人生来就不是为了被打败的。人能够被毁灭，但是不能够被打败。
literature:
  series: 名人名言
  volume: 海明威
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1950'
themes:
- 人生
interpretation:
  inspiration: 遇到停滞时，别急着给自己下结论；先保留行动、学习和重新选择的空间。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 两次世界大战改变了20世纪文学的主题，战争经历深刻影响了海明威的写作。
background: 海明威的小说以克制语言写压力、失败、尊严和人在困境中的选择。
story: 此卡按可追溯出处筛选自海明威语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
