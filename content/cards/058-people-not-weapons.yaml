id: 3b9bfc2d-0a89-5663-a4fb-b50f291b0aae
revision: 3
status: published
quote: 武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 人的作用
interpretation:
  inspiration: '设备好不好当然重要，但它不会自己把事情做成。同样一套工具，在会学习、肯配合的人手里，效果可能完全不同。资源不足时不必假装差距不存在，也别忘了人还能成长。'
  explanation: '这句话不是说武器无关紧要，而是反对仅凭武器优劣断定战争结局。1938年，日本在装备和工业上占优势，亡国论据此认为中国必败。《论持久战》则把人的政治动员、组织能力、战略选择和广大民众的参与纳入力量比较，认为这些因素会影响武器怎样被使用，也会在长期战争中改变双方条件。“决定的因素是人”因此强调人的能动作用，但这种作用仍需同物质条件、战争阶段和实际组织结合。'
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现物质条件重要，但人的组织、判断和行动会改变条件的实际效果。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把物质条件重要，但人的组织、判断和行动会改变条件的实际效果凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
