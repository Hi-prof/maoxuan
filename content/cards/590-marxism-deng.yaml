revision: 1
status: published
quote: 我们一定要坚持按劳分配的社会主义原则。按劳分配就是按劳动的数量和质量进行分配。
literature:
  series: 马原思考
  volume: 邓小平
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1978'
themes:
- 劳动
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自〈堅持按勞分配原則〉，在同胡喬木、鄧力群談按勞分配問題，1978年3月28日，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 改革开放初期，解放思想、实事求是与发展问题成为中国社会的重要讨论。
background: 邓小平的讲话常从实践标准、发展、改革和人民生活的实际改善来讨论马克思主义的方法论。
story: 此卡按可追溯出处筛选自邓小平语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
