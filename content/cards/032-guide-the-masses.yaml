id: a06af26f-ee78-5bf8-b603-c372f6e19646
revision: 3
status: published
quote: 革命党是群众的向导，在革命中未有革命党领错了路而革命不失败的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国社会各阶级的分析
  authoredAt: '1925-12-01'
themes:
- 群众路线
interpretation:
  inspiration: '带大家做一件事，先把要去哪里、为什么去说清楚。人多、热情高并不会自动带来好结果；路线有偏差时，越早听见不同意见，调整成本越小。'
  explanation: '这句话的直意是：政党承担着引导群众的责任，一旦方向判断错了，整个革命就可能随之受挫。1925年，毛泽东在《中国社会各阶级的分析》中逐一考察不同阶级的经济地位和政治态度，正是为了回答应当依靠谁、联合谁、反对谁。这里强调的不是群众只能被动跟随，而是领导者不能只靠口号和热情带路；对社会力量判断不准，组织得越广，付出的代价也可能越大。'
historicalEvent: 1925年12月1日，毛泽东写成《中国社会各阶级的分析》。
background: 第一次国共合作时期，毛泽东分析中国各阶级的经济地位和政治态度，回答革命应依靠谁、团结谁和反对谁。 此卡所选名句着重表现方向错误会使群众力量付出代价，领导首先要辨清道路。
story: 《中国社会各阶级的分析》围绕辨明社会力量与革命同盟逐层展开。这句话把方向错误会使群众力量付出代价，领导首先要辨清道路凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
