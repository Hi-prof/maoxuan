revision: 3
status: published
quote: 我们的提高，是在普及基础上的提高；我们的普及，是在提高指导下的普及。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在延安文艺座谈会上的讲话
  authoredAt: 1942-05
themes:
- 普及提高
interpretation:
  inspiration: '入门内容不必故意浅薄，进阶内容也别忘了人从哪里起步。先让更多人能走进来，再准备一段向上的台阶；两件事一起做，门槛和质量就不必互相埋怨。'
  explanation: '这句话反对把文艺的普及与提高拆成互不相干的两件事。面对当时文化水平和文艺需求，首先要创作工农兵能够接受、能够使用的作品；而普及不能停在低水平重复，还要由更高的艺术和思想标准引导。反过来，提高也不能离开群众已有的生活和文化基础，否则只会成为少数人的自我欣赏。延安文艺座谈会把二者看成循环：在群众基础上提高，再用提高了的成果推动新的普及。'
historicalEvent: 1942年5月，延安文艺座谈会召开，毛泽东作结论讲话。
background: 延安文艺座谈会上，毛泽东讨论文艺为谁服务、怎样服务，以及文艺工作者同群众生活的关系。 此卡所选名句着重表现普及与提高相互依存，不能把覆盖面和质量割裂开。
story: 《在延安文艺座谈会上的讲话》围绕文艺的人民立场、普及和提高逐层展开。这句话把普及与提高相互依存，不能把覆盖面和质量割裂开凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
