id: c4d1f2a6-16a1-598d-b336-2c6d4e7dd9a1
revision: 3
status: published
quote: 在中国，离开了武装斗争，就没有无产阶级和共产党的地位，就不能完成任何的革命任务。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 战争和战略问题
  authoredAt: '1938-11-06'
themes:
- 武装斗争
interpretation:
  inspiration: '理解一个年代的选择，先看看当时还有哪些路、哪些路已经被堵住。这样读历史，既不会轻飘飘地责怪前人，也不会把特殊处境中的办法随手搬进今天。'
  explanation: '这句话说，在当时中国的条件下，共产党如果没有自己的武装力量，就无法保持政治地位，也无法完成革命任务。《战争和战略问题》回顾了大革命失败后国民党以武力镇压革命的历史，毛泽东据此说明中国革命为何长期采取武装斗争形式。重点在“在中国”这一具体前提：半殖民地半封建社会缺少稳定的民主政治空间，反革命又掌握军队。它是一项关于近代中国革命道路的判断，不能抽掉时代条件，变成对一切社会问题的通用回答。'
historicalEvent: 1938年11月6日，毛泽东在中共六届六中全会上作结论。
background: 毛泽东总结中国革命的武装斗争经验，讨论战争、军队、政权以及党对军队领导的关系。 此卡所选名句着重表现文章从近代中国条件出发说明武装斗争对革命任务的特殊重要性。
story: 《战争和战略问题》围绕战争、政权和组织领导逐层展开。这句话把文章从近代中国条件出发说明武装斗争对革命任务的特殊重要性凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
