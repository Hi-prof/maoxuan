revision: 3
status: published
quote: 必须将城市工作和农村工作，将工业生产任务和农业生产任务，放在各中央局、分局、区党委、省委、地委和市委的领导工作的适当位置。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 一九四八年的土地改革工作和整党工作
  authoredAt: '1948-05-25'
themes:
- 经济建设
interpretation:
  inspiration: '环境变化后，原先占满注意力的工作要给新任务让出位置。不是抛下旧事，而是重新排一张全局表：哪些仍要做，哪些已经上升为新的重点。'
  explanation: '这句话要求各级党委不能只熟悉农村土地改革，也要把城市工作、工业生产同农村和农业任务一起纳入领导。1948年解放战争推进，大批城市和新地区将被接管，党的工作开始面对恢复工商业、组织城市生活和保护生产等新课题。《一九四八年的土地改革工作和整党工作》既纠正农村工作中的偏差，也提醒为全国胜利后的经济建设作准备。任务结构已经变化，领导注意力和干部能力若仍只停在农村战争环境，就无法接住新的局面。'
historicalEvent: 1948年5月25日，《一九四八年的土地改革工作和整党工作》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《一九四八年的土地改革工作和整党工作》从当时的具体问题出发讨论经济建设，本卡从“必须将城市工作和农村工作”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“必须将城市工作和农村工作”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
