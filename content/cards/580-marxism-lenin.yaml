quote: 在我们这里提出一般构想的理论勇气和在微不足道的办公制度改革上的惊人畏怯兼而有之。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《宁肯少些，但要好些》
  authoredAt: '1902'
themes:
- 理论与实践
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《宁肯少些，但要好些》，可从“理论与实践”角度理解。理论的价值不在于替代现实，而在于帮助提出问题、组织行动并接受检验。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《宁肯少些，但要好些》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
