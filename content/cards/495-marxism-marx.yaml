interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《工资、价格和利润》，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
story: 此卡从《工资、价格和利润》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
