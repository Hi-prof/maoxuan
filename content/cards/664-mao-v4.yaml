quote: 斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 丢掉幻想，准备斗争
  authoredAt: '1949-08-14'
themes:
- 群众路线
interpretation:
  inspiration: '反复失败不值得浪漫化，愿意再来却很有分量。每次多看清一点条件、换一种办法，重来就不是原地循环。坚持里也应当装着学习。'
  explanation: '这句话概括近代中国人民反抗帝国主义和封建压迫的历史：一次次革命遭到失败，人民仍继续斗争，直到中国革命取得全国胜利。1949年美国发布关于对华政策的白皮书，试图说明美国扶蒋政策的经过。毛泽东在《丢掉幻想，准备斗争》中借此反驳对美国政府的幻想，认为人民解放不是外部强国恩赐，而是长期斗争的结果。“人民的逻辑”不是说失败本身必然带来胜利，而是强调被压迫者不会因一次镇压永久放弃解放要求。'
historicalEvent: 1949年8月14日，《丢掉幻想，准备斗争》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《丢掉幻想，准备斗争》从当时的具体问题出发讨论群众路线，本卡从“斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《丢掉幻想，准备斗争》中的理由和限制一起理解。
