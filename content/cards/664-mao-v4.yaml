quote: 斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 丢掉幻想，准备斗争
  authoredAt: '1949-08-14'
themes:
- 群众路线
interpretation:
  inspiration: “斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《丢掉幻想，准备斗争》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1949年8月14日，《丢掉幻想，准备斗争》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《丢掉幻想，准备斗争》从当时的具体问题出发讨论群众路线，本卡从“斗争，失败，再斗争，再失败，再斗争，直至胜利――这就是人民的逻辑，他们也是决不会违背这个逻辑的”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《丢掉幻想，准备斗争》中的理由和限制一起理解。
