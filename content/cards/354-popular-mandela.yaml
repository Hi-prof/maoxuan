quote: 「但是，如果在適當的時候，他們能夠靈活變通，並提前以自我檢討的方式對工作做好檢查，就會獲得必需的經驗和前瞻能力，從而避免一些常見的錯誤，在錯綜複雜的事件中找到自己的解決方法。」
