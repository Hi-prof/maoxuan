id: 39eb7781-376c-4f4c-a07e-a468668cfb7c
revision: 1
status: published
quote: 中农一般不要出卖劳动力，贫农一般要出卖小部分的劳动力，这是区别中农和贫农的主要标准。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 怎样分析农村阶级
  authoredAt: 1933-10
themes:
- 矛盾分析
interpretation:
  inspiration: “中农一般不要出卖劳动力”提示我们，遇到相似问题时先把对象拆开比较，找出主次和变化条件。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《怎样分析农村阶级》，原文围绕矛盾分析的具体任务展开。“中农一般不要出卖劳动力”不是孤立口号，而是论证中的一个判断。它强调把对象拆开比较，找出主次和变化条件；理解时也要看到，分类是为了接近事实，不是给现实贴固定标签。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1933年10月，《怎样分析农村阶级》形成，集中讨论矛盾分析及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《怎样分析农村阶级》从当时的具体问题出发讨论矛盾分析，本卡从“中农一般不要出卖劳动力”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“中农一般不要出卖劳动力”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
