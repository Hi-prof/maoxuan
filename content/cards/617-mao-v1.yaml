id: 39eb7781-376c-4f4c-a07e-a468668cfb7c
revision: 3
status: published
quote: 中农一般不要出卖劳动力，贫农一般要出卖小部分的劳动力，这是区别中农和贫农的主要标准。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 怎样分析农村阶级
  authoredAt: 1933-10
themes:
- 矛盾分析
interpretation:
  inspiration: '分类真正有用时，标准应能落到事实，而不是凭印象看人。先说明要解决什么问题，再选择能观察的差异；目的和年代变了，旧分类也要重新检查。'
  explanation: '这句话用是否需要出卖劳动力，区分当时农村中的中农和贫农。中农通常拥有足以维持生活的土地和生产资料，主要靠自己劳动；贫农因资源不足，往往还要出卖一部分劳动力。《怎样分析农村阶级》是土地革命时期用于划分阶级成分的工作文件，目的是依据经济关系制定土地政策，避免只看收入表面或凭个人好恶定成分。这个标准属于20世纪30年代农村社会和革命政策语境，不能离开当时土地、雇佣和剥削关系套用到今天。'
historicalEvent: 1933年10月，《怎样分析农村阶级》形成，集中讨论矛盾分析及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《怎样分析农村阶级》从当时的具体问题出发讨论矛盾分析，本卡从“中农一般不要出卖劳动力”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“中农一般不要出卖劳动力”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
