id: 80fb5fa4-f1f6-4c36-99a1-ee2775d3e055
revision: 1
status: published
quote: 凡是找到了的材料都没有删略，尽管那里面有些话是批评我们政策的，尽管有些材料将来会成为批评的根据。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 为什么要讨论白皮书？
  authoredAt: '1949-08-28'
themes:
- 调查研究
interpretation:
  inspiration: “凡是找到了的材料都没有删略”提示我们，遇到相似问题时先先掌握事实再形成判断。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《为什么要讨论白皮书？》，原文围绕调查研究的具体任务展开。“凡是找到了的材料都没有删略”不是孤立口号，而是论证中的一个判断。它强调先掌握事实再形成判断；理解时也要看到，调查范围、材料质量和具体条件。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1949年8月28日，《为什么要讨论白皮书？》形成，集中讨论调查研究及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《为什么要讨论白皮书？》从当时的具体问题出发讨论调查研究，本卡从“凡是找到了的材料都没有删略”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“凡是找到了的材料都没有删略”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
