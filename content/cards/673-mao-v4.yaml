revision: 3
status: published
quote: 凡是找到了的材料都没有删略，尽管那里面有些话是批评我们政策的，尽管有些材料将来会成为批评的根据。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 为什么要讨论白皮书？
  authoredAt: '1949-08-28'
themes:
- 调查研究
interpretation:
  inspiration: '材料里有对自己不利的部分，先别急着藏。完整证据能让判断更结实，也能提前看见别人会从哪里质疑。愿意保留刺耳信息，是一种不太显眼的自信。'
  explanation: '1949年美国政府发表对华关系白皮书，收录大量外交文件，试图解释美国扶助国民党政策为何失败。毛泽东指出，白皮书虽然站在美国政府立场，却保存了许多未删略材料，其中也有批评共产党政策、可供以后攻击的内容。正因材料相对完整，中共可以组织干部阅读讨论，从对方自己的档案中分析美国对华政策和国民党失败。这里肯定的不是白皮书结论，而是公开材料为独立判断提供了依据；包括不利材料，反而使研究更有检验性。'
historicalEvent: 1949年8月28日，《为什么要讨论白皮书？》形成，集中讨论调查研究及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《为什么要讨论白皮书？》从当时的具体问题出发讨论调查研究，本卡从“凡是找到了的材料都没有删略”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“凡是找到了的材料都没有删略”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
