quote: '发展生产、繁荣经济、公私兼顾、劳资两利'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于工商业政策
  authoredAt: '1948-02-27'
themes:
  - 经济建设
  - 政策
interpretation:
  inspiration: '一项政策同时影响生产、就业和多方利益时，先把真正要纠正的对象分清楚，再动手。执行过程中持续看结果，哪里伤到了正常运转，哪里出现了新的矛盾，要及时交流和调整。等损失积累几个月再总结，纠错会更难。方向正确还不够，具体办法也必须接受实际后果的检查。'
  explanation: '“发展生产、繁荣经济、公私兼顾、劳资两利”概括了当时进入城市后处理工商业的政策边界。目标是保护和恢复正常生产，同时处理不同经济主体和劳动关系。指示针对一些地方在土地改革和接管城市时混淆封建剥削与正常工商业、任意没收和破坏生产的现象，要求先把对象分清。这十六个字有明确的历史条件，不能抽离语境当成任何时期都不变的经济公式。文章还特别检查领导方法：方针发布以后，领导机关要随时了解执行进程，交流经验，及时纠正错误，不能等几个月后才开会统一算账。政策是否正确，既要看出发点，也要看执行中对生产、就业和各方关系造成的实际结果。'
historicalEvent: '1948年2月27日，部分新进入城市出现破坏工商业现象，中共中央发出纠正政策错误的指示。'
background: '这份为中共中央起草的党内指示，针对一些地方在新进入城市中破坏工商业的现象，要求区分封建剥削与正常工商业经营。'
story: '文章一面明确政策边界，一面要求领导机关随时掌握执行进程、交流经验和纠正错误，不要等数月以后才开总结会统一算账。'
