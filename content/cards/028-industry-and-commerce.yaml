quote: '发展生产、繁荣经济、公私兼顾、劳资两利'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于工商业政策
  authoredAt: '1948-02-27'
themes:
  - 经济建设
  - 政策
interpretation:
  coreMeaning: '“发展生产、繁荣经济、公私兼顾、劳资两利”概括了当时进入城市后处理工商业的政策边界。目标是保护和恢复正常生产，同时协调不同经济主体和劳动关系。'
  keyPoint: '这十六个字针对的是一些地方混淆封建剥削与正常工商业、破坏生产的具体错误，不能脱离历史条件当成任何时期都不变的公式。方针明确后，还要检查执行方法。'
  contemporaryRelevance: '经济政策往往同时影响生产、就业和多方利益。执行时应先分清要纠正的对象，观察真实后果，并及时交流经验；等到损失累积后再统一总结，纠错成本会更高。'
contextExcerpt: '必须从领导方针和领导方法两方面认真地进行检查。'
background: '这份为中共中央起草的党内指示，针对一些地方在新进入城市中破坏工商业的现象，要求区分封建剥削与正常工商业经营。'
story: '文章一面明确政策边界，一面要求领导机关随时掌握执行进程、交流经验和纠正错误，不要等数月以后才开总结会统一算账。'
