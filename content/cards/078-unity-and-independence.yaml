id: e9bac50b-4e80-5880-bf9e-41f8f6370f96
revision: 3
status: published
quote: 我们的方针是统一战线中的独立自主，既统一，又独立。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 统一战线中的独立自主问题
  authoredAt: '1938-11-05'
themes:
- 统一战线
interpretation:
  inspiration: '好的合作不是谁把自己完全交出去。把共同目标说清，也保留各自负责和判断的空间，遇到分歧时反而不容易慌。既能并肩，也能站稳自己。'
  explanation: '“既统一，又独立”是在说明共产党参加抗日民族统一战线的双重要求：同国民党及其他抗日力量合作，共同抵抗日本侵略；同时保持自己的组织、军队、政治主张和群众工作。1938年统一战线内部关系复杂，党内存在把合作理解为一切服从国民党的倾向。毛泽东认为，没有共同抗日就会走向分裂，没有独立自主又可能丧失原则和行动能力。两者不是折中比例，而是同一合作关系中必须同时守住的两个方面。'
historicalEvent: 1938年11月5日，毛泽东在中共六届六中全会上作结论。
background: 抗日民族统一战线发展中，毛泽东说明合作与独立自主必须同时坚持，反对取消自身原则。 此卡所选名句着重表现合作与独立判断不是二选一，二者需要同时保持。
story: 《统一战线中的独立自主问题》围绕合作中的原则和独立判断逐层展开。这句话把合作与独立判断不是二选一，二者需要同时保持凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
