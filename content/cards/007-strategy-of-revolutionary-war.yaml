revision: 3
status: published
quote: '读书是学习，使用也是学习，而且是更重要的学习。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: '1936-12'
themes:
  - 学习
  - 实践
interpretation:
  inspiration: '学会一个方法，不能只看自己记住了多少概念。找一个范围可控的真实任务试一试，把做成的、做错的和没想到的地方记下来，再回头看原理。书本能少走弯路，实践会告诉你哪些条件被忽略了。读和用来回几次，知识才会慢慢变成处理问题的能力。'
  explanation: '这句话把学习分为从书本中学习和在实际中使用，并把使用看得更重要。知识进入具体行动后，适用条件、遗漏和判断错误才会显露，人也才能形成真正处理问题的能力。文章讨论战争规律时，主张研究前人的经验，同时强调中国革命战争有自身特点，不能把别处的结论原样搬来。“使用更重要”并非读书无用，更不是凭个人经验排斥理论。书本提供经过总结的认识，实践负责检验它在当前条件下是否成立，还会补充原有理论没有覆盖的部分。实践产生的新问题又要求重新学习。所谓“从战争学习战争”，说的正是这种读、用、再认识的往返过程，而不是把临场摸索当成唯一方法。'
historicalEvent: '1936年12月，长征结束后，毛泽东系统总结国内革命战争经验并讨论战略问题。'
background: '长征结束后，毛泽东系统总结国内革命战争的经验，讨论怎样研究战争、战略防御和反“围剿”等问题。引文位于第一章“如何研究战争”。'
story: '文章把书本结论视作需要回到自身经验中检验的知识：吸收适用的，拒绝不适用的，并补充自身实际中独有的部分。'
