quote: 现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 愚公移山
  authoredAt: '1945-06-11'
themes:
- 历史
interpretation:
  inspiration: 阅读名句时保留具体历史对象，才能理解“移山”所指的集体政治任务。
  explanation: 这句话来自《愚公移山》，原文关注长期奋斗、人民支持和胜利信心，核心是愚公移山寓言在原文中对应近代中国的帝国主义和封建主义压迫。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1945年6月11日，毛泽东在中国共产党第七次全国代表大会上致闭幕词。
background: 中共七大闭幕时，毛泽东借愚公移山寓言说明长期奋斗、人民支持和推翻压迫力量的信心。 此卡所选名句着重表现愚公移山寓言在原文中对应近代中国的帝国主义和封建主义压迫。
story: 《愚公移山》围绕长期奋斗、人民支持和胜利信心逐层展开。这句话把愚公移山寓言在原文中对应近代中国的帝国主义和封建主义压迫凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
