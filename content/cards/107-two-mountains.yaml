quote: 现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 愚公移山
  authoredAt: '1945-06-11'
themes:
- 历史
interpretation:
  inspiration: '比喻听起来轻巧，背后常有很具体的对象。读到“移山”时，知道那两座山在历史上指什么，才能分清作品原意与后来随手套用的励志版本。'
  explanation: '这句话点明《愚公移山》里两座“大山”的政治含义：帝国主义对近代中国的侵略和控制，以及封建主义对广大人民尤其农民的压迫。1945年中共七大闭幕时，毛泽东借古代寓言概括中国革命仍需完成的反帝反封建任务。愚公的坚持对应共产党长期工作，而搬走大山最终依靠的是觉悟、团结起来的人民。它不是一般意义上“只要坚持就能成功”的故事，山有明确历史对象，移山也指集体的革命行动。'
historicalEvent: 1945年6月11日，毛泽东在中国共产党第七次全国代表大会上致闭幕词。
background: 中共七大闭幕时，毛泽东借愚公移山寓言说明长期奋斗、人民支持和推翻压迫力量的信心。 此卡所选名句着重表现愚公移山寓言在原文中对应近代中国的帝国主义和封建主义压迫。
story: 《愚公移山》围绕长期奋斗、人民支持和胜利信心逐层展开。这句话把愚公移山寓言在原文中对应近代中国的帝国主义和封建主义压迫凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
