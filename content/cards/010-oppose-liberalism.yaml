revision: 3
status: published
quote: '我们要用马克思主义的积极精神，克服消极的自由主义。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 反对自由主义
  authoredAt: '1937-09-07'
themes:
  - 作风建设
  - 原则
interpretation:
  inspiration: '一起做事时，发现问题就找合适的场合把事实、影响和建议说清楚。为了表面和气一直沉默，或当面不说、转身议论，都会让小问题越积越多，也让负责解决的人得不到准确信息。说真话不等于逞强，重点是对事、讲依据，并愿意一起把问题处理掉。'
  explanation: '文章所说的“自由主义”，是组织生活中回避原则、迁就错误、只顾私人关系的一类消极态度，并非讨论个人生活方式或一般意义上的自由。正文列出十一种表现，包括当面不说、背后议论，对错误熟视无睹，只求自己不受影响，以及工作敷衍却不愿负责。这些行为看似避免冲突，实际会让共同规则被人情和冷漠慢慢掏空，也会削弱组织同群众的联系。反对这种作风，不等于逞强争胜，更不是把批评变成人身攻击。批评应针对事实和工作，在适当场合公开说明，目的在于解决问题、维护真正的团结。原则如果只停在口头，却在具体关系面前不断退让，就很难成为共同遵守的尺度。'
historicalEvent: '1937年9月7日，全面抗战开始后不久，毛泽东撰文批评组织生活中的自由主义作风。'
background: '全面抗战开始后不久，文章集中批评组织生活中回避原则、只顾私人关系和当面不说背后议论等自由主义表现。'
story: '正文先逐项列出十一种表现，再说明其共同后果：削弱集体生活、损害群众联系，并让消极态度在组织中保留下来。'
