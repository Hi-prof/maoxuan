id: 2f0cd7cc-549a-546e-a47e-3fb92510472f
revision: 3
status: published
quote: 青年是整个社会力量中的一部分最积极最有生气的力量。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 青年运动的方向
  authoredAt: '1939-05-04'
themes:
- 青年
interpretation:
  inspiration: '年轻的好处不只是一腔热情，还有试错后再来的余地。与其把活力留在口号里，不如给它一个真实的小任务、一点信任和可以修改的空间，成长会更具体。'
  explanation: '这句话肯定青年在社会变革中通常更积极、更有生气，愿意接受新事物，也更愿意行动。1939年五四运动二十周年，毛泽东在延安面对青年讲演，既赞扬青年力量，也追问青年运动应走向哪里。文章后面把是否同工农群众结合，作为判断青年知识分子方向的重要标准。因此，“最积极最有生气”不是单纯歌颂年龄，也不等于青年天然正确；活力还要进入社会实践，找到同广大群众需要相连的方向。'
historicalEvent: 1939年5月4日，毛泽东在延安青年群众纪念五四运动大会上讲演。
background: 五四运动二十周年纪念会上，毛泽东讨论青年运动的方向以及知识分子同工农群众结合的标准。 此卡所选名句着重表现青年往往具有学习快、行动强和愿意改变现状的特点。
story: 《青年运动的方向》围绕青年力量和实践方向逐层展开。这句话把青年往往具有学习快、行动强和愿意改变现状的特点凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
