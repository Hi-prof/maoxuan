quote: 这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 我们的经济政策
  authoredAt: 1934-01
themes:
- 经济建设
interpretation:
  inspiration: '手头缺钱时，最方便的办法未必最便宜。凡是把眼前缺口推给未来的选择，都值得多算一步：它会怎样影响价格、信任和长期运转。'
  explanation: '这句话要求苏区国家银行发行纸币，首先服从经济流通和生产发展的实际需要，不能主要为了填补政府财政缺口而多印钞票。1934年根据地财政和物资都很紧张，战争开支带来巨大压力。毛泽东担心若把发钞当作便捷筹款手段，会造成币值不稳、物价上涨，损害群众生活和经济秩序。因此，他把财政便利放在次要位置，强调货币要有真实经济活动支撑。这是根据地经济管理中的具体风险判断。'
historicalEvent: 1934年1月，《我们的经济政策》形成，集中讨论经济建设及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《我们的经济政策》从当时的具体问题出发讨论经济建设，本卡从“这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位”切入全文的一层论证。
story: 《我们的经济政策》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
