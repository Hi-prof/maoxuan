quote: 这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 我们的经济政策
  authoredAt: 1934-01
themes:
- 经济建设
interpretation:
  inspiration: 从“这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位”出发，可以把态度转成行动：把资源、条件和长期效果一起核算，并让事实、分工和实际结果检验原先的判断。
  explanation: 《我们的经济政策》讨论的是特定历史条件下的经济建设问题。这里用“这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位”指出行动应有的着力点，核心在于把资源、条件和长期效果一起核算。原文并不支持脱离对象的简单化理解，因为建设目标必须落实为可执行的生产与组织安排。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1934年1月，《我们的经济政策》形成，集中讨论经济建设及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《我们的经济政策》从当时的具体问题出发讨论经济建设，本卡从“这里必须充分注意：国家银行发行纸币，基本上应该根据国民经济发展的需要，单纯财政的需要只能放在次要的地位”切入全文的一层论证。
story: 《我们的经济政策》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
