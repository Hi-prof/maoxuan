revision: 3
status: published
quote: 善于把党的政策变为群众的行动，善于使我们的每一个运动和每一个斗争不但领导干部懂得，而且广大群众都能懂得，都能掌握。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 对晋绥日报编辑人员的谈话
  authoredAt: '1948-04-02'
themes:
- 政策传播
interpretation:
  inspiration: '一份方案写得很完整，不等于事情已经发生。把术语换成能理解的步骤，听听执行者哪里犹豫，再根据反馈调整。信息真的被掌握，纸面才开始变成行动。'
  explanation: '这句话把领导能力落实为一种转化工作：干部懂得政策还不够，还要使广大群众理解政策、掌握方法，并主动参加相应的运动和斗争。1948年毛泽东同《晋绥日报》编辑人员谈话，要求报纸既宣传政策，也从群众实践中发现问题，避免少数人关门办报。政策成为群众行动，需要用群众熟悉的语言说明，同他们的实际利益连接，并允许执行中的经验反馈回来。单纯发布命令或重复文件，不能完成这种转化。'
historicalEvent: 1948年4月2日，毛泽东在兴县同晋绥日报编辑人员谈话。
background: 解放战争时期，毛泽东同晋绥日报编辑人员讨论报纸怎样反映群众、解释政策并推动实际工作。 此卡所选名句着重表现政策只有被群众理解和掌握，才能转化为实际行动。
story: 《对晋绥日报编辑人员的谈话》围绕群众办报、政策传播和共同认识逐层展开。这句话把政策只有被群众理解和掌握，才能转化为实际行动凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
