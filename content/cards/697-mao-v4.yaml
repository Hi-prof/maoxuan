quote: 农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 论人民民主专政
  authoredAt: '1949-06-30'
themes:
- 群众路线
interpretation:
  inspiration: “农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《论人民民主专政》，原文围绕群众路线的具体任务展开。“农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1949年6月30日，《论人民民主专政》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《论人民民主专政》从当时的具体问题出发讨论群众路线，本卡从“农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
