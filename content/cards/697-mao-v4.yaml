quote: 农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 论人民民主专政
  authoredAt: '1949-06-30'
themes:
- 群众路线
interpretation:
  inspiration: 改变一个长期形成的习惯或协作方式，通常比宣布目标慢得多。先接受它需要时间，再把每一步同现有资源配上，反而更容易稳稳往前走。
  explanation: 这句话是说，分散经营的农户要转向农业社会化，不可能很快完成，需要长期、细致推进。1949年6月《论人民民主专政》在勾勒新政权的政治经济安排时，把农民教育和农业改造称为“严重的问题”，并说明农业社会化应同以国有企业为主体的工业发展相适应。这里依据的是当时对苏联经验和社会主义道路的判断，重点可见其对时间、步骤和经济条件的强调。
historicalEvent: 1949年6月30日，《论人民民主专政》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《论人民民主专政》从当时的具体问题出发讨论群众路线，本卡从“农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
