revision: 3
status: published
quote: 没有满腔的热忱，没有眼睛向下的决心，没有求知的渴望，没有放下臭架子甘当小学生的精神，是一定不能做，也一定做不好的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 《农村调查》的序言和跋
  authoredAt: '1941'
themes:
- 调查研究
interpretation:
  inspiration: '去请教时，暂时把“我应该懂”放在一边。问题问得朴素一点，耐心听完那些不合预期的答案。肯当一会儿小学生，往往比努力显得专业更接近真相。'
  explanation: '这句话说，做好调查需要热情、把目光投向基层的决心、真正的求知欲，还要放下身份架子，甘愿向群众当学生。1941年重印早年的农村调查材料时，毛泽东用序言和跋反思党内对中国社会实际了解不足的问题。调查者如果先认定自己高明，只想从谈话中寻找已有结论，就听不到一线经验。所谓“眼睛向下”不是轻视理论，而是承认真实生活中的人拥有调查者缺少的知识，理解要从平等学习开始。'
historicalEvent: 1941年，毛泽东为《农村调查》写序言和跋。
background: 延安整风前后，毛泽东重印农村调查材料，强调从实际出发、向群众学习和掌握第一手知识。 此卡所选名句着重表现调查者必须放下架子、保持求知欲并真正向群众学习。
story: 《《农村调查》的序言和跋》围绕调查研究和向群众学习逐层展开。这句话把调查者必须放下架子、保持求知欲并真正向群众学习凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
