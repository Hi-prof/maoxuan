revision: 3
status: published
quote: 抗日民族统一战线的组成、巩固及其任务的完成，民主共和国在中国的实现，丝毫也不能离开这一争取群众的努力。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 为争取千百万群众进入抗日民族统一战线而斗争
  authoredAt: '1937-05-08'
themes:
- 群众路线
interpretation:
  inspiration: '一个联盟写在名单上还不算形成。参与的人理解目标、看见自己的利益，也愿意实际行动，关系才会稳。真正的共同体，不只由代表人物握手组成。'
  explanation: '这句话说，无论建立和巩固抗日民族统一战线，完成它的抗战任务，还是争取建立民主共和国，都离不开争取广大群众。1937年，国共合作正在重新形成，毛泽东提醒党内，统一战线不能只停留在政党上层协议，还要发动工人、农民、青年等千百万民众。群众既是抗战力量，也是监督合作能否落实民主与民生要求的基础。没有广泛参与，统一战线容易只剩形式，民主共和国也缺少推动它成为现实的社会力量。'
historicalEvent: 1937年5月8日，《为争取千百万群众进入抗日民族统一战线而斗争》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《为争取千百万群众进入抗日民族统一战线而斗争》从当时的具体问题出发讨论群众路线，本卡从“抗日民族统一战线的组成、巩固及其任务的完成”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《为争取千百万群众进入抗日民族统一战线而斗争》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
