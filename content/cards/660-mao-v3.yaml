revision: 3
status: published
quote: 就叫做“肆意攻击”也罢，任何这类的欺骗，必须坚决、彻底、干净、全部地攻击掉，决不容许保留其一丝一毫。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 赫尔利和蒋介石的双簧已经破产
  authoredAt: '1945-07-10'
themes:
- 工作方法
interpretation:
  inspiration: '有些说法反复出现，只回应一次可能不够。把事实、来源和利益关系讲透，标签就没那么可怕。反驳的重点不是声音更大，而是不让欺骗靠重复变成常识。'
  explanation: '这句话表示，即使被指责为“肆意攻击”，也要把赫尔利和蒋介石共同制造的政治宣传彻底揭穿。1945年，美国驻华大使赫尔利公开支持国民党政府，并把国共谈判破裂归咎于共产党；蒋介石方面则借此掩盖一党专政和内战准备。毛泽东在评论中认为，这套说法以“统一”为名要求共产党交出军队和解放区政权，实质不是平等合作。“攻击掉”的对象是这套具体政治欺骗，不是鼓励消灭所有不同意见；文章用尖锐论战争夺战后中国道路的解释权。'
historicalEvent: 1945年7月10日，《赫尔利和蒋介石的双簧已经破产》形成，集中讨论工作方法及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《赫尔利和蒋介石的双簧已经破产》从当时的具体问题出发讨论工作方法，本卡从“就叫做“肆意攻击”也罢”切入全文的一层论证。
story: 文本围绕工作方法逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《赫尔利和蒋介石的双簧已经破产》中的理由和限制一起理解。
