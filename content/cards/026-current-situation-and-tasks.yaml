id: 4388cd1b-bf75-57ea-8b68-abae9bb422ac
revision: 3
status: published
quote: '当着天空中出现乌云的时候，我们就指出：这不过是暂时的现象，黑暗即将过去，曙光即在前头。'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 目前形势和我们的任务
  authoredAt: '1947-12-25'
themes:
  - 信念
  - 形势判断
interpretation:
  inspiration: '处在低谷时，把眼前波动和长期趋势分开看。列出支持判断的具体证据：哪些条件真的在变化，哪些坏消息只是短期现象，哪些风险仍要处理。这样既不会被一次挫折完全拖走，也不会用“以后会好”逃避当前问题。方向可以有信心，但每一条依据都应当允许重新检查。'
  explanation: '乌云和曙光的比喻是在说明，眼前的黑暗现象可能很强烈，却未必代表长期方向。判断形势不能只看一时的兵力、装备和局部得失，还要分析战争性质、人心向背以及战略力量是否发生持续变化。报告作于人民解放军由战略防御转入全国规模进攻之后，所谓“转折点”有具体的战场和政治条件支撑。因此，这种信心不是在困难面前简单断言“很快会好”，也不是把愿望当作趋势。短期表象与长期条件都要看，仍然存在的困难也要处理。如果支撑判断的条件发生变化，原有结论就需要重新检验。比喻强调的是穿过眼前现象分析方向，而不是忽略乌云本身。'
historicalEvent: '1947年12月25日，人民解放军转入战略进攻后，毛泽东在陕北杨家沟会议作报告。'
background: '报告作于陕北杨家沟会议。人民解放军由战略防御转入全国规模的进攻后，文章总结形势、军事原则、土地改革和经济政策。'
story: '引文回顾全面内战开始时的判断：不能只看一时的兵力和装备，还要看战争性质、人心向背等持续起作用的因素。'
