id: ab6292fe-bd85-57a6-9955-78ed907f5b20
revision: 4
status: published
quote: '全党各级领导机关，必须改正对上级事前不请示、事后不报告的不良习惯。'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于建立报告制度
  authoredAt: '1948-01-07'
themes:
  - 组织纪律
  - 工作方法
interpretation:
  inspiration: '跨团队做事，先约定哪些情况要事前请示，哪些结果要事后复盘。报告不必写得很长，但要让接收者看懂发生了什么、问题在哪里、已经怎样处理、还需要什么决定。只堆数字或复制过程，会让信息淹没在材料里。写报告的目的，是帮助判断和少犯错误，不是完成一项形式任务。'
  explanation: '请示和报告把不同地区的实际情况带进共同决策，使上级能够在行动前提供帮助，也能在行动后发现偏差、总结经验。组织范围扩大以后，各地情况变化很快，如果信息长期不上达，中央难以掌握政策执行的真实效果，各地区也容易各自为政。文章建立定期综合报告制度，处理的正是这种信息不对称。报告并不是增加形式材料。指示要求负责人亲自动手，把成绩、问题和解决办法放在有限篇幅内说明；只有技术数字，没有政策判断，同样达不到沟通目的。请示也不是把所有责任推给上级，而是让影响全局的重要决定及时进入共同判断。制度是否有效，最终要看信息能否帮助行动、减少错误。'
historicalEvent: '1948年1月7日，解放区扩大、跨地区协调增加，毛泽东为中共中央起草建立报告制度的指示。'
background: '随着解放区连成大片、城市陆续解放，跨地区工作的协调要求提高。毛泽东为中共中央起草这份党内指示，建立定期综合报告制度。'
story: '指示不仅要求报告，还限定负责人亲自动手、篇幅约一千字，并要求同时写成绩、问题和解决办法，避免只有技术数字而缺少政策信息。'
