quote: 我们大家要学习他毫无自私自利之心的精神。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 纪念白求恩
  authoredAt: '1939-12-21'
themes:
- 无私
interpretation:
  inspiration: '无私不一定是做惊天动地的牺牲。把答应的事认真做好，不因工作显眼与否区别对待，在别人需要时少算一点面子得失，已经是一种朴素的可靠。'
  explanation: '“毫无自私自利之心”在《纪念白求恩》中并不是空泛赞美。毛泽东紧接着写白求恩对工作极端负责、对同志和人民热忱，并批评有人挑拣轻松任务、只在意表现。白求恩来到中国抗日前线，以外科医生的专业救治伤员，直至因感染去世。文章希望学习的，是把公共事业、专业责任和他人需要放在个人名利之前的工作态度。这不意味着普通人必须抹去合理的自我照顾，而是不要让私利支配对职责的取舍。'
historicalEvent: 1939年12月21日，毛泽东写作《纪念白求恩》。
background: 加拿大医生白求恩在抗日前线牺牲后，毛泽东撰文纪念其国际主义、责任心和无私精神。 此卡所选名句着重表现无私不是抽象姿态，而是把公共任务、专业责任和他人需要置于私利之前。
story: 《纪念白求恩》围绕国际主义、责任心和无私精神逐层展开。这句话把无私不是抽象姿态，而是把公共任务、专业责任和他人需要置于私利之前凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
