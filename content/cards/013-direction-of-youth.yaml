quote: '什么叫做先锋队的作用？就是带头作用，就是站在革命队伍的前头。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 青年运动的方向
  authoredAt: '1939-05-04'
themes:
  - 青年
  - 担当
interpretation:
  inspiration: '在集体里带头，不是抢一个高于别人的位置。可以先去调查，先试做难的部分，出了问题先承担，再把摸到的办法交给大家。走在前面还要不断回头看：自己的方向是否贴近真正的需要，能不能同更多人一起往前。只有姿态，没有协作，跑得再快也可能离问题越来越远。'
  explanation: '讲话把青年称为革命队伍中的先锋，强调的是行动上的带头作用：遇到任务愿意先走一步、承担责任，并为队伍探索方向。“站在前头”不是获得一种高于他人的身份，也不能只靠口号证明先进。文章同时提出判断青年运动方向的尺度，即是否愿意同广大的工农群众结合。先锋队如果脱离主力军独自前进，就很难理解社会的真实处境，也难以让自己的行动产生持久作用。这里既肯定知识青年和学生青年的积极性，也提醒他们需要在共同实践中改变立足点、学习群众经验。是否真正了解群众的需要，能否把个人热情变成共同的行动，比自我标榜更能说明有没有发挥先锋作用。'
historicalEvent: '1939年5月4日，五四运动二十周年之际，毛泽东在延安讲话，讨论青年运动应走的方向。'
background: '讲话作于五四运动二十周年，回顾青年在中国革命中的先锋作用，同时把青年是否愿意同工农群众结合看作判断其方向的重要标准。'
story: '讲话地点在延安。文中既肯定知识青年的积极作用，也提醒先锋队必须同主力军结合，不能把“走在前头”理解成脱离广大群众。'
