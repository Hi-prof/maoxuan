revision: 2
status: published
quote: '什么叫做先锋队的作用？就是带头作用，就是站在革命队伍的前头。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 青年运动的方向
  authoredAt: '1939-05-04'
themes:
  - 青年
  - 担当
interpretation:
  coreMeaning: '先锋队的作用首先体现在行动上：遇到任务愿意先走一步、先承担责任，并为队伍探索方向。“站在前头”说的是实际带头，不是获得一个高于他人的身份。'
  keyPoint: '讲话同时强调青年要同工农群众结合。先锋不能脱离主力军独自前进，也不能只靠口号证明先进；是否理解群众处境、能否在共同实践中发挥作用，才是判断方向的尺度。'
  contemporaryRelevance: '在集体工作中，带头可以表现为先调查、先试做、先承担困难，再把经验交给大家。若只有姿态而没有协作，走得再快也可能与真正需要解决的问题分离。'
contextExcerpt: '中国反帝反封建的人民队伍中，有由中国知识青年们和学生青年们组成的一支军队。'
background: '讲话作于五四运动二十周年，回顾青年在中国革命中的先锋作用，同时把青年是否愿意同工农群众结合看作判断其方向的重要标准。'
story: '讲话地点在延安。文中既肯定知识青年的积极作用，也提醒先锋队必须同主力军结合，不能把“走在前头”理解成脱离广大群众。'
