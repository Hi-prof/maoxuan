quote: 兵民是胜利之本。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 人民战争
interpretation:
  inspiration: '站在台前的人很显眼，事情真正能走远，常靠许多不显眼的支持：信息、补给、信任和日常配合。做计划时把这些关系也算进去，比只盯着主角更接近全貌。'
  explanation: '“兵民是胜利之本”是说，抗战胜负的根本不只在军队数量和武器，还在军队能否同广大人民结合，获得动员、补给、情报和持续支持。1938年抗战初期，亡国论把中国的弱势看成注定失败，速胜论又低估战争的长期性。《论持久战》提出依靠人民战争，在长期过程中改变力量对比。这是一项具体的战争判断：人民不是旁观者，而是抗战力量的组成部分，军队脱离人民也就失去能够持久作战的基础。'
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现战争能力的根本来自军队与人民的支持和组织。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把战争能力的根本来自军队与人民的支持和组织凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
