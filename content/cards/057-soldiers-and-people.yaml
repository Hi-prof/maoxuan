quote: 兵民是胜利之本。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 人民战争
interpretation:
  inspiration: 任何长期事业都要重视参与者基础，不能只依赖少数专家或显眼资源。
  explanation: 在《论持久战》讨论持久抗战的阶段、力量与胜利条件的语境中，这句话把重点放在战争能力的根本来自军队与人民的支持和组织。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现战争能力的根本来自军队与人民的支持和组织。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把战争能力的根本来自军队与人民的支持和组织凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
