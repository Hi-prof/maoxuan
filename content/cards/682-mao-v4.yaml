revision: 3
status: published
quote: 反动势力对于人民的民主势力的原则，是能够消灭者一定消灭之，暂时不能消灭者准备将来消灭之。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于目前国际形势的几点估计
  authoredAt: 1946-04
themes:
- 群众路线
interpretation:
  inspiration: 有时局面暂时安静，只是各方条件还没成熟。做长期判断时，可以少猜态度，多看利益、能力和持续行动；这样既不轻信一时的缓和，也不把警惕变成处处敌对。
  explanation: 这句话的意思是，在作者的判断中，反动政治力量不会因暂时克制而放弃打击民主力量；能立即压制就压制，做不到便等待条件。它写于1946年4月，二战结束不久，文章讨论美英法同苏联发生妥协的可能，同时强调这种国际妥协不会自动消除各国内部的政治斗争。这是对战后国际力量关系的敌我判断，不是对所有合作关系或普通人性的概括。
historicalEvent: 1946年4月，《关于目前国际形势的几点估计》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于目前国际形势的几点估计》从当时的具体问题出发讨论群众路线，本卡从“反动势力对于人民的民主势力的原则”切入全文的一层论证。
story: 《关于目前国际形势的几点估计》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
