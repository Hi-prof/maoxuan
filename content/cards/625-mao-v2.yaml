revision: 3
status: published
quote: 片面抗战是一定要引导战争趋于失败的，是决然不能保卫祖国的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 上海太原失陷以后抗日战争的形势和任务
  authoredAt: '1937-11-12'
themes:
- 战略
interpretation:
  inspiration: '共同危机若只交给少数人处理，大多数人只能旁观，能用的力量就被浪费了。让参与不只停在口号上，也要给信息、权利和实际位置，才可能形成真正的合力。'
  explanation: '“片面抗战”指主要依靠国民党政府和军队、限制人民动员与民主权利的抗战路线。1937年上海、太原相继失守后，毛泽东认为正面战场的挫折已经说明，只靠少数军队和上层政府无法进行持久战争。与之相对的“全面抗战”，要开放民众运动、改善民生、实行民主，并广泛组织人民参加。句子不是说正规军队不重要，而是判断民族战争若排斥最广大人民，兵员、补给、士气和持续抵抗都会失去基础，最终难以保卫国家。'
historicalEvent: 1937年11月12日，《上海太原失陷以后抗日战争的形势和任务》形成，集中讨论战略及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《上海太原失陷以后抗日战争的形势和任务》从当时的具体问题出发讨论战略，本卡从“片面抗战是一定要引导战争趋于失败的”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“片面抗战是一定要引导战争趋于失败的”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
