revision: 3
status: published
quote: 一个外国人，毫无利己的动机，把中国人民的解放事业当作他自己的事业，这是什么精神？这是国际主义的精神。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 纪念白求恩
  authoredAt: '1939-12-21'
themes:
- 国际主义
interpretation:
  inspiration: '人与人并不一定因为出生在同一处才彼此相关。看见一个真实困难，愿意拿出自己的专业能力去帮忙，共同做过的事会让原本遥远的人靠得很近。'
  explanation: '这段话赞扬加拿大医生白求恩把中国人民的抗日与解放事业当成自己的事业。白求恩受加拿大和美国共产党委派来到中国，在敌后医疗队工作，1939年因手术感染去世。毛泽东在纪念文章中追问，一个外国人为何愿意跨越国界承担这样的风险，并把答案概括为国际主义。这里的精神不是抽象地喜欢“外国”，而是把不同国家人民反抗侵略、争取解放的事业看作相互联系，并以实际专业工作承担责任。'
historicalEvent: 1939年12月21日，毛泽东写作《纪念白求恩》。
background: 加拿大医生白求恩在抗日前线牺牲后，毛泽东撰文纪念其国际主义、责任心和无私精神。 此卡所选名句着重表现跨越国界为他人共同事业负责体现了国际主义。
story: 《纪念白求恩》围绕国际主义、责任心和无私精神逐层展开。这句话把跨越国界为他人共同事业负责体现了国际主义凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
