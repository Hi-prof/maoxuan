id: 8edca723-ff7e-5e16-b3d8-0ae21873a24d
revision: 2
status: published
quote: 一个外国人，毫无利己的动机，把中国人民的解放事业当作他自己的事业，这是什么精神？这是国际主义的精神。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 纪念白求恩
  authoredAt: '1939-12-21'
themes:
- 国际主义
interpretation:
  inspiration: 合作时关注共同问题和实际贡献，不用身份远近决定是否值得尊重与支持。
  explanation: 原文出自《纪念白求恩》，围绕国际主义、责任心和无私精神展开。这句话强调跨越国界为他人共同事业负责体现了国际主义。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1939年12月21日，毛泽东写作《纪念白求恩》。
background: 加拿大医生白求恩在抗日前线牺牲后，毛泽东撰文纪念其国际主义、责任心和无私精神。 此卡所选名句着重表现跨越国界为他人共同事业负责体现了国际主义。
story: 《纪念白求恩》围绕国际主义、责任心和无私精神逐层展开。这句话把跨越国界为他人共同事业负责体现了国际主义凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
