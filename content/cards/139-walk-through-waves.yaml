revision: 2
status: published
quote: 不管风吹浪打，胜似闲庭信步。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 水调歌头·游泳
  authoredAt: 1956-06
themes:
- 从容
interpretation:
  inspiration: 从容来自准备和能力；面对压力先稳住节奏和动作，不把表面轻松当作忽视风险。
  explanation: 这句话来自《水调歌头·游泳》，原文关注压力中的从容和建设信心，核心是在长江风浪中写从容自信的状态。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1956年6月，武汉长江大桥建设中，毛泽东畅游长江。
background: 武汉长江大桥建设期间，毛泽东畅游长江，以水势、建设和神话想象写改造自然的气象。 此卡所选名句着重表现在长江风浪中写从容自信的状态。
story: 《水调歌头·游泳》以景物、行动和历史联想组织诗意。这一句集中呈现在长江风浪中写从容自信的状态，既有鲜明画面，也保留了作品写作时的现实背景。
