quote: 必须认清目前国内国际尚存在着许多利于我们争取继续抗战、继续团结和继续进步的客观条件。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 克服投降危险，力争时局好转
  authoredAt: '1940-01-28'
themes:
- 团结
interpretation:
  inspiration: '坏消息占满视野时，可以认真找一找仍在起作用的有利条件。不是强装乐观，而是把可用的人、资源和趋势也算进去。行动往往从这份更完整的清单开始。'
  explanation: '1940年初，抗战进入相持阶段，国民党内部投降、反共和倒退倾向上升。毛泽东在指出危险的同时，要求看到继续抗战、团结和进步仍有客观基础：日本侵略同中国民族利益的矛盾没有消失，全国人民要求抗战，共产党和进步力量在发展，国际反法西斯条件也会变化。句子反对因局势恶化便认定无事可为。所谓“力争好转”，不是等待有利条件自己兑现，而是认清它们、依靠它们，组织力量去克服投降危险。'
historicalEvent: 1940年1月28日，《克服投降危险，力争时局好转》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《克服投降危险，力争时局好转》从当时的具体问题出发讨论团结，本卡从“必须认清目前国内国际尚存在着许多利于我们争取继续抗战、继续团结和继续进步的客观条件”切入全文的一层论证。
story: 文本围绕团结逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《克服投降危险，力争时局好转》中的理由和限制一起理解。
