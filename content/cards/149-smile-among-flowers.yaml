id: bbb4dd7e-fc8c-5e14-9b82-33dffa5cbe50
revision: 1
status: published
quote: 待到山花烂漫时，她在丛中笑。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 卜算子·咏梅
  authoredAt: 1961-12
themes:
- 谦逊
interpretation:
  inspiration: 真正的完成感可以是看见共同成果成熟，而不是始终站在中心证明个人贡献。
  explanation: 在《卜算子·咏梅》讨论坚韧、报春和完成后的谦退的语境中，这句话把重点放在春天到来、百花盛开时，梅花以丛中一笑完成形象。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1961年12月，毛泽东写作《卜算子·咏梅》。
background: 毛泽东读陆游咏梅词后反其意而作，用风雪中的梅花写坚韧、报春和不争功。 此卡所选名句着重表现春天到来、百花盛开时，梅花以丛中一笑完成形象。
story: 《卜算子·咏梅》以景物、行动和历史联想组织诗意。这一句集中呈现春天到来、百花盛开时，梅花以丛中一笑完成形象，既有鲜明画面，也保留了作品写作时的现实背景。
