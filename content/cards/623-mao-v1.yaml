revision: 3
status: published
quote: 当着革命的形势已经改变的时候，革命的策略，革命的领导方式，也必须跟着改变。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 论反对日本帝国主义的策略
  authoredAt: '1935-12-27'
themes:
- 领导方法
interpretation:
  inspiration: '曾经有效的办法，用久了容易变成习惯。外部条件、参与者和目标已经变化时，重新设计做法不是否定过去，而是承认今天的问题值得一套今天的回答。'
  explanation: '这句话要求革命策略和领导方式随着形势变化而调整。1935年华北危机加深，日本侵略成为更突出的民族威胁；红军长征到达陕北，全国抗日救亡运动兴起。毛泽东在瓦窑堡会议后说明，党应从土地革命战争时期较狭窄的政策，转向建立广泛的抗日民族统一战线，争取更多阶级和政治力量。目标、同盟和斗争形式都要重新安排。坚持革命方向不等于固定采用一种策略，恰恰要根据主要矛盾和力量关系的变化更新领导方法。'
historicalEvent: 1935年12月27日，《论反对日本帝国主义的策略》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《论反对日本帝国主义的策略》从当时的具体问题出发讨论领导方法，本卡从“当着革命的形势已经改变的时候”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《论反对日本帝国主义的策略》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
