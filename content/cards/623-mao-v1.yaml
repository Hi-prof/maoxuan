id: 48f310f0-913c-4167-b414-ce8b9417a9c7
revision: 1
status: published
quote: 当着革命的形势已经改变的时候，革命的策略，革命的领导方式，也必须跟着改变。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 论反对日本帝国主义的策略
  authoredAt: '1935-12-27'
themes:
- 领导方法
interpretation:
  inspiration: 可以把“当着革命的形势已经改变的时候”转成一个工作问题：怎样让方向、分工、沟通和执行彼此衔接？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《论反对日本帝国主义的策略》中，这句话服务于对领导方法问题的分析。它把“当着革命的形势已经改变的时候”同实际任务联系起来，要求让方向、分工、沟通和执行彼此衔接。它的现实启发主要是一种工作方法；领导不是包办，决定也必须建立在信息和协作上，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1935年12月27日，《论反对日本帝国主义的策略》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《论反对日本帝国主义的策略》从当时的具体问题出发讨论领导方法，本卡从“当着革命的形势已经改变的时候”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《论反对日本帝国主义的策略》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
