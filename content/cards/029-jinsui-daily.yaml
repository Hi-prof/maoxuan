id: c59b0b3e-2900-5707-99a1-18aff664a5be
revision: 3
status: published
quote: '我们的报纸也要靠大家来办，靠全体人民群众来办，靠全党来办，而不能只靠少数人关起门来办。'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 对晋绥日报编辑人员的谈话
  authoredAt: '1948-04-02'
themes:
  - 群众路线
  - 宣传
interpretation:
  inspiration: '做面向公众的内容，要让使用者和一线人员有地方反馈，也要有人认真核实、编辑和纠错。开放参与不等于谁说什么都照发，专业把关也不能变成少数人关门猜需求。把真实经验带进编辑过程，再把问题处理结果反馈出去，内容才会贴近生活，也更容易被人看懂和使用。'
  explanation: '这句话反对少数人关起门来办报，要求报纸同全党和群众的实际经验连接起来。政策宣传只有被人理解、讨论并用于行动，报纸才不会变成编辑部内部的自我表达。谈话从土地改革政策说起，指出政策不能只让少数领导干部知道，还要让群众掌握，报纸承担着连接政策和行动的责任。“靠大家来办”并不意味着取消编辑责任或专业判断。文章用检查错字的例子说明，编辑部仍要把人员组织起来，查明错误、分析原因并形成办法，只是信息来源和质量责任不能局限在少数编辑。群众提供现场经验，编辑负责核实、整理和表达，两者结合，报纸才既有真实内容，也有清楚的方向。'
historicalEvent: '1948年4月2日，毛泽东同《晋绥日报》编辑人员谈话，讨论土地改革宣传和群众办报。'
background: '谈话从土地改革政策的宣传谈起，强调政策不仅要让领导干部知道，也要让广大群众理解，报纸承担着连接政策与群众行动的作用。'
story: '文章用报纸错字这个小例子说明群众路线：把全报社人员集合起来查明错误、原因和办法，连续认真处理，小问题也能形成共同责任。'
