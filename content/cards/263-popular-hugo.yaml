interpretation:
  inspiration: 允许过程不完美，但别把一次受挫误认成全部可能性的终点。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“成长”压缩成简洁表达。成长常常表现为看法和做法的改进，不必把它包装成永远向上的情绪。
historicalEvent: 19世纪法国经历革命、复辟与共和的反复，文学作品常直接回应贫困、正义与社会变迁。
background: 雨果的文学和公共行动持续关注尊严、同情、教育与社会正义。
