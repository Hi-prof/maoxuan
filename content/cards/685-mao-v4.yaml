revision: 3
status: published
quote: 在不妨碍战争、工作和学习的条件下，部队、机关、学校仍要适当地参加生产，才能改善生活，减轻人民的负担。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 减租和生产是保卫解放区的两件大事
  authoredAt: '1945-11-07'
themes:
- 群众路线
interpretation:
  inspiration: 想接一份额外工作、做个副业或参加集体事务时，先看它会不会挤掉手头最重要的事。能兼顾主次，也让生活轻松一点，才是合适的安排。
  explanation: 这句话是说，部队、机关和学校可以适度参加生产，但前提是不耽误作战、工作和学习；这样既改善自身生活，也减少对当地群众供给的依赖。1945年抗战刚结束，解放区面临内战压力和物资负担，文章把减租、发展生产视为巩固解放区的两件要事，还强调不误农时、组织生产互助。重点不是让所有人都去务农，而是在主要任务与基本生活之间做现实安排。
historicalEvent: 1945年11月7日，《减租和生产是保卫解放区的两件大事》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《减租和生产是保卫解放区的两件大事》从当时的具体问题出发讨论群众路线，本卡从“在不妨碍战争、工作和学习的条件下”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“在不妨碍战争、工作和学习的条件下”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
