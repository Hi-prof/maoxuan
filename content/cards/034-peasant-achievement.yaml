revision: 3
status: published
quote: 孙中山先生致力国民革命凡四十年，所要做而没有做到的事，农民在几个月内做到了。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 湖南农民运动考察报告
  authoredAt: 1927-03
themes:
- 群众力量
interpretation:
  inspiration: '一个人平时看起来不起眼，不等于他永远没有力量。共同的需要让人们真正组织起来时，变化常会比旁观者预想得快。遇到新局面，不妨把旧估计也更新一下。'
  explanation: '这句话说的是：孙中山长期希望推动却未能完成的农村变革，被组织起来的湖南农民在短时间内做出了实际突破。1927年，毛泽东经过三十二天实地考察，看到农民协会迅速发展，也看到社会上有人把这些行动一概斥为“过分”。他用四十年与几个月的强烈对比，反驳对农民力量的低估。这里赞叹的是长期受压者一旦行动起来所产生的巨大社会力量，并不是说速度本身就能证明一切做法都正确。'
historicalEvent: 1927年春，毛泽东完成湖南农民运动实地考察报告。
background: 大革命时期，毛泽东考察湖南多县农民运动，以调查事实回应对农民运动的怀疑和指责。 此卡所选名句着重表现群众一旦组织起来能够产生超出惯常估计的行动力。
story: 《湖南农民运动考察报告》围绕农民运动的力量、性质和领导问题逐层展开。这句话把群众一旦组织起来能够产生超出惯常估计的行动力凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
