quote: 倘若一个人拥有了他生命的为何，就几乎能容忍所有的如何-人并不追求幸福；只有英国人这么做。——《偶像的黄昏》-格言与箭-12（卫茂平译）
literature:
  series: 名人名言
  volume: 尼采
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1880'
themes:
- 人生
interpretation:
  inspiration: 遇到停滞时，别急着给自己下结论；先保留行动、学习和重新选择的空间。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 19世纪后期，欧洲哲学开始强烈反思传统道德、宗教与现代人的精神处境。
background: 尼采的著作常以格言式语言讨论创造、自由、价值判断与自我超越。
story: 此卡按可追溯出处筛选自尼采语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
