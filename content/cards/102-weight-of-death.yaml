revision: 3
status: published
quote: 为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
- 价值
interpretation:
  inspiration: '衡量一件事，不只看它有多辛苦、多轰动，也看看它让谁的生活变好。意义常藏在服务的方向里。平凡工作若真对别人有用，也有自己的分量。'
  explanation: '这段话借司马迁“人固有一死，或重于泰山，或轻于鸿毛”的说法，区分不同牺牲的意义：为人民利益献身有崇高价值，为法西斯和压迫者卖力则没有这种价值。1944年，普通战士张思德因烧炭窑坍塌牺牲，毛泽东在追悼会上由他的死谈到全党全军为人民服务的宗旨。这里比较的是人所服务的事业，并不是给人的生命标价；张思德平凡的劳动被郑重纪念，正说明意义不由职位和声势决定。'
historicalEvent: 1944年9月8日，毛泽东在张思德追悼会上讲演。
background: 毛泽东在张思德追悼会上，从生死意义谈到人民立场、接受批评、团结和克服困难。 此卡所选名句着重表现原文用鲜明对比说明生命意义取决于所服务的事业。
story: 《为人民服务》围绕人民立场、改错和共同奋斗逐层展开。这句话把原文用鲜明对比说明生命意义取决于所服务的事业凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
