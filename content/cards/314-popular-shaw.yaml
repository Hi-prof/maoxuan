quote: 自由意味着责任，正因为如此，多数人都惧怕自由。
literature:
  series: 名人名言
  volume: 萧伯纳
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1910'
themes:
- 自由
interpretation:
  inspiration: 把这句话当作一次提醒：认真生活，也认真分辨什么值得长期投入。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“自由”压缩成简洁表达。自由既意味着选择，也意味着对选择后果和他人边界的尊重。
historicalEvent: 20世纪初英国的社会改革讨论深入公共生活，戏剧成为批评贫困、教育和阶层问题的媒介。
background: 萧伯纳的戏剧和评论以讽刺手法讨论教育、创造、社会责任和独立思考。
