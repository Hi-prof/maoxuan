quote: 人生最苦痛的是梦醒了无路可以走。做梦的人是幸福的；倘没有看出可走的路，最要紧的是不要去惊醒他。
literature:
  series: 名人名言
  volume: 鲁迅
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1920'
themes:
- 人生
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 五四新文化运动推动白话文学、思想启蒙与社会批评，鲁迅是其中的重要作家。
background: 鲁迅的杂文、小说与书信常从个人处境切入，追问麻木、勇气、学习与社会责任。
story: 此卡按可追溯出处筛选自鲁迅语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
