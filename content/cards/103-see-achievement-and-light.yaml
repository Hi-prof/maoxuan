id: 4eddf542-b8a1-5e7c-bdea-c88d9df0be0a
revision: 3
status: published
quote: 我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
- 勇气
interpretation:
  inspiration: '低谷里，大脑很容易只播放失败片段。把已经做到的、仍然可用的和下一小步写下来，不是粉饰困难，只是把画面调回完整。勇气有时来自重新看全事实。'
  explanation: '这句话要求在困难中同时看见已经取得的成绩和未来的光明，从事实中恢复继续行动的勇气。《为人民服务》是在张思德追悼会上作的讲演，当时抗战仍艰苦，队伍还要面对牺牲和各种困难。毛泽东没有说困难不存在，而是把人民解放事业的进展、共同目标和继续奋斗联系起来。只看困难会陷入失望，只喊光明又会变成空话；“看到成绩”给信心以现实依据，“提高勇气”则让认识重新转化为工作。'
historicalEvent: 1944年9月8日，毛泽东在张思德追悼会上讲演。
background: 毛泽东在张思德追悼会上，从生死意义谈到人民立场、接受批评、团结和克服困难。 此卡所选名句着重表现正视困难的同时看见已有成绩和前景，才能维持行动勇气。
story: 《为人民服务》围绕人民立场、改错和共同奋斗逐层展开。这句话把正视困难的同时看见已有成绩和前景，才能维持行动勇气凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
