themes:
- 成长
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“成长”压缩成简洁表达。成长常常表现为看法和做法的改进，不必把它包装成永远向上的情绪。
historicalEvent: 1913年，泰戈尔获得诺贝尔文学奖，亚洲文学获得更广泛的世界性关注。
background: 泰戈尔的诗歌与散文常围绕自由、爱、生命、教育和人与世界的关系展开。
story: 此卡按可追溯出处筛选自泰戈尔语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
