status: published
quote: 一切新的东西都是从艰苦斗争中锻炼出来的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 成长
interpretation:
  inspiration: 把早期摩擦当作发现问题和完善机制的材料，但不要浪漫化本可避免的代价。
  explanation: 原文出自《新民主主义论》，围绕新民主主义革命及其政治文化纲领展开。这句话强调新事物不是在无阻力环境中成熟，而是在困难中形成能力。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现新事物不是在无阻力环境中成熟，而是在困难中形成能力。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把新事物不是在无阻力环境中成熟，而是在困难中形成能力凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
