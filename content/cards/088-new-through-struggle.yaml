id: 482d845b-3bf7-505e-95e4-af2b2b7e9bc7
revision: 3
status: published
quote: 一切新的东西都是从艰苦斗争中锻炼出来的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 成长
interpretation:
  inspiration: '新办法刚出现时有点笨拙，很正常。摩擦会暴露它缺什么，也给人练习的机会。可以耐心改进，但不必把所有痛苦都浪漫化；能少走的弯路，还是值得少走。'
  explanation: '这句话说，新生的社会力量和制度不会在没有阻力的环境里自动成熟，而要在同旧力量的冲突中经受考验、形成能力。《新民主主义论》回顾中国革命从旧民主主义走向新民主主义的历史，论证新的政治、经济和文化是在反帝反封建斗争中成长起来的。“艰苦斗争”在这里有具体的革命内容，并不是把苦难本身当成价值。重点是新事物尚不完善时，不能因为遭遇阻力就断言它没有前途，也要在实践中不断塑造它。'
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现新事物不是在无阻力环境中成熟，而是在困难中形成能力。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把新事物不是在无阻力环境中成熟，而是在困难中形成能力凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
