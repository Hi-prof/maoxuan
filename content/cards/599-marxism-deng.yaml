quote: 社会主义同资本主义比较，它的优越性就在于能做到全国一盘棋，集中力量，保证重点。
literature:
  series: 马原思考
  volume: 邓小平
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1978'
themes:
- 社会关系
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自语录出处见维基语录条目，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 改革开放初期，解放思想、实事求是与发展问题成为中国社会的重要讨论。
background: 邓小平的讲话常从实践标准、发展、改革和人民生活的实际改善来讨论马克思主义的方法论。
story: 此卡按可追溯出处筛选自邓小平语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
