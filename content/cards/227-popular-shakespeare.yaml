- 成长
interpretation:
  inspiration: 把目标拆小，把注意力放回能控制的努力、节奏和下一次尝试上。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“成长”压缩成简洁表达。成长常常表现为看法和做法的改进，不必把它包装成永远向上的情绪。
historicalEvent: 伊丽莎白时代的英国戏剧繁荣，莎士比亚的作品在舞台上持续讨论权力、爱情、选择与人性。
background: 莎士比亚戏剧以冲突和人物行动呈现人性的复杂性，许多台词因准确而长期流传。
