quote: 在战役部署上，必须反对那种轻视敌人、因而平分兵力对付诸路之敌、以致一路也不能歼灭、使自己陷于被动地位的错误的作战方法。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 集中优势兵力，各个歼灭敌人
  authoredAt: '1946-09-16'
themes:
- 战略
interpretation:
  inspiration: 日常任务当然不是战役，不过“别把有限精力摊得太薄”仍是个朴素提醒。忙乱时先选一个关键点做完，再决定下一步，通常比处处开工更轻省。
  explanation: 这句话批评的是一种战役部署：因为轻敌而把兵力平均分散到多路敌军，结果任何一路都不能形成优势，反而陷入被动。1946年全面内战开始不久，文章总结苏中、定陶等战役经验，要求在战役上以少数兵力牵制其他方向，集中优势兵力先打其中一路；后文又具体区分战役和战术层面的兵力配置。这是一条针对当时解放军作战条件的军事原则，不能化约成处理所有问题的万能法则。
historicalEvent: 1946年9月16日，《集中优势兵力，各个歼灭敌人》形成，集中讨论战略及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《集中优势兵力，各个歼灭敌人》从当时的具体问题出发讨论战略，本卡从“在战役部署上，必须反对那种轻视敌人、因而平分兵力对付诸路之敌、以致一路也不能歼灭、使自己陷于被动地位的错误的作战方法”切入全文的一层论证。
story: 文本围绕战略逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《集中优势兵力，各个歼灭敌人》中的理由和限制一起理解。
