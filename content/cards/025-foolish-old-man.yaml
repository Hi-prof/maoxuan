id: 417781d4-7355-5e4b-bf7a-38fc8c7c1e9e
revision: 4
status: published
quote: '下定决心，不怕牺牲，排除万难，去争取胜利。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 愚公移山
  authoredAt: '1945-06-11'
themes:
  - 奋斗
  - 信念
interpretation:
  inspiration: '长期任务需要决心，也需要每天能做的具体步骤。把大困难拆开，持续处理眼前的障碍，并让相关的人明白为什么值得一起做。只喊“坚持”很快会耗尽热情，只有不断看见问题被解决，决心才会变成进展。一个人再能扛也有限，真正走得远还要靠更多人自愿参与。'
  explanation: '“下定决心”到“争取胜利”概括了面对长期困难所需要的意志和行动。目标确定以后，要准备承受代价，持续处理一个又一个障碍，不能因一时受挫就放弃。讲话借愚公移山的故事说明，看起来无法一次解决的重压，可以通过长期行动逐步改变。不过，原文紧接着指出，仅有少数人的决心还不够，必须让广大群众觉悟，并且甘心情愿地共同奋斗。寓言中帮助搬山的“上帝”也被重新解释为人民大众。因此，这句话不是把胜利归结为个人意志，更不是只靠硬撑。路线需要被人理解，困难需要有实际办法，更多人的参与才会把决心变成持续的力量。坚持在这里包含组织和行动，不只是态度。'
historicalEvent: '1945年6月11日，中共七大闭幕，毛泽东发表闭幕词，说明大会路线怎样带回各地实行。'
background: '这是中国共产党第七次全国代表大会的闭幕词。大会完成路线、党章和中央委员会三项主要议程后，讲话转向怎样把路线带回各地。'
story: '文章借中国古代愚公移山的寓言说明长期坚持，又重新解释故事中的“上帝”：真正能够搬走重压的，是被充分动员起来的人民大众。'
