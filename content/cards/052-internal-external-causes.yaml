revision: 3
status: published
quote: 外因是变化的条件，内因是变化的根据，外因通过内因而起作用。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 内外因
interpretation:
  inspiration: '同样一次机会，落在不同准备的人手里，结果常不一样。等外部条件改变固然重要，也可以顺手整理自己的能力、习惯和关系。这样机会来时，比较容易接得住。'
  explanation: '这句话区分变化的两类原因：外部条件会影响事物，但变化能否发生、怎样发生，还取决于事物内部原有的结构和矛盾。外因必须通过内因起作用。《矛盾论》用鸡蛋在适宜温度下能孵成小鸡、石头却不能的例子说明这一点。它并不是否认环境和外力的重要性，而是反对把结果全归给外部刺激。理解一个变化，需要同时看提供机会或压力的环境，也看内部是否存在相应的基础和动力。'
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现外部条件只有通过内部结构和能力才能形成实际变化。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把外部条件只有通过内部结构和能力才能形成实际变化凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
