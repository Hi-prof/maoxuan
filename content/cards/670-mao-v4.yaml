id: 8125b9c9-3fcf-44ff-9d61-ac04bcaacb1d
revision: 3
status: published
quote: 农民群众应当组织起来，协助人民解放军进行各项初步的改革工作。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中国人民解放军布告
  authoredAt: '1949-04-25'
themes:
- 群众路线
interpretation:
  inspiration: '变化来到一个地方时，当事人若只能等待安排，旧问题很容易换个样子继续。让人们组织起来参与最初的清理和建设，才比较可能把新秩序变成自己的生活。'
  explanation: '这句话出自人民解放军渡江后发布的布告，要求新解放区农民组织起来，协助军队和新政权开展清除残余武装、建立秩序、减租减息等初步改革。1949年南方大片地区即将接管，各地条件复杂，土地改革不能在军队到达后立即用同一速度全面展开，但群众也不能只是旁观者。先组织农民参与适合当地的初步工作，既帮助稳定社会，也为以后有准备、有领导的土地改革积累条件。'
historicalEvent: 1949年4月25日，《中国人民解放军布告》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中国人民解放军布告》从当时的具体问题出发讨论群众路线，本卡从“农民群众应当组织起来”切入全文的一层论证。
story: 《中国人民解放军布告》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
