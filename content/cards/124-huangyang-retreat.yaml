id: 61a159d4-bf40-54c6-8400-06da3eb26b8d
revision: 2
status: published
quote: 黄洋界上炮声隆，报道敌军宵遁。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 西江月·井冈山
  authoredAt: 1928-09
themes:
- 胜利
interpretation:
  inspiration: 成果来自准备、协作和现场行动；复盘胜利时要看清真正起作用的条件。
  explanation: 原文出自《西江月·井冈山》，围绕险境中的定力和军民协作展开。这句话强调以简短画面记录黄洋界保卫战和敌军退却。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1928年8月底，红军在黄洋界保卫战中击退进攻。
background: 井冈山军民保卫黄洋界后，毛泽东以词记录山地防御、军民配合和敌军退却。 此卡所选名句着重表现以简短画面记录黄洋界保卫战和敌军退却。
story: 《西江月·井冈山》以景物、行动和历史联想组织诗意。这一句集中呈现以简短画面记录黄洋界保卫战和敌军退却，既有鲜明画面，也保留了作品写作时的现实背景。
