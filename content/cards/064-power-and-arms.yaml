quote: 每个共产党员都应懂得这个真理：“枪杆子里面出政权”。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 战争和战略问题
  authoredAt: '1938-11-06'
themes:
- 政权
interpretation:
  inspiration: '有些名句声音很响，放回原来的年代才听得准。这句话适合帮助理解近代革命史，不适合拿来处理普通分歧。日常关系里，讲理、协商和边界比强力更重要。'
  explanation: '“枪杆子里面出政权”是在概括近代中国革命的一项历史经验：面对掌握军队、以武力维持统治的反革命力量，革命政权不可能只靠宣传和议会方式取得。毛泽东在1938年回顾大革命失败和此后的武装斗争，强调共产党必须懂得军队与政权的关系。这句话不是说任何政权只剩武力，也不是把暴力当成普遍真理；它针对的是当时武装反革命的现实，说明革命力量为何把建立和领导人民军队视为生存条件。'
historicalEvent: 1938年11月6日，毛泽东在中共六届六中全会上作结论。
background: 毛泽东总结中国革命的武装斗争经验，讨论战争、军队、政权以及党对军队领导的关系。 此卡所选名句着重表现特定历史条件下，政权问题同武装斗争紧密相连。
story: 《战争和战略问题》围绕战争、政权和组织领导逐层展开。这句话把特定历史条件下，政权问题同武装斗争紧密相连凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
