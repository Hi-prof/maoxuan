quote: 到中流击水，浪遏飞舟。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 沁园春·长沙
  authoredAt: '1925'
themes:
- 进取
interpretation:
  inspiration: 困难处往往最能检验能力；选准方向后主动进入实践，在行动中增长本领。
  explanation: 《沁园春·长沙》写到青年抱负、时代责任和进取精神时，用这句话说明以中流击水的回忆写青年人的行动气魄。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1925年秋，毛泽东离开长沙前往广州途中写作《沁园春·长沙》。
background: 毛泽东重游长沙、橘子洲，回忆青年时代的求学和社会活动，以秋景写抱负和时代追问。 此卡所选名句着重表现以中流击水的回忆写青年人的行动气魄。
story: 《沁园春·长沙》以景物、行动和历史联想组织诗意。这一句集中呈现以中流击水的回忆写青年人的行动气魄，既有鲜明画面，也保留了作品写作时的现实背景。
