revision: 3
status: published
quote: 任何一种东西，必须能使人民群众得到真实的利益，才是好的东西。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在延安文艺座谈会上的讲话
  authoredAt: 1942-05
themes:
- 人民立场
interpretation:
  inspiration: '“这是为你好”不妨先放一放，看看对方实际上得到了什么，又承担了什么。真实的好处通常能在生活里被感到，也允许当事人自己说话，不只存在于提供者的解释中。'
  explanation: '这句话把人民是否得到真实利益作为评价工作的标准。在延安文艺座谈会的语境里，它回应的是文艺和政治工作究竟怎样服务群众：不能只凭创作者自认高明，也不能用漂亮名义代替实际效果。所谓利益不只是眼前娱乐或物质所得，还包括帮助人民团结、认识生活并推进解放事业。毛泽东借此强调文艺的社会立场。理解“好的东西”时，需要同时追问服务对象、长期影响和群众的实际感受，而不是把一句善意声明当成证明。'
historicalEvent: 1942年5月，延安文艺座谈会召开，毛泽东作结论讲话。
background: 延安文艺座谈会上，毛泽东讨论文艺为谁服务、怎样服务，以及文艺工作者同群众生活的关系。 此卡所选名句着重表现评价文化和工作不能离开人民是否获得真实利益。
story: 《在延安文艺座谈会上的讲话》围绕文艺的人民立场、普及和提高逐层展开。这句话把评价文化和工作不能离开人民是否获得真实利益凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
