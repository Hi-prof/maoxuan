quote: 在一切新老解放区必须坚决实行土地改革（这是支持长期战争取得全国胜利的最基本条件），发展生产，厉行节约，加强军事工业的建设，一切为了前线的胜利。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 解放战争第二年的战略方针
  authoredAt: '1947-09-01'
themes:
- 经济建设
interpretation:
  inspiration: “在一切新老解放区必须坚决实行土地改革（这是支持长期战争取得全国胜利的最基本条件）”提醒我们面对复杂局面先把资源、条件和长期效果一起核算，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《解放战争第二年的战略方针》时，面对的是需要作出具体判断和安排的经济建设问题。这句话以“在一切新老解放区必须坚决实行土地改革（这是支持长期战争取得全国胜利的最基本条件）”概括其中一层意思，即把资源、条件和长期效果一起核算。同时，建设目标必须落实为可执行的生产与组织安排。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1947年9月1日，《解放战争第二年的战略方针》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《解放战争第二年的战略方针》从当时的具体问题出发讨论经济建设，本卡从“在一切新老解放区必须坚决实行土地改革（这是支持长期战争取得全国胜利的最基本条件）”切入全文的一层论证。
story: 文本围绕经济建设逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《解放战争第二年的战略方针》中的理由和限制一起理解。
