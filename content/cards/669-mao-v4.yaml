quote: 必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中国人民解放军宣言
  authoredAt: '1947-10-10'
themes:
- 群众路线
interpretation:
  inspiration: '完成一个显眼目标以后，真正让成果站稳的工作才开始：认识当地的人，解释变化，建立日常秩序。攻下难题和照顾后续，是两种不同又都重要的本领。'
  explanation: '这句话要求人民解放军不仅会打仗，还要会在新解放地区发动群众、建立政权和推进改革，使军事胜利转化为稳固的社会政治基础。1947年解放军转入战略进攻，大量部队进入原国民党统治区。当地群众对新军队和政策未必了解，旧政权关系也尚未改变。如果只占领城镇而不做群众工作，地区仍不稳固。“歼灭敌人、唤起民众”因此是军队在解放战争中的两套任务，分别解决军事控制和人民支持。'
historicalEvent: 1947年10月10日，《中国人民解放军宣言》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中国人民解放军宣言》从当时的具体问题出发讨论群众路线，本卡从“必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
