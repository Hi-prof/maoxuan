quote: 必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中国人民解放军宣言
  authoredAt: '1947-10-10'
themes:
- 群众路线
interpretation:
  inspiration: “必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《中国人民解放军宣言》，原文围绕群众路线的具体任务展开。“必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1947年10月10日，《中国人民解放军宣言》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中国人民解放军宣言》从当时的具体问题出发讨论群众路线，本卡从“必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“必须提高觉悟性，人人学会歼灭敌人、唤起民众两套本领，亲密团结群众，把新区迅速建设成为巩固区”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
