status: published
quote: 为了发展农业生产，必须劝告农民在自愿原则下逐步地组织为现时经济条件所许可的以私有制为基础的各种生产的和消费的合作团体。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在晋绥干部会议上的讲话
  authoredAt: '1948-04-01'
themes:
- 群众路线
interpretation:
  inspiration: 从“为了发展农业生产，必须劝告农民在自愿原则下逐步地组织为现时经济条件所许可的以私有制为基础的各种生产的和消费的合作团体”出发，可以把态度转成行动：把当事人的处境和实际需要放进决策，并让事实、分工和实际结果检验原先的判断。
  explanation: 《在晋绥干部会议上的讲话》讨论的是特定历史条件下的群众路线问题。这里用“为了发展农业生产，必须劝告农民在自愿原则下逐步地组织为现时经济条件所许可的以私有制为基础的各种生产的和消费的合作团体”指出行动应有的着力点，核心在于把当事人的处境和实际需要放进决策。原文并不支持脱离对象的简单化理解，因为尊重群众不等于放弃分析和责任边界。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1948年4月1日，《在晋绥干部会议上的讲话》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《在晋绥干部会议上的讲话》从当时的具体问题出发讨论群众路线，本卡从“为了发展农业生产，必须劝告农民在自愿原则下逐步地组织为现时经济条件所许可的以私有制为基础的各种生产的和消费的合作团体”切入全文的一层论证。
story: 《在晋绥干部会议上的讲话》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
