status: published
quote: 深圳的发展和经验证明，我们建立经济特区的政策是正确的。
literature:
  series: 马原思考
  volume: 邓小平
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1978'
themes:
- 马原思考
interpretation:
  inspiration: 不要用抽象口号跳过具体问题。把对象、条件、利益和变化过程放在一起看。
  explanation: 这句出自在廣州为深圳经济特区题词，將落款日期寫為離開深圳的1月26日，1984年2月1日，可从“马原思考”角度理解。这句话提醒我们用现实关系和发展过程来理解问题，而不是满足于抽象判断。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 改革开放初期，解放思想、实事求是与发展问题成为中国社会的重要讨论。
background: 邓小平的讲话常从实践标准、发展、改革和人民生活的实际改善来讨论马克思主义的方法论。
story: 此卡按可追溯出处筛选自邓小平语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
