revision: 3
status: published
quote: 我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 愚公移山
  authoredAt: '1945-06-11'
themes:
- 坚持
interpretation:
  inspiration: '坚持不必每天都气势很大。把能做的一点继续做，也让更多人慢慢看见和加入，长期变化就有了来源。累了可以调整办法，方向和节奏不是一回事。'
  explanation: '这里的“感动上帝”沿用愚公移山寓言，但毛泽东随即解释，真正的“上帝”是中国人民大众。共产党不断工作，是为了使人民了解并共同推翻压在头上的帝国主义和封建主义两座“大山”。1945年中共七大闭幕时，抗战即将胜利，前面的政治任务仍很艰巨。句子强调的不是靠虔诚等待奇迹，而是持续行动、争取人民支持，让原本看似不可能的目标获得越来越广泛的现实力量。'
historicalEvent: 1945年6月11日，毛泽东在中国共产党第七次全国代表大会上致闭幕词。
background: 中共七大闭幕时，毛泽东借愚公移山寓言说明长期奋斗、人民支持和推翻压迫力量的信心。 此卡所选名句着重表现长期目标需要持续工作，并依靠人民大众形成最终力量。
story: 《愚公移山》围绕长期奋斗、人民支持和胜利信心逐层展开。这句话把长期目标需要持续工作，并依靠人民大众形成最终力量凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
