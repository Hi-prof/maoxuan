quote: 被敌逼迫到被动地位的事是常有的，重要的是要迅速地恢复主动地位。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: 1936-12
themes:
- 主动权
interpretation:
  inspiration: 遇到突发变化先稳住信息和资源，再设计下一步，让自己重新拥有选择权。
  explanation: 《中国革命战争的战略问题》写到战略判断、主动权和力量配置时，用这句话说明暂时被动并不可怕，关键是尽快创造可选择、可行动的条件。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1936年12月，毛泽东在陕北红军大学讲授革命战争战略问题。
background: 毛泽东总结土地革命战争经验，系统讨论战争规律、主动权、集中兵力和战略防御。 此卡所选名句着重表现暂时被动并不可怕，关键是尽快创造可选择、可行动的条件。
story: 《中国革命战争的战略问题》围绕战略判断、主动权和力量配置逐层展开。这句话把暂时被动并不可怕，关键是尽快创造可选择、可行动的条件凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
