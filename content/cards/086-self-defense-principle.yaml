quote: 人不犯我，我不犯人；人若犯我，我必犯人。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 目前抗日统一战线中的策略问题
  authoredAt: '1940-03-11'
themes:
- 原则
interpretation:
  inspiration: '日常分歧里，这句话不该成为“别人一句重话，我就加倍还回去”的理由。更温和的借鉴是把边界说清：不主动伤害，也不默默接受伤害，回应以停止伤害为止。'
  explanation: '这句话概括抗日统一战线中同反共顽固派斗争的“自卫原则”：共产党不主动破坏合作，但遭到军事进攻时要坚决反击。1940年，统一战线一面共同抗日，一面发生严重反共摩擦，毛泽东试图同时反对无原则退让和无限扩大冲突。文章还提出胜利、休战等原则，说明反击的目的仍是制止进攻、争取继续团结抗日。因此“我必犯人”有明确的军事和政治边界，不是鼓励在普通关系中以报复升级矛盾。'
historicalEvent: 1940年3月11日，毛泽东在延安党的高级干部会议上作报告。
background: 抗日统一战线中的关系复杂，毛泽东总结发展进步势力、争取中间势力和反对顽固势力的策略。 此卡所选名句着重表现原文把同顽固派斗争的第一项原则概括为自卫。
story: 《目前抗日统一战线中的策略问题》围绕统一战线中的自卫、斗争和团结逐层展开。这句话把原文把同顽固派斗争的第一项原则概括为自卫凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
