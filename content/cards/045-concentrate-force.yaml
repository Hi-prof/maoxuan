revision: 3
status: published
quote: 对于人，伤其十指不如断其一指；对于敌，击溃其十个师不如歼灭其一个师。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: 1936-12
themes:
- 集中力量
interpretation:
  inspiration: '待办事项很多时，平均分一点力气给每件事，看上去忙碌，结果可能全是半成品。挑一个最能带来进展的目标先做完，常比同时开十个头更让人轻松。'
  explanation: '这组比喻强调的是集中兵力取得完整战果，而不是把力量平均撒在许多目标上。土地革命战争时期，红军总体弱于对手，如果处处迎击，容易在每一处都处于劣势。毛泽东总结的办法是在战略上面对强敌、在具体战役中创造局部优势，争取一次解决一个目标。“断其一指”说的是军事效果的完整性。用于一般工作时，可以借鉴集中有限资源的思路，却不能把这种战争语言直接搬到人与人的关系中。'
historicalEvent: 1936年12月，毛泽东在陕北红军大学讲授革命战争战略问题。
background: 毛泽东总结土地革命战争经验，系统讨论战争规律、主动权、集中兵力和战略防御。 此卡所选名句着重表现把有限力量集中到能够形成确定结果的目标上更有效。
story: 《中国革命战争的战略问题》围绕战略判断、主动权和力量配置逐层展开。这句话把把有限力量集中到能够形成确定结果的目标上更有效凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
