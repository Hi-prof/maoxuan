revision: 1
status: published
quote: 五岭逶迤腾细浪，乌蒙磅礴走泥丸。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七律·长征
  authoredAt: 1935-10
themes:
- 气魄
interpretation:
  inspiration: 放大目标感能减轻畏难，但具体行动仍要尊重地形、资源和每一步风险。
  explanation: 在《七律·长征》讨论长期跋涉中的勇气和乐观的语境中，这句话把重点放在用夸张比喻把巨大山岭写成可跨越的细浪和泥丸。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1935年10月，中央红军到达陕北，长征取得关键胜利。
background: 中央红军长征即将结束时，毛泽东回顾跨越群山江河的艰苦历程，突出从容和胜利信念。 此卡所选名句着重表现用夸张比喻把巨大山岭写成可跨越的细浪和泥丸。
story: 《七律·长征》以景物、行动和历史联想组织诗意。这一句集中呈现用夸张比喻把巨大山岭写成可跨越的细浪和泥丸，既有鲜明画面，也保留了作品写作时的现实背景。
