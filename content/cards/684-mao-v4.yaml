revision: 3
status: published
quote: 部队内部政治工作方针，是放手发动士兵群众、指挥员和一切工作人员，通过集中领导下的民主运动，达到政治上高度团结、生活上获得改善、军事上提高技术和战术的三大目的。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 军队内部的民主运动
  authoredAt: '1948-01-30'
themes:
- 群众路线
interpretation:
  inspiration: 一起做事时，让执行者说出一线问题，常常比单向布置更快找到办法；但讨论之后还要有人归纳、定责和推进。参与感与明确领导并不冲突。
  explanation: 这句话把军队内部政治工作的办法说得很具体：让士兵、指挥员和工作人员参与民主讨论，同时由统一领导把意见转化为行动，目标是增进团结、改善生活并提高军事能力。文章写于1948年初，概括当时“三查、三整”以及政治、经济、军事民主的经验，后文还谈到伙食监督、官兵互教和战斗讨论。这里的“民主运动”有明确的军队组织和战争背景，并非泛指任何场合都以讨论代替指挥。
historicalEvent: 1948年1月30日，《军队内部的民主运动》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《军队内部的民主运动》从当时的具体问题出发讨论群众路线，本卡从“部队内部政治工作方针”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《军队内部的民主运动》中的理由和限制一起理解。
