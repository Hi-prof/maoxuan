themes:
- 人生
interpretation:
  inspiration: 把目标拆小，把注意力放回能控制的努力、节奏和下一次尝试上。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 19世纪法国经历革命、复辟与共和的反复，文学作品常直接回应贫困、正义与社会变迁。
background: 雨果的文学和公共行动持续关注尊严、同情、教育与社会正义。
story: 此卡按可追溯出处筛选自维克多·雨果语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
