id: d0472a3c-2403-45a0-97f8-436257c45395
revision: 3
status: published
quote: 要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 理论与实践
interpretation:
  inspiration: '一个想法在脑中很完整，到了现实里才知道哪里松动。先做一次小规模尝试，看看结果是否接近预期。被事实改过的方案，往往比从未碰壁的方案更可靠。'
  explanation: '这句话说，认识从感性材料上升为理性理论后，还没有完成全过程；必须把理论重新用于实践，看它能否实现预期目的，才能检验它是否正确。《实践论》把认识描写为实践、认识、再实践的反复运动，针对的是理论脱离实际和经验停在零散感受两种问题。实践结果可能证明原判断，也可能暴露偏差，促使人重新认识。这里的“预想目的”不是只看一次成败，而是看理论在具体条件中能否指导行动，并接受持续反馈。'
historicalEvent: 1937年7月，《实践论》形成，集中讨论理论与实践及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《实践论》从当时的具体问题出发讨论理论与实践，本卡从“要完全地解决这个问题”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《实践论》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
