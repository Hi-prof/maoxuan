id: d0472a3c-2403-45a0-97f8-436257c45395
revision: 2
status: published
quote: 要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 理论与实践
interpretation:
  inspiration: 可以把“要完全地解决这个问题”转成一个工作问题：怎样让认识在行动和反馈中接受检验？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《实践论》中，这句话服务于对理论与实践问题的分析。它把“要完全地解决这个问题”同实际任务联系起来，要求让认识在行动和反馈中接受检验。它的现实启发主要是一种工作方法；理论不能替代事实，经验也不能拒绝总结，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1937年7月，《实践论》形成，集中讨论理论与实践及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《实践论》从当时的具体问题出发讨论理论与实践，本卡从“要完全地解决这个问题”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《实践论》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
