revision: 1
status: published
quote: 中国人民愿意同世界各国人民实行友好合作，恢复和发展国际间的通商事业，以利发展生产和繁荣经济。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在新政治协商会议筹备会上的讲话
  authoredAt: '1949-06-15'
themes:
- 群众路线
interpretation:
  inspiration: “中国人民愿意同世界各国人民实行友好合作”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《在新政治协商会议筹备会上的讲话》，原文围绕群众路线的具体任务展开。“中国人民愿意同世界各国人民实行友好合作”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1949年6月15日，《在新政治协商会议筹备会上的讲话》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《在新政治协商会议筹备会上的讲话》从当时的具体问题出发讨论群众路线，本卡从“中国人民愿意同世界各国人民实行友好合作”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“中国人民愿意同世界各国人民实行友好合作”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
