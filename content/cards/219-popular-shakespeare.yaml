revision: 1
status: published
quote: 不管饕餮的时间怎样吞噬着一切，我们要在这一息尚存的时候，努力博取我们的声名，使时间的镰刀不能伤害我们我们的生命可以终了，我们的名誉却要永垂万古。
literature:
  series: 名人名言
  volume: 莎士比亚
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1600'
themes:
- 行动
interpretation:
  inspiration: 把这句话当作一次提醒：认真生活，也认真分辨什么值得长期投入。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“行动”压缩成简洁表达。行动的意义在于形成反馈：做过、看见结果、再决定下一步。
historicalEvent: 伊丽莎白时代的英国戏剧繁荣，莎士比亚的作品在舞台上持续讨论权力、爱情、选择与人性。
background: 莎士比亚戏剧以冲突和人物行动呈现人性的复杂性，许多台词因准确而长期流传。
story: 此卡按可追溯出处筛选自莎士比亚语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
