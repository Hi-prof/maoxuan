quote: 但对于凡非坚决投降和坚决反共的人，则必须采取团结政策。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 团结到底
  authoredAt: '1940-07-05'
themes:
- 团结
interpretation:
  inspiration: 可以把“但对于凡非坚决投降和坚决反共的人”转成一个工作问题：怎样围绕共同目标处理差异并形成协作？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《团结到底》中，这句话服务于对团结问题的分析。它把“但对于凡非坚决投降和坚决反共的人”同实际任务联系起来，要求围绕共同目标处理差异并形成协作。它的现实启发主要是一种工作方法；团结需要原则、沟通和清楚的任务，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1940年7月5日，《团结到底》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《团结到底》从当时的具体问题出发讨论团结，本卡从“但对于凡非坚决投降和坚决反共的人”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《团结到底》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
