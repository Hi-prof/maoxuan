quote: 但对于凡非坚决投降和坚决反共的人，则必须采取团结政策。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 团结到底
  authoredAt: '1940-07-05'
themes:
- 团结
interpretation:
  inspiration: '合作不必只留给完全同意自己的人。把不可跨越的底线说清，底线之外仍可寻找共同部分。边界明确以后，许多差异反而没有想象中那么妨碍同行。'
  explanation: '这句话为抗日统一战线划定团结范围：对已经坚决投降日本、坚决反共并破坏抗战的人要斗争；除此之外，即使有分歧，也应尽量采取团结政策。1940年投降危险和反共摩擦上升，毛泽东发表《团结到底》，反对把所有中间力量都推向顽固派，也反对无原则迁就。这里的团结有明确底线，也保留很大争取空间。它根据各方实际行动区分对象，目的是扩大抗日力量，而不是要求所有合作者在政治上完全一致。'
historicalEvent: 1940年7月5日，《团结到底》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《团结到底》从当时的具体问题出发讨论团结，本卡从“但对于凡非坚决投降和坚决反共的人”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《团结到底》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
