revision: 2
status: published
quote: 实现中国人民之幸福与愉快的生活，首先须切实救济灾荒，安定民生，发展国防经济，解除人民痛苦，与改善人民生活。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 评国民党十一中全会和三届二次国民参政会
  authoredAt: '1943-10-05'
themes:
- 群众路线
interpretation:
  inspiration: “实现中国人民之幸福与愉快的生活”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《评国民党十一中全会和三届二次国民参政会》，原文围绕群众路线的具体任务展开。“实现中国人民之幸福与愉快的生活”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1943年10月5日，《评国民党十一中全会和三届二次国民参政会》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《评国民党十一中全会和三届二次国民参政会》从当时的具体问题出发讨论群众路线，本卡从“实现中国人民之幸福与愉快的生活”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“实现中国人民之幸福与愉快的生活”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
