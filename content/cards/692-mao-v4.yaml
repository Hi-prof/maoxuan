id: eb41d7e2-f02b-42b5-be06-5d62437c9d7f
revision: 3
status: published
quote: 一切军队，均须有确定的地区和任务，才能迅速和人民结合起来，建立巩固的根据地。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 建立巩固的东北根据地
  authoredAt: '1945-12-28'
themes:
- 群众路线
interpretation:
  inspiration: 任务只写“大家一起推进”，往往谁都不知道先做什么。给每个小组一块明确范围和一个可验收目标，再让它在当地建立稳定联系，协作会踏实很多。
  explanation: 这句话是说，进入东北的各支部队都要划定具体活动地区和任务，才能同当地民众建立联系并形成稳定根据地。1945年底，东北局势快速变化，中共中央要求把部分正规军分到各军分区，既发动群众、建立政权，也配合野战军应对国民党进攻。引文针对的是建立东北根据地的军事与政治部署；其中可理解的工作逻辑是“责任必须落到具体区域和任务”，不是把根据地经验照搬到一般场景。
historicalEvent: 1945年12月28日，《建立巩固的东北根据地》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《建立巩固的东北根据地》从当时的具体问题出发讨论群众路线，本卡从“一切军队，均须有确定的地区和任务，才能迅速和人民结合起来，建立巩固的根据地”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《建立巩固的东北根据地》中的理由和限制一起理解。
