revision: 3
status: published
quote: 务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在中国共产党第七届中央委员会第二次全体会议上的报告
  authoredAt: '1949-03-05'
themes:
- 作风
interpretation:
  inspiration: '成绩好的时候，人最容易把顺利当成理所当然。庆祝之后，留一点时间看看没被听见的意见、正在增加的成本和下一段新功课。克制不是扫兴，是让好状态更耐久。'
  explanation: '“两个务必”是在全国胜利即将到来时，对全党作风提出的提醒：继续谦虚谨慎、戒骄戒躁，继续保持艰苦奋斗。1949年七届二中全会讨论从革命战争转向城市管理和国家建设，环境将从艰苦斗争变为执掌全国政权。毛泽东担心胜利、赞扬和较优越的生活条件使干部骄傲、享乐，甚至经不起“糖衣炮弹”。这段话不是一般的个人修养格言，而是对一个即将执政的政党能否保持同人民联系、承担新任务的政治警告。'
historicalEvent: 1949年3月5日，中共七届二中全会在西柏坡召开。
background: 全国胜利前夕，毛泽东在西柏坡讨论工作重心转移、城市建设以及胜利后的风险和任务。 此卡所选名句着重表现胜利临近时更要防止骄傲、急躁和脱离艰苦奋斗。
story: 《在中国共产党第七届中央委员会第二次全体会议上的报告》围绕从革命胜利转向国家建设逐层展开。这句话把胜利临近时更要防止骄傲、急躁和脱离艰苦奋斗凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
