quote: 务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在中国共产党第七届中央委员会第二次全体会议上的报告
  authoredAt: '1949-03-05'
themes:
- 作风
interpretation:
  inspiration: 阶段性成功后主动检查盲点、成本和下一阶段风险，让克制成为持续能力。
  explanation: 原文出自《在中国共产党第七届中央委员会第二次全体会议上的报告》，围绕从革命胜利转向国家建设展开。这句话强调胜利临近时更要防止骄傲、急躁和脱离艰苦奋斗。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1949年3月5日，中共七届二中全会在西柏坡召开。
background: 全国胜利前夕，毛泽东在西柏坡讨论工作重心转移、城市建设以及胜利后的风险和任务。 此卡所选名句着重表现胜利临近时更要防止骄傲、急躁和脱离艰苦奋斗。
story: 《在中国共产党第七届中央委员会第二次全体会议上的报告》围绕从革命胜利转向国家建设逐层展开。这句话把胜利临近时更要防止骄傲、急躁和脱离艰苦奋斗凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
