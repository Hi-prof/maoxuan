revision: 3
status: published
quote: 把群众力量组织起来，这是一种方针。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 组织起来
  authoredAt: '1943-11-29'
themes:
- 组织
interpretation:
  inspiration: '大家都肯出力，事情仍可能散成许多孤单的忙碌。把谁擅长什么、哪些工具能共用、哪里可以互相搭把手理清楚，个人力气就会接在一起。'
  explanation: '“把群众力量组织起来”在《组织起来》中主要指通过互助组、合作社等形式，把分散的家庭生产和个人积极性连接起来。1943年，陕甘宁边区在战争与封锁中开展大生产，既缺物资，也需要提高劳动效率。毛泽东在劳动英雄大会上强调，不只依靠少数模范个人，还要让群众自愿合作、互相帮助，使有限的人力、畜力和工具发挥更大作用。组织不是简单把人集中起来，而是建立能够持续协作、共同受益的生产关系。'
historicalEvent: 1943年11月29日，毛泽东在陕甘宁边区劳动英雄大会上讲话。
background: 抗日根据地开展大生产运动，毛泽东强调通过合作组织把分散的群众力量和生产积极性结合起来。 此卡所选名句着重表现分散的积极性需要通过适当组织转化为持续力量。
story: 《组织起来》围绕组织群众和发挥集体创造力逐层展开。这句话把分散的积极性需要通过适当组织转化为持续力量凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
