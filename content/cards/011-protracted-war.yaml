revision: 3
status: published
quote: '战争的伟力之最深厚的根源，存在于民众之中。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: '1938-05'
themes:
  - 群众
  - 抗战
interpretation:
  inspiration: '需要很多人长期参与的事情，不能只靠少数骨干硬撑。让参与者知道为什么做、自己能做什么，也能把困难和意见说回来。人多并不自动等于力量，只有目标被理解、分工真正运转、彼此愿意承担，人数才会变成稳定的协作。组织人的同时，也要尊重人的感受和实际需要。'
  explanation: '这句话把抗战能够长期坚持并取得胜利的深层力量放在民众之中。兵力和装备当然重要，但如果广大人民处于分散、无组织的状态，战争就缺少持续的兵员补充、情报、生产和政治支持。引文所在的“兵民是胜利之本”一节，因此把政治动员、军民关系和尊重人民放在一起讨论。这里的“民众”不是一个抽象数字，也不是等待命令的被动资源。只有让人们理解战争同自身生活的关系，通过实际组织参与生产、运输、情报和作战，并在过程中形成共同承担，分散的人力才会成为可以持续的力量。文章反对亡国论和速胜论，这一判断也服务于“为什么能够持久、靠什么争取胜利”的整体论证。'
historicalEvent: '1938年5月，抗战进入艰难阶段，毛泽东在延安连续讲演，系统说明持久抗战的依据和方法。'
background: '一九三八年，抗日战争正处在艰难阶段。毛泽东在延安连续讲演，反驳亡国论和速胜论，分析战争为何持久以及怎样争取最后胜利。'
story: '引文位于“兵民是胜利之本”一节。文章随后把政治动员、军民关系和尊重人民视为长期战争能否坚持的重要条件。'
