id: 7b04fd69-61b8-56fb-9628-6ad95105b99b
revision: 3
status: published
quote: 工业无产阶级是我们革命的领导力量。一切半无产阶级、小资产阶级，是我们最接近的朋友。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国社会各阶级的分析
  authoredAt: '1925-12-01'
themes:
- 团结
interpretation:
  inspiration: '合作不必从“大家完全一样”开始。先看看彼此最关心什么、能一起做到哪一步，关系反而更稳。把差异说清楚，有时比急着营造一团和气更轻松。'
  explanation: '这段话是在给当时的革命力量排出层次：工人阶级被视为领导力量，半无产阶级和小资产阶级则是最接近、可以联合的力量。第一次国共合作时期，各种政治主张交错，文章试图通过经济地位和现实利益判断不同阶级可能采取的态度。它不是按个人品格给人分好坏，而是在回答革命由谁推动、能同谁合作。重点在于，广泛联合要建立在对各方处境和力量关系的具体认识上。'
historicalEvent: 1925年12月1日，毛泽东写成《中国社会各阶级的分析》。
background: 第一次国共合作时期，毛泽东分析中国各阶级的经济地位和政治态度，回答革命应依靠谁、团结谁和反对谁。 此卡所选名句着重表现分析力量结构是组织广泛合作的前提。
story: 《中国社会各阶级的分析》围绕辨明社会力量与革命同盟逐层展开。这句话把分析力量结构是组织广泛合作的前提凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
