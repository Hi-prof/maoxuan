revision: 3
status: published
quote: 我们要的是马克思列宁主义的学风。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 整顿党的作风
  authoredAt: '1942-02-01'
themes:
- 学风
interpretation:
  inspiration: '学过多少术语不太容易看出，能不能把眼前问题说清楚却很诚实。遇到现实不配合理论时，愿意回头检查理解，比把概念说得更响更接近学习。'
  explanation: '“马克思列宁主义的学风”不是指会背多少经典词句，而是以理论研究实际、实事求是，并让认识接受实践检验。1942年延安整风开始时，党内既有把外国经验和书本结论机械搬来的主观主义，也有不善于总结的经验主义。毛泽东在中央党校演说中把整顿学风放在首位，因为错误的学习方法会继续影响路线、组织关系和表达方式。他要的是理论与中国革命实际相结合的学习，而不是用理论装饰文章和身份。'
historicalEvent: 1942年2月1日，毛泽东在中央党校开学典礼上演说。
background: 延安整风运动中，毛泽东分析主观主义、宗派主义和党八股的危害，提出整顿学风、党风和文风。 此卡所选名句着重表现整风首先要求形成理论联系实际、实事求是的学风。
story: 《整顿党的作风》围绕整风、学风和组织作风逐层展开。这句话把整风首先要求形成理论联系实际、实事求是的学风凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
