interpretation:
  inspiration: 把认识放回行动中验证：先做可观察的一步，再根据结果修正原先的判断。
  explanation: 这句出自《政治经济学批判》序言，可从“历史唯物主义”角度理解。历史分析要回到人们怎样生活、生产和组织社会的具体条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
