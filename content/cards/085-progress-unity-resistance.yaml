id: bdb77d70-53cd-5860-8243-3773e671789b
revision: 3
status: published
quote: 只有进步才能团结，只有团结才能抗日，只有进步、团结、抗日才能统一。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 团结一切抗日力量，反对反共顽固派
  authoredAt: '1940-02-01'
themes:
- 团结
interpretation:
  inspiration: '关系要稳，不能只反复说“大家要团结”。一起解决一个真实问题，让每个人看见一点进展，共同感往往就长出来了。团结更像结果，也需要每天有内容。'
  explanation: '这段排比把进步、团结、抗日和统一连成一条因果链。1940年统一战线面临反共摩擦，毛泽东认为，若压制进步力量、破坏民主，表面的团结无法维持；只有推动进步，才能扩大真实团结，形成有效抗战，进而维护国家统一。因此“团结”不是不谈原则、维持形式上的和气，而要以抗日和进步的实际行动为基础。这是对当时政治局势的主张，核心在于共同关系需要具体内容支撑，而不能只剩名义。'
historicalEvent: 1940年2月1日，毛泽东在延安民众大会上演说。
background: 抗日统一战线面临反共摩擦，毛泽东在延安会议上强调团结抗日力量并反对分裂倒退。 此卡所选名句着重表现进步、团结和抗日被说明为相互支撑的关系。
story: 《团结一切抗日力量，反对反共顽固派》围绕抗日力量的团结与反分裂逐层展开。这句话把进步、团结和抗日被说明为相互支撑的关系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
