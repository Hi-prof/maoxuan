revision: 3
status: published
quote: 我们不但善于破坏一个旧世界，我们还将善于建设一个新世界。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在中国共产党第七届中央委员会第二次全体会议上的报告
  authoredAt: '1949-03-05'
themes:
- 建设
interpretation:
  inspiration: '指出旧办法哪里不好只是第一步。接着试着画出替代方案：日常怎样运转，谁来维护，出了问题怎么办。建设常没有批评那么痛快，却更考验耐心和本事。'
  explanation: '这句话说，共产党不仅能够推翻旧政权，还将有能力管理城市、发展生产、建设新的国家。1949年三大战役结束，全国胜利在即，七届二中全会讨论工作重心从乡村转向城市，以及经济恢复、国家治理等新任务。长期革命战争培养的是“破坏旧世界”的能力，执政后却要学习许多不熟悉的建设工作。毛泽东用这句话表达信心，也提出新的考验：胜利不是终点，能否建立稳定制度、改善生产和生活，才决定“新世界”是否真正站得住。'
historicalEvent: 1949年3月5日，中共七届二中全会在西柏坡召开。
background: 全国胜利前夕，毛泽东在西柏坡讨论工作重心转移、城市建设以及胜利后的风险和任务。 此卡所选名句着重表现全国胜利前夕，工作重心开始从破坏旧秩序转向建设新国家。
story: 《在中国共产党第七届中央委员会第二次全体会议上的报告》围绕从革命胜利转向国家建设逐层展开。这句话把全国胜利前夕，工作重心开始从破坏旧秩序转向建设新国家凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
