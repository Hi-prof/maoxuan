id: 9e91e6e3-8764-5d65-824a-d7d610683de3
revision: 4
status: published
quote: '同志们，真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
  - 群众路线
  - 工作方法
interpretation:
  inspiration: '需要大家长期参与的事情，不能只靠一遍遍喊口号、压任务。先看看参与者有哪些现实困难，承诺过的帮助有没有落实。吃饭、住房、健康和工作方法这些“小事”，往往直接决定人们愿不愿意继续相信和投入。真正稳固的支持，是在一次次解决具体问题中积累起来的。'
  explanation: '文中的“铜墙铁壁”不是指真正的工事，而是比喻群众真心实意形成的支持。这样的力量不能靠命令临时征集，也不能只靠宏大目标感召。文章把战争动员同穿衣、吃饭、住房、疾病和卫生等日常问题放在一起，说明关心群众生活本身就是组织工作。群众在实际困难中得到回应，才更可能理解共同目标并愿意参与。文章还批评只会提出任务、不管实现方法的工作作风，用“过河要有桥或船”说明目标之后必须有办法。汀州市与长冈乡、才溪乡的对比也表明，信任来自具体工作，不来自口头上的关心。群众支持因此既是立场问题，也是长期积累的工作结果。'
historicalEvent: '1934年1月27日，毛泽东在第二次全国工农兵代表大会上作结论，讨论群众生活和工作方法。'
background: '文章是第二次全国工农兵代表大会上的结论之一，讨论如何把战争动员同群众的穿衣、吃饭、住房、疾病卫生等实际生活问题联系起来。'
story: '文中对比只会下任务的汀州市和重视群众生活的长冈乡、才溪乡。后半篇又用“过河要有桥或船”说明提出任务之后还必须解决方法。'
