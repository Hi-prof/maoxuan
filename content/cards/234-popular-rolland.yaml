status: published
quote: 每个人的生活经验都是由自己去体会的。如果你有勇气，一切都会顺利。
literature:
  series: 名人名言
  volume: 罗曼·罗兰
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1915'
themes:
- 勇气
interpretation:
  inspiration: 把这句话当作一次提醒：认真生活，也认真分辨什么值得长期投入。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“勇气”压缩成简洁表达。勇气不等于莽撞，而是在不确定中仍能承担选择和后果。
historicalEvent: 第一次世界大战前后，欧洲知识界围绕战争、和平与人的尊严展开激烈讨论。
background: 罗曼·罗兰以文学和公共写作关注英雄主义、良知、和平与普通人的精神力量。
story: 此卡按可追溯出处筛选自罗曼·罗兰语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
