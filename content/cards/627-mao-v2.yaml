revision: 3
status: published
quote: 故目前全国人民的紧急任务，在于以最大的警惕性，注视事变的发展，准备着对付任何黑暗的反动局面，绝对不能粗心大意。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 为皖南事变发表的命令和谈话
  authoredAt: '1941-01-20'
themes:
- 群众路线
interpretation:
  inspiration: '局面刚受过一次严重冲击时，警惕不是让自己一直紧绷。把可能的变化列出来，留意可靠信号，也准备几个应对步骤，未知就会从一团恐惧变成可以观察的事。'
  explanation: '这句话出现在皖南事变之后。1941年1月，新四军军部及所属部队在奉命北移途中遭国民党军围攻，损失严重，统一战线面临新的反共高潮。毛泽东判断事变不是孤立摩擦，要求全国人民密切观察国民党后续行动，防备抗战、团结和进步局面进一步倒退。“任何黑暗的反动局面”指扩大内战和政治压迫的危险。这里的警惕建立在刚发生的重大政治军事事件上，目的是争取制止倒退，不是鼓励无根据的日常猜疑。'
historicalEvent: 1941年1月20日，《为皖南事变发表的命令和谈话》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《为皖南事变发表的命令和谈话》从当时的具体问题出发讨论群众路线，本卡从“故目前全国人民的紧急任务”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《为皖南事变发表的命令和谈话》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
