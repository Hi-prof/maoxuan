id: 3ff480cc-8520-4eaa-b3a5-009ed1c8d994
revision: 1
status: published
quote: 故目前全国人民的紧急任务，在于以最大的警惕性，注视事变的发展，准备着对付任何黑暗的反动局面，绝对不能粗心大意。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 为皖南事变发表的命令和谈话
  authoredAt: '1941-01-20'
themes:
- 群众路线
interpretation:
  inspiration: 可以把“故目前全国人民的紧急任务”转成一个工作问题：怎样把当事人的处境和实际需要放进决策？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《为皖南事变发表的命令和谈话》中，这句话服务于对群众路线问题的分析。它把“故目前全国人民的紧急任务”同实际任务联系起来，要求把当事人的处境和实际需要放进决策。它的现实启发主要是一种工作方法；尊重群众不等于放弃分析和责任边界，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1941年1月20日，《为皖南事变发表的命令和谈话》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《为皖南事变发表的命令和谈话》从当时的具体问题出发讨论群众路线，本卡从“故目前全国人民的紧急任务”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《为皖南事变发表的命令和谈话》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
