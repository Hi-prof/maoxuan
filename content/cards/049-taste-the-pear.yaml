quote: 你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 实践
interpretation:
  inspiration: '想知道一种方法合不合手，读十篇介绍后也要亲自试一次。可以从很小的真实任务开始，让手上的卡顿、意外和成果告诉你，哪些理解还只停在纸面。'
  explanation: '这句话用吃梨作比：要真正知道梨的滋味，不能只观察或听别人描述，必须亲自改变它、接触它，也就是咬下去尝一尝。《实践论》借这个日常例子说明，人的认识来自参与实际过程，而不是站在事物之外凭空获得。文章写于1937年的延安，针对教条主义讨论认识与实践的关系。亲身经验很重要，但它并不排斥向别人学习；别人的知识也来自实践，自己还要在新的条件下继续检验。'
historicalEvent: 1937年7月，毛泽东在延安讲授认识与实践问题。
background: 为克服党内教条主义，毛泽东在延安从认识论角度说明实践、认识、真理标准和反复检验的关系。 此卡所选名句着重表现理解事物不能只靠旁观，必须进入实际过程取得经验。
story: 《实践论》围绕认识怎样从实践产生并接受检验逐层展开。这句话把理解事物不能只靠旁观，必须进入实际过程取得经验凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
