revision: 3
status: published
quote: 一切经过统一战线是不对的，应该是独立自主地去解决问题。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 统一战线中的独立自主问题
  authoredAt: '1938-11-05'
themes:
- 独立自主
interpretation:
  inspiration: '合作里有些事要一起商量，也有些事本来就该自己负责。把这两类分开，既能少一点等待和推诿，也不会把“配合”误解成事事都要同一步调。'
  explanation: '这句话反对把所有工作都交由统一战线共同决定。抗日合作有共同范围，但共产党仍需独立开展军队建设、群众动员和根据地工作，不能因为等待国民党同意而停下自己的责任。1938年，毛泽东用“一切经过统一战线”的说法批评党内对国民党过度迁就、放弃独立性的倾向。“独立自主解决问题”也不是拒绝合作，而是在共同抗日目标下划清各方职责：该协商的协商，该自行承担的不能推给合作关系。'
historicalEvent: 1938年11月5日，毛泽东在中共六届六中全会上作结论。
background: 抗日民族统一战线发展中，毛泽东说明合作与独立自主必须同时坚持，反对取消自身原则。 此卡所选名句着重表现统一战线有共同范围，但并不取消各方独立负责的工作。
story: 《统一战线中的独立自主问题》围绕合作中的原则和独立判断逐层展开。这句话把统一战线有共同范围，但并不取消各方独立负责的工作凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
