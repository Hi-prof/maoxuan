revision: 1
status: published
quote: 我们要承认困难，分析困难，向困难作斗争。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于重庆谈判
  authoredAt: '1945-10-17'
themes:
- 困难
interpretation:
  inspiration: 先停止回避，再拆清原因和约束，最后选择可执行动作，避免只在情绪里反复。
  explanation: 原文出自《关于重庆谈判》，围绕困难、曲折和主动工作展开。这句话强调面对困难要经历承认、分析和行动三个相连步骤。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1945年10月17日，毛泽东在延安干部会上报告重庆谈判情况。
background: 重庆谈判结束后，毛泽东分析和平协议、国内形势和工作中的困难，提醒全党准备走曲折道路。 此卡所选名句着重表现面对困难要经历承认、分析和行动三个相连步骤。
story: 《关于重庆谈判》围绕困难、曲折和主动工作逐层展开。这句话把面对困难要经历承认、分析和行动三个相连步骤凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
