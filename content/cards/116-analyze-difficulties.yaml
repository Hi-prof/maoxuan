revision: 3
status: published
quote: 我们要承认困难，分析困难，向困难作斗争。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于重庆谈判
  authoredAt: '1945-10-17'
themes:
- 困难
interpretation:
  inspiration: '困难模糊成一团时最让人累。先承认“确实有事”，再把原因、限制和能动的部分分开，最后只选一个动作。问题未必立刻消失，心里会先多一点秩序。'
  explanation: '这句话给面对困难排出三个连续动作：不粉饰地承认困难，具体分析困难从何而来，再采取行动克服它。重庆谈判结束后，和平协议已经签订，但国内局势仍不稳定，协议落实要经过复杂斗争。毛泽东既反对因前途光明就轻视障碍，也反对看到曲折便悲观失望。承认让判断从事实出发，分析避免盲目硬冲，斗争则防止认识停在纸上。三者缺一，乐观可能变空话，困难也可能只剩压人的情绪。'
historicalEvent: 1945年10月17日，毛泽东在延安干部会上报告重庆谈判情况。
background: 重庆谈判结束后，毛泽东分析和平协议、国内形势和工作中的困难，提醒全党准备走曲折道路。 此卡所选名句着重表现面对困难要经历承认、分析和行动三个相连步骤。
story: 《关于重庆谈判》围绕困难、曲折和主动工作逐层展开。这句话把面对困难要经历承认、分析和行动三个相连步骤凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
