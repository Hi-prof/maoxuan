revision: 3
status: published
quote: 各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 迎接中国革命的新高潮
  authoredAt: '1947-02-01'
themes:
- 经济建设
interpretation:
  inspiration: 手头紧的时候，只盯着怎么分配现有的钱，容易越算越窄。先想办法让收入和产出恢复，再把开支收住，财务安排才有可以周转的空间。
  explanation: 这句话是说，解放区的财政不能只靠征收和调配，要以发展生产、节约开支作为基础，并按长期需要来安排。1947年初，文章判断解放战争将进入新的发展阶段，同时列出土地、生产等任务。引文后面紧接三个原则：发展生产、保障供给；军民兼顾、公私兼顾；统一领导、分散经营，所针对的是忽视工农业、只抓财政商业的偏向。这是战时解放区的财政经济方针。
historicalEvent: 1947年2月1日，《迎接中国革命的新高潮》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《迎接中国革命的新高潮》从当时的具体问题出发讨论经济建设，本卡从“各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《迎接中国革命的新高潮》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
