revision: 2
status: published
quote: 各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 迎接中国革命的新高潮
  authoredAt: '1947-02-01'
themes:
- 经济建设
interpretation:
  inspiration: 可以把“各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题”转成一个工作问题：怎样把资源、条件和长期效果一起核算？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《迎接中国革命的新高潮》中，这句话服务于对经济建设问题的分析。它把“各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题”同实际任务联系起来，要求把资源、条件和长期效果一起核算。它的现实启发主要是一种工作方法；建设目标必须落实为可执行的生产与组织安排，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1947年2月1日，《迎接中国革命的新高潮》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《迎接中国革命的新高潮》从当时的具体问题出发讨论经济建设，本卡从“各地必须作长期打算，努力生产，厉行节约，并在生产和节约的基础上，正确地解决财政问题”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《迎接中国革命的新高潮》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
