quote: 世上无难事，只要肯登攀。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 水调歌头·重上井冈山
  authoredAt: 1965-05
themes:
- 行动
interpretation:
  inspiration: 不要把它理解成忽视条件；先判断目标值得，再准备路径、能力和持续投入。
  explanation: 《水调歌头·重上井冈山》写到长期目标、登攀和克服困难时，用这句话说明以登攀概括克服困难需要的意志和行动。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1965年5月，毛泽东重上井冈山并写下这首词。
background: 毛泽东重上井冈山，回望早期斗争并写长期变化，以登攀比喻克服困难。 此卡所选名句着重表现以登攀概括克服困难需要的意志和行动。
story: 《水调歌头·重上井冈山》以景物、行动和历史联想组织诗意。这一句集中呈现以登攀概括克服困难需要的意志和行动，既有鲜明画面，也保留了作品写作时的现实背景。
