id: 10962920-79bb-4a09-90ad-9b63e519abab
revision: 2
status: published
quote: 一切努力集中于打击日本法西斯，这就是中国人民的任务。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 祝十月革命二十五周年
  authoredAt: '1942-11-06'
themes:
- 群众路线
interpretation:
  inspiration: “一切努力集中于打击日本法西斯”提示我们，遇到相似问题时先把当事人的处境和实际需要放进决策。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《祝十月革命二十五周年》，原文围绕群众路线的具体任务展开。“一切努力集中于打击日本法西斯”不是孤立口号，而是论证中的一个判断。它强调把当事人的处境和实际需要放进决策；理解时也要看到，尊重群众不等于放弃分析和责任边界。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1942年11月6日，《祝十月革命二十五周年》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《祝十月革命二十五周年》从当时的具体问题出发讨论群众路线，本卡从“一切努力集中于打击日本法西斯”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“一切努力集中于打击日本法西斯”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
