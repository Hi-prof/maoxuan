quote: 一切努力集中于打击日本法西斯，这就是中国人民的任务。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 祝十月革命二十五周年
  authoredAt: '1942-11-06'
themes:
- 群众路线
interpretation:
  inspiration: '真正紧迫的目标出现时，许多次要争论可以先放一放。集中不意味着其他问题永远不重要，只是有限的时间和精力需要一个清楚的去处。'
  explanation: '1942年世界反法西斯战争处在关键时期，毛泽东纪念十月革命二十五周年时说，中国人民当前的中心任务就是集中力量打败日本法西斯。苏联正在斯大林格勒抵抗德国进攻，中国也经历长期抗战；两者被放在国际反法西斯战线中理解。这句话要求国内各抗日力量减少内耗，把军事、政治和生产努力集中到民族解放战争上。它不是一般的“专注”格言，而是战时对主要敌人和中心任务的明确判断。'
historicalEvent: 1942年11月6日，《祝十月革命二十五周年》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《祝十月革命二十五周年》从当时的具体问题出发讨论群众路线，本卡从“一切努力集中于打击日本法西斯”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“一切努力集中于打击日本法西斯”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
