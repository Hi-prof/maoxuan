quote: 必须洗刷唯心精神，防止一切机会主义盲动主义错误出现，才能完成争取群众战胜敌人的任务。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: 1930-05
themes:
- 群众路线
interpretation:
  inspiration: '越想快点解决问题，越容易把愿望当事实。先去看看现场，听听不同声音，再决定该等、该试还是该停。多做一点调查，常能少付一点冲动的学费。'
  explanation: '这句话要求用实际调查克服主观想象，防止机会主义的动摇和盲动主义的冒进，才能争取群众、战胜敌人。1930年的《反对本本主义》针对红军工作中照抄书本和上级指示、不研究当地情况的作风。毛泽东所说的“唯心精神”，是让观念和愿望代替事实；由此既可能错过真实机会，也可能在条件不足时贸然行动。争取群众更不能靠自以为是，必须了解他们的处境和态度。调查在这里是纠正政治路线和行动节奏的基础。'
historicalEvent: 1930年5月，《反对本本主义》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《反对本本主义》从当时的具体问题出发讨论群众路线，本卡从“必须洗刷唯心精神，防止一切机会主义盲动主义错误出现，才能完成争取群众战胜敌人的任务”切入全文的一层论证。
story: 《反对本本主义》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
