quote: 凡是把理论引向神秘主义的神秘东西，都能在人的实践中以及对这个实践的理解中得到合理的解决。
literature:
  series: 马原思考
  volume: 卡尔·马克思
  workTitle: 《关于费尔巴哈的提纲》
  authoredAt: '1848'
themes:
- 实践
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《关于费尔巴哈的提纲》，可从“实践”角度理解。实践不是忙碌本身，而是让认识接受现实结果的检验。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
story: 此卡从《关于费尔巴哈的提纲》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
