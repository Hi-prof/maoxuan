status: published
quote: 一切机关学校部队，必须于战争条件下厉行种菜、养猪、打柴、烧炭、发展手工业和部分种粮。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 开展根据地的减租、生产和拥政爱民运动
  authoredAt: '1943-10-01'
themes:
- 经济建设
interpretation:
  inspiration: '资源紧张时，坐等别人补给会让焦虑越来越大。看看自己能生产、修复或共享什么，哪怕只解决一小部分需要，也会多一点自主。不过，自己动手最好同合理分工一起做。'
  explanation: '这句话要求抗日根据地的机关、学校和部队参加具体生产，从种菜养猪到打柴烧炭、发展手工业，以补充自身供给。1943年根据地受日军进攻、国民党封锁和灾荒影响，财政物资困难，也不能把军政人员的全部生活负担继续压给农民。毛泽东把机关部队生产同减租、拥政爱民并列，是要减轻群众负担、改善军民关系，并保障长期抗战。列举这些日常劳动，正说明生产运动不是口号，而要落到可检查的物资成果。'
historicalEvent: 1943年10月1日，《开展根据地的减租、生产和拥政爱民运动》形成，集中讨论经济建设及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《开展根据地的减租、生产和拥政爱民运动》从当时的具体问题出发讨论经济建设，本卡从“一切机关学校部队，必须于战争条件下厉行种菜、养猪、打柴、烧炭、发展手工业和部分种粮”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《开展根据地的减租、生产和拥政爱民运动》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
