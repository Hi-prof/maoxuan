id: 4631bc4b-c964-5d09-8cea-758a723ac48c
revision: 2
status: published
quote: 事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 反对自由主义
  authoredAt: '1937-09-07'
themes:
- 责任
interpretation:
  inspiration: 发现影响共同目标的问题，要选择合适方式及时提出，并承担推动解决的一部分责任。
  explanation: 这句话来自《反对自由主义》，原文关注原则、责任和组织团结，核心是以自保为先会让明知存在的问题持续累积。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1937年9月7日，毛泽东写成《反对自由主义》。
background: 全面抗战开始后，毛泽东列举组织生活中的自由主义表现，强调原则、团结和思想斗争。 此卡所选名句着重表现以自保为先会让明知存在的问题持续累积。
story: 《反对自由主义》围绕原则、责任和组织团结逐层展开。这句话把以自保为先会让明知存在的问题持续累积凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
