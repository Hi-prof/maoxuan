revision: 3
status: published
quote: 事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 反对自由主义
  authoredAt: '1937-09-07'
themes:
- 责任
interpretation:
  inspiration: '看见小问题时，温和地说一句，往往比等它变大后集中爆发轻松。表达不必尖锐，也不用替所有事情负责；把自己确实知道的部分讲清楚，就已经减少了一点含糊。'
  explanation: '这几句话描写的是一种自保姿态：事情没有直接落到自己身上就不管，明知不对也少开口，只求个人不出差错。1937年全面抗战开始后，毛泽东在《反对自由主义》中列举党内组织生活的多种问题，认为这种态度会让错误得不到纠正，也会损害真正的团结。文章所说的“事不关己”针对共同事业中的责任，不是要求个人对所有事情无边界介入；关键是不能一面看见共同问题，一面只为省事而假装没有看见。'
historicalEvent: 1937年9月7日，毛泽东写成《反对自由主义》。
background: 全面抗战开始后，毛泽东列举组织生活中的自由主义表现，强调原则、团结和思想斗争。 此卡所选名句着重表现以自保为先会让明知存在的问题持续累积。
story: 《反对自由主义》围绕原则、责任和组织团结逐层展开。这句话把以自保为先会让明知存在的问题持续累积凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
