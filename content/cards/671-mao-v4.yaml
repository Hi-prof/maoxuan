revision: 3
status: published
quote: 中国的领土主权，中国人民必须保卫，绝对不允许外国政府来侵犯。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中国人民解放军总部发言人为英国军舰暴行发表的声明
  authoredAt: '1949-03-30'
themes:
- 群众路线
interpretation:
  inspiration: '边界不只属于个人关系，也属于国家历史。理解这句话，重要的是看见近代中国长期遭受外国武装干涉后，对独立和主权的坚持，而不是勉强把它变成日常技巧。'
  explanation: '这句话针对英国军舰未经允许进入长江、介入渡江战役并造成双方伤亡的事件，声明中国领土和主权应由中国人民保卫，外国政府无权以军舰干涉中国内战。1949年人民解放军即将渡江，英国仍沿用近代以来在华特权和炮舰活动方式。中共发言人的声明把具体冲突放进中国争取民族独立的历史中：新政权不会继续接受外国武装在中国领土上自由行动。这是国家主权立场，不是一般的群众路线或个人边界比喻。'
historicalEvent: 1949年3月30日，《中国人民解放军总部发言人为英国军舰暴行发表的声明》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中国人民解放军总部发言人为英国军舰暴行发表的声明》从当时的具体问题出发讨论群众路线，本卡从“中国的领土主权，中国人民必须保卫，绝对不允许外国政府来侵犯”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《中国人民解放军总部发言人为英国军舰暴行发表的声明》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
