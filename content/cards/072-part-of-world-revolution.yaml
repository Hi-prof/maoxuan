quote: 中国革命是世界革命的一部分。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 世界视野
interpretation:
  inspiration: '眼前的问题看似只发生在本地，背后也许连着更大的技术、市场或时代变化。把镜头拉远一点，再拉回自己的具体处境，常能同时避开封闭和空泛。'
  explanation: '“中国革命是世界革命的一部分”是把中国的反帝反封建斗争放进十月革命以后形成的世界格局中理解。《新民主主义论》认为，中国革命虽仍有资产阶级民主革命的任务，却已不再属于旧式的、由资产阶级领导的世界革命，而同世界无产阶级和被压迫民族的解放运动相联系。这一判断说明中国革命会受国际力量影响，也会影响世界反帝斗争。它并非要用国际结论替代中国实际，文章恰恰同时强调从中国社会性质出发确定道路。'
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现中国革命被放在世界历史联系中理解，而不是孤立事件。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把中国革命被放在世界历史联系中理解，而不是孤立事件凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
