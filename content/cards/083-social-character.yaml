quote: 中国现时的社会，是一个殖民地、半殖民地、半封建性质的社会。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国革命和中国共产党
  authoredAt: 1939-12
themes:
- 国情
interpretation:
  inspiration: '历史概念都有日期。读到一个有力判断时，先看看它描述的是哪一年的制度与生活，再问后来发生了什么。这样既尊重原意，也不会拿旧标签替今天省掉调查。'
  explanation: '这句话是对1930年代中国社会性质的概括。“殖民地、半殖民地”指帝国主义直接占领部分领土并控制中国的重要政治经济命脉；“半封建”指封建土地关系仍占重要地位，同时已有资本主义发展。《中国革命和中国共产党》以此判断来说明，当时革命首先要反对帝国主义和封建主义，性质是新民主主义革命。它是一项服务于特定革命任务的历史分析，不是对中国社会的永久标签；理解时必须放回近代中国的主权、经济和土地关系中。'
historicalEvent: 1939年冬，毛泽东参与编写《中国革命和中国共产党》。
background: 为干部教育需要，毛泽东等系统说明中国社会性质、革命对象、动力、性质和前途。 此卡所选名句着重表现文章从当时中国社会性质出发界定革命对象和任务。
story: 《中国革命和中国共产党》围绕从国情出发认识革命问题逐层展开。这句话把文章从当时中国社会性质出发界定革命对象和任务凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
