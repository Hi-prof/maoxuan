id: 25e9fd23-d07e-5a81-a24b-0144772e2c1c
revision: 3
status: published
quote: 革命的或不革命的或反革命的知识分子的最后的分界，看其是否愿意并且实行和工农民众相结合。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 青年运动的方向
  authoredAt: '1939-05-04'
themes:
- 实践方向
interpretation:
  inspiration: '知识待在熟悉的圈子里，很容易越说越完整，离真实生活却越来越远。偶尔走进使用者和一线劳动者的环境，让原来的问题被现实改写，专业会多一点温度。'
  explanation: '这句话把知识分子是否真正站在革命一边，放到实际行动中检验：不是看口头表态，而是看他愿不愿意、有没有真正同工农群众相结合。五四运动二十周年时，许多青年知识分子来到延安或投身抗战，毛泽东一方面肯定他们的重要作用，另一方面强调要走出原有的小圈子，理解中国人数最多的劳动群众。这里的“分界”属于当时革命阵营的政治判断。今天阅读，更适合把握知识与社会实践相连的要求，不宜照搬这种政治分类给个人贴标签。'
historicalEvent: 1939年5月4日，毛泽东在延安青年群众纪念五四运动大会上讲演。
background: 五四运动二十周年纪念会上，毛泽东讨论青年运动的方向以及知识分子同工农群众结合的标准。 此卡所选名句着重表现知识分子的立场要通过同工农群众结合的实际行动检验。
story: 《青年运动的方向》围绕青年力量和实践方向逐层展开。这句话把知识分子的立场要通过同工农群众结合的实际行动检验凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
