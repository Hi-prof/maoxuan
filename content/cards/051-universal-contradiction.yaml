id: 73616916-625e-5df6-9650-44acc05e4d39
revision: 1
status: published
quote: 矛盾是普遍的、绝对的，存在于事物发展的一切过程中，又贯串于一切过程的始终。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 矛盾分析
interpretation:
  inspiration: 面对冲突先识别双方条件和阶段变化，再解决主要问题，不必追求虚假的零矛盾。
  explanation: 这句话来自《矛盾论》，原文关注用矛盾分析理解事物发展，核心是矛盾伴随过程发展，不能期待复杂事务进入完全无冲突状态。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现矛盾伴随过程发展，不能期待复杂事务进入完全无冲突状态。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把矛盾伴随过程发展，不能期待复杂事务进入完全无冲突状态凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
