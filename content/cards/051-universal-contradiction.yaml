revision: 3
status: published
quote: 矛盾是普遍的、绝对的，存在于事物发展的一切过程中，又贯串于一切过程的始终。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 矛盾分析
interpretation:
  inspiration: '计划推进时出现拉扯，不一定说明事情做坏了。速度和质量、眼前和长远，本来就可能同时提要求。先辨认哪一组矛盾最要紧，比追求一个“从此再无冲突”的状态实际。'
  explanation: '这句话说的是，事物内部相互联系又相互冲突的因素始终存在，并推动着事物变化；矛盾不是发展中偶然冒出的故障。《矛盾论》写于1937年的延安，毛泽东借辩证法讨论怎样认识中国革命中的复杂问题，并反对用固定答案套一切情况。说矛盾普遍，并不等于所有矛盾都一样尖锐、都要用同一种方式处理。文章随后强调矛盾的特殊性，正是要求在承认冲突存在之后，继续分析它具体是什么。'
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现矛盾伴随过程发展，不能期待复杂事务进入完全无冲突状态。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把矛盾伴随过程发展，不能期待复杂事务进入完全无冲突状态凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
