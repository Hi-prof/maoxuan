revision: 3
status: published
quote: 战争的目的不是别的，就是“保存自己，消灭敌人”。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: 1936-12
themes:
- 战略
interpretation:
  inspiration: '解决难题时，结果重要，自己的精力和长期能力也重要。若一种办法赢了眼前却让后面无力继续，它可能并不划算。先守住基本盘，再挑真正需要解决的关键处。'
  explanation: '这句话把战争目的概括为相互联系的两面：保存己方力量，同时消灭敌方力量。1936年，毛泽东总结红军在强敌面前进行战略防御的经验，强调保存自己不是消极避战，消灭敌人也不能靠不计代价的硬拼。只有保住有生力量，才可能继续作战；只有削弱对方，保存才有实际意义。这是军事语境中的严格表述，日常阅读可以理解其中对目标与代价的权衡，但不宜把人际分歧都想象成敌我斗争。'
historicalEvent: 1936年12月，毛泽东在陕北红军大学讲授革命战争战略问题。
background: 毛泽东总结土地革命战争经验，系统讨论战争规律、主动权、集中兵力和战略防御。 此卡所选名句着重表现行动设计要同时考虑保存有效力量和达成核心目的。
story: 《中国革命战争的战略问题》围绕战略判断、主动权和力量配置逐层展开。这句话把行动设计要同时考虑保存有效力量和达成核心目的凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
