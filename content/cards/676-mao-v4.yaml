revision: 3
status: published
quote: 苦难的中国人民必须求得解放，并且他们坚信是能够求得解放的。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 全世界革命力量团结起来，反对帝国主义的侵略
  authoredAt: 1948-11
themes:
- 群众路线
interpretation:
  inspiration: '一个群体长期受苦时，改变不是外人替它宣布，而要由当事人形成自己的力量。相信“能够”，不是轻看代价，而是不把苦难误当成永远不能改变的命运。'
  explanation: '这句话表达中国人民摆脱帝国主义侵略和国内反动统治的必要与信心。1948年解放战争已发生战略转折，毛泽东在纪念十月革命的文章中把中国革命同世界被压迫民族和人民反对帝国主义的力量相联系。他认为中国人民的苦难不是应当忍受的宿命，解放也不能依赖外国政府恩赐，而要靠自身斗争和国际革命力量相互支持。“必须”说的是历史和现实要求，“能够”则建立在中国人民力量增长与世界反帝运动发展的判断上。'
historicalEvent: 1948年11月，《全世界革命力量团结起来，反对帝国主义的侵略》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《全世界革命力量团结起来，反对帝国主义的侵略》从当时的具体问题出发讨论群众路线，本卡从“苦难的中国人民必须求得解放”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《全世界革命力量团结起来，反对帝国主义的侵略》中的理由和限制一起理解。
