quote: 群众齐心了，一切事情就好办了。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 对晋绥日报编辑人员的谈话
  authoredAt: '1948-04-02'
themes:
- 团结
interpretation:
  inspiration: '齐心不是所有人安静地点头。大家知道为什么做，能把疑问说出来，也看见自己的位置，共同行动才会省力。多花一点时间形成理解，常能少掉后面的拉扯。'
  explanation: '“群众齐心”是指广大群众理解共同任务，并把它转化为自己的行动，而不只是服从少数干部的命令。1948年土地改革等工作深入推进，毛泽东同《晋绥日报》编辑人员谈到，报纸要反映群众生活，准确解释党的政策，帮助群众形成共同认识。事情“好办”不是因为人数本身，而是政策经过讨论、宣传和实践，被群众真正掌握。新闻工作在这里也不是单向发布消息，而是连接领导政策与群众经验的一条渠道。'
historicalEvent: 1948年4月2日，毛泽东在兴县同晋绥日报编辑人员谈话。
background: 解放战争时期，毛泽东同晋绥日报编辑人员讨论报纸怎样反映群众、解释政策并推动实际工作。 此卡所选名句着重表现群众形成共同认识和行动后，工作才有广泛基础。
story: 《对晋绥日报编辑人员的谈话》围绕群众办报、政策传播和共同认识逐层展开。这句话把群众形成共同认识和行动后，工作才有广泛基础凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
