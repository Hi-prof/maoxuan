quote: 偉人對我毫無意義，我只欣賞自己理想中的明星。(一譯「甚麼？偉人？我看到的只是盡力實現自己理想的演員。」)
literature:
  series: 名人名言
  volume: 尼采
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1880'
themes:
- 理想
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 19世纪后期，欧洲哲学开始强烈反思传统道德、宗教与现代人的精神处境。
background: 尼采的著作常以格言式语言讨论创造、自由、价值判断与自我超越。
