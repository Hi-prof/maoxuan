revision: 3
status: published
quote: 自由主义取消思想斗争，主张无原则的和平，结果是腐朽庸俗的作风发生。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 反对自由主义
  authoredAt: '1937-09-07'
themes:
- 原则
interpretation:
  inspiration: '怕伤和气而一直不谈分歧，表面安静，心里的距离可能越来越远。找一个合适时机，只谈具体事情和真实感受，不急着给人下结论，反而更有机会把关系照顾好。'
  explanation: '这里的“无原则和平”是指为了表面和气，回避组织内部必要的批评和思想讨论。毛泽东认为，分歧被压住并不会消失，反而会让错误习惯和敷衍作风逐渐积累。《反对自由主义》写于1937年，面对的是党内需要在抗战环境中加强团结和纪律的问题。文章不是赞成无休止争吵，更不是把态度强硬当成原则；它强调的是以共同目标为基础，把真实问题摆出来讨论，团结才不只是彼此迁就的表面状态。'
historicalEvent: 1937年9月7日，毛泽东写成《反对自由主义》。
background: 全面抗战开始后，毛泽东列举组织生活中的自由主义表现，强调原则、团结和思想斗争。 此卡所选名句着重表现回避必要分歧只能换来表面和气，并不能形成真正团结。
story: 《反对自由主义》围绕原则、责任和组织团结逐层展开。这句话把回避必要分歧只能换来表面和气，并不能形成真正团结凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
