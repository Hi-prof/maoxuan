revision: 3
status: published
quote: 我们的文化是人民的文化，文化工作者必须有为人民服务的高度的热忱，必须联系群众，而不要脱离群众。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 文化工作中的统一战线
  authoredAt: '1944-10-30'
themes:
- 群众路线
interpretation:
  inspiration: '文化若真想走近人，就要肯听日常语言，也肯看普通生活。热情不是替别人发言，而是同他们保持来往，让作品在真实使用和反馈里慢慢改变。'
  explanation: '这句话把根据地文化规定为服务人民的文化，并要求文化工作者以热情联系群众、反对关在自己的小圈子里。1944年，陕甘宁边区文化教育工作已广泛展开，毛泽东在文教工作者会议上谈文化统一战线，既要团结各种文化力量，也要坚持人民方向。联系群众不只是选择群众题材，还包括了解他们的语言、生活和需要，让文化成果能被理解、使用。文艺工作者的专业性并未被取消，而要在同群众的双向关系中找到内容和检验。'
historicalEvent: 1944年10月30日，《文化工作中的统一战线》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《文化工作中的统一战线》从当时的具体问题出发讨论群众路线，本卡从“我们的文化是人民的文化”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《文化工作中的统一战线》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
