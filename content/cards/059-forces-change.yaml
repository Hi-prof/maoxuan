id: e2951e53-c36f-5898-8389-eb52975c73f6
revision: 1
status: published
quote: 战争是力量的竞赛，但力量在战争过程中变化其原来的形态。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 动态判断
interpretation:
  inspiration: 评估长期任务要持续更新资源、士气、学习和外部条件，不能用一次盘点替代动态判断。
  explanation: 这句话来自《论持久战》，原文关注持久抗战的阶段、力量与胜利条件，核心是力量不是开局时固定不变的数字，会在过程和关系中转化。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现力量不是开局时固定不变的数字，会在过程和关系中转化。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把力量不是开局时固定不变的数字，会在过程和关系中转化凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
