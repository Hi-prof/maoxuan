revision: 3
status: published
quote: 战争是力量的竞赛，但力量在战争过程中变化其原来的形态。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 动态判断
interpretation:
  inspiration: '起点会影响结果，却不一定提前写完结局。人在做事的过程中会学习，关系会重组，资源也会消耗或积累。与其只盯着最初差距，不如看看哪些变化正在悄悄发生。'
  explanation: '这句话说，战争固然是力量较量，但双方力量不是开战时固定不动的数字，会在交战过程中消长、转化。1938年中国在军力和经济上弱于日本，如果只比较当下，很容易得出必败结论。《论持久战》把国土、人口、战争性质、国际条件和长期动员都纳入分析，认为日本的优势会被消耗，中国的潜力可以逐步发挥。判断胜负因此不能只拍一张开局快照，还要分析什么因素会随时间增强或减弱。'
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现力量不是开局时固定不变的数字，会在过程和关系中转化。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把力量不是开局时固定不变的数字，会在过程和关系中转化凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
