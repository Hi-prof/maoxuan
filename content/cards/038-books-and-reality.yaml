quote: 马克思主义的“本本”是要学习的，但是必须同我国的实际情况相结合。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: 1930-05
themes:
- 理论联系实际
interpretation:
  inspiration: '书里的方法像地图，能帮人少走弯路，却不会替你看见脚下正在修路还是下雨。学完一个框架，拿手头的真实问题试一试；不合适的地方调整了，知识才真正成为自己的。'
  explanation: '这句话说得很直白：马克思主义理论当然要学，但不能照本宣科，必须同中国的具体情况结合。1930年前后，红军工作中存在不调查实际、机械执行书本和上级指示的倾向。《反对本本主义》因此把现场调查放到重要位置。毛泽东反对的不是读书和理论，而是把理论当成现成答案。理论提供观察和分析的方法，现实则决定问题究竟是什么；两者相遇，理论才可能转化为有效行动。'
historicalEvent: 1930年5月，毛泽东写成《反对本本主义》。
background: 毛泽东总结红军工作经验，批评离开实际调查、照搬书本和上级指示的作风。 此卡所选名句着重表现理论只有同具体条件结合才具有解释和行动价值。
story: 《反对本本主义》围绕调查研究与理论联系实际逐层展开。这句话把理论只有同具体条件结合才具有解释和行动价值凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
