revision: 3
status: published
quote: 游击战争基本的方针必须是进攻的；游击战争是防御战的一部分，然而它本身必须是进攻的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 抗日游击战争的战略问题
  authoredAt: 1938-05
themes:
- 战略主动
interpretation:
  inspiration: '整体处在守势时，也不代表每一步只能等待。找一个风险可控、能获得信息或空间的小动作，局面就会多一点选择。谨慎和主动，有时可以同时存在。'
  explanation: '这句话区分战争全局与游击作战本身：抗日战争在战略上处于防御阶段，游击战争是其中一部分；但一支游击队在具体行动中不能只是消极躲避，而要主动寻找机会进攻敌人的薄弱处。1938年，毛泽东论证游击战争具有战略作用，试图纠正把它看成零散小打小闹的认识。只有主动出击、发展根据地并调动群众，游击力量才能保存和成长。这里说的是特定军事层次之间并不矛盾，而非笼统推崇进攻。'
historicalEvent: 1938年5月，毛泽东系统论述抗日游击战争的战略作用。
background: 全面抗战初期，毛泽东论证游击战争不是零散战术，而是在持久抗战中具有战略地位。 此卡所选名句着重表现总体防御中的具体行动仍要争取主动和有效进攻。
story: 《抗日游击战争的战略问题》围绕游击战争的战略地位与主动性逐层展开。这句话把总体防御中的具体行动仍要争取主动和有效进攻凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
