revision: 3
status: published
quote: 只有党的政策和策略全部走上正轨，中国革命才有胜利的可能。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于情况的通报
  authoredAt: '1948-03-20'
themes:
- 政策
interpretation:
  inspiration: '一件大事很少只靠一个环节正确。主目标进展顺利时，也检查配套规则有没有伤到合作、生产或长期信任。局部的“赢”，不一定能抵消别处持续跑偏。'
  explanation: '这句话强调中国革命胜利不仅靠军事进攻，还要求土地改革、工商业、统一战线、城市工作等各项政策和策略都正确。1948年解放战争发展顺利，但一些地区土地改革出现过“左”的偏差，侵犯中农和工商业，整党、政权工作也需纠正。毛泽东在党内通报中要求完整执行中央政策，不能认为打了胜仗就可以忽视其他领域。群众基础、经济秩序和联合对象若因错误政策受损，军事成果也难以稳固。“全部走上正轨”说的是各方面相互配合。'
historicalEvent: 1948年3月20日，《关于情况的通报》形成，集中讨论政策及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于情况的通报》从当时的具体问题出发讨论政策，本卡从“只有党的政策和策略全部走上正轨”切入全文的一层论证。
story: 《关于情况的通报》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
