quote: 为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 目前形势和党的任务
  authoredAt: '1939-10-10'
themes:
- 群众路线
interpretation:
  inspiration: “为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《目前形势和党的任务》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1939年10月10日，《目前形势和党的任务》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《目前形势和党的任务》从当时的具体问题出发讨论群众路线，本卡从“为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《目前形势和党的任务》中的理由和限制一起理解。
