revision: 3
status: published
quote: 为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 目前形势和党的任务
  authoredAt: '1939-10-10'
themes:
- 群众路线
interpretation:
  inspiration: '想让一项长期行动站稳，只处理眼前威胁还不够，也要让参与者的生活确实变好。安全、权利和利益彼此连接时，人们才有理由一起守住成果。'
  explanation: '这句话把敌后抗战的军事任务同政治、经济改革放在一起：坚持游击战争，粉碎日军“扫荡”，同时在根据地实行有利于广大抗日民众的改革。1939年抗战进入相持阶段，敌后根据地既面对日军进攻，也要解决政权、土地、负担和群众生活问题。毛泽东认为，军事上打击占领力量只是一个方面；只有扩大民主、改善民生，使群众从根据地建设中获得实际利益，游击战争才有持续的人力和物质基础。战争与社会动员在这里不能分开。'
historicalEvent: 1939年10月10日，《目前形势和党的任务》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《目前形势和党的任务》从当时的具体问题出发讨论群众路线，本卡从“为达此目的，在敌后方，必须坚持游击战争，战胜敌人的“扫荡”，破坏敌人的占领地，实行激进的有利于广大抗日民众的政治改革和经济改革”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《目前形势和党的任务》中的理由和限制一起理解。
