quote: 和在时间上发展着的人类历史相反，自然界的历史被认为只是在空间中扩张。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《自然辩证法》导言
  authoredAt: '1878'
themes:
- 历史唯物主义
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《自然辩证法》导言，可从“历史唯物主义”角度理解。历史分析要回到人们怎样生活、生产和组织社会的具体条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《自然辩证法》导言的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
