status: published
quote: 所谓劳动人民，是指一切体力劳动者（如工人、农民、手工业者等）以及和体力劳动者相近的、不剥削人而又受人剥削的脑力劳动者。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于民族资产阶级和开明绅士问题
  authoredAt: '1948-03-01'
themes:
- 群众路线
interpretation:
  inspiration: 可以把“所谓劳动人民，是指一切体力劳动者（如工人、农民、手工业者等）以及和体力劳动者相近的、不剥削人而又受人剥削的脑力劳动者”转成一个工作问题：怎样把当事人的处境和实际需要放进决策？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《关于民族资产阶级和开明绅士问题》中，这句话服务于对群众路线问题的分析。它把“所谓劳动人民，是指一切体力劳动者（如工人、农民、手工业者等）以及和体力劳动者相近的、不剥削人而又受人剥削的脑力劳动者”同实际任务联系起来，要求把当事人的处境和实际需要放进决策。它的现实启发主要是一种工作方法；尊重群众不等于放弃分析和责任边界，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1948年3月1日，《关于民族资产阶级和开明绅士问题》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于民族资产阶级和开明绅士问题》从当时的具体问题出发讨论群众路线，本卡从“所谓劳动人民，是指一切体力劳动者（如工人、农民、手工业者等）以及和体力劳动者相近的、不剥削人而又受人剥削的脑力劳动者”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《关于民族资产阶级和开明绅士问题》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
