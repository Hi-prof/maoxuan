revision: 3
status: published
quote: 斗争是团结的手段，团结是斗争的目的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 目前抗日统一战线中的策略问题
  authoredAt: '1940-03-11'
themes:
- 团结
interpretation:
  inspiration: '有些话说出来会不舒服，却能让合作更诚实。判断一次争论值不值得，可以看它最终让问题更清楚、关系更可持续，还是只让某个人赢得痛快。'
  explanation: '这句话说明，在抗日统一战线内部，对破坏抗战和压制进步力量的行为进行斗争，并不是为了同一切合作者决裂，而是为了制止倒退、恢复有原则的合作。1940年，毛泽东总结同国民党顽固派打交道的策略，反对只讲团结而不敢斗争，也反对只顾斗争而忘记共同抗日。斗争是手段，限定了它的方向和分寸；团结是目的，说明最终要争取的是能够继续抗战的真实合作，而不是在冲突中证明谁更强硬。'
historicalEvent: 1940年3月11日，毛泽东在延安党的高级干部会议上作报告。
background: 抗日统一战线中的关系复杂，毛泽东总结发展进步势力、争取中间势力和反对顽固势力的策略。 此卡所选名句着重表现必要的原则斗争服务于形成真实而有基础的团结。
story: 《目前抗日统一战线中的策略问题》围绕统一战线中的自卫、斗争和团结逐层展开。这句话把必要的原则斗争服务于形成真实而有基础的团结凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
