id: ea083057-37d6-4c5e-a53b-f1ef668f4bbf
revision: 2
status: published
quote: 中国过去一切革命斗争成效甚少，其基本原因就是因为不能团结真正的朋友，以攻击真正的敌人。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国社会各阶级的分析
  authoredAt: '1925-12-01'
themes:
- 团结
interpretation:
  inspiration: “中国过去一切革命斗争成效甚少”提示我们，遇到相似问题时先围绕共同目标处理差异并形成协作。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《中国社会各阶级的分析》，原文围绕团结的具体任务展开。“中国过去一切革命斗争成效甚少”不是孤立口号，而是论证中的一个判断。它强调围绕共同目标处理差异并形成协作；理解时也要看到，团结需要原则、沟通和清楚的任务。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1925年12月1日，《中国社会各阶级的分析》形成，集中讨论团结及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国社会各阶级的分析》从当时的具体问题出发讨论团结，本卡从“中国过去一切革命斗争成效甚少”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“中国过去一切革命斗争成效甚少”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
