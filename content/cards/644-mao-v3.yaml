revision: 3
status: published
quote: 目前共产党人在全世界的任务是动员各国人民组织国际统一战线，为着反对法西斯而斗争，为着保卫苏联、保卫中国、保卫一切民族的自由和独立而斗争。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 关于反法西斯的国际统一战线
  authoredAt: '1941-06-23'
themes:
- 群众路线
interpretation:
  inspiration: '有些威胁跨过很多边界，单独守住自己的一角并不够。彼此立场不完全相同的人，也可能围绕最紧迫的共同风险合作。先找共同点，再保留各自差异。'
  explanation: '1941年6月22日，德国法西斯进攻苏联，第二次世界大战格局发生重大变化。次日，毛泽东提出各国共产党应推动建立最广泛的国际反法西斯统一战线，把保卫苏联、中国抗战和各民族自由独立联系起来。这一主张意味着，同法西斯侵略相比，原有国家、阶级和政治力量之间的一些分歧可以暂时居于次要位置，反法西斯力量需要联合行动。句子针对的是世界战争中的共同威胁，并不是取消不同国家和组织的独立目标。'
historicalEvent: 1941年6月23日，《关于反法西斯的国际统一战线》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《关于反法西斯的国际统一战线》从当时的具体问题出发讨论群众路线，本卡从“目前共产党人在全世界的任务是动员各国人民组织国际统一战线”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《关于反法西斯的国际统一战线》中的理由和限制一起理解。
