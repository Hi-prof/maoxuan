quote: 不要性急，应依环境、群众觉悟程度和领导干部强弱决定土地改革工作进行的速度。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 新解放区土地改革要点
  authoredAt: '1948-02-15'
themes:
- 群众路线
interpretation:
  inspiration: 做重要改变时，快不一定就是好。看看参与者是否理解、带头的人是否够用、环境是否允许，再决定步子大小；慢一点做实，常比赶着交差省时间。
  explanation: 这句话是说，土地改革不能规定一个整齐的速度，要根据当地环境、群众的组织和认识程度、干部能力来推进。1948年2月这份党内指示专谈新解放区，要求把土地改革分成两个阶段，区别地主与富农，并预计全区需要两三年完成。当时新区基层基础差异很大，“不要性急”是在防止脱离条件、几个月内强推完成，不是对改革目标的迟疑。
historicalEvent: 1948年2月15日，《新解放区土地改革要点》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《新解放区土地改革要点》从当时的具体问题出发讨论群众路线，本卡从“不要性急，应依环境、群众觉悟程度和领导干部强弱决定土地改革工作进行的速度”切入全文的一层论证。
story: 《新解放区土地改革要点》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
