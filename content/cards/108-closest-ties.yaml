revision: 1
status: published
quote: 我们共产党人区别于其他任何政党的又一个显著的标志，就是和最广大的人民群众取得最密切的联系。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 群众联系
interpretation:
  inspiration: 制度和组织要有稳定的一线反馈渠道，并让意见能够影响决策和纠错。
  explanation: 原文出自《论联合政府》，围绕人民力量、政治纲领和国家建设展开。这句话强调同最广大人民保持密切联系被视为政党的根本标志。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现同最广大人民保持密切联系被视为政党的根本标志。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把同最广大人民保持密切联系被视为政党的根本标志凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
