quote: 我们共产党人区别于其他任何政党的又一个显著的标志，就是和最广大的人民群众取得最密切的联系。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 群众联系
interpretation:
  inspiration: '联系不是通讯录里人数很多，而是有人愿意把真实情况告诉你，意见也真的能改变决定。常去一线听一听，过后让反馈有回音，关系才不会只剩称呼。'
  explanation: '这句话把同最广大人民群众保持密切联系，视为共产党区别于其他政党的重要标志。1945年抗战胜利前夕，毛泽东在《论联合政府》中总结党的作风和政治纲领，认为力量来自为人民利益工作、依靠群众，并把党的政策转化为群众自觉行动。所谓“密切联系”不只是经常接触，更包括倾听群众经验、接受监督、纠正脱离实际的做法。它是一项政治标准：一个自称代表人民的政党，要通过持续的组织关系和实际利益来证明这种联系。'
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现同最广大人民保持密切联系被视为政党的根本标志。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把同最广大人民保持密切联系被视为政党的根本标志凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
