revision: 3
status: published
quote: 没有什么事物是不包含矛盾的，没有矛盾就没有世界。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 辩证思维
interpretation:
  inspiration: '一件事同时让人喜欢又为难，并不奇怪。工作带来成长也消耗精力，亲近让人温暖也需要边界。把两面都摆在桌上，不急着消灭其中一面，反而更容易找到相处办法。'
  explanation: '“没有矛盾就没有世界”是说，任何具体事物内部都有相互依存又相互排斥的方面；没有这种关系，事物也就失去运动和变化的动力。在《矛盾论》中，这一判断用来说明矛盾的普遍性，反对把矛盾只当成少数异常事件。不过，承认矛盾无处不在只是分析的起点。不同事物的矛盾各有特点，同一矛盾在不同阶段也会变化，不能因为都叫“矛盾”就采用相同结论。'
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现真实事物往往同时包含相反要求和不一致因素。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把真实事物往往同时包含相反要求和不一致因素凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
