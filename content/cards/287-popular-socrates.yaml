quote: 未經反思自省的人生沒有意義。
literature:
  series: 名人名言
  volume: 苏格拉底
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: 前4世纪
themes:
- 人生
interpretation:
  inspiration: 把目标拆小，把注意力放回能控制的努力、节奏和下一次尝试上。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 古希腊城邦的公共辩论塑造了哲学传统，苏格拉底式追问强调审视自己的判断。
background: 苏格拉底的思想通过柏拉图等人的记述流传，核心方法是提问、辨析与承认无知。
story: 此卡按可追溯出处筛选自苏格拉底语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
