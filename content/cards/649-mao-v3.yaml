revision: 3
status: published
quote: 财政困难，只有从切切实实的有效的经济发展上才能解决。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 抗日时期的经济问题和财政问题
  authoredAt: 1942-12
themes:
- 经济建设
interpretation:
  inspiration: '缺口出现时，只想着再省一点、再收一点，很容易越转越紧。若有余地，也看看怎样把能创造价值的部分做起来。长期平衡往往靠增加真实能力，不只靠挪动账面。'
  explanation: '这句话认为，根据地财政缺口不能主要靠加重税收、发行货币或临时摊派解决，根本办法是发展真实有效的生产和经济。1942年，陕甘宁边区受到封锁，军政开支大，群众负担已经很重。毛泽东把经济工作放在财政之前：农业、手工业和公营经济发展了，物资和税源才有稳定基础，财政才能持续。所谓“切切实实”也在反对只报数字、不见产品的形式主义。财政平衡要建立在经济增长和减轻群众负担上。'
historicalEvent: 1942年12月，《抗日时期的经济问题和财政问题》形成，集中讨论经济建设及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《抗日时期的经济问题和财政问题》从当时的具体问题出发讨论经济建设，本卡从“财政困难，只有从切切实实的有效的经济发展上才能解决”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“财政困难，只有从切切实实的有效的经济发展上才能解决”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
