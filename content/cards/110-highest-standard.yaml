id: 73f9d14b-a85c-5275-a869-7162c8b8a2e5
revision: 2
status: published
quote: 共产党人的一切言论行动，必须以合乎最广大人民群众的最大利益，为最广大人民群众所拥护为最高标准。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 人民立场
interpretation:
  inspiration: 评估政策时具体说明受影响人群、长期利益和参与反馈，不能只用自我评价证明正确。
  explanation: 《论联合政府》写到人民力量、政治纲领和国家建设时，用这句话说明言论行动的最高标准被明确放在最广大人民的利益和拥护上。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现言论行动的最高标准被明确放在最广大人民的利益和拥护上。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把言论行动的最高标准被明确放在最广大人民的利益和拥护上凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
