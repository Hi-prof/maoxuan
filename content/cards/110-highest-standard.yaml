quote: 共产党人的一切言论行动，必须以合乎最广大人民群众的最大利益，为最广大人民群众所拥护为最高标准。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 人民立场
interpretation:
  inspiration: '一个决定若声称“为了大家”，就把“大家”说具体一点：谁得到好处，谁承担代价，意见怎样回来。抽象的善意经得起这些问题，才比较接近真实利益。'
  explanation: '这句话规定共产党言论和行动的最高政治标准：是否符合最广大人民的最大利益，并得到他们的拥护。它出现在1945年的《论联合政府》中，同密切联系群众、反对脱离群众的作风相连。“最广大”和“最大利益”要求超出少数人、局部和眼前得失，考虑多数人的根本和长远利益；“为群众所拥护”又要求这种判断不能只由组织自我证明，要回到群众的实际经验。它不是一次简单表决，而是利益、政策和群众实践之间持续的检验。'
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现言论行动的最高标准被明确放在最广大人民的利益和拥护上。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把言论行动的最高标准被明确放在最广大人民的利益和拥护上凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
