quote: 工业在资本主义基础上的迅速发展，使劳动群众的贫穷和困苦成了社会的生存条件。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《社会主义从空想到科学的发展》
  authoredAt: '1878'
themes:
- 劳动
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《社会主义从空想到科学的发展》，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《社会主义从空想到科学的发展》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
