id: c99ebbf7-0b9e-50c3-b1c1-d9adc72fd1c4
revision: 4
status: published
quote: '为着这一切，就需要进行经济方面的建设工作。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
  - 经济建设
  - 群众生活
interpretation:
  inspiration: '任务再紧，也不能只顾最显眼的一线工作。吃饭、物资、人员照顾和日常运转看起来不够“关键”，却决定事情能撑多久。做计划时，把目标和保障放在同一张表上，先分清哪些基础工作现在必须做、哪些暂时做不到。照顾好持续运转的条件，不是分散精力，而是在给主任务托底。'
  explanation: '这句话说明，战争压力越大，经济工作越不能被当成以后再说的附属事项。军需物资、生产组织和群众生活，是长期行动能够继续的基础；这些条件断裂，前线任务也很难维持。文章针对“战争已经忙不过来，哪有工夫建设经济”的看法，指出战争本身就在提出更迫切的供给要求。这里的“建设”有清楚的现实尺度，并非在困难条件下追求大而全。报告谈的是当时必要而且可能推进的合作社、粮食调剂、生产计划等工作，重点是把有限资源组织起来，同时改善群众生活。经济工作、群众动员和战争保障在文中不是三件分开的事，而是互相支撑的同一过程。'
historicalEvent: '1933年8月12日，毛泽东在中央革命根据地南部十七县经济建设大会上作报告。'
background: '这段文字出自中央革命根据地南部十七县经济建设大会上的报告。文章把物资供给、改善群众生活和组织群众都纳入经济工作的目标。'
story: '面对“战争已经忙不过来，哪有工夫建设经济”的看法，报告反问长期战争靠什么保障，并以合作社、粮食调剂和生产计划说明建设不能等待。'
