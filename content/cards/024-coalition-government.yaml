revision: 3
status: published
quote: '人民，只有人民，才是创造世界历史的动力。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
  - 人民
  - 历史
interpretation:
  inspiration: '评价一项公共事业，别只看少数代表人物说了什么、设计得多漂亮。还要看普通参与者是否理解，手里有没有行动条件，实际生活发生了什么变化。人们不是被动等待安排的数字，他们的生产、选择和合作会改变事情的走向。离开这些具体检验，宏大的说法很容易只停在纸面。'
  explanation: '这句话把人民的生产、斗争和社会实践看作历史变化的根本动力。历史不是少数英雄人物单独创造的，大规模的制度变化和社会进步，最终要通过广大人民的实际行动才能发生。引文出现在对国际形势的分析中，文章先谈反法西斯战争怎样教育和组织人民，再把这一判断转向中国，作为争取民主、团结和建设新国家的依据。肯定人民的决定作用，并不是否认组织、领导者和制度安排的影响，而是改变观察的重心：这些因素能否真正起作用，要看是否回应人民需要，能否转化为广泛参与的行动。没有人民的理解、能力和持续实践，再完整的设计也难以成为现实。人民并非历史叙述中的背景，而是行动的主体。'
historicalEvent: '1945年4月24日，中共七大在延安举行，毛泽东作政治报告，讨论联合政府和新中国政策。'
background: '这是毛泽东在中国共产党第七次全国代表大会上的政治报告。抗战胜利临近，报告讨论国内外形势、联合政府和建设新中国的政策。'
story: '引文出现在国际形势部分。文章先分析反法西斯战争中的人民力量，再把这种判断转向中国，作为团结、民主和动员群众的立论基础。'
