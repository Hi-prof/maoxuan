quote: 应该了解：在我们目前的条件下，‘干部决定一切’。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 为争取千百万群众进入抗日民族统一战线而斗争
  authoredAt: '1937-05-08'
themes:
- 群众路线
interpretation:
  inspiration: '方向写得再好，也要有人把它做成日常。选对负责人以后，还要给他学习、反馈和纠错的条件。把一切压在“能人”肩上，不如让更多普通人逐渐变得能干。'
  explanation: '“干部决定一切”有一个明确前提：政治路线已经确定之后，干部是否理解并能执行路线，成为事业成败的关键。1937年抗日民族统一战线扩大，党需要大批能够联系群众、组织抗战的干部。毛泽东引用这一说法，是为了强调有计划地培养、选拔和爱护干部，而不是宣称少数干部可以替代群众。干部承担把政策变成行动的组织责任；如果缺乏能力或脱离群众，正确主张也落不了地。这里的“决定”强调执行环节的重要，不是个人权力无限。'
historicalEvent: 1937年5月8日，《为争取千百万群众进入抗日民族统一战线而斗争》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《为争取千百万群众进入抗日民族统一战线而斗争》从当时的具体问题出发讨论群众路线，本卡从“应该了解：在我们目前的条件下，‘干部决定一切”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《为争取千百万群众进入抗日民族统一战线而斗争》中的理由和限制一起理解。
