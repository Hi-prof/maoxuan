id: 9d79ff91-4e31-5e8c-b783-536300367ccf
revision: 2
status: published
quote: '中国革命的历史进程，必须分为两步，其第一步是民主主义的革命，其第二步是社会主义的革命，这是性质不同的两个革命过程。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: '1940-01'
themes:
  - 新民主主义
  - 历史进程
interpretation:
  coreMeaning: '这句话把中国革命的长期进程区分为性质不同、前后衔接的两个阶段。第一步解决民主主义革命的任务，第二步再进入社会主义革命，不能把二者混成同一个过程。'
  keyPoint: '分成两步并不是把两个阶段割裂。文章讨论的是特定历史条件下目标、力量和制度任务的次序：既不能跳过第一步，也不能因为先完成第一步就否认后续方向。'
  contemporaryRelevance: '面对有先后条件的长期目标，应分清每一阶段实际要解决什么、完成标准是什么，以及它怎样为下一阶段创造条件。把终点口号直接替代当前任务，通常会失去可执行路径。'
contextExcerpt: '所谓民主主义，现在已不是旧范畴的民主主义，已不是旧民主主义，而是新范畴的民主主义，而是新民主主义。'
background: '抗日战争相持阶段，社会各界都在讨论“中国向何处去”。文章从政治、经济和文化三个方面系统阐述新民主主义共和国的构想。'
story: '全文把近代中国革命放进世界历史进程中考察，并用“两步”区分民主主义革命和社会主义革命，说明两者性质不同又前后衔接。'
