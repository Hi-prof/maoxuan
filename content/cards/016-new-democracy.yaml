revision: 4
status: published
quote: '中国革命的历史进程，必须分为两步，其第一步是民主主义的革命，其第二步是社会主义的革命，这是性质不同的两个革命过程。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: '1940-01'
themes:
  - 新民主主义
  - 历史进程
interpretation:
  inspiration: '长期目标常常有先后条件。先弄清这一阶段真正要解决什么、做到什么算完成，再看它要为下一步准备哪些条件。把最后的目标直接当成今天的任务，容易只剩口号；只顾眼前，又可能忘了接下来往哪里走。阶段分清了，行动更具体，方向也不会因为分步推进而丢掉。'
  explanation: '这句话把中国革命的长期进程区分为性质不同、前后衔接的两个阶段。第一步是民主主义革命，处理当时反帝反封建的任务；第二步再进入社会主义革命。文章认为，近代中国的社会条件决定这两步不能混成一个过程，也不能绕过前一阶段直接完成后一阶段。分成两步并不意味着把它们割裂。第一阶段的方向、领导力量和制度安排，同旧式民主主义已经不同，并要为后续发展创造条件。理解时应看到，文章讨论的是特定历史条件下革命目标、参与力量和制度任务的次序，不是一套可以脱离条件套用的通用进度表。既不能用最终目标替代当前任务，也不能因为先完成第一步就否认后续方向。'
historicalEvent: '1940年1月，抗战进入相持阶段，各界讨论中国前途，毛泽东系统阐述新民主主义主张。'
background: '抗日战争相持阶段，社会各界都在讨论“中国向何处去”。文章从政治、经济和文化三个方面系统阐述新民主主义共和国的构想。'
story: '全文把近代中国革命放进世界历史进程中考察，并用“两步”区分民主主义革命和社会主义革命，说明两者性质不同又前后衔接。'
