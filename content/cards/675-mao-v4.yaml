revision: 3
status: published
quote: 党委要完成自己的领导任务，就必须依靠党委这“一班人”，充分发挥他们的作用。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 党委会的工作方法
  authoredAt: '1949-03-13'
themes:
- 领导方法
interpretation:
  inspiration: '负责人不必成为全队最忙的人。让每个成员都知道情况、能说意见、承担一块工作，班子才真的存在。一个人的能干，替代不了一群人的作用被发挥出来。'
  explanation: '毛泽东把党委成员比作一个班，书记像“班长”。党委要完成领导任务，不能只靠书记个人决定和忙碌，而要依靠全体委员，充分发挥每个人作用。1949年全国执政在即，各级党委将面对更复杂的城市和国家治理，《党委会的工作方法》因此强调集体领导、互通情报、开好会议和团结协作。“依靠一班人”既反对个人包办，也要求成员不能只挂名；班长要善于组织讨论和分工，使集体判断真正形成。'
historicalEvent: 1949年3月13日，《党委会的工作方法》形成，集中讨论领导方法及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《党委会的工作方法》从当时的具体问题出发讨论领导方法，本卡从“党委要完成自己的领导任务”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《党委会的工作方法》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
