revision: 1
status: published
quote: 寡头专政的国民党领导者们，至今看不见他们有什么改革政治抗住敌人的意图和本领，只有“土地”一项现成资本可资抵挡。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 评蒋介石在双十节的演说
  authoredAt: '1944-10-11'
themes:
- 领导方法
interpretation:
  inspiration: 从“寡头专政的国民党领导者们”出发，可以把态度转成行动：让方向、分工、沟通和执行彼此衔接，并让事实、分工和实际结果检验原先的判断。
  explanation: 《评蒋介石在双十节的演说》讨论的是特定历史条件下的领导方法问题。这里用“寡头专政的国民党领导者们”指出行动应有的着力点，核心在于让方向、分工、沟通和执行彼此衔接。原文并不支持脱离对象的简单化理解，因为领导不是包办，决定也必须建立在信息和协作上。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1944年10月11日，《评蒋介石在双十节的演说》形成，集中讨论领导方法及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《评蒋介石在双十节的演说》从当时的具体问题出发讨论领导方法，本卡从“寡头专政的国民党领导者们”切入全文的一层论证。
story: 《评蒋介石在双十节的演说》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
