revision: 3
status: published
quote: 寡头专政的国民党领导者们，至今看不见他们有什么改革政治抗住敌人的意图和本领，只有“土地”一项现成资本可资抵挡。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 评蒋介石在双十节的演说
  authoredAt: '1944-10-11'
themes:
- 领导方法
interpretation:
  inspiration: '拥有资源不等于会使用资源。面对危机，只强调“家底还在”却不改组织和做法，优势也可能慢慢耗掉。真正的底气常来自能让更多人参与的更新能力。'
  explanation: '这句话批评国民党在抗战后期军事失利、政治腐败加深，却仍不愿实行民主改革和发动人民，只把中国广阔土地当作继续抵抗的最后资本。1944年日军发动豫湘桂战役，国民党军大败、大片国土沦陷；蒋介石双十节演说仍回避政治责任。毛泽东承认土地广大有利于持久抗战，但认为若继续寡头专政、压制民众，再大的空间也不能自动转化为抵抗力量。“土地”在这里是未经政治动员的现成条件，不是充分答案。'
historicalEvent: 1944年10月11日，《评蒋介石在双十节的演说》形成，集中讨论领导方法及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《评蒋介石在双十节的演说》从当时的具体问题出发讨论领导方法，本卡从“寡头专政的国民党领导者们”切入全文的一层论证。
story: 《评蒋介石在双十节的演说》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
