revision: 1
status: published
quote: 天生一个仙人洞，无限风光在险峰。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七绝·为李进同志题所摄庐山仙人洞照
  authoredAt: '1961-09-09'
themes:
- 攀登
interpretation:
  inspiration: 困难本身不值得崇拜；值得的是为重要目标承担必要难度，并获得新的能力和认识。
  explanation: 《七绝·为李进同志题所摄庐山仙人洞照》写到复杂环境中的定力和攀登时，用这句话说明把险峰同开阔风光联系起来，写克服困难后的视野。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1961年9月9日，毛泽东为庐山仙人洞照片题诗。
background: 作品题写庐山仙人洞照片，以劲松、乱云和险峰组织出逆境中从容挺立的形象。 此卡所选名句着重表现把险峰同开阔风光联系起来，写克服困难后的视野。
story: 《七绝·为李进同志题所摄庐山仙人洞照》以景物、行动和历史联想组织诗意。这一句集中呈现把险峰同开阔风光联系起来，写克服困难后的视野，既有鲜明画面，也保留了作品写作时的现实背景。
