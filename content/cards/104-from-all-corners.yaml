revision: 3
status: published
quote: 我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
- 共同目标
interpretation:
  inspiration: '一群背景不同的人不必先变得一样，才可以一起做事。有一个真心认同的目标，再慢慢熟悉彼此的经验和脾气，陌生人也能长成队友。'
  explanation: '这句话说，革命队伍中的人来自全国不同地方，因为共同的解放目标汇聚在一起。它出现在张思德追悼会的讲话中，紧接着谈怎样关心队伍里的每一个人：有人牺牲要开追悼会，寄托哀思，也让人民团结起来。“五湖四海”因此不只表示人员来源广，还说明共同目标需要转化为彼此照顾的组织关系。来自不同地域和经历的人能够成为同志，不是因为差异消失，而是因为共同事业让这些差异有了相连的位置。'
historicalEvent: 1944年9月8日，毛泽东在张思德追悼会上讲演。
background: 毛泽东在张思德追悼会上，从生死意义谈到人民立场、接受批评、团结和克服困难。 此卡所选名句着重表现不同来历的人可以因共同目标形成队伍。
story: 《为人民服务》围绕人民立场、改错和共同奋斗逐层展开。这句话把不同来历的人可以因共同目标形成队伍凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
