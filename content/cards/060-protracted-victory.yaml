revision: 3
status: published
quote: 抗日战争是持久战，最后胜利是中国的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 长期主义
interpretation:
  inspiration: '有些目标不会很快见效。知道路很长以后，可以少一点“怎么还没成功”的焦躁，多一点阶段感：眼下先守住什么、积累什么、等什么条件成熟。'
  explanation: '这句话同时回答抗战会打多久、结果可能怎样：战争不会迅速结束，而要经过长期较量；只要正确组织和坚持，中国最终能够取胜。1938年，亡国论只看中日当时的强弱，速胜论又忽视敌强我弱的现实。《论持久战》分析双方条件会怎样变化，并把战争划分为战略防御、相持和反攻等阶段。这里的信心不是脱离困难的保证，而是建立在对战争性质、人民动员和力量变化的具体判断上。'
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现对阶段和条件的分析能够把长期信心同现实困难结合起来。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把对阶段和条件的分析能够把长期信心同现实困难结合起来凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
