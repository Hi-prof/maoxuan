id: 4af767c7-65f6-5086-a0a3-3298aaf8de53
revision: 1
status: published
quote: 抗日战争是持久战，最后胜利是中国的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论持久战
  authoredAt: 1938-05
themes:
- 长期主义
interpretation:
  inspiration: 确定长期方向后，把目标拆成阶段，既不因短期受挫放弃，也不靠空泛乐观等待。
  explanation: 原文出自《论持久战》，围绕持久抗战的阶段、力量与胜利条件展开。这句话强调对阶段和条件的分析能够把长期信心同现实困难结合起来。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1938年5月至6月，毛泽东在延安抗日战争研究会上讲演。
background: 抗战初期亡国论和速胜论并存，毛泽东分析中日双方条件、战争阶段和人民战争的力量。 此卡所选名句着重表现对阶段和条件的分析能够把长期信心同现实困难结合起来。
story: 《论持久战》围绕持久抗战的阶段、力量与胜利条件逐层展开。这句话把对阶段和条件的分析能够把长期信心同现实困难结合起来凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
