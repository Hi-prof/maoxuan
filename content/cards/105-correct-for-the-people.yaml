id: 12b3169c-d343-5bf0-879c-141026a2fed9
revision: 1
status: published
quote: 只要我们为人民的利益坚持好的，为人民的利益改正错的，我们这个队伍就一定会兴旺起来。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
- 改错
interpretation:
  inspiration: 建立能指出错误、验证改进和公开复盘的机制，让改错成为工作能力。
  explanation: 在《为人民服务》讨论人民立场、改错和共同奋斗的语境中，这句话把重点放在坚持和改正都以人民利益为判断标准，队伍才能保持活力。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1944年9月8日，毛泽东在张思德追悼会上讲演。
background: 毛泽东在张思德追悼会上，从生死意义谈到人民立场、接受批评、团结和克服困难。 此卡所选名句着重表现坚持和改正都以人民利益为判断标准，队伍才能保持活力。
story: 《为人民服务》围绕人民立场、改错和共同奋斗逐层展开。这句话把坚持和改正都以人民利益为判断标准，队伍才能保持活力凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
