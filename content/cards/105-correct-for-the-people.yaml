revision: 3
status: published
quote: 只要我们为人民的利益坚持好的，为人民的利益改正错的，我们这个队伍就一定会兴旺起来。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
- 改错
interpretation:
  inspiration: '承认改错，不会让一支队伍显得软弱。大家若知道正确做法会留下，错误做法能调整，提出意见就少一点顾虑。可靠不是从不犯错，而是有能力变好。'
  explanation: '这句话把“坚持什么、改正什么”的标准都放在人民利益上。毛泽东在《为人民服务》中还说，只要批评说得对，不管是谁提出都应接受，并举李鼎铭精兵简政建议被采纳为例。队伍兴旺不是因为它永远正确，而是因为有共同标准，也有允许外部意见进入、让错误得到修正的能力。“为人民利益”既给坚持提供方向，也防止把维护组织面子当成原则。改错在这里不是偶然补救，而是保持队伍生命力的日常机制。'
historicalEvent: 1944年9月8日，毛泽东在张思德追悼会上讲演。
background: 毛泽东在张思德追悼会上，从生死意义谈到人民立场、接受批评、团结和克服困难。 此卡所选名句着重表现坚持和改正都以人民利益为判断标准，队伍才能保持活力。
story: 《为人民服务》围绕人民立场、改错和共同奋斗逐层展开。这句话把坚持和改正都以人民利益为判断标准，队伍才能保持活力凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
