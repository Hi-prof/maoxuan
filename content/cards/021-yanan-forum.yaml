status: published
quote: '为什么人的问题，是一个根本的问题，原则的问题。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在延安文艺座谈会上的讲话
  authoredAt: '1942-05'
themes:
  - 文艺
  - 人民
interpretation:
  inspiration: '做内容或公共表达前，先说清楚主要给谁看，他们正面对什么问题，平时怎样说话。只从自己的兴趣和习惯出发，技巧再熟练，也可能让信息到不了真正需要的人。了解受众不是迎合，更不是降低内容，而是决定材料怎么选、话怎么说，才能让表达发生实际联系。'
  explanation: '“为什么人”追问的是文艺工作的立场和服务对象。写谁的生活、采用谁能理解的语言、怎样评价作品，都受这个根本问题影响，所以它先于许多具体的创作方法。讲话把服务对象指向工农兵群众，同时要求文艺工作者进入实际生活，熟悉群众的语言、感情和斗争经验。明确服务对象并不等于忽视艺术规律，也不是要求作品只有一种形式。相反，如果不了解对象，只凭自己原有的趣味和知识写作，立场就很难真正转化为作品。讲话先问“为什么人”，再讨论“如何服务”，说明方向和能力需要连在一起。立场不是在作品外面加一句口号，而要通过长期观察、学习和思想变化，进入题材、语言和创作判断之中。'
historicalEvent: '1942年5月，延安文艺座谈会分两次举行，毛泽东围绕文艺工作的立场和服务方向讲话。'
background: '一九四二年五月，延安文艺座谈会分两次举行。讲话围绕文艺工作者的立场、态度、对象、学习和服务方向展开。'
story: '文章先问文艺“为什么人”，再谈怎样服务。它要求文艺工作者深入群众和实际生活，并在这个过程中改变自己的立足点和表达方式。'
