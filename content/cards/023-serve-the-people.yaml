id: a03adb4a-bb69-5c4c-8447-d65cbf03c4e7
revision: 2
status: published
quote: '因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
  - 为人民服务
  - 自我批评
interpretation:
  coreMeaning: '这句话把是否接受批评分成两个判断：工作目的是为人民服务，因此不必因承认缺点而维护面子；意见是否值得采纳，要看它说得是否正确，而不是看提出者身份。'
  keyPoint: '“不怕批评”不等于不加分析地接受所有意见。原文用“说得对”设定了事实和效果标准，也以“精兵简政”为例，说明判断要落到是否对人民有好处。'
  contemporaryRelevance: '收到不同意见时，可以先把来源身份同内容分开，核对事实、影响和改进成本。能够说明为什么采纳或不采纳，比本能防御或一味迎合更有利于真正修正问题。'
contextExcerpt: '不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。'
background: '这是毛泽东在中共中央警备团追悼张思德的会上的讲演。文章从怎样看待死亡谈到为人民工作的宗旨、接受批评和队伍团结。'
story: '文中以党外人士李鼎铭提出“精兵简政”为例：判断意见不看提出者身份，而看它是否正确、是否对人民有好处。'
