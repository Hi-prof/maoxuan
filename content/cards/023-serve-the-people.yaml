id: a03adb4a-bb69-5c4c-8447-d65cbf03c4e7
revision: 3
status: published
quote: '因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 为人民服务
  authoredAt: '1944-09-08'
themes:
  - 为人民服务
  - 自我批评
interpretation:
  inspiration: '听到批评时，先把“谁说的”和“说得对不对”分开。核对事实，看看问题造成了什么影响，修改后是否更好。对的就改，不对的也说明理由。这样比本能地维护面子，或者为了显得虚心什么都答应，更能真正解决问题。愿意改错不是示弱，而是让工作的目的排在个人感受前面。'
  explanation: '这句话把接受批评建立在两个判断上。既然工作的目的是为人民服务，就不必为了维护个人和组织的面子而掩盖缺点；一条意见是否值得采纳，要看它说得是否正确、是否对人民有好处，而不是看提出者是什么身份。原文明确说“不管是什么人”，并以党外人士李鼎铭提出“精兵简政”为例，说明有益意见可以来自组织之外。“不怕批评”不等于不加分析地接受所有说法，“说得对”仍然要求核对事实和实际效果。文章把宗旨、改错和队伍团结放在一起：能够公开面对缺点，才可能减少损失、改善工作。判断意见时把内容同身份分开，也能避免因为亲疏、地位或情绪错过真正有用的提醒。'
historicalEvent: '1944年9月8日，毛泽东在中共中央警备团举行的张思德追悼会上发表讲演。'
background: '这是毛泽东在中共中央警备团追悼张思德的会上的讲演。文章从怎样看待死亡谈到为人民工作的宗旨、接受批评和队伍团结。'
story: '文中以党外人士李鼎铭提出“精兵简政”为例：判断意见不看提出者身份，而看它是否正确、是否对人民有好处。'
