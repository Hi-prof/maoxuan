revision: 3
status: published
quote: 只有破坏旧的腐朽的东西，才能建设新的健全的东西。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义的宪政
  authoredAt: '1940-02-20'
themes:
- 工作方法
interpretation:
  inspiration: '旧办法占着位置时，新办法常没有生长空间。改变不只是在旁边添一层装饰，也要诚实处理已经失效的规则。不过，拆掉什么最好同准备建起什么一起想。'
  explanation: '这句话说，要建立新的民主政治，就必须打破帝国主义、封建主义和大地主大资产阶级专政等旧制度。《新民主主义的宪政》写于1940年，毛泽东讨论中国需要怎样的宪政，反对只借用“宪政”名义而不改变旧有统治。所谓“破坏”有明确的制度对象，是清除阻碍人民民主的腐朽结构；“建设”则指建立各革命阶级联合的新民主主义共和国。两者相连，说明革命不以破坏本身为目的，旧制度让出的空间要由新的政治组织和规则接住。'
historicalEvent: 1940年2月20日，《新民主主义的宪政》形成，集中讨论工作方法及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《新民主主义的宪政》从当时的具体问题出发讨论工作方法，本卡从“只有破坏旧的腐朽的东西”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《新民主主义的宪政》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
