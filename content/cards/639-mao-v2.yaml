id: 488710f1-100a-4f33-953e-f674c6d3a592
revision: 1
status: published
quote: 只有破坏旧的腐朽的东西，才能建设新的健全的东西。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义的宪政
  authoredAt: '1940-02-20'
themes:
- 工作方法
interpretation:
  inspiration: 可以把“只有破坏旧的腐朽的东西”转成一个工作问题：怎样从具体问题出发选择可执行的方法？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《新民主主义的宪政》中，这句话服务于对工作方法问题的分析。它把“只有破坏旧的腐朽的东西”同实际任务联系起来，要求从具体问题出发选择可执行的方法。它的现实启发主要是一种工作方法；一句话的启发必须放回原文对象和历史条件，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1940年2月20日，《新民主主义的宪政》形成，集中讨论工作方法及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《新民主主义的宪政》从当时的具体问题出发讨论工作方法，本卡从“只有破坏旧的腐朽的东西”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《新民主主义的宪政》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
