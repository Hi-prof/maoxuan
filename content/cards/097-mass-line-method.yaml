quote: 从群众中集中起来又到群众中坚持下去，以形成正确的领导意见，这是基本的领导方法。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 关于领导方法的若干问题
  authoredAt: '1943-06-01'
themes:
- 群众路线
interpretation:
  inspiration: 收集一线意见后形成方案，回到现场试行、解释和修正，完成反馈闭环。
  explanation: 在《关于领导方法的若干问题》讨论群众路线与领导方法的语境中，这句话把重点放在领导意见要从群众经验中集中，再回到群众实践中检验和坚持。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1943年6月1日，中共中央作出关于领导方法的决定。
background: 抗日根据地工作中，毛泽东总结一般号召与个别指导、领导骨干与广大群众相结合的方法。 此卡所选名句着重表现领导意见要从群众经验中集中，再回到群众实践中检验和坚持。
story: 《关于领导方法的若干问题》围绕群众路线与领导方法逐层展开。这句话把领导意见要从群众经验中集中，再回到群众实践中检验和坚持凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
