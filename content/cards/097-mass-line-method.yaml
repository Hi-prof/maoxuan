id: 86e2f2a6-761b-56e5-9972-9f1475a0cb8b
revision: 3
status: published
quote: 从群众中集中起来又到群众中坚持下去，以形成正确的领导意见，这是基本的领导方法。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 关于领导方法的若干问题
  authoredAt: '1943-06-01'
themes:
- 群众路线
interpretation:
  inspiration: '收集意见不是开完会就结束。把零散经验整理成一个可试的办法，再回到现场看看大家能不能理解、结果好不好。来回走一趟，方案才不只是会议室里的成品。'
  explanation: '这句话概括“从群众中来，到群众中去”的领导循环。群众在实践中有许多分散、未整理的经验和要求，领导者要把它们集中、分析，形成比较系统的意见；随后再回到群众中宣传、执行，并在新的实践中检验和修正。1943年抗日根据地工作日益复杂，中央总结这一方法，是为了反对脱离群众的命令主义，也避免只收集意见却不作判断。领导的作用在于集中和组织，但正确性要不断回到群众实践中确认。'
historicalEvent: 1943年6月1日，中共中央作出关于领导方法的决定。
background: 抗日根据地工作中，毛泽东总结一般号召与个别指导、领导骨干与广大群众相结合的方法。 此卡所选名句着重表现领导意见要从群众经验中集中，再回到群众实践中检验和坚持。
story: 《关于领导方法的若干问题》围绕群众路线与领导方法逐层展开。这句话把领导意见要从群众经验中集中，再回到群众实践中检验和坚持凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
