revision: 3
status: published
quote: 此皆将士寒心、敌人拊掌之怪现象，断乎不能容许者也。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 向国民党的十点要求
  authoredAt: '1940-02-01'
themes:
- 战略
interpretation:
  inspiration: '共同面对外部难题时，内部若忙着压制真正出力的人，最先消耗的是信任。看一项做法是否合理，也可看看谁因此灰心、谁反而从分裂中获利。'
  explanation: '“将士寒心、敌人拊掌”批评的是抗战期间压制共产党、八路军、新四军和进步民众的反共措施：这些做法让前线抗日力量失望，却使日本侵略者因中国内部摩擦而得利。1940年统一战线倒退倾向加重，毛泽东在《向国民党的十点要求》中要求制止投降、分裂和政治压迫，维护团结抗战。“怪现象”揭示政策结果同抗日共同目标相反。它不是一般的战略口号，而是在追问内耗究竟削弱谁、便利谁。'
historicalEvent: 1940年2月1日，《向国民党的十点要求》形成，集中讨论战略及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《向国民党的十点要求》从当时的具体问题出发讨论战略，本卡从“此皆将士寒心、敌人拊掌之怪现象”切入全文的一层论证。
story: 文本围绕战略逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《向国民党的十点要求》中的理由和限制一起理解。
