status: published
quote: 阿比西尼亚主要地是因为封建制度的统治，不能巩固内部的团结，不能发动人民的积极性，所以失败了。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国共产党在抗日时期的任务
  authoredAt: '1937-05-03'
themes:
- 群众路线
interpretation:
  inspiration: '一群人要共同应对外部压力，内部是否信任、能否参与，比口头上的团结更重要。平时积累的不公平会在困难时显出来；真正的凝聚力，要从日常关系里慢慢长。'
  explanation: '阿比西尼亚即今天的埃塞俄比亚。1935至1936年，它遭到意大利法西斯入侵并战败。毛泽东在讨论中国抗日任务时借这个例子说明，落后的封建统治使国内各阶层难以真正团结，也没有充分发动人民抵抗，因此外敌入侵时缺少深厚的社会动员基础。他不是把失败只归给军事装备，而是强调内部政治社会关系会影响民族战争能力。这个比较服务于当时中国实行民主改革、改善民生和广泛动员民众的主张。'
historicalEvent: 1937年5月3日，《中国共产党在抗日时期的任务》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国共产党在抗日时期的任务》从当时的具体问题出发讨论群众路线，本卡从“阿比西尼亚主要地是因为封建制度的统治”切入全文的一层论证。
story: 《中国共产党在抗日时期的任务》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
