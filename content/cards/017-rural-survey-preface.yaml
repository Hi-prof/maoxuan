revision: 4
status: published
quote: '必须明白：群众是真正的英雄，而我们自己则往往是幼稚可笑的，不了解这一点，就不能得到起码的知识。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 《农村调查》的序言和跋
  authoredAt: '1941'
themes:
  - 调查研究
  - 群众
interpretation:
  inspiration: '研究一个群体，或设计一项给别人使用的服务，要让真正使用、承受和执行它的人进入信息来源。带着写好的答案去走过场，只会听见自己熟悉的声音。先承认有些事自己不知道，再找不同经历的人谈，把说法放在一起比较。谦虚不是客气话，而是调查能够开始的条件。'
  explanation: '把群众称为“真正的英雄”，首先是在纠正调查者认识上的自满。直接参与生产和社会生活的人，掌握许多书本、文件和外部观察中没有的经验；如果不肯向他们学习，连基本情况都很难弄清。序言回忆调查会里的农民、干部、商人、秀才、狱吏和旧衙门小吏，正是不同经历的人提供了多方面材料。这并不是说每个零散意见都天然正确，也不是用态度谦虚代替分析。调查者仍要组织问题、核对事实，把具体材料集中比较，辨别其中的联系。所谓“眼睛向下”，是愿意放下既定答案，进入真实生活，承认自己的知识有边界。群众经验成为认识来源后，还需要经过研究，才会形成比较可靠的判断。'
historicalEvent: '1941年，毛泽东重新整理早年的农村调查材料，并为出版写下序言和跋。'
background: '一九四一年，毛泽东为重新整理和印行早年的农村调查材料写下序言与跋，目的不是让读者背结论，而是学习了解下层情况的方法。'
story: '序言具体回忆了调查会的参加者：干部、农民、秀才、狱吏、商人和旧衙门小吏。正是这些不同经历的人，提供了书本和文件里没有的知识。'
