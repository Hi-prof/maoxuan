id: 56c0857f-a0d7-5862-a610-b6c16416c110
revision: 2
status: published
quote: '必须明白：群众是真正的英雄，而我们自己则往往是幼稚可笑的，不了解这一点，就不能得到起码的知识。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 《农村调查》的序言和跋
  authoredAt: '1941'
themes:
  - 调查研究
  - 群众
interpretation:
  coreMeaning: '把群众称为“真正的英雄”，首先是在纠正认识上的自满。社会生活的直接参与者掌握大量书本和文件之外的经验；调查者若不肯向他们学习，连基本情况也难弄清。'
  keyPoint: '这不是说每一个零散意见天然正确，也不是用态度谦虚代替分析。序言重视调查会和不同经历的参与者，说明需要把具体材料集中、比较，才能形成较可靠的认识。'
  contemporaryRelevance: '研究一个群体或设计一项服务时，应让真正使用、承受和执行它的人进入信息来源。带着既定答案走过场，往往只会听见自己熟悉的声音；承认无知是调查的起点。'
contextExcerpt: '没有眼睛向下的兴趣和决心，是一辈子也不会真正懂得中国的事情的。'
background: '一九四一年，毛泽东为重新整理和印行早年的农村调查材料写下序言与跋，目的不是让读者背结论，而是学习了解下层情况的方法。'
story: '序言具体回忆了调查会的参加者：干部、农民、秀才、狱吏、商人和旧衙门小吏。正是这些不同经历的人，提供了书本和文件里没有的知识。'
