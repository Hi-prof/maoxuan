status: published
quote: '没有调查，没有发言权'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: '1930-05'
themes:
  - 调查研究
  - 实事求是
interpretation:
  coreMeaning: '“没有调查，没有发言权”要求结论建立在实际材料之上。不了解对象的现状、过程和差异，就急着给出判断，往往只是把书本概念或上级意见套到现实中。'
  keyPoint: '它不是否定理论、经验或他人的研究，而是反对用现成答案代替具体调查。调查也不等于随便看一看；文章随后讨论对象选择、调查会和记录方法，说明证据要经过组织和分析。'
  contemporaryRelevance: '提出方案或评价问题前，先确认信息来自哪里、是否覆盖关键对象、能否解释例外。资料不足时应说明判断边界，继续调查，而不是用确定的语气掩盖未知。'
contextExcerpt: '一切结论产生于调查情况的末尾，而不是在它的先头。'
background: '文章针对红军中照搬书本和上级指示、不了解实际情况的倾向而写。当时尚未普遍使用“教条主义”一词，文中称之为“本本主义”。'
story: '正文不仅提出调查的重要性，还连续讨论怎样开调查会、怎样选择对象和怎样记录问题，把原则落到了可执行的方法上。'
