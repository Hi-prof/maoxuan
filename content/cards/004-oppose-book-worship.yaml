revision: 4
status: published
quote: '没有调查，没有发言权'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 反对本本主义
  authoredAt: '1930-05'
themes:
  - 调查研究
  - 实事求是
interpretation:
  inspiration: '准备评价一个问题或提出方案前，先问自己：材料从哪里来，关键的人有没有被听见，反例能不能解释。资料不够，就坦白说明判断只到哪里，再继续查。书本和经验可以帮助提问，却不能替你回答眼前的具体情况。少一点抢答，多一点认真调查，往往能省下后面的返工。'
  explanation: '“没有调查，没有发言权”要求判断建立在实际材料上。不了解对象的现状、过程和差异，就急着下结论，常常只是把书本概念、上级意见或个人经验套进现实。文章反对的是“本本主义”，并不是否定理论、历史经验和他人的研究；这些知识能够提供线索，但不能代替对具体问题的了解。调查也不是到现场随便看一圈。正文继续谈到怎样选择调查对象、怎样开调查会、怎样列问题和做记录，说明材料需要收集、比较和分析。结论应当出现在调查之后，并随着新事实修正。发言权不是身份带来的，而是对问题掌握到什么程度的责任。'
historicalEvent: '1930年5月，毛泽东针对红军中照搬书本和上级指示的倾向，写下《反对本本主义》。'
background: '文章针对红军中照搬书本和上级指示、不了解实际情况的倾向而写。当时尚未普遍使用“教条主义”一词，文中称之为“本本主义”。'
story: '正文不仅提出调查的重要性，还连续讨论怎样开调查会、怎样选择对象和怎样记录问题，把原则落到了可执行的方法上。'
