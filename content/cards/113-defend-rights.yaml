id: c1d16f59-e03a-5946-9f89-b0c8b93e8efd
revision: 3
status: published
quote: 人民得到的权利，绝不允许轻易丧失，必须用战斗来保卫。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 抗日战争胜利后的时局和我们的方针
  authoredAt: '1945-08-13'
themes:
- 人民权利
interpretation:
  inspiration: '权利写下来很重要，也需要有人记得、使用和维护它。遇到边界被悄悄挪动时，及时询问、留下记录、寻找制度渠道，比等到失去很多以后再追更从容。'
  explanation: '这句话说，人民在抗战和根据地建设中已经取得的政治、经济权利，不能在胜利到来时轻易交回去，而要通过斗争保卫。1945年抗战结束前夕，毛泽东判断国内和平仍有希望，但国民党企图垄断胜利果实、发动内战的危险也很现实。因此，争取和平不等于放弃自卫和群众力量。原文中的“战斗”有当时严峻的军事政治含义；它提醒的是权利需要现实力量和制度保障，不应被泛化为普通争议中逢事对抗。'
historicalEvent: 1945年8月13日，毛泽东在延安干部会议上作报告。
background: 抗日战争胜利前夕，毛泽东分析国内和平与内战危险，强调人民权利要靠斗争保卫。 此卡所选名句着重表现抗战胜利后，原文强调已经取得的人民权利需要保卫。
story: 《抗日战争胜利后的时局和我们的方针》围绕胜利后的形势判断与人民权利逐层展开。这句话把抗战胜利后，原文强调已经取得的人民权利需要保卫凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
