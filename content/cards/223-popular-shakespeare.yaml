- 人生
interpretation:
  inspiration: 允许过程不完美，但别把一次受挫误认成全部可能性的终点。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“人生”压缩成简洁表达。它提供的是观察生活的一个角度，不要求每个人照着同一种人生脚本行走。
historicalEvent: 伊丽莎白时代的英国戏剧繁荣，莎士比亚的作品在舞台上持续讨论权力、爱情、选择与人性。
background: 莎士比亚戏剧以冲突和人物行动呈现人性的复杂性，许多台词因准确而长期流传。
story: 此卡按可追溯出处筛选自莎士比亚语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
