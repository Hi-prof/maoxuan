status: published
quote: 黑暗籠罩著整個世界，但理想卻光芒四射，無比燦爛。
literature:
  series: 名人名言
  volume: 维克多·雨果
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1860'
themes:
- 理想
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 19世纪法国经历革命、复辟与共和的反复，文学作品常直接回应贫困、正义与社会变迁。
background: 雨果的文学和公共行动持续关注尊严、同情、教育与社会正义。
story: 此卡按可追溯出处筛选自维克多·雨果语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
