revision: 4
status: published
quote: '一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。'
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 纪念白求恩
  authoredAt: '1939-12-21'
themes:
  - 为人民服务
  - 品格
interpretation:
  inspiration: '看一个人做事，不能只看他有多聪明、成绩有多亮眼。还要看他是否肯为结果负责，是否把别人的需要当回事，遇到麻烦会不会敷衍退开。能力可以继续学，也各有高低；责任心决定这些能力最终用在什么地方。把手上的小事认真做好，同样能给别人带来可靠的帮助。'
  explanation: '这段评价把人的价值同能力大小区分开来。每个人的能力有高低，但只要在工作中保持毫不自私、对他人负责的态度，有限的能力也能产生对人民有益的作用。“这点精神”承接全文对白求恩的概括，包括国际主义、对工作的极端负责、对同志和人民的热忱，以及毫不利己的品格，并非一句泛泛的赞美。文章也没有说专业能力不重要。白求恩本身就是外科医生，正文批评的恰恰是对工作不负责任、对技术见异思迁的态度。能力需要学习和磨炼，但能力由什么目的支配、在具体工作中是否可靠，同样决定它的价值。纪念因此没有停在追悼，而是落到普通人可以怎样对待工作和他人。'
historicalEvent: '1939年12月21日，白求恩逝世一个多月后，毛泽东写下这篇纪念文章。'
background: '加拿大医生诺尔曼·白求恩在中国抗日前线从事医疗工作，因手术感染于一九三九年十一月逝世。一个多月后，毛泽东写下这篇纪念文章。'
story: '毛泽东与白求恩只见过一面，后来收到过多封来信。文章没有停留在追悼，而是从国际主义、工作责任心和毫不利己的精神三个层面总结其品格。'
