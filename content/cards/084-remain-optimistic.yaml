revision: 3
status: published
quote: 我们决不悲观失望，我们是乐观的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 团结一切抗日力量，反对反共顽固派
  authoredAt: '1940-02-01'
themes:
- 信心
interpretation:
  inspiration: '乐观不一定是把坏消息调小声。把困难看全，也把仍能依靠的人、资源和行动列出来，心里会多一种有根据的安定：事情不轻松，但还可以往前做。'
  explanation: '“决不悲观失望”是在抗日统一战线遭遇严重摩擦时表达的政治判断。1940年，国民党顽固派加强反共活动，合作抗日面临倒退风险。毛泽东在延安民众大会上既指出危险，也认为全国多数人民要求抗日、进步力量在发展，国际形势也存在有利因素，因此仍有条件争取团结、反对分裂。这里的乐观不是忽略反共摩擦，而是把不利与有利条件同时纳入判断，并以继续组织抗日力量作为信心的实际内容。'
historicalEvent: 1940年2月1日，毛泽东在延安民众大会上演说。
background: 抗日统一战线面临反共摩擦，毛泽东在延安会议上强调团结抗日力量并反对分裂倒退。 此卡所选名句着重表现严峻形势中仍要基于有利条件保持行动信心。
story: 《团结一切抗日力量，反对反共顽固派》围绕抗日力量的团结与反分裂逐层展开。这句话把严峻形势中仍要基于有利条件保持行动信心凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
