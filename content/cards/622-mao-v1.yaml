quote: 然而不管怎样，过程发展的各个阶段中，只有一种主要的矛盾起着领导的作用，是完全没有疑义的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 领导方法
interpretation:
  inspiration: '问题很多时，不妨问眼下哪一个最牵动其他问题。先抓住它，不等于其余都不重要；只是注意力需要一个临时中心。阶段变了，答案也可以跟着更新。'
  explanation: '这句话说，一个复杂过程里同时存在许多矛盾，但在某个具体发展阶段，会有一种主要矛盾对其他矛盾起主导作用。抓住它，才比较容易理解这一阶段的整体变化。《矛盾论》以中国革命中阶级关系、民族矛盾等变化说明，主要矛盾不是永远固定的，随着形势转变，原来次要的问题可能上升为主要问题。因此，强调“只有一种”不是把现实简化成单一原因，而是要求在多重关系中辨认当前的中心，同时继续看到其他矛盾的作用。'
historicalEvent: 1937年8月，《矛盾论》形成，集中讨论领导方法及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《矛盾论》从当时的具体问题出发讨论领导方法，本卡从“然而不管怎样，过程发展的各个阶段中，只有一种主要的矛盾起着领导的作用，是完全没有疑义的”切入全文的一层论证。
story: 《矛盾论》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
