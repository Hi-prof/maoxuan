revision: 2
status: published
quote: 共产党是为民族、为人民谋利益的政党，它本身决无私利可图。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在陕甘宁边区参议会的演说
  authoredAt: '1941-11-06'
themes:
- 人民利益
interpretation:
  inspiration: 公共组织要接受利益冲突检查和人民监督，不能把组织自身扩张等同于公共利益。
  explanation: 在《在陕甘宁边区参议会的演说》讨论民主合作、人民利益和监督的语境中，这句话把重点放在政党的宗旨被明确放在民族和人民利益上，而不是组织私利。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1941年11月6日，陕甘宁边区第二届参议会在延安开幕。
background: 陕甘宁边区第二届参议会开幕时，毛泽东说明共产党的民主合作立场、人民监督和共同抗日任务。 此卡所选名句着重表现政党的宗旨被明确放在民族和人民利益上，而不是组织私利。
story: 《在陕甘宁边区参议会的演说》围绕民主合作、人民利益和监督逐层展开。这句话把政党的宗旨被明确放在民族和人民利益上，而不是组织私利凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
