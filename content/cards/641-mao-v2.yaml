quote: 关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论政策
  authoredAt: '1940-12-25'
themes:
- 经济建设
interpretation:
  inspiration: '目标和规则有时会悄悄打架：嘴上鼓励一件事，流程却处处增加成本。把相关政策放在一起走一遍，看看实际感受是否同方向一致，会比逐条看都正确更有用。'
  explanation: '这句话要求根据地的关税和货币政策服务于发展农业、工业和商业的总方针，不能一面号召生产流通，一面用过高关税、币制混乱等政策阻碍它。1940年的《论政策》为抗日根据地规定土地、劳动、税收和经济等一系列政策，既要保障群众利益，也要团结各抗日阶层、维持经济。毛泽东强调各项工具要彼此协调：财政和管理上的局部便利，不能破坏生产与市场这个更基本的目标。政策效果要放到整个经济关系中看。'
historicalEvent: 1940年12月25日，《论政策》形成，集中讨论经济建设及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《论政策》从当时的具体问题出发讨论经济建设，本卡从“关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
