quote: 关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 论政策
  authoredAt: '1940-12-25'
themes:
- 经济建设
interpretation:
  inspiration: “关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”提示我们，遇到相似问题时先把资源、条件和长期效果一起核算。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《论政策》，原文围绕经济建设的具体任务展开。“关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”不是孤立口号，而是论证中的一个判断。它强调把资源、条件和长期效果一起核算；理解时也要看到，建设目标必须落实为可执行的生产与组织安排。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1940年12月25日，《论政策》形成，集中讨论经济建设及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《论政策》从当时的具体问题出发讨论经济建设，本卡从“关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“关税政策和货币政策，应该和发展农工商业的基本方针相适合，而不是相违背”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
