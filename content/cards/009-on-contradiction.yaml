revision: 3
status: published
quote: '事物的矛盾法则，即对立统一的法则，是唯物辩证法的最根本的法则。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: '1937-08'
themes:
  - 辩证法
  - 方法论
interpretation:
  inspiration: '问题卡住时，别只列一串原因。先找出其中互相牵制的目标、条件和力量，看哪一组关系眼下最影响全局。两边“都有道理”只是起点，还要继续问：它们怎么联系，哪一边当前占主导，条件变化后会不会转换。把关系理清，才知道力气该用在哪里。'
  explanation: '这句话把对立统一看作理解事物运动的根本方法。事物内部常有彼此联系又彼此排斥的方面，它们的关系发生变化，事物也随之发展，因此不能把原因全都归到外部。文章把这一规律称为矛盾的普遍性，但并没有主张用一个固定公式解释所有问题。全文用了很大篇幅讨论矛盾的特殊性、主要矛盾和矛盾的主要方面，要求分析不同事物、不同阶段的具体结构。同一问题在条件变化后，主次关系也可能改变。理解“矛盾”不是简单寻找正反两面，更不是让所有意见各占一半，而是弄清相互依存和斗争怎样发生，当前哪种关系决定事情的走向，以及转化需要什么条件。'
historicalEvent: '1937年8月，毛泽东继《实践论》后在延安讲授矛盾问题，以克服党内教条主义思想。'
background: '文章继《实践论》之后写成，也源于延安抗日军事政治大学的讲演。全文围绕矛盾的普遍性、特殊性以及主要矛盾等问题展开。'
story: '写作不是孤立的哲学讨论，而是为了克服党内严重的教条主义思想。收入《毛泽东选集》第一版时，作者又作了补充、删节和修改。'
