revision: 2
status: published
quote: 孩子，人生並不意味日子輕鬆好過，但要有勇氣，日子可以是喜悅的。
literature:
  series: 名人名言
  volume: 萧伯纳
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1910'
themes:
- 勇气
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“勇气”压缩成简洁表达。勇气不等于莽撞，而是在不确定中仍能承担选择和后果。
historicalEvent: 20世纪初英国的社会改革讨论深入公共生活，戏剧成为批评贫困、教育和阶层问题的媒介。
background: 萧伯纳的戏剧和评论以讽刺手法讨论教育、创造、社会责任和独立思考。
story: 此卡按可追溯出处筛选自萧伯纳语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
