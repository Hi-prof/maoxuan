id: 6c3c15b0-7903-5598-bb1b-a411d79f2ad2
revision: 3
status: published
quote: 凡是反动的东西，你不打，他就不倒。这也和扫地一样，扫帚不到，灰尘照例不会自己跑掉。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 抗日战争胜利后的时局和我们的方针
  authoredAt: '1945-08-13'
themes:
- 行动
interpretation:
  inspiration: '有些小麻烦会自行过去，有些则会一直落灰。看清它不会自动变好以后，拿起“扫帚”做一个具体动作：约人、整理、修补。行动未必激烈，只要真的碰到问题。'
  explanation: '这句话借扫地说明，反动势力不会因为抗战胜利就自动退出历史舞台，人民必须通过有组织的斗争保卫和扩大自己的权利。1945年8月，日本投降在即，国内既有和平愿望，也有国民党发动内战、夺取人民抗战成果的危险。毛泽东反对把希望完全寄托在对方自行改变上。“打”和“扫帚”在原文中有明确的政治斗争含义。日常阅读可以理解主动处理顽固问题的必要，但不能把普通障碍或意见不同的人随意等同为“反动”。'
historicalEvent: 1945年8月13日，毛泽东在延安干部会议上作报告。
background: 抗日战争胜利前夕，毛泽东分析国内和平与内战危险，强调人民权利要靠斗争保卫。 此卡所选名句着重表现有些阻碍不会自行消失，需要有组织的行动才能改变。
story: 《抗日战争胜利后的时局和我们的方针》围绕胜利后的形势判断与人民权利逐层展开。这句话把有些阻碍不会自行消失，需要有组织的行动才能改变凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
