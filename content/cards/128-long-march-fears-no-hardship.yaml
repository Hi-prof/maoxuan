id: 21ac37c4-3b1a-503b-b5d2-23f9bc58fc5c
revision: 1
status: published
quote: 红军不怕远征难，万水千山只等闲。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七律·长征
  authoredAt: 1935-10
themes:
- 长征
interpretation:
  inspiration: 长期任务需要把巨大困难拆进日常行程，用稳定行动缩小心理上的压迫感。
  explanation: 原文出自《七律·长征》，围绕长期跋涉中的勇气和乐观展开。这句话强调以总领句写红军面对漫长远征的英雄气概。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1935年10月，中央红军到达陕北，长征取得关键胜利。
background: 中央红军长征即将结束时，毛泽东回顾跨越群山江河的艰苦历程，突出从容和胜利信念。 此卡所选名句着重表现以总领句写红军面对漫长远征的英雄气概。
story: 《七律·长征》以景物、行动和历史联想组织诗意。这一句集中呈现以总领句写红军面对漫长远征的英雄气概，既有鲜明画面，也保留了作品写作时的现实背景。
