id: 798c2b1f-a4be-5e26-b8ba-2e259a2d7670
revision: 2
status: published
quote: 只有人们的社会实践，才是人们对于外界认识的真理性的标准。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 实践
interpretation:
  inspiration: 把争论转成可观察的试验和反馈，用结果修正判断，而不是只增加论证声量。
  explanation: 这句话来自《实践论》，原文关注认识怎样从实践产生并接受检验，核心是认识是否可靠最终要接受实践结果的检验。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1937年7月，毛泽东在延安讲授认识与实践问题。
background: 为克服党内教条主义，毛泽东在延安从认识论角度说明实践、认识、真理标准和反复检验的关系。 此卡所选名句着重表现认识是否可靠最终要接受实践结果的检验。
story: 《实践论》围绕认识怎样从实践产生并接受检验逐层展开。这句话把认识是否可靠最终要接受实践结果的检验凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
