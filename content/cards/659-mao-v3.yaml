quote: 中央社于七月六日发出破坏团结、侮辱共产党的消息，这是一种极端错误的言论，也是不能容许的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 质问国民党
  authoredAt: '1943-07-12'
themes:
- 团结
interpretation:
  inspiration: '关系紧张时，一条未经核实又带侮辱性的公开消息，常比私下分歧更快破坏信任。面对共同任务，发布信息前多核一遍事实，也是在保护合作空间。'
  explanation: '1943年夏，国民党掀起新的反共高潮，中央通讯社发布攻击共产党的消息，为军事政治压力制造舆论。毛泽东在《质问国民党》中公开追问这种宣传是否代表国民党的政策，并指出它会破坏国共合作、损害抗战团结。这里批评的不只是措辞失礼，而是官方新闻机构用未经公正说明的指控塑造敌意，使共同抗日的伙伴在舆论中被当作攻击对象。战争时期的公开传播会直接影响政治关系和社会动员，因而不能被视为无关紧要的口舌之争。'
historicalEvent: 1943年7月12日，《质问国民党》形成，集中讨论团结及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《质问国民党》从当时的具体问题出发讨论团结，本卡从“中央社于七月六日发出破坏团结、侮辱共产党的消息”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《质问国民党》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
