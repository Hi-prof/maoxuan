revision: 1
status: published
quote: 中央社于七月六日发出破坏团结、侮辱共产党的消息，这是一种极端错误的言论，也是不能容许的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 质问国民党
  authoredAt: '1943-07-12'
themes:
- 团结
interpretation:
  inspiration: 可以把“中央社于七月六日发出破坏团结、侮辱共产党的消息”转成一个工作问题：怎样围绕共同目标处理差异并形成协作？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《质问国民党》中，这句话服务于对团结问题的分析。它把“中央社于七月六日发出破坏团结、侮辱共产党的消息”同实际任务联系起来，要求围绕共同目标处理差异并形成协作。它的现实启发主要是一种工作方法；团结需要原则、沟通和清楚的任务，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1943年7月12日，《质问国民党》形成，集中讨论团结及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《质问国民党》从当时的具体问题出发讨论团结，本卡从“中央社于七月六日发出破坏团结、侮辱共产党的消息”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《质问国民党》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
