revision: 3
status: published
quote: 没有全局在胸，是不会真的投下一着好棋子的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国革命战争的战略问题
  authoredAt: 1936-12
themes:
- 全局思维
interpretation:
  inspiration: '眼前最显眼的一步，不一定是最值得先走的一步。做决定前把时间线拉长一点，看看它会给后面留下什么空间。全局感不是事事都管，而是知道这一小步放在哪里。'
  explanation: '这句话借下棋说明战略与局部行动的关系：心里没有整盘棋，就很难判断眼前这一着究竟好不好。1936年，毛泽东总结土地革命战争经验，讨论弱小红军如何选择作战方向、保存力量并争取主动。战术上的一次得失，要放到全局目标、力量对比和后续行动中衡量。所谓“全局在胸”也不是预知每个细节，而是先抓住决定全局的关系，再据此安排局部，使每一步能够彼此衔接。'
historicalEvent: 1936年12月，毛泽东在陕北红军大学讲授革命战争战略问题。
background: 毛泽东总结土地革命战争经验，系统讨论战争规律、主动权、集中兵力和战略防御。 此卡所选名句着重表现局部动作的价值取决于它在全局中的位置和后续影响。
story: 《中国革命战争的战略问题》围绕战略判断、主动权和力量配置逐层展开。这句话把局部动作的价值取决于它在全局中的位置和后续影响凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
