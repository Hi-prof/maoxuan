revision: 3
status: published
quote: 所谓新民主主义的文化，就是人民大众反帝反封建的文化。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 新民主主义论
  authoredAt: 1940-01
themes:
- 人民文化
interpretation:
  inspiration: '谈“文化属于谁”时，可以落到几个小问题：谁看得见、听得懂、能参与，谁的生活被认真写进来。答案不在漂亮定义里，而在普通人是否真正进入其中。'
  explanation: '这句话是在给“新民主主义文化”下定义：它面向人民大众，并承担反对帝国主义和封建主义的历史任务。《新民主主义论》写于抗战相持阶段，毛泽东把当时中国革命理解为新民主主义革命，并为与之相应的政治、经济、文化提出纲领。文中还把这种文化概括为民族的、科学的、大众的。它不是对所有时代文化的抽象定义，而是特定革命阶段的文化主张；“人民大众”强调文化不能只属于少数精英，要同多数人的解放和生活相连。'
historicalEvent: 1940年1月，毛泽东发表《新民主主义论》。
background: 抗战进入相持阶段，毛泽东系统论述中国革命的历史进程以及新民主主义政治、经济和文化。 此卡所选名句着重表现新民主主义文化在特定革命阶段有明确的人民立场和历史任务。
story: 《新民主主义论》围绕新民主主义革命及其政治文化纲领逐层展开。这句话把新民主主义文化在特定革命阶段有明确的人民立场和历史任务凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
