quote: 什么叫工作，工作就是斗争。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于重庆谈判
  authoredAt: '1945-10-17'
themes:
- 工作
interpretation:
  inspiration: '工作顺利，不是桌面上从来没有问题。有价值的部分常在发现卡点、协调分歧、把事情往前推。若今天解决了一点真实阻力，平静的一天也没有白过。'
  explanation: '“工作就是斗争”在这里不是把所有工作都军事化，而是说工作要面对现实矛盾，主动克服困难。1945年重庆谈判后，毛泽东向延安干部说明，《双十协定》虽已签订，和平民主并不会自动实现，国民党仍可能破坏协议，前途会有曲折。干部不能把有了文件当作任务完成，还要宣传、组织并争取协议成为现实。因此，这里的“斗争”是同阻碍目标实现的具体困难打交道；回避矛盾、等待顺利到来，反而不算真正开始工作。'
historicalEvent: 1945年10月17日，毛泽东在延安干部会上报告重庆谈判情况。
background: 重庆谈判结束后，毛泽东分析和平协议、国内形势和工作中的困难，提醒全党准备走曲折道路。 此卡所选名句着重表现原文把工作理解为主动面对并解决现实困难。
story: 《关于重庆谈判》围绕困难、曲折和主动工作逐层展开。这句话把原文把工作理解为主动面对并解决现实困难凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
