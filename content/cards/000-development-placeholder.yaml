revision: 4
status: published
quote: '谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国社会各阶级的分析
  authoredAt: '1925-12-01'
themes:
  - 阶级分析
  - 革命方法
interpretation:
  inspiration: '碰到牵涉很多人的事情，先别急着表态或选边。花一点时间弄清每个人所处的位置、真正关心什么、能够做什么，再判断谁可以合作，分歧又在哪里。对象看错了，后面越努力，越可能偏离问题本身。判断也不要停在别人说了什么，还要看实际利益和行动有没有变化。'
  explanation: '这句话把辨明敌友放在行动的起点。文章讨论的不是按个人好恶给人贴标签，而是分析不同社会力量的经济地位、政治态度和实际行动，从中判断革命能够依靠谁、团结谁，又要反对谁。当时革命斗争多次受挫，作者认为一个重要原因是没有分清真正的朋友和敌人。“首要问题”因此强调，路线和办法不能凭愿望制定，必须先了解社会结构和力量关系。口头表态只是材料的一部分，现实处境、利益变化和实际选择同样需要观察。只有对象判断比较准确，组织、联合和斗争才有可靠的落点。'
historicalEvent: '1925年12月，第一次国共合作继续发展，毛泽东撰文分析中国各阶级的经济地位和政治态度。'
background: '文章写于第一次国共合作时期，核心任务是辨明中国社会各阶级的经济地位和政治态度，从而回答革命应当依靠谁、团结谁、反对谁。'
story: '编入《毛泽东选集》时，这篇文章被置于第一卷开篇。正文前的说明指出，它同时针对当时党内忽视农民力量的两种错误倾向。'
