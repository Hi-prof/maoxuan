id: d99d5cbc-1193-5d91-8896-7969c9393c53
revision: 2
status: published
quote: '谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国社会各阶级的分析
  authoredAt: '1925-12-01'
themes:
  - 阶级分析
  - 革命方法
interpretation:
  coreMeaning: '这句话把辨明敌友放在行动之前。文章关心的不是给人贴上固定标签，而是从不同社会力量的经济地位和政治态度出发，判断革命可以依靠谁、团结谁，又要反对谁。'
  keyPoint: '“首要问题”强调分析对象和力量关系是制定路线的起点。敌友并非凭个人好恶划分，也不能只看口头表态；判断必须联系当时的社会结构、现实利益和实际行动。'
  contemporaryRelevance: '处理复杂事务时，先弄清参与者的处境、诉求和相互关系，再决定合作与应对方式。若一开始就把对象判断错了，后续投入越多，越可能偏离原本要解决的问题。'
contextExcerpt: '中国过去一切革命斗争成效甚少，其基本原因就是因为不能团结真正的朋友，以攻击真正的敌人。'
background: '文章写于第一次国共合作时期，核心任务是辨明中国社会各阶级的经济地位和政治态度，从而回答革命应当依靠谁、团结谁、反对谁。'
story: '编入《毛泽东选集》时，这篇文章被置于第一卷开篇。正文前的说明指出，它同时针对当时党内忽视农民力量的两种错误倾向。'
