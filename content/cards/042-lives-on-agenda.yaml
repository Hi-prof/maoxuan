revision: 3
status: published
quote: 一切这些群众生活上的问题，都应该把它提到自己的议事日程上。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
- 工作方法
interpretation:
  inspiration: '“这件事很重要”说完以后，不妨顺手给它留出时间，写下谁来跟进。真正的在意通常会在日程表里占一个位置；否则，再真诚的念头也容易被更急的事情推走。'
  explanation: '“提到议事日程上”是说，群众在土地、劳动、住房、医疗和生活物资上的困难，不能只表示同情，而要成为组织正式讨论和解决的工作。1934年根据地处境困难，干部既要完成战争和政权任务，也容易把日常生活看成次要小事。毛泽东强调，群众从这些具体问题中判断政权是否真正代表自己。关心因此不只是一种态度，还意味着安排调查、确定责任、想出办法并看到结果。'
historicalEvent: 1934年1月27日，毛泽东在第二次全国工农兵代表大会上作报告。
background: 中央革命根据地反围剿时期，毛泽东强调既要提出政治任务，也要解决群众日常生活中的实际困难。 此卡所选名句着重表现关心生活要进入正式议程和责任安排，不能只停留在口头。
story: 《关心群众生活，注意工作方法》围绕群众生活与工作方法逐层展开。这句话把关心生活要进入正式议程和责任安排，不能只停留在口头凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
