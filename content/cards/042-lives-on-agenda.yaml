id: bba36731-b0fa-59e1-a074-f99194a3f2c2
revision: 2
status: published
quote: 一切这些群众生活上的问题，都应该把它提到自己的议事日程上。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
- 工作方法
interpretation:
  inspiration: 把重要但容易被忽略的问题列入会议、负责人和完成时间，才能真正推进。
  explanation: 《关心群众生活，注意工作方法》写到群众生活与工作方法时，用这句话说明关心生活要进入正式议程和责任安排，不能只停留在口头。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1934年1月27日，毛泽东在第二次全国工农兵代表大会上作报告。
background: 中央革命根据地反围剿时期，毛泽东强调既要提出政治任务，也要解决群众日常生活中的实际困难。 此卡所选名句着重表现关心生活要进入正式议程和责任安排，不能只停留在口头。
story: 《关心群众生活，注意工作方法》围绕群众生活与工作方法逐层展开。这句话把关心生活要进入正式议程和责任安排，不能只停留在口头凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
