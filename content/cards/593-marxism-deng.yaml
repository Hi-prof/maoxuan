quote: 香港的稳定，除了经济的发展以外，还要有个稳定的政治制度。
literature:
  series: 马原思考
  volume: 邓小平
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1978'
themes:
- 马原思考
interpretation:
  inspiration: 面对复杂局面，先找主要矛盾和关键条件，避免把所有问题混成一团。
  explanation: 这句出自〈要吸收国际的经验〉，1988年6月3日，可从“马原思考”角度理解。这句话提醒我们用现实关系和发展过程来理解问题，而不是满足于抽象判断。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 改革开放初期，解放思想、实事求是与发展问题成为中国社会的重要讨论。
background: 邓小平的讲话常从实践标准、发展、改革和人民生活的实际改善来讨论马克思主义的方法论。
story: 此卡按可追溯出处筛选自邓小平语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
