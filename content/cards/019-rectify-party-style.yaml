revision: 4
status: published
quote: '反对主观主义以整顿学风，反对宗派主义以整顿党风，反对党八股以整顿文风，这就是我们的任务。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 整顿党的作风
  authoredAt: '1942-02-01'
themes:
  - 作风建设
  - 党的建设
interpretation:
  inspiration: '团队出了问题，别只盯着最后一次失误。可以从三个地方往回看：判断依据靠不靠谱，协作中有没有小圈子和信息阻隔，说话写东西别人能不能听懂。很多执行故障不是一个人的单点错误，而是认识、关系和表达互相放大。几处一起改，比只换一句口号更有效。'
  explanation: '这句话把整风任务落到学风、党风和文风三个方面。主观主义影响人们怎样认识问题，容易让理论脱离实际；宗派主义影响组织内部和党群关系，使小团体利益妨碍共同工作；党八股则让思想表达变得空洞、僵硬，难以让人理解。三项任务并非只改文字、礼节或个别人的脾气，而是同一类作风问题在认识、组织和表达上的不同表现。思想方法不变，只修改措辞，空话还会回来；只谈表面团结，不检查立场和实际工作，关系问题也不会消失。演说用“窑洞有风”的比喻引出这些问题，要求通过研究、教育和具体检查加以克服，目的在于让理论、组织生活和群众工作重新接上实际。'
historicalEvent: '1942年2月1日，毛泽东在中共中央党校开学典礼上演说，延安整风由此深入展开。'
background: '这是毛泽东在中共中央党校开学典礼上的演说，也是延安整风的重要文献。文章把学风、党风和文风放在同一套作风问题中检查。'
story: '演说先用“窑洞有风”的比喻引出三股不良作风，随后分别分析其历史根源、思想方法和组织表现，要求通过研究和教育加以克服。'
