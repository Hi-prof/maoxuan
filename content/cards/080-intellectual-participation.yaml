revision: 3
status: published
quote: 革命的力量的组织和革命工作的建设，离开革命的知识分子的参加，是不能成功的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 五四运动
  authoredAt: '1939-05-01'
themes:
- 人才
interpretation:
  inspiration: '专业知识不是站在生活之外点评。它进入真实任务，和一线经验碰在一起，才容易变成能用的办法。专家与当事人彼此补足，比谁单方面教谁更有意思。'
  explanation: '这句话肯定革命知识分子在宣传、组织和各项建设中的重要作用，认为缺少他们的参与，革命力量难以组织起来，工作也难以展开。1939年五四运动二十周年，毛泽东回顾青年和知识分子在反帝反封建运动中的积极性，同时强调他们要同工农群众结合。文章不是把知识分子单独视为决定力量，而是说明专业知识、文化能力和组织工作不可缺少；这些能力只有进入广大群众的实际斗争，才可能成为革命整体力量的一部分。'
historicalEvent: 1939年5月1日，毛泽东为五四运动二十周年写作此文。
background: 五四运动二十周年之际，毛泽东分析知识分子、青年学生与工农群众在民主革命中的结合。 此卡所选名句着重表现知识分子参与是组织力量和建设工作的重要条件。
story: 《五四运动》围绕青年、知识分子与群众结合逐层展开。这句话把知识分子参与是组织力量和建设工作的重要条件凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
