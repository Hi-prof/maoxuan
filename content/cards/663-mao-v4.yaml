revision: 3
status: published
quote: 各地必须在今后几个月内，不论战争如何忙，坚决地领导农民群众解决土地问题，并在土地改革基础上布置明年的大规模的生产工作。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 三个月总结
  authoredAt: '1946-10-01'
themes:
- 群众路线
interpretation:
  inspiration: '忙于处理最急的事时，也要给下一季留一点准备。眼前任务和长期基础并不总是二选一；找到会影响后来生产和参与的关键工作，越忙越不能完全搁下。'
  explanation: '1946年全面内战开始三个月后，毛泽东总结战局，要求各解放区即使军事工作繁忙，也要推进土地改革，并在此基础上安排来年生产。土地问题直接关系农民利益，解决后才能更广泛地动员群众支持战争；分地若不紧接生产，又可能影响农业和根据地供给。因此，军事、改革和生产不是彼此排斥的三件事，而是解放区能否长期坚持的相连环节。句子强调在战争压力下仍要抓住群众基础和下一阶段生活。'
historicalEvent: 1946年10月1日，《三个月总结》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《三个月总结》从当时的具体问题出发讨论群众路线，本卡从“各地必须在今后几个月内”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《三个月总结》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
