revision: 1
status: published
quote: 各地必须在今后几个月内，不论战争如何忙，坚决地领导农民群众解决土地问题，并在土地改革基础上布置明年的大规模的生产工作。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 三个月总结
  authoredAt: '1946-10-01'
themes:
- 群众路线
interpretation:
  inspiration: 可以把“各地必须在今后几个月内”转成一个工作问题：怎样把当事人的处境和实际需要放进决策？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《三个月总结》中，这句话服务于对群众路线问题的分析。它把“各地必须在今后几个月内”同实际任务联系起来，要求把当事人的处境和实际需要放进决策。它的现实启发主要是一种工作方法；尊重群众不等于放弃分析和责任边界，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1946年10月1日，《三个月总结》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《三个月总结》从当时的具体问题出发讨论群众路线，本卡从“各地必须在今后几个月内”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《三个月总结》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
