quote: 一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关于纠正党内的错误思想
  authoredAt: 1929-12
themes:
- 矛盾分析
interpretation:
  inspiration: '一次谈不清的事，可以先停在一个不妨碍工作的地方。等材料多一点、情绪低一点，再回来讨论。并非所有问题都要当场定输赢，清楚比仓促更重要。'
  explanation: '这句话谈的是党内讨论怎样形成明确结论：一次会议解决不了，可以在不影响工作的前提下留待再次讨论。古田会议决议反对讨论问题时随便下结论，也反对无休止争吵。复杂分歧可能需要补充事实、澄清概念和多次交换意见；暂时搁置不是逃避，而是给认识成熟留出时间。“以不妨碍工作为条件”又限定了讨论不能让组织停摆。它体现的是既认真求得明晰结论，也不把一次会议的速度当成正确性的证明。'
historicalEvent: 1929年12月，《关于纠正党内的错误思想》形成，集中讨论矛盾分析及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关于纠正党内的错误思想》从当时的具体问题出发讨论矛盾分析，本卡从“一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《关于纠正党内的错误思想》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
