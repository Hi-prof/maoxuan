id: c611891d-56f0-4cca-9265-802ab5db91aa
revision: 2
status: published
quote: 一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关于纠正党内的错误思想
  authoredAt: 1929-12
themes:
- 矛盾分析
interpretation:
  inspiration: 可以把“一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论”转成一个工作问题：怎样把对象拆开比较，找出主次和变化条件？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《关于纠正党内的错误思想》中，这句话服务于对矛盾分析问题的分析。它把“一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论”同实际任务联系起来，要求把对象拆开比较，找出主次和变化条件。它的现实启发主要是一种工作方法；分类是为了接近事实，不是给现实贴固定标签，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1929年12月，《关于纠正党内的错误思想》形成，集中讨论矛盾分析及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《关于纠正党内的错误思想》从当时的具体问题出发讨论矛盾分析，本卡从“一次不能解决的，二次再议（以不妨碍工作为条件），以期得到明晰的结论”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《关于纠正党内的错误思想》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
