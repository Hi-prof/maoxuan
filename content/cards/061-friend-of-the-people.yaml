quote: 共产党员应在民众运动中，成为民众的朋友，而不是民众的上司。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国共产党在民族战争中的地位
  authoredAt: '1938-10-14'
themes:
- 群众关系
interpretation:
  inspiration: '想帮一个人或一个群体时，先坐到他们身边听一听。朋友会询问需要，也愿意被纠正；“上司”则容易替别人决定。少一点居高临下，合作会自然许多。'
  explanation: '这句话说，党员参加群众运动时，应当同群众建立朋友关系，而不是把自己摆在发号施令的上级位置。1938年抗战扩大，党需要在广泛的群众工作中发挥组织作用。毛泽东在六届六中全会上强调党员既要做模范，也要向群众学习。称“朋友”不是取消领导责任，而是说明领导不能靠身份和命令取得；只有了解群众的处境、尊重他们的经验，并同他们一起解决问题，政治主张才可能变成群众自己的行动。'
historicalEvent: 1938年10月14日，毛泽东在中共六届六中全会上作报告。
background: 抗战进入相持阶段前后，毛泽东讨论共产党员在民族战争中的模范作用、学习责任和群众关系。 此卡所选名句着重表现参与群众工作应当建立平等、学习和共同解决问题的关系。
story: 《中国共产党在民族战争中的地位》围绕党员的模范作用和群众关系逐层展开。这句话把参与群众工作应当建立平等、学习和共同解决问题的关系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
