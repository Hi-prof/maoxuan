revision: 1
status: published
quote: 共产党员应在民众运动中，成为民众的朋友，而不是民众的上司。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国共产党在民族战争中的地位
  authoredAt: '1938-10-14'
themes:
- 群众关系
interpretation:
  inspiration: 进入陌生群体时先倾听和协作，不用职位替代了解，也不把帮助变成居高临下。
  explanation: 在《中国共产党在民族战争中的地位》讨论党员的模范作用和群众关系的语境中，这句话把重点放在参与群众工作应当建立平等、学习和共同解决问题的关系。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1938年10月14日，毛泽东在中共六届六中全会上作报告。
background: 抗战进入相持阶段前后，毛泽东讨论共产党员在民族战争中的模范作用、学习责任和群众关系。 此卡所选名句着重表现参与群众工作应当建立平等、学习和共同解决问题的关系。
story: 《中国共产党在民族战争中的地位》围绕党员的模范作用和群众关系逐层展开。这句话把参与群众工作应当建立平等、学习和共同解决问题的关系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
