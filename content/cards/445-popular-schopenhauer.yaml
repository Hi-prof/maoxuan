quote: 友谊就好像传说中的海怪，大家绘声绘影，可是却仍有待证实。想要拥有一位如圣经所言比亲兄弟更亲的朋友，可能比一睹尼斯海怪的身影还难呢！
literature:
  series: 名人名言
  volume: 叔本华
  workTitle: 热门名人语录（出处见来源页）
