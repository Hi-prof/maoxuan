revision: 1
status: published
quote: 共产党领导的武力和民众已成了抗日战争中的中流砥柱。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 揭破远东慕尼黑的阴谋
  authoredAt: '1941-05-25'
themes:
- 群众路线
interpretation:
  inspiration: 从“共产党领导的武力和民众已成了抗日战争中的中流砥柱”出发，可以把态度转成行动：把当事人的处境和实际需要放进决策，并让事实、分工和实际结果检验原先的判断。
  explanation: 《揭破远东慕尼黑的阴谋》讨论的是特定历史条件下的群众路线问题。这里用“共产党领导的武力和民众已成了抗日战争中的中流砥柱”指出行动应有的着力点，核心在于把当事人的处境和实际需要放进决策。原文并不支持脱离对象的简单化理解，因为尊重群众不等于放弃分析和责任边界。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1941年5月25日，《揭破远东慕尼黑的阴谋》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《揭破远东慕尼黑的阴谋》从当时的具体问题出发讨论群众路线，本卡从“共产党领导的武力和民众已成了抗日战争中的中流砥柱”切入全文的一层论证。
story: 《揭破远东慕尼黑的阴谋》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
