quote: 共产党领导的武力和民众已成了抗日战争中的中流砥柱。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 揭破远东慕尼黑的阴谋
  authoredAt: '1941-05-25'
themes:
- 群众路线
interpretation:
  inspiration: '真正撑住局面的力量，常不是最会宣称重要的人，而是持续承担任务、同许多人保持联系的人。看一支力量的分量，不妨看它在困难中实际支撑了什么。'
  explanation: '这句话判断，到1941年，共产党领导的八路军、新四军、敌后根据地和广大民众，已经成为中国抗战的重要支柱。文章所说的“远东慕尼黑阴谋”，是指以牺牲中国利益、推动对日妥协来换取某种国际安排的危险。毛泽东认为，中国内部仍有投降和反共势力，但敌后抗战力量的发展，使任何轻易出卖抗战的方案都会遇到坚强抵抗。“中流砥柱”在这里由实际的敌后作战、群众动员和根据地建设支撑，并非抽象的自我赞誉。'
historicalEvent: 1941年5月25日，《揭破远东慕尼黑的阴谋》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《揭破远东慕尼黑的阴谋》从当时的具体问题出发讨论群众路线，本卡从“共产党领导的武力和民众已成了抗日战争中的中流砥柱”切入全文的一层论证。
story: 《揭破远东慕尼黑的阴谋》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
