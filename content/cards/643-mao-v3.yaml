revision: 3
status: published
quote: 我们应该讲，我们这次大会是关系全中国四亿五千万人民命运的一次大会。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 两个中国之命运
  authoredAt: '1945-04-23'
themes:
- 群众路线
interpretation:
  inspiration: '会议的分量不在场面，而在决定会落到多少人的生活上。议题越大，越需要把抽象的“大家”还原成具体人群，想清他们将得到什么、承担什么。'
  explanation: '这句话出自1945年中共七大开幕词。抗战接近胜利，中国战后将走向何种政治道路成为现实问题。毛泽东把前途概括为“两个中国之命运”：是继续半殖民地半封建、专制分裂的旧中国，还是建立独立、自由、民主、统一和富强的新中国。说大会关系四亿五千万人民命运，是强调七大制定的政治路线不只是党内事务，而要回答全国人民的战后生活和国家制度问题。大会的重要性最终要由其主张能否回应广大人民来衡量。'
historicalEvent: 1945年4月23日，《两个中国之命运》形成，集中讨论群众路线及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《两个中国之命运》从当时的具体问题出发讨论群众路线，本卡从“我们应该讲，我们这次大会是关系全中国四亿五千万人民命运的一次大会”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《两个中国之命运》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
