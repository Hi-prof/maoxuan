quote: 如果我们把“劳动所得”这个用语首先理解为劳动的产品，那末集体的劳动所得就是社会总产品。
literature:
  series: 马原思考
  volume: 卡尔·马克思
  workTitle: 《哥达纲领批判》
  authoredAt: '1848'
themes:
- 劳动
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《哥达纲领批判》，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
background: 马克思的文本围绕实践、劳动、社会关系、历史发展和人的解放展开分析。
story: 此卡从《哥达纲领批判》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
