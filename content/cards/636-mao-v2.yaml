revision: 3
status: published
quote: 我们应该把统一战线发展充实起来，把民众加进去。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 国共合作成立后的迫切任务
  authoredAt: '1937-09-29'
themes:
- 群众路线
interpretation:
  inspiration: '两个代表握手，只是合作的开始。让真正做事、承受影响的人也能进入，关系才会从一纸约定长成有内容的共同体。形式要靠参与来充实。'
  explanation: '1937年国民党公布中共中央提交的合作宣言，第二次国共合作正式形成。毛泽东随即指出，统一战线若只停留在两党上层关系还不够，必须把广大民众组织进来，开放救亡运动，并落实民主和民生政策。只有工人、农民、青年、妇女等真正参加抗战，合作才有社会基础和持续力量。“发展充实”因此是把政治协议变成广泛群众行动，而不是单纯扩大组织名单。民众既是抗战的参与者，也是推动合作不倒退的重要力量。'
historicalEvent: 1937年9月29日，《国共合作成立后的迫切任务》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《国共合作成立后的迫切任务》从当时的具体问题出发讨论群众路线，本卡从“我们应该把统一战线发展充实起来”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《国共合作成立后的迫切任务》中的理由和限制一起理解。
