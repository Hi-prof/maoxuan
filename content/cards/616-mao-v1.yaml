id: cb0ea59d-37f0-4031-9d0e-b3b40e7b7af2
revision: 2
status: published
quote: 只有坚决地实行劳动法，才能改善工人群众的生活，使工人群众积极地迅速地参加经济建设事业，而加强他们对于农民的领导作用。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
- 群众路线
interpretation:
  inspiration: “只有坚决地实行劳动法”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《必须注意经济工作》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“只有坚决地实行劳动法”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1933年8月12日，《必须注意经济工作》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《必须注意经济工作》从当时的具体问题出发讨论群众路线，本卡从“只有坚决地实行劳动法”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《必须注意经济工作》中的理由和限制一起理解。
