revision: 3
status: published
quote: 只有坚决地实行劳动法，才能改善工人群众的生活，使工人群众积极地迅速地参加经济建设事业，而加强他们对于农民的领导作用。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
- 群众路线
interpretation:
  inspiration: '想让人积极投入共同工作，先让基本待遇和规则站得住。安全感不是积极性的对手；被公平对待的人，往往更愿意把能力放进长期的事情里。'
  explanation: '这句话主张认真执行苏区劳动法，改善工人的工资、工时和生活待遇，使他们更积极地参加根据地经济建设，并发挥工人阶级的领导作用。1933年中央革命根据地既要支持战争，也要恢复和发展生产。毛泽东反对把经济建设理解为只增加产量、忽视劳动者权益；如果工人生活没有保障，政治动员就缺少实际基础。劳动法在这里既是保护工人利益的制度，也是把工人积极性同根据地建设联系起来的条件。'
historicalEvent: 1933年8月12日，《必须注意经济工作》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《必须注意经济工作》从当时的具体问题出发讨论群众路线，本卡从“只有坚决地实行劳动法”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《必须注意经济工作》中的理由和限制一起理解。
