revision: 1
status: published
quote: 已是悬崖百丈冰，犹有花枝俏。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 卜算子·咏梅
  authoredAt: 1961-12
themes:
- 坚韧
interpretation:
  inspiration: 条件艰难时先守住最重要的品质和工作，让小而真实的进展成为支点。
  explanation: 这句话来自《卜算子·咏梅》，原文关注坚韧、报春和完成后的谦退，核心是以严寒悬崖上的梅花写逆境中的生命力。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1961年12月，毛泽东写作《卜算子·咏梅》。
background: 毛泽东读陆游咏梅词后反其意而作，用风雪中的梅花写坚韧、报春和不争功。 此卡所选名句着重表现以严寒悬崖上的梅花写逆境中的生命力。
story: 《卜算子·咏梅》以景物、行动和历史联想组织诗意。这一句集中呈现以严寒悬崖上的梅花写逆境中的生命力，既有鲜明画面，也保留了作品写作时的现实背景。
