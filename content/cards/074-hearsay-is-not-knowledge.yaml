interpretation:
  inspiration: 重要结论至少核对原始材料、不同当事人和相反证据，不把转述当成事实终点。
  explanation: 《《农村调查》的序言和跋》写到调查研究和向群众学习时，用这句话说明零散耳闻不能替代系统、直接和可核对的调查。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1941年，毛泽东为《农村调查》写序言和跋。
background: 延安整风前后，毛泽东重印农村调查材料，强调从实际出发、向群众学习和掌握第一手知识。 此卡所选名句着重表现零散耳闻不能替代系统、直接和可核对的调查。
story: 《《农村调查》的序言和跋》围绕调查研究和向群众学习逐层展开。这句话把零散耳闻不能替代系统、直接和可核对的调查凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
