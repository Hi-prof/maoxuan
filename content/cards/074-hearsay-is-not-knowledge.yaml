quote: 东张西望，道听途说，决然得不到什么完全的知识。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 《农村调查》的序言和跋
  authoredAt: '1941'
themes:
- 求真
interpretation:
  inspiration: '消息听得多，不等于事情看得清。遇到重要判断，回到原始材料，问问不同位置的人，再留意有没有反例。少转一手，理解通常就多一分踏实。'
  explanation: '“东张西望、道听途说”指的是到处看一点、零散听几句，却没有深入而系统地调查。毛泽东在《农村调查》的序言和跋中回顾早年调查经验，强调要了解中国社会，不能靠二手传闻拼出全貌。完整知识需要有目的地选择对象，听取不同方面的材料，追问事实之间的关系，并在现场核对。这里并非否定所有间接资料，而是提醒：当结论要指导实际工作时，未经核实的耳闻不能冒充对具体情况的真正了解。'
historicalEvent: 1941年，毛泽东为《农村调查》写序言和跋。
background: 延安整风前后，毛泽东重印农村调查材料，强调从实际出发、向群众学习和掌握第一手知识。 此卡所选名句着重表现零散耳闻不能替代系统、直接和可核对的调查。
story: 《《农村调查》的序言和跋》围绕调查研究和向群众学习逐层展开。这句话把零散耳闻不能替代系统、直接和可核对的调查凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
