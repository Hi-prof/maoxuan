revision: 1
status: published
quote: 问苍茫大地，谁主沉浮？
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 沁园春·长沙
  authoredAt: '1925'
themes:
- 青年担当
interpretation:
  inspiration: 把对时代的感慨转成责任问题：自己愿意学习什么、承担什么、改变什么。
  explanation: 在《沁园春·长沙》讨论青年抱负、时代责任和进取精神的语境中，这句话把重点放在面对辽阔天地追问谁来主宰国家和时代命运。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1925年秋，毛泽东离开长沙前往广州途中写作《沁园春·长沙》。
background: 毛泽东重游长沙、橘子洲，回忆青年时代的求学和社会活动，以秋景写抱负和时代追问。 此卡所选名句着重表现面对辽阔天地追问谁来主宰国家和时代命运。
story: 《沁园春·长沙》以景物、行动和历史联想组织诗意。这一句集中呈现面对辽阔天地追问谁来主宰国家和时代命运，既有鲜明画面，也保留了作品写作时的现实背景。
