quote: 一切革命同志须知：国民革命需要一个大的农村变动。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 湖南农民运动考察报告
  authoredAt: 1927-03
themes:
- 社会调查
interpretation:
  inspiration: '想让一件事真正变好，不能只调整最显眼、最熟悉的部分。多问一句“人数最多、声音最小的人会受到什么影响”，常能看见方案里原来没注意到的地方。'
  explanation: '这句话的意思是，中国当时要完成国民革命，就绕不开农村社会关系的深刻变化。20世纪20年代，农民占人口绝大多数，却长期受地主、宗族和地方权力压迫。《湖南农民运动考察报告》用实地材料说明，农民运动不是革命之外的混乱插曲，而是改变旧有权力结构的重要力量。毛泽东是在提醒党内外的革命者：如果多数农民的处境没有改变，所谓全国性的革命就缺少最广泛的社会基础。'
historicalEvent: 1927年春，毛泽东完成湖南农民运动实地考察报告。
background: 大革命时期，毛泽东考察湖南多县农民运动，以调查事实回应对农民运动的怀疑和指责。 此卡所选名句着重表现重大变革必须触及占人口多数者的实际处境。
story: 《湖南农民运动考察报告》围绕农民运动的力量、性质和领导问题逐层展开。这句话把重大变革必须触及占人口多数者的实际处境凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
