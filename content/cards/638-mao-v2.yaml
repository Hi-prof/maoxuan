revision: 3
status: published
quote: 在我党我军内部，只有坚持对顽固派的斗争，才能振奋精神，发扬勇气，团结干部，扩大力量，巩固军队和巩固党。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 放手发展抗日力量，抵抗反共顽固派的进攻
  authoredAt: '1940-05-04'
themes:
- 团结
interpretation:
  inspiration: '一支队伍若面对不合理压力总是后退，内部的人会渐渐失去信心。把原则和边界守住，成员才知道共同目标不是一句空话。坚定可以有分寸，但不能只剩忍让。'
  explanation: '这句话说，面对国民党顽固派的军事进攻和政治压制，共产党若坚持有理、有利、有节的斗争，反而能够鼓舞内部士气、团结干部并巩固组织。1940年反共摩擦加剧，党内有些地方因害怕破坏统一战线而退让，不敢发展抗日力量。毛泽东认为，无原则退让既不能换来团结，还会让党员和军队失去信心。这里的斗争对象和方式都有明确边界，目的仍是制止反共进攻、维护抗日力量，不是把统一战线变成全面决裂。'
historicalEvent: 1940年5月4日，《放手发展抗日力量，抵抗反共顽固派的进攻》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《放手发展抗日力量，抵抗反共顽固派的进攻》从当时的具体问题出发讨论团结，本卡从“在我党我军内部，只有坚持对顽固派的斗争，才能振奋精神，发扬勇气，团结干部，扩大力量，巩固军队和巩固党”切入全文的一层论证。
story: 《放手发展抗日力量，抵抗反共顽固派的进攻》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
