quote: 我们应该深刻地注意群众生活的问题，从土地、劳动问题，到柴米油盐问题。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 关心群众生活，注意工作方法
  authoredAt: '1934-01-27'
themes:
- 群众生活
interpretation:
  inspiration: '关心一个人，不必总从宏大的问题说起。问问他最近吃饭、通勤、睡眠或办事哪里不方便，往往更容易找到能帮上忙的地方。小问题被认真对待，也会让关系变得可信。'
  explanation: '这句话要求干部把群众生活当作具体工作，从土地和劳动这样的大问题，一直管到柴米油盐这样的日常难处。1934年，中央革命根据地正处在反“围剿”和物资紧张时期，动员群众支援革命不能只靠政治号召。毛泽东把改善生活同争取群众支持联系起来：群众为什么愿意参加、怎样感受到新政权与自己有关，最终要落在可感知的生活变化上。列举柴米油盐，正是把“关心群众”从口号变成可以检查的事务。'
historicalEvent: 1934年1月27日，毛泽东在第二次全国工农兵代表大会上作报告。
background: 中央革命根据地反围剿时期，毛泽东强调既要提出政治任务，也要解决群众日常生活中的实际困难。 此卡所选名句着重表现公共目标要同普通人的具体生活问题连接起来。
story: 《关心群众生活，注意工作方法》围绕群众生活与工作方法逐层展开。这句话把公共目标要同普通人的具体生活问题连接起来凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
