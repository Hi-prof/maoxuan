revision: 1
status: published
quote: 没有知识分子的参加，革命的胜利是不可能的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 大量吸收知识分子
  authoredAt: '1939-12-01'
themes:
- 人才
interpretation:
  inspiration: 不要把专业人才当点缀；给出明确任务、实践环境和共同责任，才能形成有效贡献。
  explanation: 在《大量吸收知识分子》讨论人才、学习和革命队伍建设的语境中，这句话把重点放在革命队伍需要吸收并正确使用具有专业知识的人才。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1939年12月1日，中共中央作出大量吸收知识分子的决定。
background: 抗日根据地建设需要各类人才，毛泽东要求各级组织正确认识知识分子的作用并做好团结教育。 此卡所选名句着重表现革命队伍需要吸收并正确使用具有专业知识的人才。
story: 《大量吸收知识分子》围绕人才、学习和革命队伍建设逐层展开。这句话把革命队伍需要吸收并正确使用具有专业知识的人才凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
