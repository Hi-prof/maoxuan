revision: 3
status: published
quote: 没有知识分子的参加，革命的胜利是不可能的。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 大量吸收知识分子
  authoredAt: '1939-12-01'
themes:
- 人才
interpretation:
  inspiration: '请专业的人加入，不只是名单上多一个名字。让他知道真实问题，给出能负责的空间，也让团队理解他的长处。人才被认真使用，知识才不会停在门口。'
  explanation: '这句话强调抗日和根据地建设不能缺少知识分子。1939年，大批青年知识分子投身抗战，一些党组织却仍有排斥、怀疑或不会使用他们的问题。中共中央作出《大量吸收知识分子》的决定，要求大胆吸收他们参加军队、政权、教育和群众工作，同时在实践中帮助他们同工农群众结合。“胜利是不可能的”并非把知识分子置于群众之上，而是纠正忽视文化、技术和专业人才的倾向，说明革命队伍需要不同能力共同构成。'
historicalEvent: 1939年12月1日，中共中央作出大量吸收知识分子的决定。
background: 抗日根据地建设需要各类人才，毛泽东要求各级组织正确认识知识分子的作用并做好团结教育。 此卡所选名句着重表现革命队伍需要吸收并正确使用具有专业知识的人才。
story: 《大量吸收知识分子》围绕人才、学习和革命队伍建设逐层展开。这句话把革命队伍需要吸收并正确使用具有专业知识的人才凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
