quote: 游击区能够和必须进行军民的大规模的生产运动，一切问题都解决了。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 游击区也能够进行生产
  authoredAt: '1945-01-31'
themes:
- 经济建设
interpretation:
  inspiration: '环境不稳定时，人容易认定“等安稳了再建设”。可有些基本能力正要在不安稳中一点点做起来。把任务拆小、方法变灵活，生产与应对变化也许能同时进行。'
  explanation: '这句话反对“游击区战斗频繁，无法开展生产”的看法。1945年敌后供给困难，毛泽东总结一些地区经验，认为军民仍可以利用战斗间隙、分散地开展农业和手工业生产，以改善粮食、经费和日用品供应。这里的“大规模”不是照搬稳定根据地的集中方式，而是动员范围广、方法适应游击环境。文中说“一切问题都解决了”着重说明生产能缓解供给、群众负担和军民关系等连锁困难，并非真的消除战争中的所有问题。'
historicalEvent: 1945年1月31日，《游击区也能够进行生产》形成，集中讨论经济建设及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《游击区也能够进行生产》从当时的具体问题出发讨论经济建设，本卡从“游击区能够和必须进行军民的大规模的生产运动”切入全文的一层论证。
story: 文本围绕经济建设逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《游击区也能够进行生产》中的理由和限制一起理解。
