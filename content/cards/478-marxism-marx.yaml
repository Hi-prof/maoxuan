  inspiration: 面对复杂局面，先找主要矛盾和关键条件，避免把所有问题混成一团。
  explanation: 这句出自《政治经济学批判》导言，可从“劳动”角度理解。劳动在这里不仅是个人付出，也关联生产、创造和社会关系。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
