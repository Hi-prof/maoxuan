id: a04efea5-d021-4d02-9968-3f3a9a078595
revision: 3
status: published
quote: 如果我们的干部不能迅速学会管理城市，则我们将会发生极大困难。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 把军队变为工作队
  authoredAt: '1949-02-08'
themes:
- 领导方法
interpretation:
  inspiration: 角色变了，旧经验未必自动够用。接手一项陌生工作时，专门留一段时间补课、请教熟手、先做小范围练习，比一边硬撑一边犯同样的错从容得多。
  explanation: 这句话是说，如果军队干部不能尽快掌握城市管理，接管新区就会遇到严重困难。1949年2月，平津战役结束、解放军准备南下，文章要求部队除继续作战外，还要转为承担城市和乡村工作的“工作队”；金融、财政、工商业等都是过去不熟悉的新课题。作者甚至安排一个月集中学习城市和新区工作，反映的是革命重心由战争向接管与治理转换时的能力缺口。
historicalEvent: 1949年2月8日，《把军队变为工作队》形成，集中讨论领导方法及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《把军队变为工作队》从当时的具体问题出发讨论领导方法，本卡从“如果我们的干部不能迅速学会管理城市”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“如果我们的干部不能迅速学会管理城市”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
