revision: 3
status: published
quote: '革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 湖南农民运动考察报告
  authoredAt: '1927-03'
themes:
  - 调查研究
  - 群众运动
interpretation:
  inspiration: '评价自己不熟悉的社会现象时，先去现场听一听当事人怎么说，看看冲突是怎样形成的。只按平静时期的习惯下结论，容易忽略积累已久的问题；只凭激烈场面判断，也可能看不见具体后果。把参与者的处境、行动原因和实际影响放在一起，判断才不会停在一句“太过分了”上。'
  explanation: '这段话回应的是当时社会上对湖南农民运动“过分”“糟得很”的指责。作者用请客、作文章、绘画绣花等日常活动作对照，说明旧有阶级关系被打破时，不会像礼仪活动那样温和从容。它要反驳的是脱离现场、只按旧秩序的表面标准评价农民行动的看法。理解时必须放回1927年的农民运动语境：文章来自三十二天实地考察，依据调查会和各地见闻展开，并不是抽象赞美一切冲动，更不能据此把无边界的暴力当作普遍原则。重点是先弄清长期压迫、力量变化和实际行动，再评价冲突的性质与后果。'
historicalEvent: '1927年初，毛泽东在湖南多地考察农民运动三十二天，随后于3月写成这份报告。'
background: '一九二七年初，毛泽东在湖南多地实地考察三十二天，通过调查会听取农民和农运工作者的报告，随后写成这篇考察报告。'
story: '报告所见与城市绅士阶级对农民运动的议论大不相同。文章用大量具体见闻回应“过分”“糟得很”等指责，强调先了解现场再作判断。'
