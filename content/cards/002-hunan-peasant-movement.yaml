id: 987c2a94-7bde-5f45-aca8-17beb0a2ef35
revision: 2
status: published
quote: '革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 湖南农民运动考察报告
  authoredAt: '1927-03'
themes:
  - 调查研究
  - 群众运动
interpretation:
  coreMeaning: '这段话针对把革命想象成温和礼仪活动的看法，指出阶级关系发生根本改变时必然伴随尖锐冲突。它用一连串日常事物作对照，是为了揭示革命行动与文雅修饰之间的性质差别。'
  keyPoint: '理解这句话不能离开一九二七年农民运动的具体语境。文章是在回应“过分”等指责，并不等于把任何冲动或无边界的暴力都视为正当，更不能把历史判断直接当作日常处事原则。'
  contemporaryRelevance: '面对剧烈社会变化，不能只用平静时期的表面尺度评判，也不能用好听的措辞掩盖真实冲突。更可靠的做法是进入现场，分清冲突来源、参与者处境和行动后果。'
contextExcerpt: '革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。'
background: '一九二七年初，毛泽东在湖南多地实地考察三十二天，通过调查会听取农民和农运工作者的报告，随后写成这篇考察报告。'
story: '报告所见与城市绅士阶级对农民运动的议论大不相同。文章用大量具体见闻回应“过分”“糟得很”等指责，强调先了解现场再作判断。'
