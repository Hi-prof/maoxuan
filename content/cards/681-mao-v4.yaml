revision: 3
status: published
quote: 平分土地以后，必须号召农民发展生产，丰衣足食，并劝告农民组织变工队、互助组或换工班一类的农业互助合作组织。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于目前党的政策中的几个重要问题
  authoredAt: '1948-01-18'
themes:
- 群众路线
interpretation:
  inspiration: 把分配方案做完，不等于事情就结束。比如团队重新分工后，还得看看工具、协作和日常运转能不能跟上；公平落到生活里，往往靠这些后续的小事。
  explanation: 这句话是说，土地平分之后，工作重点还要转向恢复和发展农业生产，并在农民自愿、现实可行的基础上组织换工互助。1948年初，解放区土地改革深入推进，《关于目前党的政策中的几个重要问题》同时纠正工作中的偏差；这段话提醒干部，改变土地占有关系不是终点，农民能否稳定生产、改善生活同样重要。这里的互助组织对应当时小农生产条件，不能脱离那一阶段理解。
historicalEvent: 1948年1月18日，《关于目前党的政策中的几个重要问题》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于目前党的政策中的几个重要问题》从当时的具体问题出发讨论群众路线，本卡从“平分土地以后，必须号召农民发展生产，丰衣足食，并劝告农民组织变工队、互助组或换工班一类的农业互助合作组织”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“平分土地以后，必须号召农民发展生产，丰衣足食，并劝告农民组织变工队、互助组或换工班一类的农业互助合作组织”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
