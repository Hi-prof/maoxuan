quote: 没有一个人民的军队，便没有人民的一切。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 人民军队
interpretation:
  inspiration: '读战争年代的句子，先别急着变成日常方法。它能提醒我们理解安全和权利需要现实保障，却不意味着普通关系中也该依赖强力。语境留下来，启发才不会跑偏。'
  explanation: '“没有人民的军队，便没有人民的一切”是在抗日战争和革命战争的语境中说，人民已经争取到的生存、权利和政治成果，需要一支属于人民、服务人民的武装力量来保卫。1945年《论联合政府》回顾八路军、新四军在抗战中的发展，并讨论未来国家建设。毛泽东用高度概括的语言强调军队对民族解放和人民政权的作用。它不是说人民生活只靠军事力量构成，更不是一般性的强力崇拜；“人民的军队”本身包含政治归属和服务对象。'
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现在革命战争语境中，人民军队被视为保卫人民利益的必要力量。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把在革命战争语境中，人民军队被视为保卫人民利益的必要力量凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
