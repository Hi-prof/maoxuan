quote: 聽，是森林的聲音，它隱身於花叢間，祈求著自由]。
literature:
  series: 名人名言
  volume: 泰戈尔
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1913'
themes:
- 自由
interpretation:
  inspiration: 把目标拆小，把注意力放回能控制的努力、节奏和下一次尝试上。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“自由”压缩成简洁表达。自由既意味着选择，也意味着对选择后果和他人边界的尊重。
historicalEvent: 1913年，泰戈尔获得诺贝尔文学奖，亚洲文学获得更广泛的世界性关注。
background: 泰戈尔的诗歌与散文常围绕自由、爱、生命、教育和人与世界的关系展开。
story: 此卡按可追溯出处筛选自泰戈尔语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
