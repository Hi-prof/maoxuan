quote: 更喜岷山千里雪，三军过后尽开颜。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 七律·长征
  authoredAt: 1935-10
themes:
- 胜利
interpretation:
  inspiration: 重要节点值得庆祝，也要记得喜悦建立在共同坚持和真实付出之上。
  explanation: 《七律·长征》写到长期跋涉中的勇气和乐观时，用这句话说明越过雪山后的喜悦来自艰苦行程即将完成。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1935年10月，中央红军到达陕北，长征取得关键胜利。
background: 中央红军长征即将结束时，毛泽东回顾跨越群山江河的艰苦历程，突出从容和胜利信念。 此卡所选名句着重表现越过雪山后的喜悦来自艰苦行程即将完成。
story: 《七律·长征》以景物、行动和历史联想组织诗意。这一句集中呈现越过雪山后的喜悦来自艰苦行程即将完成，既有鲜明画面，也保留了作品写作时的现实背景。
