status: published
quote: 为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 抗日根据地的政权问题
  authoredAt: '1940-03-06'
themes:
- 团结
interpretation:
  inspiration: '邀请别人参与，不只是给他一把椅子。重要决定提前商量，允许意见改变方案，参与才是真的。习惯自己说了算的人，也需要练习民主，不会因为身份正确就自动学会。'
  explanation: '这句话要求在抗日根据地政权中工作的党员，克服只愿同党内人办事的狭隘习惯，重大事项先同党外代表商量，取得多数同意再执行。1940年，毛泽东提出抗日民主政权的“三三制”，让共产党员、非党左派进步分子和中间派各占大体三分之一，以团结更广泛的抗日力量。党领导政权不等于党员包办政权；如果党外人士只有名额却不能参与决定，联合就成了形式。民主作风要体现在协商怎样实际影响行动。'
historicalEvent: 1940年3月6日，《抗日根据地的政权问题》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《抗日根据地的政权问题》从当时的具体问题出发讨论团结，本卡从“为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
