  volume: 第二卷
  workTitle: 抗日根据地的政权问题
  authoredAt: '1940-03-06'
themes:
- 团结
interpretation:
  inspiration: “为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”提示我们，遇到相似问题时先围绕共同目标处理差异并形成协作。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《抗日根据地的政权问题》，原文围绕团结的具体任务展开。“为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”不是孤立口号，而是论证中的一个判断。它强调围绕共同目标处理差异并形成协作；理解时也要看到，团结需要原则、沟通和清楚的任务。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1940年3月6日，《抗日根据地的政权问题》形成，集中讨论团结及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《抗日根据地的政权问题》从当时的具体问题出发讨论团结，本卡从“为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“为着执行这个政策，必须教育担任政权工作的党员，克服他们不愿和不惯同党外人士合作的狭隘性，提倡民主作风，遇事先和党外人士商量，取得多数同意，然后去做”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
