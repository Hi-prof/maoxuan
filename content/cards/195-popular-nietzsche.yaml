themes:
- 成长
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“成长”压缩成简洁表达。成长常常表现为看法和做法的改进，不必把它包装成永远向上的情绪。
historicalEvent: 19世纪后期，欧洲哲学开始强烈反思传统道德、宗教与现代人的精神处境。
background: 尼采的著作常以格言式语言讨论创造、自由、价值判断与自我超越。
story: 此卡按可追溯出处筛选自尼采语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
