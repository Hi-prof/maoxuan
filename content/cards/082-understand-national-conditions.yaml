revision: 3
status: published
quote: 认清中国的国情，乃是认清一切革命问题的基本的根据。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 中国革命和中国共产党
  authoredAt: 1939-12
themes:
- 国情
interpretation:
  inspiration: '别人的经验可以借，但先看看自己的地面是什么样。历史、资源、习惯和限制不同，同一办法会长出不同结果。先认识所处的地方，选择才不容易悬在空中。'
  explanation: '这句话把认识中国国情放在分析革命问题的起点。1939年，为干部教育编写的《中国革命和中国共产党》先说明中国的地理、人口、历史和社会性质，再讨论革命对象、动力、性质与前途。这样的顺序是在反对从外国经验或抽象理论直接推出中国道路。所谓“基本的根据”，不是说国情一成不变，而是任何路线都要回答当时中国是什么样、主要矛盾在哪里、有哪些社会力量；没有这些认识，革命任务就缺少现实落点。'
historicalEvent: 1939年冬，毛泽东参与编写《中国革命和中国共产党》。
background: 为干部教育需要，毛泽东等系统说明中国社会性质、革命对象、动力、性质和前途。 此卡所选名句着重表现对具体国情的认识是制定革命判断和路线的基础。
story: 《中国革命和中国共产党》围绕从国情出发认识革命问题逐层展开。这句话把对具体国情的认识是制定革命判断和路线的基础凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
