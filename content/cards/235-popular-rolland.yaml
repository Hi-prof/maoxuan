  authoredAt: '1915'
themes:
- 行动
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“行动”压缩成简洁表达。行动的意义在于形成反馈：做过、看见结果、再决定下一步。
historicalEvent: 第一次世界大战前后，欧洲知识界围绕战争、和平与人的尊严展开激烈讨论。
background: 罗曼·罗兰以文学和公共写作关注英雄主义、良知、和平与普通人的精神力量。
story: 此卡按可追溯出处筛选自罗曼·罗兰语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
