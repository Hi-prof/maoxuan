revision: 1
status: published
quote: 要去掉我们党内浓厚的盲目性，必须提倡思索，学会分析事物的方法，养成分析的习惯。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 学习和时局
  authoredAt: '1944-04-12'
themes:
- 理论与实践
interpretation:
  inspiration: “要去掉我们党内浓厚的盲目性”提示我们，遇到相似问题时先让认识在行动和反馈中接受检验。把目标、对象和现实条件写清楚，再检查办法是否真正回应了问题。
  explanation: 这句话出自《学习和时局》，原文围绕理论与实践的具体任务展开。“要去掉我们党内浓厚的盲目性”不是孤立口号，而是论证中的一个判断。它强调让认识在行动和反馈中接受检验；理解时也要看到，理论不能替代事实，经验也不能拒绝总结。今天借鉴的是分析和行动方法，不能把当时的对象、力量关系和历史条件原样搬到新的场景。
historicalEvent: 1944年4月12日，《学习和时局》形成，集中讨论理论与实践及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《学习和时局》从当时的具体问题出发讨论理论与实践，本卡从“要去掉我们党内浓厚的盲目性”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“要去掉我们党内浓厚的盲目性”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
