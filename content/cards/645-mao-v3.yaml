quote: 要去掉我们党内浓厚的盲目性，必须提倡思索，学会分析事物的方法，养成分析的习惯。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 学习和时局
  authoredAt: '1944-04-12'
themes:
- 理论与实践
interpretation:
  inspiration: '分析不是少数聪明人的天赋，更像每天练一点的习惯。遇事多问原因、条件和变化，事后再对照结果。这样做久了，很多原本凭感觉冲过去的地方会慢下来。'
  explanation: '这句话说，要减少党内对历史和现实的盲目认识，就要鼓励独立思考，学习分析事物的方法，并把分析变成习惯。1944年延安整风进入总结阶段，毛泽东在《学习和时局》中回顾党的历史经验，要求干部正确理解以往路线问题，同时团结起来工作。盲目性既可能来自理论水平不足，也可能来自不愿具体分析、只随口号和权威走。提倡思索不是鼓励脱离组织的空想，而是让干部能从事实和历史关系中形成判断，少重复过去的错误。'
historicalEvent: 1944年4月12日，《学习和时局》形成，集中讨论理论与实践及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《学习和时局》从当时的具体问题出发讨论理论与实践，本卡从“要去掉我们党内浓厚的盲目性”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“要去掉我们党内浓厚的盲目性”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
