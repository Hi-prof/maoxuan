revision: 2
status: published
quote: 踏遍青山人未老，风景这边独好。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 清平乐·会昌
  authoredAt: 1934-07
themes:
- 乐观
interpretation:
  inspiration: 经历多次奔波后仍要保持观察力，从现实中寻找继续前进的条件，而非自我安慰。
  explanation: 在《清平乐·会昌》讨论逆境中的开阔视野和持续行动的语境中，这句话把重点放在在艰难处境中仍以行路和远望写开阔精神。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1934年夏，毛泽东在会昌写作《清平乐·会昌》。
background: 中央苏区第五次反围剿困难时期，毛泽东登会昌山远望，以开阔景象写继续前行的精神。 此卡所选名句着重表现在艰难处境中仍以行路和远望写开阔精神。
story: 《清平乐·会昌》以景物、行动和历史联想组织诗意。这一句集中呈现在艰难处境中仍以行路和远望写开阔精神，既有鲜明画面，也保留了作品写作时的现实背景。
