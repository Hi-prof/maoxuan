revision: 3
status: published
quote: 边界党如不能对经济问题有一个适当的办法，在敌人势力的稳定还有一个比较长的期间的条件下，割据将要遇到很大的困难。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国的红色政权为什么能够存在？
  authoredAt: '1928-10-05'
themes:
- 经济建设
interpretation:
  inspiration: '准备长期做一件事时，热情之外也要算柴米油盐。钱从哪里来，物资怎样补，参与的人能否生活下去，这些看似琐碎的问题，常决定理想能走多远。'
  explanation: '这句话说，如果湘赣边界党组织不能妥善解决经济问题，在敌人仍将长期保持较强力量的情况下，红色割据就很难维持。1928年的井冈山根据地受到军事包围和经济封锁，军民的粮食、食盐、布匹等供应都很紧张。《中国的红色政权为什么能够存在？》在分析政治和军事条件之外，专门指出经济基础的重要性。建立政权不能只靠打仗，还要组织生产、贸易和群众生活，让根据地具备长期存在的物质条件。'
historicalEvent: 1928年10月5日，《中国的红色政权为什么能够存在？》形成，集中讨论经济建设及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国的红色政权为什么能够存在？》从当时的具体问题出发讨论经济建设，本卡从“边界党如不能对经济问题有一个适当的办法”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《中国的红色政权为什么能够存在？》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
