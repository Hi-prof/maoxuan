quote: 工人中间应该教育出大批的干部，他们应该有知识，有能力，不务空名，会干实事。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 《中国工人》发刊词
  authoredAt: '1940-02-07'
themes:
- 群众路线
interpretation:
  inspiration: '真正能干的人不一定自带光环。给一线成员学习知识、承担责任和练习组织工作的机会，队伍会多出许多可靠支点。少看头衔，多看事情是否做成。'
  explanation: '这句话要求在工人群众中培养大批有知识、有能力、重实际工作的干部。1940年《中国工人》杂志创刊，工人运动在国民党统治区受到压制，抗日根据地的生产和群众组织又需要骨干。毛泽东希望刊物帮助工人学习政治与文化，成长为能够联系、组织工人的干部。“不务空名，会干实事”针对的是只追求职位和口号、缺少实际能力的作风。干部不应只从外部派来，工人自身也要在学习和实践中成为组织工作的主体。'
historicalEvent: 1940年2月7日，《《中国工人》发刊词》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《《中国工人》发刊词》从当时的具体问题出发讨论群众路线，本卡从“工人中间应该教育出大批的干部”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《《中国工人》发刊词》中的理由和限制一起理解。
