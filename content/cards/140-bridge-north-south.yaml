revision: 1
status: published
quote: 一桥飞架南北，天堑变通途。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 水调歌头·游泳
  authoredAt: 1956-06
themes:
- 建设
interpretation:
  inspiration: 建设成果能重塑长期条件；评价项目既看完成，也看它怎样连接人、资源和机会。
  explanation: 原文出自《水调歌头·游泳》，围绕压力中的从容和建设信心展开。这句话强调以武汉长江大桥把自然阻隔转为交通通途。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1956年6月，武汉长江大桥建设中，毛泽东畅游长江。
background: 武汉长江大桥建设期间，毛泽东畅游长江，以水势、建设和神话想象写改造自然的气象。 此卡所选名句着重表现以武汉长江大桥把自然阻隔转为交通通途。
story: 《水调歌头·游泳》以景物、行动和历史联想组织诗意。这一句集中呈现以武汉长江大桥把自然阻隔转为交通通途，既有鲜明画面，也保留了作品写作时的现实背景。
