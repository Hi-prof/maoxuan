quote: 大多數人都從眾，他們的思想是其他人的意見，他們的生活是一場模仿，他們熱衷於引旁人所述。
literature:
  series: 名人名言
  volume: 奥斯卡·王尔德
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1890'
themes:
- 成长
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“成长”压缩成简洁表达。成长常常表现为看法和做法的改进，不必把它包装成永远向上的情绪。
historicalEvent: 19世纪末英国文学和戏剧活跃，王尔德以机智的文字批评社会习俗和虚伪道德。
background: 王尔德的格言常从反常识角度谈个性、审美、教育和社会期待，适合连同语境一起理解。
story: 此卡按可追溯出处筛选自奥斯卡·王尔德语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
