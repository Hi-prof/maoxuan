status: published
quote: 深入考察这一事业的历史条件以及这一事业的性质本身，从而使负有使命完成这一事业的今天受压迫的阶级认识到自己的行动的条件和性质，这就是无产阶级运动的理论表现即科学社会主义的任务。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《社会主义从空想到科学的发展》
  authoredAt: '1878'
themes:
- 历史唯物主义
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《社会主义从空想到科学的发展》，可从“历史唯物主义”角度理解。历史分析要回到人们怎样生活、生产和组织社会的具体条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《社会主义从空想到科学的发展》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
