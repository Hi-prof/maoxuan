revision: 3
status: published
quote: 县政治必须农民起来才能澄清，广东的海丰已经有了证明。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 湖南农民运动考察报告
  authoredAt: 1927-03
themes:
- 群众路线
interpretation:
  inspiration: '地方问题最清楚的人，往往就是每天受它影响的人。让他们能发言、能参与，不只是多收集几条意见，也可能改变原来谁有权定义问题、推动解决。'
  explanation: '这句话说，要清理县级政治中由土豪劣绅把持、贪污压迫等问题，必须让人数最多、直接受其影响的农民组织起来并参与政治。毛泽东在1927年考察湖南农民运动时，引用广东海丰农民运动的经验，说明只靠上层换人，地方旧势力仍可能继续控制政权。农民协会的兴起改变了长期沉默的权力关系。这里的“澄清”不是一般的行政整顿，而是大革命时期农民群众打击封建势力、重塑基层政治的行动。'
historicalEvent: 1927年3月，《湖南农民运动考察报告》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《湖南农民运动考察报告》从当时的具体问题出发讨论群众路线，本卡从“县政治必须农民起来才能澄清”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“县政治必须农民起来才能澄清”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
