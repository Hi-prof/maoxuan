revision: 3
status: published
quote: 一切反动派都是纸老虎。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 和美国记者安娜·路易斯·斯特朗的谈话
  authoredAt: '1946-08-06'
themes:
- 战略信心
interpretation:
  inspiration: '庞大的外表会让人先把自己吓小。把它拆开看：力量从哪里来，靠什么维持，又有什么脆弱处。心里可以不怕，手上的准备仍要认真，这两种态度并不冲突。'
  explanation: '“纸老虎”是从长远和根本上判断反动统治的脆弱：它看似拥有强大军队和武器，却同广大人民利益对立，最终可能被人民力量推翻。1946年全面内战爆发后，毛泽东同美国记者斯特朗谈世界形势，用这一说法反对被美帝国主义和国民党军队的外表吓倒。但“纸”不等于眼前没有杀伤力。后来概括的原则是战略上藐视、战术上重视：保持胜利信心，同时认真对待每一次具体斗争和真实力量差距。'
historicalEvent: 1946年8月6日，毛泽东同美国记者安娜·路易斯·斯特朗谈话。
background: 全面内战爆发后，毛泽东同美国记者谈国际形势，分析强大外表与人民力量之间的关系。 此卡所选名句着重表现从战略上看，脱离人民的强大力量有其脆弱根基。
story: 《和美国记者安娜·路易斯·斯特朗的谈话》围绕战略信心与力量的实质逐层展开。这句话把从战略上看，脱离人民的强大力量有其脆弱根基凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
