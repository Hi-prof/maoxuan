revision: 2
status: published
quote: '前途是光明的，道路是曲折的。'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于重庆谈判
  authoredAt: '1945-10-17'
themes:
  - 信念
  - 长期主义
interpretation:
  inspiration: '面对长期任务，可以同时写下两件事：为什么这个方向仍值得相信，眼前又有哪些具体阻碍。然后把阻碍拆成能处理的事项，一件件解决。这样既不会因一次反复就否定目标，也不会拿乐观当作不处理问题的理由。允许延期、调整和重新判断，反而能让信心落在真实进展上。'
  explanation: '这句话把总体趋势和具体进程分开来看。文章判断第二次世界大战后的世界和中国将向进步方向发展，同时承认国内局势仍不稳定，革命道路上还有许多障碍。所谓“光明”，不是凭愿望保证事情一定顺利，而是建立在对进步力量、人民觉悟和现实条件的分析上；所谓“曲折”，则要求如实承认困难，分析困难从哪里来，并准备同困难斗争。二者不能拆开。只看波折，会把暂时受阻误认为方向错误；只谈前途，又容易回避协议落实、力量对比和现实风险。报告是在重庆谈判结束后作出的，纸面协议已经取得，但能否成为现实仍取决于后续努力。因此，信心和清醒在这里是同一种态度的两面。'
historicalEvent: '1945年10月17日，毛泽东结束四十三天重庆谈判回到延安后，向干部报告谈判经过和形势。'
background: '抗日战争胜利后，毛泽东赴重庆谈判四十三天，回到延安后向干部作报告。文章在肯定《双十协定》收获的同时，指出纸面协议仍需经过努力才能成为现实，国内局势仍动荡不定。'
story: '报告末段从第二次世界大战后的世界形势谈到中国前途：进步是总趋势，但革命道路仍有障碍。因而一面要求宣传光明前途、建立胜利信心，一面要求如实承认并分析困难。'
