revision: 3
status: published
quote: 因为半殖民地中国的革命，只有农民斗争得不到工人的领导而失败，没有农民斗争的发展超过工人的势力而不利于革命本身的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 星星之火，可以燎原
  authoredAt: '1930-01-05'
themes:
- 群众路线
interpretation:
  inspiration: '一股新力量成长得快，旁观者容易先担心“会不会太多”。不妨回到它解决的真实问题、需要的引导和产生的结果来看。规模本身，很少能替代具体判断。'
  explanation: '这句话反驳对农民斗争发展过快、可能超过工人力量的担心。毛泽东认为，在半殖民地半封建中国，农民占人口多数，是民主革命的主要力量；真正的危险不是农民运动太发展，而是缺少工人阶级和共产党的领导，以致力量分散或失败。1930年的《星星之火，可以燎原》在革命低潮中强调农村斗争和红色政权的前途。它既肯定农民运动的必要发展，也保留了无产阶级领导这一政治前提，并非认为任何自发行动都天然正确。'
historicalEvent: 1930年1月5日，《星星之火，可以燎原》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《星星之火，可以燎原》从当时的具体问题出发讨论群众路线，本卡从“因为半殖民地中国的革命”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《星星之火，可以燎原》中的理由和限制一起理解。
