id: 4823f84e-c9be-48b7-a7e0-ad60ccaba571
revision: 2
status: published
quote: 因为半殖民地中国的革命，只有农民斗争得不到工人的领导而失败，没有农民斗争的发展超过工人的势力而不利于革命本身的。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 星星之火，可以燎原
  authoredAt: '1930-01-05'
themes:
- 群众路线
interpretation:
  inspiration: “因为半殖民地中国的革命”提醒我们面对复杂局面先把当事人的处境和实际需要放进决策，同时保留修正空间。清楚说明依据和边界，比套用结论更重要。
  explanation: 原文写作《星星之火，可以燎原》时，面对的是需要作出具体判断和安排的群众路线问题。这句话以“因为半殖民地中国的革命”概括其中一层意思，即把当事人的处境和实际需要放进决策。同时，尊重群众不等于放弃分析和责任边界。把它用于今天，应先核对问题是否同类，再决定哪些方法可以借鉴。
historicalEvent: 1930年1月5日，《星星之火，可以燎原》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《星星之火，可以燎原》从当时的具体问题出发讨论群众路线，本卡从“因为半殖民地中国的革命”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《星星之火，可以燎原》中的理由和限制一起理解。
