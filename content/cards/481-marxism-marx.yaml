interpretation:
  inspiration: 不要用抽象口号跳过具体问题。把对象、条件、利益和变化过程放在一起看。
  explanation: 这句出自《政治经济学批判》导言，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪工业化加速发展，劳动、资本和社会结构的变化成为思想界的重要问题。
