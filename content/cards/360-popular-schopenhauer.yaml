quote: 读书越多，留存在脑中的东西越少，两者适成反比。读书多，他的脑海就像一块密密麻麻重重叠叠涂抹的黑板一样。
literature:
  series: 名人名言
  volume: 叔本华
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1840'
themes:
- 学习
interpretation:
  inspiration: 把感受转成一个可完成的动作：今天先推进最小的一步，再用结果校正方向。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“学习”压缩成简洁表达。它更适合作为长期学习的提醒，而不是催促立刻给出完美答案。
historicalEvent: 19世纪欧洲哲学在理性主义之外重新讨论欲望、痛苦、艺术与人生体验。
background: 叔本华的观点常带有锋芒，适合用来反省欲望、判断和独处，而不宜被断章当成消极结论。
story: 此卡按可追溯出处筛选自叔本华语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
