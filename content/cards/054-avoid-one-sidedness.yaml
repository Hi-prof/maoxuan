revision: 3
status: published
quote: 研究问题，忌带主观性、片面性和表面性。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 研究方法
interpretation:
  inspiration: '一个判断越让自己顺耳，越可以慢一点。找一条相反材料，问问当事人，再看看眼前现象是偶然还是长期结果。多绕这一小步，常能避开很自信的误会。'
  explanation: '这句话提醒研究问题要避开三种偏差：用主观愿望代替客观情况，只看到事物的一面，以及停留在表面现象。它出现在《矛盾论》讨论矛盾特殊性的部分。要认识一个具体矛盾，就得接触足够材料，看到相互关联的各个方面，并追问现象背后的原因。毛泽东当时借哲学讨论反对党内的教条主义和经验主义，因为无论照搬抽象结论，还是把局部经验当成全部，都无法准确判断复杂的革命实际。'
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现研究要防止以个人愿望代替事实、只看一面或停在表象。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把研究要防止以个人愿望代替事实、只看一面或停在表象凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
