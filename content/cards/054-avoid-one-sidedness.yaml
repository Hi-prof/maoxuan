  workTitle: 矛盾论
  authoredAt: 1937-08
themes:
- 研究方法
interpretation:
  inspiration: 下判断前主动寻找反例、缺失视角和深层原因，尤其检查最符合自己预期的证据。
  explanation: 《矛盾论》写到用矛盾分析理解事物发展时，用这句话说明研究要防止以个人愿望代替事实、只看一面或停在表象。它的价值在于把立场转成可分析的关系和行动要求。现代阅读可以获得启发，但不能抹去作品所处的革命和建设语境。
historicalEvent: 1937年8月，毛泽东在延安讲授矛盾法则。
background: 毛泽东在延安讲授辩证法，讨论矛盾的普遍性、特殊性、主要方面以及内外因关系。 此卡所选名句着重表现研究要防止以个人愿望代替事实、只看一面或停在表象。
story: 《矛盾论》围绕用矛盾分析理解事物发展逐层展开。这句话把研究要防止以个人愿望代替事实、只看一面或停在表象凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
