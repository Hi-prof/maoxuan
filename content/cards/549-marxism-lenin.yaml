quote: 把爱国主义和社会主义这两个互相矛盾的任务结合起来，是法国社会主义者的致命错误。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思主义和修正主义》
  authoredAt: '1902'
themes:
- 辩证思维
interpretation:
  inspiration: 关注人的现实处境和社会关系，不把个人选择孤立成脱离条件的道德判断。
  explanation: 这句出自《马克思主义和修正主义》，可从“辩证思维”角度理解。辩证思维要求看到联系、变化和条件，不用静止标签代替分析。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义和修正主义》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
