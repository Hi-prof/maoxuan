id: 7ac4f48d-4ee3-544b-8867-89f631327ad4
revision: 3
status: published
quote: '在我党的一切实际工作中，凡属正确的领导，必须是从群众中来，到群众中去。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 关于领导方法的若干问题
  authoredAt: '1943-06-01'
themes:
  - 群众路线
  - 领导方法
interpretation:
  inspiration: '制定会影响很多人的方案，可以把访谈、归纳、试行和复盘连成一圈。先听到真实经验，再由负责的人作判断，形成能执行的办法；试过以后，把结果和意见带回来继续修改。只收集意见却不反馈，或方案一旦定下就拒绝再改，参与都会变成形式，信息也会慢慢失真。'
  explanation: '“从群众中来，到群众中去”描述的是一个反复往返的工作过程。先从群众的实践中收集分散的经验和意见，经过研究，把其中合理、共同而且能够行动的部分集中成主张；再回到群众中作说明，转化为大家的行动，并在新的实践中检验。它既不是少数人关起门来替所有人决定，也不是把零散意见不加辨别地原样相加。领导工作的责任在于调查、比较、集中，提出方向明确的方案；群众实践则会显示方案哪里有效、哪里仍不符合情况。新的结果还要再次集中研究。文章把这一过程称为无限循环，强调每一轮都应比上一轮更具体。群众路线因此不是一次征求意见，而是一套持续产生、执行和修正决策的方法。'
historicalEvent: '1943年6月1日，毛泽东为中共中央起草决定，集中说明领导同群众相结合的工作方法。'
background: '这是毛泽东为中共中央起草的决定，集中说明“一般和个别相结合”以及“领导和群众相结合”两种工作方法。'
story: '文中给出的闭环很具体：先把分散意见集中研究，再回到群众中解释和实践，在行动中检验，然后重新集中。它不是一次性的意见征集。'
