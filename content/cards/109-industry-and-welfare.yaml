revision: 3
status: published
quote: 没有工业，便没有巩固的国防，便没有人民的福利，便没有国家的富强。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论联合政府
  authoredAt: '1945-04-24'
themes:
- 工业建设
interpretation:
  inspiration: '看一项产业，不只数眼前产量。它有没有培养技术、改善生活、让系统在困难时更稳，也是价值的一部分。把时间拉长，许多“基础工作”就不再显得不起眼。'
  explanation: '这句话把工业化同国防、人民生活和国家富强连在一起。1945年抗战接近胜利，毛泽东在《论联合政府》中不只讨论怎样取得民主联合政府，也展望战后建设，提出发展现代工业的重要性。长期战争已经暴露中国工业基础薄弱、国防和民生受制的处境。这里的“没有工业”不是否定农业，而是说明一个独立国家若缺少现代生产和技术能力，就难以保卫自己、持续提高人民生活，也难以摆脱贫弱状态。'
historicalEvent: 1945年4月24日，毛泽东在中国共产党第七次全国代表大会上作报告。
background: 抗战胜利前夕，毛泽东在中共七大作政治报告，系统说明党的纲领、人民力量和国家建设任务。 此卡所选名句着重表现工业能力同国防、人民生活和国家发展相互关联。
story: 《论联合政府》围绕人民力量、政治纲领和国家建设逐层展开。这句话把工业能力同国防、人民生活和国家发展相互关联凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
