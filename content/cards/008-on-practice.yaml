id: 0aa241e5-e429-5e9e-8912-dcf8d1ba78a0
revision: 4
status: published
quote: '实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。'
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: '1937-07'
themes:
  - 实践
  - 认识论
interpretation:
  inspiration: '计划很少能一次写对。先在能控制的范围里做起来，把结果和原先判断放在一起比较：哪些成立，哪些只是想当然，哪些新情况以前没看见。根据事实修改，再进入下一轮。愿意承认旧判断不够准确，不是反复无常，而是让认识跟着现实往前走。'
  explanation: '这句话说明，人的认识不是一次完成的。人先在生产、社会活动和科学实验中接触事实，形成初步感受；经过思考，把零散材料整理成判断和理论；随后还要把这些判断放回实践，看它们能否说明问题、指导行动。新的结果又会提供新的材料，使原有认识得到修正或发展。这个循环不是原地打转，也不会自动进步。只有认真面对不符合预期的事实，改变已经站不住的判断，认识才可能“进到高一级”。教条主义把理论同现实隔开，经验主义则容易停在零散经验，两者都切断了认识与实践的往返。《实践论》借这一过程说明知与行的统一，也说明真理必须在实践中接受检验。'
historicalEvent: '1937年7月，毛泽东在延安抗日军事政治大学讲授哲学问题，随后形成《实践论》。'
background: '这篇哲学论文源于延安抗日军事政治大学的讲演，旨在从认识论角度批评轻视实践的教条主义和轻视理论的经验主义。'
story: '全文从生产活动、阶级斗争和科学实验谈认识的来源，再讨论感性认识上升为理性认识、理性认识回到实践接受检验的循环。'
