id: 83e1a1f4-bca2-4a6f-9712-d25354ca0db6
revision: 3
status: published
quote: “统一领导，分散经营”的原则，已被证明是我们解放区在目前条件下组织一切经济生活的正确的原则。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 论军队生产自给，兼论整风和生产两大运动的重要性
  authoredAt: '1945-04-27'
themes:
- 经济建设
interpretation:
  inspiration: '共同方向可以统一，具体做法不必全部一样。让离现场近的人有经营和调整空间，再用清楚目标把各处连起来，常比事事等中央指令更灵活。'
  explanation: '“统一领导，分散经营”是在解放区和军队生产中形成的组织原则：上级统一规定方向、政策和主要任务，各地区、机关、部队则根据本地土地、劳力和物资条件自行经营。1945年毛泽东总结军队生产自给经验，认为战争环境地域分散、情况不同，若一切集中经营会僵化，完全各自为政又会失去方向。统一解决目标和政策一致，分散调动基层主动性、适应具体条件。它是当时组织经济生活的实践结论，不是无条件适用的管理公式。'
historicalEvent: 1945年4月27日，《论军队生产自给，兼论整风和生产两大运动的重要性》形成，集中讨论经济建设及其现实任务。
background: 延安整风和抗战后期，党的作风、群众工作、生产建设与联合政府问题集中展开。《论军队生产自给，兼论整风和生产两大运动的重要性》从当时的具体问题出发讨论经济建设，本卡从“统一领导，分散经营”的原则，已被证明是我们解放区在目前条件下组织一切经济生活的正确的原则”切入全文的一层论证。
story: 文本围绕经济建设逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《论军队生产自给，兼论整风和生产两大运动的重要性》中的理由和限制一起理解。
