revision: 3
status: published
quote: 判断一个地方的社会性质是不是新民主主义的，主要地是以那里的政权是否有人民大众的代表参加以及是否有共产党的领导为原则。
literature:
  series: 毛泽东选集
  volume: 第二卷
  workTitle: 关于打退第二次反共高潮的总结
  authoredAt: '1941-05-08'
themes:
- 群众路线
interpretation:
  inspiration: '判断一个制度，不妨少看它怎样称呼自己，多看谁能参加、意见怎样进入、权力由什么方向组织。名称能表达愿望，实际结构才说明它怎样运转。'
  explanation: '这句话给当时“新民主主义政权”提出两个判断标准：政权中是否有人民大众各阶层的代表参加，是否由共产党领导。1941年第二次反共高潮被打退后，毛泽东总结抗日根据地政权建设经验，说明这些地区不是少数共产党人的封闭政权，也不是社会主义政权，而是团结工人、农民、小资产阶级和其他抗日力量的民主联合政权。人民代表参加体现广泛性，共产党领导保证抗日和进步方向；两项缺一，都不能只凭名称判定其性质。'
historicalEvent: 1941年5月8日，《关于打退第二次反共高潮的总结》形成，集中讨论群众路线及其现实任务。
background: 全面抗战时期，民族危机、统一战线、战争进程和新民主主义道路需要持续分析。《关于打退第二次反共高潮的总结》从当时的具体问题出发讨论群众路线，本卡从“判断一个地方的社会性质是不是新民主主义的”切入全文的一层论证。
story: 《关于打退第二次反共高潮的总结》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
