id: 35b61c3f-e2b8-5025-91f1-6f873dcfb68f
revision: 3
status: published
quote: 感觉只解决现象问题，理论才解决本质问题。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 认识
interpretation:
  inspiration: '看到一个现象时，先把第一感觉保留下来，也给它留一点被推翻的余地。多看几个例子，问问彼此有什么联系，表面杂乱的事情才可能露出较稳定的脉络。'
  explanation: '这句话区分了认识的两个阶段：感觉让人接触事物的表面和各个片段，理论思考则把这些材料联系起来，寻找内部关系和发展规律。毛泽东在《实践论》中讨论认识怎样从感性上升到理性，又怎样回到实践接受检验，是为了反对只凭零散经验或书本结论看问题。“理论解决本质”并不是说理论可以离开感觉材料凭空产生；没有实际经验，概念就失去来源，只有感觉而不整理，也难以把握事物为何如此。'
historicalEvent: 1937年7月，毛泽东在延安讲授认识与实践问题。
background: 为克服党内教条主义，毛泽东在延安从认识论角度说明实践、认识、真理标准和反复检验的关系。 此卡所选名句着重表现直接感受提供现象材料，系统思考帮助发现背后的关系。
story: 《实践论》围绕认识怎样从实践产生并接受检验逐层展开。这句话把直接感受提供现象材料，系统思考帮助发现背后的关系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
