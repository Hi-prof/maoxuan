quote: 感觉只解决现象问题，理论才解决本质问题。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 实践论
  authoredAt: 1937-07
themes:
- 认识
interpretation:
  inspiration: 记录直观感受之后，再比较样本、寻找机制，避免把一次体验当成全部规律。
  explanation: 原文出自《实践论》，围绕认识怎样从实践产生并接受检验展开。这句话强调直接感受提供现象材料，系统思考帮助发现背后的关系。它有明确的历史对象和论述边界，今天可以借鉴其中的判断方法，但不应脱离全文把它变成适用于任何场景的口号。
historicalEvent: 1937年7月，毛泽东在延安讲授认识与实践问题。
background: 为克服党内教条主义，毛泽东在延安从认识论角度说明实践、认识、真理标准和反复检验的关系。 此卡所选名句着重表现直接感受提供现象材料，系统思考帮助发现背后的关系。
story: 《实践论》围绕认识怎样从实践产生并接受检验逐层展开。这句话把直接感受提供现象材料，系统思考帮助发现背后的关系凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
