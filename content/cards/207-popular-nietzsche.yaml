quote: 一个理想主义者是不可救药的：如果他被逐出天堂，他就从地狱中找出自己的理想。——《人性的，太人性的》-下-1-23（杨恒达译）
literature:
  series: 名人名言
  volume: 尼采
  workTitle: 热门名人语录（出处见来源页）
  authoredAt: '1880'
themes:
- 理想
interpretation:
  inspiration: 把目标拆小，把注意力放回能控制的努力、节奏和下一次尝试上。
  explanation: 这句在网络上长期被转引，来源页可回看其作者、作品或演讲出处。它之所以容易被记住，是因为把“理想”压缩成简洁表达。理想需要被拆成可以积累的行动，才不会只停留在口号或想象里。
historicalEvent: 19世纪后期，欧洲哲学开始强烈反思传统道德、宗教与现代人的精神处境。
background: 尼采的著作常以格言式语言讨论创造、自由、价值判断与自我超越。
story: 此卡按可追溯出处筛选自尼采语录条目，不以随机段落凑数；可从来源页回看上下文和引用作品。
