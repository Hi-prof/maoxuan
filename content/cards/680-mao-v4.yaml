quote: 于是，淮海战役发展成为中国人民解放战争中三个有决定意义的最大战役之一。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 关于淮海战役的作战方针
  authoredAt: '1948-10-11'
themes:
- 群众路线
interpretation:
  inspiration: '有些大结果并不是开局就完整写好的。第一步抓住了关键，随后根据局面扩展目标，事情才逐渐长大。回看成功时，也别把后来的规模误写成最初就确定的剧本。'
  explanation: '这句话是对作战方针及其后来结果的概括：最初部署主要围歼黄百韬兵团，随着战局发展，参战范围和歼敌目标不断扩大，最终形成淮海战役，并同辽沈、平津战役一起成为决定解放战争进程的三大战役。1948年10月的原始电报根据敌军配置提出第一阶段任务，预留后续行动。后来战役规模远超最初设想。理解“于是”要看到计划与形势互动：先明确关键目标，再根据实际战果和敌我变化扩大战役，而不是一开始就拥有完整不变的终局方案。'
historicalEvent: 1948年10月11日，《关于淮海战役的作战方针》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《关于淮海战役的作战方针》从当时的具体问题出发讨论群众路线，本卡从“于是，淮海战役发展成为中国人民解放战争中三个有决定意义的最大战役之一”切入全文的一层论证。
story: 文本围绕群众路线逐层展开，从事实判断走向行动安排。所选原文便于记忆，但真正有用的是连同《关于淮海战役的作战方针》中的理由和限制一起理解。
