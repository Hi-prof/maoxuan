revision: 1
status: published
quote: 江山如此多娇，引无数英雄竞折腰。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 沁园春·雪
  authoredAt: 1936-02
themes:
- 山河
interpretation:
  inspiration: 面对宏大对象既要有感情，也要进入历史比较，理解不同人物的贡献与局限。
  explanation: 在《沁园春·雪》讨论山河气象、历史评价和当代担当的语境中，这句话把重点放在由北国雪景转入历史人物，写山河壮丽和历史竞争。理解它需要同时看到当时的任务和条件；用于今天时，应保留这种具体分析意识，而不是只取一句表面的豪迈表达。
historicalEvent: 1936年2月，毛泽东在陕北写作《沁园春·雪》。
background: 毛泽东在陕北写北国雪景，由山河景象转入历史人物评论，落脚于当代创造者。 此卡所选名句着重表现由北国雪景转入历史人物，写山河壮丽和历史竞争。
story: 《沁园春·雪》以景物、行动和历史联想组织诗意。这一句集中呈现由北国雪景转入历史人物，写山河壮丽和历史竞争，既有鲜明画面，也保留了作品写作时的现实背景。
