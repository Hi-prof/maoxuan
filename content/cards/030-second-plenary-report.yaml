id: c4bd6f66-16a3-5fdb-818e-60fc03074d4e
revision: 4
status: published
quote: '夺取全国胜利，这只是万里长征走完了第一步。'
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 在中国共产党第七届中央委员会第二次全体会议上的报告
  authoredAt: '1949-03-05'
themes:
  - 艰苦奋斗
  - 建设
interpretation:
  inspiration: '事情做到一个重要里程碑，可以庆祝，但也要马上分清：哪些真的完成了，下一阶段还缺什么。新任务往往需要不同的能力、资源和工作方法，不能照搬成功前的惯性。越是在顺利的时候，越要检查风险和薄弱处。把成果当成新的起点，能让信心留下来，也不至于被成绩遮住后面的路。'
  explanation: '把全国胜利比作长征第一步，是提醒人们，一个重大阶段即将完成，但它只是新任务的起点。取得政权以后，工作重心要从乡村转向城市，经济建设、城市管理和国家治理会提出更长、更复杂的要求。报告并不是削弱胜利的意义，而是反对因为阶段成果而高估完成度，把“序幕”误当成“高潮”。正因胜利临近，文章特别强调保持谦虚、谨慎和艰苦奋斗，警惕骄傲、享乐以及可能出现的“糖衣炮弹”。环境变得有利，原有经验不一定足够，新问题也会随之出现。真正理解这句话，需要同时看见已经取得的转折和仍待完成的建设任务，把胜利带来的信心转化为重新学习和继续工作的准备。'
historicalEvent: '1949年3月5日，三大战役结束后，中共七届二中全会在西柏坡召开，讨论全国胜利后的任务。'
background: '七届二中全会在西柏坡举行，三大战役结束后全国胜利已近。报告讨论工作重心由乡村转到城市以及胜利后的经济、政治和外交任务。'
story: '正因为胜利临近，文章把更长远的建设工作放在眼前，提醒警惕骄傲、享乐和“糖衣炮弹”，并强调革命后的路程更长、工作更艰苦。'
