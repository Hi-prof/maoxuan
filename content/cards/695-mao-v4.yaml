id: 6cf03c93-705e-4748-8a71-35315bb1af65
revision: 3
status: published
quote: 我们只有在日皇命令其军队停止敌对行为和放下武器，而且这个命令被实际执行的时候，才承认日本军队投降了。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 第十八集团军总司令给蒋介石的两个电报
  authoredAt: 1945-08
themes:
- 领导方法
interpretation:
  inspiration: 判断一件事是否完成，最好看约定动作有没有真正发生，而不只看宣布。项目验收、问题整改都是如此：把可观察的完成条件写清，争论会少很多。
  explanation: 这段话的意思是，日本发布投降声明还不等于战场上的实际投降；只有停止敌对、放下武器的命令发出并执行，才算完成。1945年8月，蒋介石命令八路军“原地驻防待命”，毛泽东以朱德名义起草电报反驳，文中引用苏军总参谋长安东诺夫的声明，说明日军仍在抵抗，要求继续受降和作战。因此，引文中的“我们”首先是所引苏军声明的表述，也服务于当时争夺受降权的论证。
historicalEvent: 1945年8月，《第十八集团军总司令给蒋介石的两个电报》形成，集中讨论领导方法及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《第十八集团军总司令给蒋介石的两个电报》从当时的具体问题出发讨论领导方法，本卡从“我们只有在日皇命令其军队停止敌对行为和放下武器”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《第十八集团军总司令给蒋介石的两个电报》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
