revision: 3
status: published
quote: 我们的文学艺术都是为人民大众的，首先是为工农兵的，为工农兵而创作，为工农兵所利用的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 在延安文艺座谈会上的讲话
  authoredAt: 1942-05
themes:
- 文艺
interpretation:
  inspiration: '创作时问一句“谁会用到它”，会带来很多具体变化：用什么语言、从哪里取材、怎样被看见。表达自己和照顾读者不必对立，真正的连接常让作品更有生命。'
  explanation: '这句话明确延安文艺工作的服务对象：人民大众，首先是当时抗战和根据地中的工人、农民、士兵。1942年，一批来自城市的文艺工作者来到延安，创作同群众生活之间仍有距离。毛泽东在座谈会上把“为什么人”视为根本问题，要求作者改变立场、深入群众生活，并让作品能够被群众理解和使用。它并不是说文艺只剩宣传口号；讲话还讨论普及与提高，重点是创作的生活来源、审美对象和社会作用不能同人民分开。'
historicalEvent: 1942年5月，延安文艺座谈会召开，毛泽东作结论讲话。
background: 延安文艺座谈会上，毛泽东讨论文艺为谁服务、怎样服务，以及文艺工作者同群众生活的关系。 此卡所选名句着重表现文艺的服务对象决定创作立场、生活来源和传播方式。
story: 《在延安文艺座谈会上的讲话》围绕文艺的人民立场、普及和提高逐层展开。这句话把文艺的服务对象决定创作立场、生活来源和传播方式凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
