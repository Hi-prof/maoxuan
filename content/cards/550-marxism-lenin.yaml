quote: 无产阶级抛掉了“全民族的”幻想，把自己的阶级力量集中在自己的群众性组织工兵代表苏维埃等等的手中。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思主义和修正主义》
  authoredAt: '1902'
themes:
- 人民立场
interpretation:
  inspiration: 先看现实条件和关系，再提出判断；把立场落实为能被事实检验的分析。
  explanation: 这句出自《马克思主义和修正主义》，可从“人民立场”角度理解。分析公共问题时，要看真实承担后果的人群，而不只看少数人的表述。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思主义和修正主义》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
