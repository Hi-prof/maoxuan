id: f8988df2-c35a-58e9-99a7-bca215e9b7ef
revision: 3
status: published
quote: '“实事”就是客观存在着的一切事物，“是”就是客观事物的内部联系，即规律性，“求”就是我们去研究。'
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 改造我们的学习
  authoredAt: '1941-05-19'
themes:
  - 实事求是
  - 学习
interpretation:
  inspiration: '处理问题时，先把事实、推测和个人偏好分开。哪些材料已经确认，哪些只是听说，哪些联系还需要验证，最好写清楚。概念可以帮忙整理，但不能替代对象本身。等材料变了，也要愿意修改原来的判断。这样做不花哨，却能让方案真正对准要解决的事情。'
  explanation: '文章逐字解释“实事求是”：先承认客观存在的一切事物是“实事”，再从这些材料中研究内部的联系和规律，这个主动研究的过程就是“求”。它不是等待现成答案，也不是拿着已经决定的结论到现实中挑选例子。报告针对当时一些人只会背诵词句、不了解国内外实际情况，以及理论同实践分离的学习方法。只罗列零散现象而不作分析，同样不够；事实需要比较，联系需要验证，形成的规律还要回到实践中接受检验。文章用“有的放矢”说明理论和实际的关系：箭必须射向具体目标。离开对象空谈理论，或只有经验没有整理，都不能称为实事求是。'
historicalEvent: '1941年5月19日，毛泽东在延安干部会议上作报告，推动整顿脱离实际的学习方法。'
background: '这篇报告在延安干部会议上作出，针对只会背诵个别词句、不了解国内外实际情况以及理论与实践相分离的学习方法。'
story: '文章借“有的放矢”解释理论与中国实际的关系，又对“实事求是”逐字说明，使它从传统表述转化为调查、研究和行动的方法。'
