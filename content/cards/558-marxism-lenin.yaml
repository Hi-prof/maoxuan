quote: 在欧洲所有的其它国家，比较错综复杂和不那么的彻底的发展过程也导致同样的资产阶级社会的形成。
literature:
  series: 马原思考
  volume: 弗拉基米尔·列宁
  workTitle: 《马克思学说的历史命运》
  authoredAt: '1902'
themes:
- 社会关系
interpretation:
  inspiration: 面对复杂局面，先找主要矛盾和关键条件，避免把所有问题混成一团。
  explanation: 这句出自《马克思学说的历史命运》，可从“社会关系”角度理解。个人并不生活在真空里，理解问题要把关系、制度和资源条件一并纳入。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 20世纪初的革命实践把理论、组织、群众工作和具体形势分析放在紧密关联中。
background: 列宁的论述常强调从具体条件出发，把理论学习、实践检验和组织行动联系起来。
story: 此卡从《马克思学说的历史命运》的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
