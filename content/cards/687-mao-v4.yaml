revision: 3
status: published
quote: 我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 国民党进攻的真相
  authoredAt: '1945-11-05'
themes:
- 工作方法
interpretation:
  inspiration: 大家都赞成“尽快恢复”，分歧常常藏在先做什么、由谁负责。重新启动合作前，把安全、权限和遗留问题摆到桌面上谈清楚，速度反而更踏实。
  explanation: 这句话是说，中共也主张尽快恢复交通，但认为必须先解决日军受降、伪军处置和解放区自治三个争议，不能只把铁路恢复当作孤立的技术问题。1945年11月，抗战结束后的受降与军队调动引发激烈冲突，《国民党进攻的真相》回应国民党关于中共阻碍交通的指责，指出铁路同时被用于运兵进攻解放区。这是当时内战危机中的政治立场，理解重点在“目标相同不等于前提已经解决”。
historicalEvent: 1945年11月5日，《国民党进攻的真相》形成，集中讨论工作方法及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《国民党进攻的真相》从当时的具体问题出发讨论工作方法，本卡从“我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《国民党进攻的真相》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
