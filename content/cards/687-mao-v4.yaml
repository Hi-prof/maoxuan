quote: 我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 国民党进攻的真相
  authoredAt: '1945-11-05'
themes:
- 工作方法
interpretation:
  inspiration: 可以把“我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复”转成一个工作问题：怎样从具体问题出发选择可执行的方法？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《国民党进攻的真相》中，这句话服务于对工作方法问题的分析。它把“我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复”同实际任务联系起来，要求从具体问题出发选择可执行的方法。它的现实启发主要是一种工作方法；一句话的启发必须放回原文对象和历史条件，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1945年11月5日，《国民党进攻的真相》形成，集中讨论工作方法及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《国民党进攻的真相》从当时的具体问题出发讨论工作方法，本卡从“我们和旁人一样，主张交通线迅速恢复，但是必须在受降、处置伪军和实行解放区自治三项问题获得解决之后，才能恢复”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《国民党进攻的真相》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
