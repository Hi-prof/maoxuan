revision: 3
status: published
quote: 人民渴望早日获得和平，但是不赞成战争罪犯们的所谓和平，不赞成他们的反动条件。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 中共中央毛泽东主席关于时局的声明
  authoredAt: '1949-01-14'
themes:
- 群众路线
interpretation:
  inspiration: '想结束冲突，不等于什么条件都该接受。真正的和平要看问题是否被处理、伤害会不会继续。名字叫“和平”的安排，若只是让一方放弃基本权利，安静也很难长久。'
  explanation: '1949年初，国民党军在三大战役中败局已定，蒋介石提出和平谈判，试图保存其统治和军队。毛泽东发表时局声明，承认全国人民迫切希望结束内战，但区分真正和平与以和平为名的拖延、整军和反攻条件。声明提出惩办战争罪犯、废除伪宪法、改编反动军队等八项基础，要求从造成内战的根本问题入手。人民反对的是继续战争，也不会因为一个方案用了“和平”二字，就接受旧秩序原样保留。'
historicalEvent: 1949年1月14日，《中共中央毛泽东主席关于时局的声明》形成，集中讨论群众路线及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《中共中央毛泽东主席关于时局的声明》从当时的具体问题出发讨论群众路线，本卡从“人民渴望早日获得和平”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《中共中央毛泽东主席关于时局的声明》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
