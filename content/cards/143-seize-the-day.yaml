id: 5517e7c3-74e7-5c65-9971-b983131b01cd
revision: 1
status: published
quote: 多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。
literature:
  series: 毛泽东诗词
  volume: 诗词
  workTitle: 满江红·和郭沫若同志
  authoredAt: '1963-01-09'
themes:
- 时间
interpretation:
  inspiration: 紧迫感应帮助确定优先级和立即开始，而不是制造无休止加速和透支。
  explanation: 这句话来自《满江红·和郭沫若同志》，原文关注珍惜时间和立足当下行动，核心是以天地运行和时间紧迫催促现实行动。名句流传很广，准确理解仍要回到上下文：既看到它提供的精神力量，也看到成立所需的事实、组织和历史条件。
historicalEvent: 1963年1月9日，毛泽东写《满江红·和郭沫若同志》。
background: 国际形势紧张之际，毛泽东和郭沫若词，把时间紧迫感和现实行动写入作品。 此卡所选名句着重表现以天地运行和时间紧迫催促现实行动。
story: 《满江红·和郭沫若同志》以景物、行动和历史联想组织诗意。这一句集中呈现以天地运行和时间紧迫催促现实行动，既有鲜明画面，也保留了作品写作时的现实背景。
