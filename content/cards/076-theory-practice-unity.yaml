quote: 没有科学的态度，即没有马克思列宁主义的理论和实践统一的态度，就叫做没有党性，或叫做党性不完全。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 改造我们的学习
  authoredAt: '1941-05-19'
themes:
- 学风
interpretation:
  inspiration: '理解一个道理，不妨看看它能解释哪些真实现象，又在哪些地方需要修改。愿意让观点碰一碰现实，不是显得不坚定，而是让学习少一点装饰，多一点用处。'
  explanation: '这句话把理论与实践统一看作马克思主义的科学态度，也把它同共产党员的党性联系起来。1941年，毛泽东在《改造我们的学习》中批评主观主义学风：有人只会引用词句，不调查现实；也有人只有零散经验，不善于用理论整理。两种倾向都会让党的路线脱离实际。这里的“统一”不是拿实践给既有结论作证明，而是理论指导调查和行动，实践结果又反过来检验、修正认识。对当时的党员而言，这种求实态度也是对组织事业负责。'
historicalEvent: 1941年5月19日，毛泽东在延安干部会上作《改造我们的学习》报告。
background: 延安整风准备阶段，毛泽东批评主观主义学风，要求研究历史、现状并把理论用于中国实际。 此卡所选名句着重表现科学态度要求理论同实践相统一，并接受组织目标检验。
story: 《改造我们的学习》围绕学风、调查和理论联系实际逐层展开。这句话把科学态度要求理论同实践相统一，并接受组织目标检验凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
