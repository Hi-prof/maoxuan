quote: 主观主义、宗派主义、党八股，这三种东西，都是反马克思列宁主义的。
literature:
  series: 毛泽东选集
  volume: 第三卷
  workTitle: 整顿党的作风
  authoredAt: '1942-02-01'
themes:
- 整风
interpretation:
  inspiration: '事情卡住时，可以看看是不是三个小毛病碰到了一起：凭想当然判断，只和熟人配合，说话又空又绕。事实多一点、圈子打开一点、语言朴素一点，局面常会松动。'
  explanation: '这句话点出延安整风要反对的三种作风。主观主义使认识脱离事实，宗派主义把组织关系变成小圈子，党八股则用空洞僵硬的语言掩盖内容。毛泽东认为它们都违背马克思主义实事求是、联系群众的要求，而且会相互加强：判断没有事实支撑，便更依赖派别；内容贫乏，又容易用套话包装。1942年的《整顿党的作风》因此不只谈个人文风，而是把学习方法、组织关系和表达方式放在一起整顿。'
historicalEvent: 1942年2月1日，毛泽东在中央党校开学典礼上演说。
background: 延安整风运动中，毛泽东分析主观主义、宗派主义和党八股的危害，提出整顿学风、党风和文风。 此卡所选名句着重表现主观判断、封闭派别和空洞表达会相互强化并损害工作。
story: 《整顿党的作风》围绕整风、学风和组织作风逐层展开。这句话把主观判断、封闭派别和空洞表达会相互强化并损害工作凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
