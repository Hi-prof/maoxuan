quote: 每个人什么都能写，而“科学自由”正是在于人们有权撰写他们所没有学过的东西，并且以此冒充唯一严格的科学的方法。
literature:
  series: 马原思考
  volume: 弗里德里希·恩格斯
  workTitle: 《反杜林论》旧序：论辩证法
  authoredAt: '1878'
themes:
- 人的发展
interpretation:
  inspiration: 把认识放回行动中验证：先做可观察的一步，再根据结果修正原先的判断。
  explanation: 这句出自《反杜林论》旧序：论辩证法，可从“人的发展”角度理解。自由不是抽象口号，而要落实到人能够实际发展能力、参与社会生活的条件。 阅读时应回到原文的论证对象，避免把一句话当成脱离历史和条件的万能答案。
historicalEvent: 19世纪的工人运动和自然科学进展推动了对社会历史与辩证思维的新讨论。
background: 恩格斯与马克思共同发展历史唯物主义，也持续讨论自然、科学、劳动与社会变迁。
story: 此卡从《反杜林论》旧序：论辩证法的原文中筛选，不以随机段落凑数；可从来源页回看上下文和论证对象。
