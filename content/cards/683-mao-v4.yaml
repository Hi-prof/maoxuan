revision: 2
status: published
quote: 市委书记和市长应该对所属一切工作人员加以训练，讲明各项城市政策和策略。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 再克洛阳后给洛阳前线指挥部的电报
  authoredAt: '1948-04-08'
themes:
- 政策
interpretation:
  inspiration: 可以把“市委书记和市长应该对所属一切工作人员加以训练”转成一个工作问题：怎样根据对象、阶段和条件选择具体办法？答案要经得起事实、协作过程和实际结果的检验。
  explanation: 在《再克洛阳后给洛阳前线指挥部的电报》中，这句话服务于对政策问题的分析。它把“市委书记和市长应该对所属一切工作人员加以训练”同实际任务联系起来，要求根据对象、阶段和条件选择具体办法。它的现实启发主要是一种工作方法；原则稳定不等于方法僵化，因此不能只保留有力量的措辞而省略前后的事实和限制。
historicalEvent: 1948年4月8日，《再克洛阳后给洛阳前线指挥部的电报》形成，集中讨论政策及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《再克洛阳后给洛阳前线指挥部的电报》从当时的具体问题出发讨论政策，本卡从“市委书记和市长应该对所属一切工作人员加以训练”切入全文的一层论证。
story: 这句话在全文中承担承上启下或归纳判断的作用。沿着《再克洛阳后给洛阳前线指挥部的电报》的论证继续阅读，可以分清历史结论、工作方法和今天可借鉴的部分。
