quote: 为着应付最近时期的紧张工作而增重了的财政负担，在一九四六年中，必须有计划有步骤地转到正常状态。
literature:
  series: 毛泽东选集
  volume: 第四卷
  workTitle: 一九四六年解放区工作的方针
  authoredAt: '1945-12-15'
themes:
- 经济建设
interpretation:
  inspiration: 从“为着应付最近时期的紧张工作而增重了的财政负担”出发，可以把态度转成行动：把资源、条件和长期效果一起核算，并让事实、分工和实际结果检验原先的判断。
  explanation: 《一九四六年解放区工作的方针》讨论的是特定历史条件下的经济建设问题。这里用“为着应付最近时期的紧张工作而增重了的财政负担”指出行动应有的着力点，核心在于把资源、条件和长期效果一起核算。原文并不支持脱离对象的简单化理解，因为建设目标必须落实为可执行的生产与组织安排。阅读这句话时，应把结论、依据和适用条件放在一起。
historicalEvent: 1945年12月15日，《一九四六年解放区工作的方针》形成，集中讨论经济建设及其现实任务。
background: 解放战争时期，战略转折、土地政策、组织建设和新中国前途成为现实任务。《一九四六年解放区工作的方针》从当时的具体问题出发讨论经济建设，本卡从“为着应付最近时期的紧张工作而增重了的财政负担”切入全文的一层论证。
story: 《一九四六年解放区工作的方针》并非名句汇编，而是针对现实任务展开的完整论述。所选句子把其中一个关键判断压缩得很鲜明，前后段落则补足了对象和条件。
