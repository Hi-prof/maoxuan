revision: 3
status: published
quote: 我们要用百分之九十的精力帮助农民增加生产，然后用百分之十的精力从农民取得税收。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 必须注意经济工作
  authoredAt: '1933-08-12'
themes:
- 经济建设
interpretation:
  inspiration: '向别人提出要求前，先看看他有没有余力。若能先帮忙解决工具、流程或资源上的难处，后面的合作通常更顺。让一件事长期运转，比眼下多拿一点更重要。'
  explanation: '这句话主张把大部分精力用于帮助农民扩大生产，较小部分用于征税，也就是先把生产和生活基础做起来，再谈公共负担。1933年，中央革命根据地既要应对战争，又面临物资紧张。毛泽东在经济建设大会上批评只会向群众要粮要钱、却不关心生产的做法。这里的“九十”和“十”重在说明工作次序和精力分配：税收要有生产作支撑，政权要获得群众支持，也要先帮助群众解决现实困难。'
historicalEvent: 1933年8月12日，毛泽东在南部十七县经济建设大会上作报告。
background: 中央革命根据地面临战争和物资困难，毛泽东要求把经济建设作为支持战争、改善群众生活的重要工作。 此卡所选名句着重表现公共工作应先帮助生产和生活改善，再谈合理负担。
story: 《必须注意经济工作》围绕经济建设与群众负担逐层展开。这句话把公共工作应先帮助生产和生活改善，再谈合理负担凝练成便于记忆的表达，适合联系全文前后的论证一起阅读。
