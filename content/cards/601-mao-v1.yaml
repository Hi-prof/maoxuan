revision: 3
status: published
quote: 对反日战争中的广大民众，应该满足他们基本利益的要求（农民的土地要求，工人、士兵、贫民、知识分子等改良生活待遇的要求）。
literature:
  series: 毛泽东选集
  volume: 第一卷
  workTitle: 中国共产党在抗日时期的任务
  authoredAt: '1937-05-03'
themes:
- 群众路线
interpretation:
  inspiration: '请人一起承担一件大事时，也要看见他眼前的小日子。目标再重要，若生活压力一直无人理会，热情很难长久。照顾共同方向，也照顾具体的人，两者并不冲突。'
  explanation: '这句话说，要让广大民众积极参加抗日战争，就要回应他们最基本的利益：农民希望解决土地问题，工人、士兵、贫民和知识分子希望改善生活待遇。1937年全面抗战临近，毛泽东在党的全国代表会议上讨论怎样建立广泛的抗日民族统一战线。他认为民族危机并不会自动消除各阶层的现实困苦；只有实行民主、改善民生，民众才会真正被发动起来。这里把抗日的共同目标同群众每天的利益连在一起，反对只要求牺牲而不解决生活问题。'
historicalEvent: 1937年5月3日，《中国共产党在抗日时期的任务》形成，集中讨论群众路线及其现实任务。
background: 第一次国内革命战争后到全面抗战前，革命道路、调查研究和认识方法成为重要议题。《中国共产党在抗日时期的任务》从当时的具体问题出发讨论群众路线，本卡从“对反日战争中的广大民众”切入全文的一层论证。
story: 文章先交代现实矛盾，再提出判断和办法。这句以“对反日战争中的广大民众”留下清晰抓手，回看上下文可以看到它回答了什么问题、依靠什么条件。
