# Java's Windows launcher reads @argfiles with the system ANSI code page. Gradle's
# test worker classpath therefore needs GBK while this repository lives in a Chinese path.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
